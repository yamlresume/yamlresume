  awards:
    - title: Marketer of the Year 2022
      date: Dec 2022
      awarder: Asosiasi Pemasaran Indonesia
      summary: |
        Diberikan kepada manajer pemasaran yang menunjukkan inovasi luar biasa dalam kampanye digital dan kontribusi signifikan terhadap pertumbuhan industri.
    - title: Best Digital Campaign
      date: Nov 2021
      awarder: Digital Marketing Awards
      summary: |
        Menghargai kampanye #BanggaLokal yang berhasil meningkatkan keterlibatan pelanggan sebesar 300% dan penjualan 50% dalam 6 bulan.
  certificates:
    - name: Google Digital Marketing & E-commerce Professional Certificate
      issuer: Google
      date: May 2022
      url: https://www.coursera.org/professional-certificates/google-digital-marketing-ecommerce
    - name: HubSpot Content Marketing Certification
      issuer: HubSpot Academy
      date: Aug 2021
      url: https://academy.hubspot.com/courses/content-marketing
    - name: Meta Certified Digital Marketing Associate
      issuer: Meta
      date: Feb 2023
      url: https://www.facebook.com/business/learn/certification
  publications:
    - name: "Tren Pemasaran Digital di Indonesia 2023: Strategi Omni-channel untuk
        UMKM"
      publisher: Jurnal Pemasaran Indonesia
      releaseDate: Jun 2023
      url: https://www.jurnalpemasaran.id/artikel/tren-2023
      summary: |
        - Menganalisis adopsi strategi omni-channel oleh UMKM di Indonesia.
        - Menyajikan studi kasus dari 50 bisnis yang berhasil meningkatkan pendapatan melalui integrasi digital dan offline.
        - Merekomendasikan kerangka kerja untuk pemasaran yang berkelanjutan dan berbasis data.
  projects:
    - name: 'Kampanye #BanggaLokal'
      startDate: Jan 2022
      endDate: Dec 2022
      url: https://www.banggalokal.id
      description: Kampanye pemasaran terintegrasi untuk mendorong konsumsi produk lokal.
      summary: |
        - Merancang dan memimpin kampanye multi-channel yang melibatkan 100+ influencer dan 50 media nasional.
        - Meningkatkan penjualan produk lokal sebesar 50% dan engagement media sosial 300%.
        - Meraih penghargaan Best Digital Campaign 2021 dan menjadi studi kasus di universitas.
      keywords:
        - Kampanye Integratif
        - Influencer Marketing
        - Media Sosial
        - Brand Lokal
    - name: Peluncuran Aplikasi Mobile BelanjaMudah
      startDate: Mar 2021
      endDate: Sep 2021
      url: https://www.belanjamudah.id
      description: Peluncuran aplikasi belanja online untuk pasar Indonesia.
      summary: |
        - Mengoordinasikan tim pemasaran, produk, dan teknologi untuk peluncuran aplikasi.
        - Mencapai 100.000 unduhan dalam 3 bulan pertama melalui strategi user acquisition.
        - Mengelola anggaran peluncuran Rp5 miliar dengan ROI 200%.
      keywords:
        - Product Launch
        - User Acquisition
        - Mobile Marketing
        - ROI
