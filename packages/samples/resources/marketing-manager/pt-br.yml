      publisher: Revista Brasileira de Marketing
      releaseDate: Oct 1, 2018
      url: https://www.revistabrasileirademarketing.com.br
      summary: |
        - Estudo sobre o impacto da personalização em taxas de conversão.
        - Análise de dados de mais de 50 mil sessões em lojas virtuais.
        - Recomendações práticas para gestores de marketing.

  references:
    - name: Dr. Ricardo Menezes
      summary: |
        Mariana demonstra excelência estratégica e capacidade de liderança. Sua visão analítica e criatividade geram resultados consistentes.
      email: ricardo.menezes@usp.br
      phone: '+55 11 91234-5678'
      relationship: Professor Orientador de Mestrado
    - name: Camila Torres
      summary: |
        Trabalhei diretamente com Mariana por 4 anos. É uma líder inspiradora, focada em dados e resultados.
      email: camila.torres@technova.com.br
      phone: '+55 11 99876-5432'
      relationship: Diretora de Vendas

  projects:
    - name: 'Campanha "Viva Mais"'
      url: https://www.technova.com.br/vivamais
      description: Campanha integrada de branding e performance para lançamento de
        linha de produtos.
      startDate: Mar 1, 2023
      endDate: Jun 30, 2023
      summary: |
        - Coordenei criação, mídia, influenciadores e assessoria de imprensa.
        - Resultado: 120% da meta de leads em 3 meses.
        - Aumento de 35% no reconhecimento de marca na região Sudeste.
      keywords:
        - Lançamento
        - Branding
        - Leads
    - name: Programa de Fidelidade VarejoMais+
      url: https://www.varejomais.com.br/fidelidade
      description: Reestruturação do programa de fidelidade com foco em personalização.
      startDate: Jan 1, 2018
      endDate: Dec 31, 2019
      summary: |
        - Implementei segmentação comportamental e automação de e-mail marketing.
        - Aumento de 22% na retenção de clientes.
        - Crescimento de 18% no ticket médio dos participantes.
      keywords:
        - CRM
        - Fidelidade
        - Automação

