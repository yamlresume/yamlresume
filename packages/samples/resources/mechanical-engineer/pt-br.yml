  publications:
    - name: Otimização Topológica de Componentes Estruturais para Veículos Comerciais
      publisher: Revista Brasileira de Engenharia Mecânica
      releaseDate: Jul 2018
      url: https://www.rbem.org.br/artigo/otimizacao-topologica-veiculos
      summary: |
        - Estudo comparativo entre métodos de otimização topológica aplicados a suportes estruturais.
        - Validação por elementos finitos e ensaios experimentais em protótipos metálicos.
        - Discussão sobre ganhos de massa, rigidez e custo de fabricação.
  projects:
    - name: Sistema de Resfriamento Modular para Equipamentos Industriais
      url: https://www.aerotech-engenharia.com.br/projetos/resfriamento-modular
      description: Projeto de trocador de calor compacto para reduzir consumo
        energético em linhas de produção.
      startDate: Feb 2022
      endDate: Nov 2023
      summary: |
        - Coordenação do projeto desde a concepção até a validação em campo.
        - Simulação CFD para dimensionamento térmico e otimização do fluxo de ar.
        - Uso de manufatura aditiva na produção de componentes de teste.
      keywords:
        - Trocador de calor
        - CFD
        - Sustentabilidade
        - Manufatura aditiva
    - name: Plataforma de Ensaio de Bombas Centrífugas
      url: https://www.hidraulicavale.com.br/projetos/plataforma-ensaio
      description: Bancada automatizada para medição de vazão, pressão e eficiência de
        bombas.
      startDate: May 2017
      endDate: Dec 2018
      summary: |
        - Especificação de instrumentação, aquisição de dados e painel de controle.
        - Padronização de ensaios conforme a norma ISO 9906.
        - Treinamento da equipe técnica para operação e manutenção da bancada.
      keywords:
        - Instrumentação
        - Aquisição de dados
        - Norma ISO 9906
        - Automação
