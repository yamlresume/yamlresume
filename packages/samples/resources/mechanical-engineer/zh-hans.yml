  publications:
    - name: 基于有限元分析的汽车悬架结构优化设计
      publisher: 机械工程学报
      releaseDate: 2019-05
      url: https://doi.org/10.3901/JME.2019.05.001
      summary: |
        - 提出一种基于响应面法的悬架结构优化方法，实现减重12%并提高疲劳寿命。
        - 通过ANSYS仿真和台架试验验证，结果误差小于5%。
        - 被引次数超过30次，获期刊年度优秀论文。
    - name: 轻量化材料在汽车车身中的应用研究
      publisher: 汽车工程
      releaseDate: 2017-11
      url: https://doi.org/10.19562/j.chinasae.qcgc.2017.11.001
      summary: |
        - 对比分析高强钢、铝合金和碳纤维复合材料在车身中的应用效果。
        - 提出多材料混合车身设计方案，实现减重20%的同时满足碰撞安全法规。
        - 为后续车型开发提供材料选型依据。

  projects:
    - name: 新能源汽车电池包结构设计与优化
      startDate: 2020-01-01
      endDate: 2021-12-31
      description: 针对纯电动车型的电池包进行结构设计、轻量化和安全优化。
      summary: |
        - 设计电池包上下壳体、模组支架和冷却板，满足IP67防护等级和振动疲劳要求。
        - 采用拓扑优化和尺寸优化方法，实现电池包减重15%，能量密度提升8%。
        - 通过CAE仿真和物理试验验证，顺利通过国标GB 38031碰撞安全测试。
        - 项目投产后，年产量达10万台，新增产值超5亿元。
      keywords:
        - 电池包
        - 轻量化
        - 拓扑优化
        - 碰撞安全
      url: https://www.saicmotor.com/tech/battery
    - name: 某车型底盘轻量化项目
      startDate: 2018-03-01
      endDate: 2019-12-31
      description: 对某轿车底盘进行轻量化设计，采用铝合金和液压成型技术。
      summary: |
        - 重新设计前副车架和后扭力梁，采用铝合金材料，减重25%。
        - 使用HyperMesh进行网格划分和优化，通过Abaqus进行强度刚度分析。
        - 协调供应商完成样件制造和台架试验，满足耐久性要求。
        - 项目成果应用于两款车型，年节约成本约2000万元。
      keywords:
