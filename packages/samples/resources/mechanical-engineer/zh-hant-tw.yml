      - 具備跨部門專案領導經驗，曾主導電動車電池模組與工業設備散熱方案開發
      - 熟悉 ISO 9001、幾何尺寸與公差、FMEA 與供應商技術管理，擅長以數據驅動設計決策
      - 重視團隊協作與技術傳承，能將複雜工程問題轉化為可執行方案
