    country: Indonesia
    postalCode: "10330"
  profiles:
    - network: LinkedIn
      url: https://www.linkedin.com/in/arif-prasetyo-me
      username: arif-prasetyo-me
    - network: GitHub
      url: https://github.com/arifprasetyo-me
      username: arifprasetyo-me
  education:
    - institution: Institut Teknologi Bandung
      url: https://www.itb.ac.id
      degree: Bachelor
      area: Teknik Mesin
      score: "3.72"
      startDate: '2013-08-01'
      endDate: '2017-08-31'
      courses:
        - Mekanika Fluida
        - Termodinamika
        - Perpindahan Panas
        - Kinematika dan Dinamika
        - Perancangan Mesin
        - Proses Manufaktur
        - Material Teknik
        - Getaran Mekanis
      summary: |
        - Menyelesaikan tugas akhir tentang optimasi desain rangka mesin press menggunakan analisis elemen hingga.
        - Aktif dalam tim robotika kampus dan kompetisi perancangan mesin tingkat nasional.
        - Memperoleh pemahaman kuat dalam perancangan komponen, pemilihan material, dan proses produksi.
  work:
    - name: PT Astra Otoparts Tbk
      url: https://www.astra-otoparts.com
      position: Insinyur Mesin Senior
      startDate: '2021-03-01'
      summary: |
        - Memimpin perancangan dan perbaikan fixture serta tooling untuk lini produksi komponen rem dengan target efisiensi 12%.
        - Mengimplementasikan proyek otomasi berbasis PLC dan robotik untuk mengurangi waktu siklus dan kesalahan operator.
        - Melakukan analisis kegagalan komponen menggunakan metode root cause analysis dan finite element analysis.
        - Mengoordinasikan tim lintas fungsi dalam validasi proses, APQP, PPAP, dan audit standar ISO 9001.
        - Membimbing tiga insinyur junior dalam praktik desain untuk manufaktur dan keselamatan kerja.
      keywords:
        - Desain Manufaktur
        - Otomasi Produksi
        - Lean Manufacturing
        - CAD/CAE
        - ISO 9001
    - name: PT Komatsu Indonesia
      url: https://www.komatsu.com
      position: Insinyur Proses Produksi
      startDate: '2018-06-01'
      endDate: '2021-02-28'
      summary: |
        - Menganalisis dan mengoptimalkan proses permesinan komponen alat berat untuk meningkatkan throughput sebesar 15%.
        - Mengembangkan program CNC dan standar operasional untuk mengurangi scrap rate pada komponen kritis.
        - Memimpin kaizen mingguan bersama tim produksi dan maintenance untuk mengurangi downtime mesin.
        - Menyusun laporan analisis kapasitas, time study, dan rekomendasi investasi peralatan produksi.
      keywords:
        - CNC Programming
        - Lean Manufacturing
        - Six Sigma
        - Time Study
        - Perbaikan Berkelanjutan
    - name: PT Dirgantara Indonesia
      url: https://www.indonesian-aerospace.com
      position: Insinyur Muda Perawatan
      startDate: '2017-09-01'
      endDate: '2018-05-31'
      summary: |
        - Mendukung perawatan preventif dan korektif komponen struktur pesawat sesuai manual dan standar keselamatan.
        - Melakukan inspeksi dimensional dan dokumentasi hasil perawatan untuk audit kualitas internal.
        - Berkolaborasi dengan teknisi senior dalam analisis kerusakan dan penyusunan prosedur perbaikan.
      keywords:
        - Maintenance
        - Inspeksi Kualitas
        - Struktur Pesawat
        - K3
