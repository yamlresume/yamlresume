content:
  basics:
    name: Arif Prasetyo
    headline: Insinyur Mesin Senior | Spesialis Manufaktur & Otomasi
    phone: "+62 812-3456-7890"
    email: arif.prasetyo.engineer@gmail.com
    url: https://www.arifprasetyo.id
    summary: |
      Insinyur mesin dengan pengalaman lebih dari 8 tahun di industri manufaktur otomotif dan kedirgantaraan, berfokus pada perancangan mesin, optimasi proses produksi, dan implementasi otomasi.

      - Menguasai CAD/CAE, analisis struktural, dan metodologi Lean Six Sigma untuk meningkatkan efisiensi lini produksi.
      - Berpengalaman memimpin proyek perbaikan proses lintas fungsi dengan penghematan biaya terukur dan peningkatan kualitas produk.
      - Terbiasa bekerja dengan standar ISO 9001, APQP, PPAP, serta keselamatan kerja K3 di lingkungan manufaktur.
  location:
    address: Jl. Cikini Raya No. 42, Menteng
