  publications:
    - name: Analisis Pengurangan Waktu Setup Mesin CNC pada Produksi Komponen Otomotif
      publisher: Jurnal Teknik Mesin Indonesia
      releaseDate: '2022-04-01'
      url: https://doi.org/10.1234/jtmi.2022.012
      summary: |
        - Membahas pendekatan lean manufacturing dan standardisasi tooling untuk mengurangi waktu setup mesin CNC.
        - Menyajikan data time study dan dampak pengurangan waktu setup terhadap kapasitas produksi.
        - Merekomendasikan praktik terbaik untuk implementasi perbaikan berkelanjutan di lantai produksi.
  projects:
    - name: Sistem Otomasi Lini Perakitan Komponen Rem
      startDate: '2022-01-01'
      endDate: '2023-06-30'
      description: |
        Proyek otomasi lini perakitan komponen rem yang mencakup desain fixture, integrasi PLC, dan validasi proses produksi.
      summary: |
        - Merancang fixture dan mekanisme feeding untuk mengurangi waktu siklus perakitan.
        - Mengintegrasikan sistem PLC dan sensor untuk meningkatkan konsistensi kualitas produk.
        - Menghasilkan penghematan biaya tahunan dan penurunan cacat produk.
      keywords:
        - Otomasi Lini Produksi
        - PLC
        - Fixture Design
        - Validasi Proses
    - name: Optimasi Desain Rangka Mesin Press 120 Ton
      startDate: '2020-02-01'
      endDate: '2020-12-31'
      description: |
        Proyek rekayasa ulang rangka mesin press untuk meningkatkan kekakuan struktur dan mengurangi berat material.
      summary: |
        - Melakukan analisis elemen hingga untuk mengevaluasi tegangan dan deformasi rangka.
        - Mengusulkan perubahan geometri dan material yang menurunkan berat tanpa mengorbankan kekuatan.
        - Memvalidasi desain melalui pengujian prototipe dan simulasi beban kerja.
      keywords:
        - Desain Rangka
        - Optimasi Struktur
        - Finite Element Analysis
        - Pengurangan Biaya
  interests:
