      summary: |
        Diberikan atas keberhasilan memimpin proyek otomasi lini perakitan komponen rem yang meningkatkan produktivitas dan menurunkan biaya operasional.
    - title: Karyawan Terbaik Tahun 2020
      date: '2020-12-01'
