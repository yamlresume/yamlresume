      startDate: '2021-01-01'
      summary: |
        - Membimbing mahasiswa teknik mesin dalam perancangan proyek akhir dan persiapan karier industri.
        - Menjadi narasumber lokakarya tentang CAD, manufaktur lean, dan keselamatan kerja.
        - Mendukung kegiatan komunitas insinyur muda untuk meningkatkan kompetensi teknis dan profesionalisme.

