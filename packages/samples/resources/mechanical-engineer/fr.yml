  publications:
    - name: Optimisation thermique des échangeurs à plaques pour réseaux de chaleur
      publisher: Revue Française de Génie Mécanique
      releaseDate: 2022-10-01
      url: https://www.rfgm.fr/articles/echangeurs-plaques
      summary: |
        - Article présentant une méthode de dimensionnement d'échangeurs à plaques intégrant les contraintes de maintenance.
        - Résultats issus d'une campagne de mesures sur trois sites industriels et d'un modèle CFD validé.
  projects:
    - name: Récupérateur de chaleur industriel
      url: https://www.voltaire-energie.fr/projets/recuperateur
      description: Module compact de récupération de chaleur destiné aux procédés
        industriels.
      startDate: 2022-01-01
      endDate: 2023-09-30
      summary: |
        - Conception mécanique complète d'un échangeur air-eau modulaire.
        - Intégration des contraintes de maintenance, d'isolation et de sécurité.
        - Validation par calculs thermomécaniques et essais sur banc.
      keywords:
        - Thermique
        - Échangeur
        - Industrie
        - Modélisation
    - name: Banc d'essai pour pompes à haut rendement
      description: Banc instrumenté pour caractériser le rendement et la fiabilité de
        pompes industrielles.
      startDate: 2019-03-01
      endDate: 2020-02-29
      summary: |
        - Définition de l'architecture mécanique, des capteurs et de la chaîne d'acquisition.
        - Réalisation des plans, du dossier de fabrication et du protocole d'essai.
        - Réduction du temps de qualification des pompes de 25 %.
      keywords:
        - Banc d'essai
        - Instrumentation
        - Pompes
        - Essais
