        - 英検1級
  awards:
    - title: 年間最優秀人事賞
      date: Dec 2022
      awarder: 株式会社テクノロジーソリューションズ
      summary: |
        人事改革プロジェクトのリーダーとして、採用・育成・評価制度の刷新に貢献し、組織のエンゲージメントスコアを20%向上させた。
  certificates:
    - name: 社会保険労務士
      issuer: 厚生労働省
      date: Aug 2018
      url: https://www.mhlw.go.jp
    - name: キャリアコンサルタント
      issuer: 厚生労働省
      date: Nov 2019
      url: https://www.mhlw.go.jp
  publications:
    - name: 次世代人事戦略：データドリブンな人材マネジメント
      publisher: 日本の人事部
      releaseDate: Jun 2023
      url: https://www.jinji-bu.jp
      summary: |
        人事データ分析を活用した採用・育成の最適化について寄稿。データに基づく意思決定の重要性と具体的な手法を解説。
  projects:
    - name: 人事評価システム刷新プロジェクト
      startDate: Apr 2022
      endDate: Mar 2023
      summary: |
        評価制度の見直しとシステム導入をリード。360度評価とOKRを組み合わせた新評価制度を設計し、クラウド人事システムを導入。
      description: プロジェクトの詳細説明。評価制度の設計からシステム選定、運用開始までを一貫して担当。
      keywords:
        - 評価制度
        - 人事システム
        - プロジェクトマネジメント
      url: https://www.tech-sol.co.jp/projects/hr-system
