        - Gestione del cambiamento
        - Clima aziendale
        - Diversità e inclusione
    - name: Competenze Trasversali
      level: Expert
      keywords:
        - Comunicazione efficace
        - Negoziazione
        - Capacità di guida
        - Risoluzione dei problemi
        - Pensiero analitico

  languages:
