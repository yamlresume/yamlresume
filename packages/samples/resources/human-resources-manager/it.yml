      publisher: Rivista Italiana di Direzione del Personale
      releaseDate: Apr 2023
      url: https://www.rivistaitalianadirigenzapersonale.it/articoli/talento-lavoro-ibrido
      summary: |
        - Analisi delle principali tendenze del lavoro ibrido e delle implicazioni per la gestione del talento.
        - Proposta
