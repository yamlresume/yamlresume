        - 講師培育
        - 學習平台
  awards:
    - title: 年度最佳人力資源團隊獎
      date: Nov 2023
      awarder: 中華人力資源管理協會
      summary: |
        - 表揚在人才策略、員工體驗與組織變革具卓越成效之人資團隊。
        - 帶領團隊完成薪酬架構改革與雇主品牌計畫，獲得評審一致肯定。
    - title: 卓越雇主品牌獎
      date: Sep 2022
      awarder: 亞太人力資源評論
      summary: |
        - 肯定公司在校園招募、員工價值主張與多元共融政策之表現。
        - 成功提升品牌知名度與新人到職率，並降低招募成本。
  certificates:
    - name: 全方位人力資源管理師
      issuer: 中華人力資源管理協會
      date: Mar 2018
      url: https://www.chrma.org.tw/certification/hr-manager
    - name: 國際專案管理師 PMP
      issuer: 國際專案管理學會
      date: Jun 2019
      url: https://www.pmi.org/certifications/project-management-pmp
    - name: 勞動法令遵循專家
      issuer: 台灣勞動法學會
      date: Oct 2020
      url: https://www.taiwanlaborlaw.org/certification/compliance
  publications:
    - name: 數位轉型下的人才策略：以台灣科技業為例
      publisher: 人力資源管理學報
      releaseDate: Dec 2022
      url: https://doi.org/10.1234/hrmj.2022.001
      summary: |
        - 探討數位轉型對科技業人才策略、組織設計與關鍵職能之影響。
        - 以三家台灣上市科技公司為個案，提出人才培育與接班規劃建議。
    - name: 從員工體驗出發的留才策略
      publisher: 亞太人力資源評論
      releaseDate: May 2021
      url: https://www.aphrreview.com/articles/employee-experience-retention
      summary: |
        - 分析員工體驗對留任意願之影響，提出五大員工旅程改善方向。
        - 提供人資主管可執行之留才措施與衡量指標。
  projects:
    - name: 人才發展與接班計畫
      startDate: Jan 2022
      endDate: Dec 2023
      description: 為關鍵職位建立人才盤點、發展藍圖與接班梯隊，確保組織中長期人才供給。
      summary: |
        - 盤點 12 個關鍵職位與 45 位高潛力人才，建立九宮格人才地圖。
        - 設計個人發展計畫與導師制度，兩年內內部晉升比例提升至 65%。
        - 建立接班梯隊檢視機制，每季向高階管理層報告人才準備度。
      keywords:
        - 人才盤點
        - 接班梯隊
        - 發展藍圖
        - 關鍵職位
      url: https://www.yunhui-tech.com/esg/talent-development
    - name: 員工體驗平台導入
      startDate: Mar 2021
      endDate: Nov 2021
      description: 導入一站式員工服務平台，整合入離職、考勤、薪酬查詢與意見回饋流程。
      summary: |
        - 與 IT 及外部供應商協作，完成需求訪談、流程設計與系統上線。
        - 將常見人資問題處理時間縮短 40%，員工服務滿意度提升至 88%。
        - 建立人資數據儀表板，追蹤服務量、處理時效與員工回饋趨勢。
      keywords:
        - 員工體驗
        - 流程自動化
        - HRIS
        - 服務中心
      url: https://www.yunhui-tech.com/hr/employee-experience
  interests:
