        - 心理學
        - 人物傳記
  volunteer:
    - organization: 中華人力資源管理協會
      url: https://www.chrma.org.tw
      position: 志工講師
      startDate: Jan 2019
      summary: |
        - 擔任人力資源管理師認證課程講師，分享薪酬設計與員工關係實務。
        - 協助協會辦理年度論壇與企業參訪，促進人資專業交流。
    - organization: 台灣青年職涯發展協會
      url: https://www.twyouthcareer.org.tw
      position: 職涯導師
      startDate: Mar 2020
      endDate: Dec 2023
      summary: |
        - 提供青年一對一職涯諮詢，協助履歷健檢、面試準備與職涯規劃。
        - 參與校園職涯講座，分享人資產業趨勢與求職技巧。

