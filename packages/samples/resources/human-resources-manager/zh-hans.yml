        探讨数字化时代HR如何利用技术提升员工体验和组织效能，结合案例分析提出实施路径。
  projects:
    - name: 员工满意度提升项目
      startDate: 2020-04-01
      endDate: 2020-12-31
      summary: |
        - 领导跨部门团队，通过问卷调查和焦点小组识别员工满意度关键因素
        - 制定并实施改进措施，包括弹性工作制、职业发展通道和即时激励
        - 项目结束后员工满意度提升15%，离职率下降8%
      description: 该项目旨在通过系统性的调研和干预，提升员工敬业度和满意度，打造积极的组织氛围。
      keywords:
        - 员工满意度
        - 组织氛围
        - 调研
    - name: HR数字化转型
      startDate: 2019-06-01
      endDate: 2020-03-31
      summary: |
        - 主导HRIS系统选型与实施，整合招聘、考勤、薪酬和绩效模块
        - 实现员工自助服务和线上审批，HR事务处理效率提升40%
        - 建立人力资源数据看板，为管理层提供决策支持
      description: 推动人力资源管理的数字化升级，提升运营效率和员工体验。
      keywords:
        - HRIS
        - 数字化
        - 流程优化
