        - 全面负责人力资源部门工作，管理10人团队，支持公司2000余名员工
        - 主导年度招聘计划，年均招聘300+人，关键岗位到岗率95%
        - 设计并实施绩效管理体系，推动OKR与KPI结合，员工绩效提升20%
        - 建立员工关系沟通机制，员工满意度从75%提升至88%
        - 优化薪酬福利体系，完成年度薪酬调研和调薪方案，保持市场竞争力
