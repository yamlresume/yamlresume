      startDate: 2013-07-01
      endDate: 2018-02-28
      summary: |
        - 负责集团总部及下属子公司招聘工作，年均完成150+岗位招聘
        - 搭建培训体系，组织新员工入职培训和管理技能培训，覆盖500+人次
        - 参与薪酬体系改革，完成岗位价值评估和薪酬宽带设计
        - 处理员工关系日常事务，包括劳动合同管理、员工投诉和劳动纠纷
        - 协助HRD完成组织架构调整和人才盘点项目
