        - Public Speaking
    - language: Spanish
      fluency: Limited Working Proficiency
      keywords:
        - DELE B2
        - Conversational

  awards:
    - title: Quality Champion Award
      date: Nov 2023
      awarder: BrightWave Technologies
      summary: |
        Recognized for outstanding contributions to test automation and quality process improvements, leading to a 40% reduction in escaped defects.

  certificates:
    - name: ISTQB Certified Tester Foundation Level
      issuer: ISTQB
      date: Aug 2019
      url: https://www.istqb.org/certifications
    - name: Certified Selenium Professional
      issuer: Selenium Academy
