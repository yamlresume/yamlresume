  publications:
    - name: Automating Accessibility Checks in CI Pipelines
      publisher: Ministry of Testing
      releaseDate: Apr 2023
      url: https://www.ministryoftesting.com/articles/automating-accessibility-checks
      summary: |
        - Discusses strategies for integrating accessibility testing into automated CI/CD workflows.
        - Covers tools such as axe-core, Pa11y, and Lighthouse.
        - Provides practical examples for reducing accessibility defects in web applications.

  projects:
    - name: OpenCart QA Test Suite
      url: https://github.com/jordanellis-qa/opencart-qa-suite
      description: Open-source test suite for e-commerce checkout flows
      startDate: Jan 2021
      endDate: May 2021
      summary: |
        - Developed a Selenium-based test suite covering cart, checkout, and payment workflows.
        - Implemented Page Object Model and data-driven testing with Pytest.
        - Configured GitHub Actions to run tests on every pull request.
      keywords:
        - Selenium
        - Python
        - Pytest
        - Page Object Model
    - name: API Contract Testing Framework
      url: https://github.com/jordanellis-qa/api-contract-testing
      description: Lightweight framework for validating API contracts across microservices
      startDate: Sep 2022
      endDate: Feb 2023
      summary: |
        - Built a reusable framework using Python and JSON Schema to validate API request/response contracts.
        - Integrated with Postman and Newman for CI execution.
        - Reduced integration defects by catching schema mismatches early.
      keywords:
        - API Testing
        - JSON Schema
        - Python
        - Postman

  interests:
