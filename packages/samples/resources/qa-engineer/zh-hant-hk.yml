        - 協助開發及維護測試案例庫，確保測試覆蓋率
        - 使用 SQL 查詢驗證後端資料完整性
        - 參與每日站立會議及衝刺評審，跟進測試進度
        - 學習並應用自動化測試工具（Selenium WebDriver）
      keywords:
