  awards:
    - title: Prix de l'excellence qualité
      date: Jun 2023
      awarder: HexaFinance
      summary: |
        Récompense attribuée pour la refonte de la stratégie de test et la réduction significative des défauts en production.
  certificates:
    - name: Certification ISTQB niveau fondation
      issuer: ISTQB
      date: Apr 2018
      url: https://www.istqb.org/certifications/foundation-level
    - name: Testeur agile certifié
      issuer: iSQI
      date: Nov 2020
      url: https://www.isqi.org/certified-agile-tester
    - name: ISTQB ingénieur automatisation des tests
      issuer: ISTQB
      date: Sep 2022
      url: https://www.istqb.org/certifications/test-automation-engineer
  publications:
    - name: "Automatiser les tests sans sacrifier la maintenabilité"
      publisher: Blog Qualité & Logiciel
      releaseDate: Feb 2023
      url: https://www.qualite-logiciel.fr/articles/automatiser-tests-maintenabilite
      summary: |
        Article pratique sur les bonnes pratiques d'automatisation des tests, la conception de suites robustes et la réduction de la dette de test.
  projects:
    - name: QualiDash
      url: https://github.com/camillemoreau-qa/qualidash
      description: Tableau de bord de pilotage de la qualité logicielle pour les
        équipes produit.
      startDate: Jan 2022
      endDate: Jun 2023
      summary: |
        - Centralisation des métriques de test, des anomalies et des tendances de qualité
        - Visualisation des risques par fonctionnalité et suivi de la couverture automatisée
        - Réduction du temps de préparation des bilans qualité hebdomadaires
      keywords:
        - Qualité
        - Métriques
        - Automatisation
        - Reporting
    - name: TestAPIFactory
      description: Bibliothèque interne de scénarios réutilisables pour les tests
        d'API REST.
      startDate: Mar 2023
      endDate: Dec 2023
      summary: |
        - Factorisation des appels, assertions et jeux de données pour accélérer l'écriture des tests
        - Intégration dans plusieurs pipelines CI avec exécution parallèle
        - Documentation et formation des équipes à l'utilisation de la bibliothèque
      keywords:
        - API REST
        - Tests automatisés
        - CI/CD
        - Documentation
