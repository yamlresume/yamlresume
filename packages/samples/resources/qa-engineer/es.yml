    - name: Programa de Pruebas de Accesibilidad
      url: https://github.com/luciafdzqa/accesibilidad-qa
      description: Iniciativa para incorporar validaciones de accesibilidad en el
        ciclo de pruebas.
      startDate: Mar 2022
      endDate: Nov 2022
      summary: |
        - Definí criterios WCAG 2.1 AA y checklists para equipos de producto.
        - Automaticé auditorías con axe-core y Lighthouse en pipelines de integración.
        - Formé a desarrolladores y diseñadores en buenas prácticas de accesibilidad.
