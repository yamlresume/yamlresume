      - Erfaren QA-ingeniør med seks års bakgrunn fra test av web- og API-baserte helseløsninger
      - Sterk på testautomatisering med Playwright, Cypress og Postman, og på å bygge robuste regresjonssuiter
      - Systematisk og kvalitetsbevisst, med erfaring fra Scrum, CI/CD og tverrfaglig produktutvikling
