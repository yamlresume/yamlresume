        - Ansvarlig for teststrategi og kvalitetssikring av pasientrettet webplattform og tilhørende API-er
        - Bygget og vedlikeholdt automatiserte regresjonssuiter i Playwright og Cypress, med daglig kjøring i CI/CD
        - Utførte API-testing med Postman og REST-assured, inkludert validering av autentisering, datakvalitet og feilhåndtering
        - Ledet testgjennomganger og triage av feil i tett samarbeid med utviklere, produktleder og designere
        - Forbedret feilrapporteringsmaler og testdokumentasjon, noe som reduserte gjennomsnittlig tid til retting
      keywords:
        - Teststrategi
        - Testautomatisering
        - Playwright
        - Cypress
        - API-testing
        - CI/CD
        - Regresjonstesting
        - Kvalitetssikring
