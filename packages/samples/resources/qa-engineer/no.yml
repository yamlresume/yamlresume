        - Utviklet automatiserte tester for nettbaserte tjenester innen offentlig sektor
        - Skrev testkode i JavaScript og Python, og integrerte testene i Azure DevOps-pipelines
        - Gjennomførte manuell utforskende testing og sikret god dekning av kritiske brukerreiser
        - Bidro til å innføre BDD med Cucumber og tydeligere akseptansekriterier i Scrum-teamet
        - Dokumenterte testresultater og presenterte kvalitetsstatus i sprintgjennomganger
      keywords:
