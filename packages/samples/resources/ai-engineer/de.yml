        - Praxisbericht zur Integration von RAG und Vektordatenbanken in bestehende Unternehmenslandschaften.
  projects:
    - name: DocuMind – Intelligenter Dokumentenassistent
      url: https://github.com/lena-hartmann/documind
      description: RAG-basierter Assistent zur semantischen Suche und Zusammenfassung
        technischer Dokumente.
      startDate: '2023-01-15'
      endDate: '2023-10-30'
      summary: |
        - Entwicklung einer Ende-zu-Ende-Plattform mit Ingestion, Chunking, Embedding und Vektordatenbank.
        - Evaluation von LLMs hinsichtlich Genauigkeit, Latenz und Kosten.
        - Bereitstellung einer REST-API und eines Web-Frontends für interne Nutzer:innen.
      keywords:
        - RAG
        - LLM
        - Vektordatenbank
        - FastAPI
        - Evaluation
    - name: VisionQC – Qualitätskontrolle mit Computer Vision
      url: https://github.com/lena-hartmann/visionqc
      description: Deep-Learning-System zur automatischen Fehlererkennung in der Fertigung.
      startDate: '2019-03-01'
      endDate: '2020-08-31'
      summary: |
        - Training von Convolutional Neural Networks auf hochauflösenden Industriebildern.
