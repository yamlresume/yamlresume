      summary: |
        - 使用 BERT 與多標籤分類架構，處理客服來文意圖與緊急程度預測。
        - 建立資料標註流程與模型監控指標，持續改善分類表現。
        - 將模型部署為微服務，提供即時 API 與批次推論功能。
