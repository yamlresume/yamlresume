  awards:
    - title: 最佳應用論文獎
      date: Nov 18, 2023
      awarder: 台灣人工智慧學會
      summary: |
        - 以「檢索增強生成於企業知識問答之應用」獲得最佳應用論文獎。
        - 論文提出混合稀疏與稠密檢索策略，有效提升長文件問答的召回率與準確率。
    - title: 年度傑出工程師
