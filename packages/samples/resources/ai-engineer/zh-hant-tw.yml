        - LLM
        - Elasticsearch
        - FastAPI
    - name: 智慧客服意圖分類平台
      url: https://github.com/yentinglin-ai/intent-classifier
      description: 支援多語系與多標籤的客服意圖分類服務
      startDate: Mar 1, 2021
