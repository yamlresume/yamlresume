      summary: |
        - 研究主題聚焦於深度學習與自然語言處理，完成以注意力機制為基礎的文字分類研究。
        - 擔任課程助教，協助機器學習與資料結構課程之教學與作業批改。
        - 與實驗室團隊合作發表 2 篇研討會論文，培養獨立研究與團隊協作能力。
    - institution: 國立清華大學
      url: https://www.nthu.edu.tw
      degree: Bachelor
      area: 資訊工程學系
      score: "3.9/4.3"
      startDate: Sep 1, 2011
      endDate: Jun 30, 2015
      courses:
