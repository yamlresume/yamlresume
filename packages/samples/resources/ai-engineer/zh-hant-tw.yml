      summary: |
        - 整合 Elasticsearch 與向量資料庫，支援文件上傳、切塊、嵌入與檢索。
        - 設計多輪對話與引用來源機制，提升回答可信度與可追溯性。
        - 以 FastAPI 與 Docker 部署，支援權限控管與使用量監控。
      keywords:
