  publications:
    - name: 以檢索增強生成提升企業知識問答準確率之研究
      publisher: 2023 台灣人工智慧年會論文集
      releaseDate: Nov 18, 2023
      url: https://www.taiwanai.org.tw/proceedings/2023
      summary: |
        - 提出結合 BM25 與向量檢索的混合式 RAG 架構，改善長尾問題的檢索品質。
        - 實驗顯示在企業內部知識庫上，回答準確率較基線模型提升 15%。
    - name: 輕量化 Transformer 於邊緣裝置之推論加速
      publisher: 中華民國資訊學會通訊
      releaseDate: Jun 1, 2022
      url: https://www.ics.org.tw/journal/2022
      summary: |
        - 探討知識蒸餾與量化技術在邊緣裝置上的效能與精度權衡。
        - 提出適用於資源受限環境的推論優化流程，降低延遲 35%。
  projects:
    - name: 企業知識庫問答系統
      url: https://github.com/yentinglin-ai/enterprise-rag
      description: 基於檢索增強生成的企業內部知識問答平台
      startDate: Jan 10, 2023
