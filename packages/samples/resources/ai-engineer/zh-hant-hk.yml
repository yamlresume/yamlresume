      summary: |
        - 主修機器學習與自然語言處理，深入研究大型語言模型與檢索增強生成技術
        - 以優異成績完成畢業論文，主題為粵語語音辨識與意圖理解
        - 積極參與人工智能實驗室研究項目，累積模型訓練與部署經驗
    - institution: 香港中文大學
