content:
  basics:
    name: Aditya Pratama Nugroho
    headline: 'Insinyur AI | Pembelajaran Mesin & MLOps'
    phone: '+62 812-3456-7890'
    email: aditya.pratama.ai@gmail.com
    url: https://adityapratama.id
    summary: |
      Insinyur AI dengan pengalaman 6+ tahun merancang, membangun, dan menerapkan solusi machine learning serta deep learning untuk skala produksi. Terbiasa menangani siklus penuh mulai dari eksplorasi data, feature engineering, pelatihan model, evaluasi, hingga deployment dan monitoring di cloud.

      - Menguasai Python, PyTorch, TensorFlow, dan scikit-learn untuk pengembangan model prediktif, NLP, dan computer vision.
      - Berpengalaman membangun pipeline MLOps menggunakan Docker, Kubernetes, MLflow, dan Airflow.
      - Kolaboratif, berorientasi hasil, dan mampu menerjemahkan kebutuhan bisnis menjadi solusi AI yang terukur.

  location:
    address: Jl. Gatot Subroto No. 88
    city: Jakarta Selatan
    region: DKI Jakarta
    country: Indonesia
    postalCode: "12930"

  profiles:
    - network: LinkedIn
      url: https://www.linkedin.com/in/adityapratamanugroho
      username: adityapratamanugroho
    - network: GitHub
      url: https://github.com/adityapratama
      username: adityapratama
    - network: Stack Overflow
      url: https://stackoverflow.com/users/1234567/aditya-pratama
