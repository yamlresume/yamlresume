      summary: |
        - Menjadi mentor untuk program bootcamp machine learning bagi mahasiswa dan profesional muda.
        - Membantu peserta mengembangkan proyek akhir dan mempersiapkan portofolio AI.
        - Menyelenggarakan workshop tentang MLOps dan deployment model.
    - organization: Universitas Indonesia
      url: https://www.ui.ac.id
