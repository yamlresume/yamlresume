  education:
    - institution: Universitas Indonesia
      url: https://www.ui.ac.id
      degree: Bachelor
      area: Ilmu Komputer
      score: "3.72"
      startDate: Aug 1, 2014
      endDate: Jul 1, 2018
      courses:
        - Struktur Data dan Algoritma
        - Pembelajaran Mesin
        - Pengolahan Bahasa Alami
        - Visi Komputer
        - Basis Data
        - Sistem Terdistribusi
        - Statistika Komputasi
        - Kecerdasan Buatan
      summary: |
        - Lulus dengan predikat cum laude dan fokus pada bidang kecerdasan buatan serta pembelajaran mesin.
        - Menjadi asisten dosen untuk mata kuliah Pembelajaran Mesin dan Struktur Data.
        - Menyelesaikan skripsi tentang klasifikasi teks berita berbahasa Indonesia menggunakan model transformer.

  work:
    - name: PT Nusantara AI Solutions
      url: https://www.nusantara-ai.co.id
      position: Insinyur AI Senior
      startDate: Jan 1, 2022
      summary: |
        - Memimpin tim 5 engineer dalam pengembangan platform rekomendasi berbasis deep learning yang melayani 2 juta pengguna aktif.
        - Merancang arsitektur model NLP untuk analisis sentimen dan ekstraksi entitas dengan akurasi F1 di atas 0,92.
        - Membangun pipeline MLOps end-to-end menggunakan MLflow, Airflow, Docker, dan Kubernetes untuk 30+ model produksi.
        - Mengoptimalkan biaya inferensi sebesar 35% melalui model quantization, caching, dan autoscaling.
        - Berkolaborasi dengan product manager dan data analyst untuk menerjemahkan kebutuhan bisnis menjadi roadmap AI.
      keywords:
        - Deep Learning
        - NLP
        - MLOps
        - Kubernetes
        - Leadership
    - name: PT Data Cerdas Indonesia
      url: https://www.datacerdas.co.id
      position: Insinyur Pembelajaran Mesin
      startDate: Mar 1, 2019
      endDate: Dec 1, 2021
      summary: |
        - Mengembangkan model prediksi churn dan credit scoring untuk industri finansial dengan AUC 0,88.
        - Membangun fitur dan pipeline data menggunakan Python, Spark, dan SQL untuk dataset 50 juta transaksi.
        - Menerapkan model ke layanan API menggunakan FastAPI dan Docker dengan latensi rata-rata di bawah 80 ms.
        - Melakukan A/B testing dan monitoring model untuk memastikan performa dan stabilitas di lingkungan produksi.
      keywords:
        - Machine Learning
        - Spark
        - Python
        - FastAPI
        - Credit Scoring
    - name: PT Solusi Analitik Global
      url: https://www.solusi-analitik.co.id
      position: Ilmuwan Data
      startDate: Aug 1, 2018
      endDate: Feb 1, 2019
      summary: |
        - Menganalisis data pelanggan untuk mengidentifikasi peluang cross-selling dan segmentasi pasar.
        - Membuat dashboard interaktif dan laporan insight menggunakan Tableau dan Python.
        - Berkolaborasi dengan tim penjualan untuk merancang kampanye berbasis data yang meningkatkan konversi 12%.
      keywords:
        - Data Analysis
        - Tableau
        - Segmentation
        - Python

