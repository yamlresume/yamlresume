  publications:
    - name: Klasifikasi Teks Berita Berbahasa Indonesia Menggunakan IndoBERT
      publisher: Jurnal Ilmu Komputer dan Informasi
      releaseDate: Oct 2021
      url: https://jiki.cs.ui.ac.id/index.php/jiki
      summary: |
        - Menerapkan model IndoBERT untuk klasifikasi topik berita berbahasa Indonesia.
        - Mencapai akurasi 94,2% pada dataset 20.000 berita dari berbagai portal daring.
        - Menganalisis pengaruh fine-tuning dan ukuran data terhadap performa model.
    - name: Deteksi Anomali Transaksi Keuangan dengan Autoencoder
      publisher: Seminar Nasional Artificial Intelligence
      releaseDate: Aug 2020
      url: https://semnas-ai.id/prosiding
      summary: |
        - Mengembangkan model autoencoder untuk mendeteksi anomali pada data transaksi keuangan.
        - Membandingkan performa dengan Isolation Forest dan One-Class SVM.
        - Menunjukkan peningkatan recall sebesar 15% pada data yang tidak seimbang.

  projects:
    - name: Asisten Virtual Berbahasa Indonesia
      url: https://github.com/adityapratama/asisten-virtual-id
      description: Chatbot berbasis LLM untuk layanan pelanggan berbahasa Indonesia.
      startDate: Jan 2023
      endDate: Jun 2023
      summary: |
        - Membangun chatbot dengan arsitektur RAG menggunakan LangChain, vector database, dan model open-source.
        - Mengintegrasikan API ke kanal WhatsApp dan web dengan latensi respons di bawah 2 detik.
        - Menerapkan evaluasi otomatis untuk kualitas jawaban dan deteksi halusinasi.
      keywords:
        - LLM
        - RAG
        - LangChain
        - Chatbot
    - name: Sistem Deteksi Kerusakan Jalan
      url: https://github.com/adityapratama/deteksi-jalan
      description: Deteksi kerusakan jalan berbasis computer vision dari citra kendaraan.
      startDate: Mar 2020
      endDate: Nov 2020
      summary: |
        - Melatih model YOLOv5 untuk mendeteksi retak dan lubang jalan pada citra dashcam.
        - Mencapai mAP 0,81 pada dataset 5.000 gambar yang dianotasi secara manual.
        - Mengemas model sebagai layanan inferensi menggunakan FastAPI dan Docker.
      keywords:
        - Computer Vision
        - YOLOv5
        - FastAPI

