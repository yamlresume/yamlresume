      startDate: Sep 2016
      endDate: Jun 2018
      summary: |
        - Membantu dosen dalam menyusun materi dan soal untuk mata kuliah Pembelajaran Mesin.
        - Membimbing mahasiswa dalam tugas pemrograman dan proyek kelompok.
        - Memberikan sesi konsultasi mingguan tentang konsep algoritma dan statistika.

