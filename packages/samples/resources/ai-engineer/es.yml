  publications:
    - name: Detección temprana de anomalías en series temporales con modelos híbridos
      publisher: Revista Iberoamericana de Inteligencia Artificial
      releaseDate: '2022-10-01'
      url: https://revista.iberoai.org/articulos/deteccion-anomalias-series-temporales
      summary: |
        - Propone una combinación de modelos estadísticos y redes neuronales para detectar anomalías en datos industriales.
        - Evalúa el enfoque en conjuntos de datos reales y analiza su robustez ante ruido y cambios de distribución.
  projects:
    - name: Asistente clínico con RAG
      url: https://github.com/alejandrovega-ai/asistente-clinico-rag
      description: Asistente conversacional para consultas sobre documentación clínica
        mediante recuperación aumentada.
      startDate: '2023-02-01'
      endDate: '2023-11-30'
      summary: |
        - Implementé un pipeline de ingestión, indexación vectorial y recuperación de documentos médicos.
        - Añadí evaluación de respuestas y trazas para reducir alucinaciones y mejorar la trazabilidad.
        - Desplegué el servicio con FastAPI, Docker y una base vectorial gestionada en cloud.
      keywords:
        - RAG
        - LLMs
        - FastAPI
        - Búsqueda vectorial
    - name: Visión artificial para control de calidad
      url: https://github.com/alejandrovega-ai/vision-calidad
      description: Sistema de inspección visual automática para detectar defectos en
        línea de producción.
      startDate: '2021-05-01'
      endDate: '2022-01-31'
      summary: |
        - Entrené modelos de detección y segmentación con imágenes industriales etiquetadas por expertos.
        - Optimicé la inferencia con TensorRT para cumplir requisitos de latencia en planta.
        - Diseñé un panel de revisión humana para validar casos ambiguos y retroalimentar el modelo.
      keywords:
        - Visión por computador
        - YOLO
        - TensorRT
        - Control de calidad
