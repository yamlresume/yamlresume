  publications:
    - name: Automatización GitOps para plataformas multinube
      publisher: 'Revista Cloud & DevOps'
      releaseDate: Oct 2023
      url: https://www.clouddevops.example.com/articulos/gitops-multinube
      summary: |
        - Artículo técnico sobre patrones GitOps para desplegar aplicaciones en AWS, Azure y GCP.
        - Incluye ejemplos con Argo CD, Terraform y políticas de promoción entre entornos.
        - Analiza métricas de adopción, seguridad y reducción del tiempo de despliegue.

  projects:
    - name: Plataforma GitOps Multinube
      url: https://github.com/luciaferdevops/gitops-multinube
      description: Plataforma interna para desplegar microservicios en varios
        proveedores cloud mediante GitOps.
      startDate: Jan 2022
      endDate: Dec 2023
      summary: |
        - Implementé flujos de promoción automática entre desarrollo, preproducción y producción.
        - Integré validaciones de seguridad y coste en los pipelines antes del despliegue.
        - Reduje el tiempo medio de despliegue de 45 a 12 minutos por servicio.
      keywords:
        - GitOps
        - Argo CD
        - Terraform
        - Kubernetes
    - name: Observabilidad Unificada
      url: https://github.com/luciaferdevops/observabilidad-unificada
      description: Solución de observabilidad centralizada para equipos de desarrollo y SRE.
      startDate: Mar 2020
      endDate: Nov 2021
      summary: |
        - Desplegué Prometheus, Grafana y OpenTelemetry en clústeres Kubernetes de alta disponibilidad.
        - Definí SLOs y alertas accionables, reduciendo el ruido de alertas en un 60 %.
        - Documenté runbooks y formé a equipos en investigación de incidentes.
      keywords:
        - Prometheus
        - Grafana
        - OpenTelemetry
        - SRE

