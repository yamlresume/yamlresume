    - name: 'HashiCorp Certified: Terraform Associate'
      issuer: HashiCorp
      date: Nov 2021
      url: https://www.hashicorp.com/certification/terraform-associate
  publications:
    - name: Effiziente Kubernetes-Skalierung durch adaptive Metriken
      publisher: DevOps-Konferenz Berlin 2023
      releaseDate: Sep 2023
      url: https://www.devops-konferenz-berlin.example/vortraege
      summary: |
        - Vortrag über die Nutzung von Custom Metrics und KEDA zur automatisierten Skalierung von Workloads
        - Praxisbericht zur Reduzierung von Overprovisioning und Steigerung der Ressourceneffizienz
  projects:
    - name: Self-Service-Infrastrukturplattform
      url: https://github.com/lhoffmann-devops/self-service-infra
      description: Eine interne Plattform zur Bereitstellung standardisierter
        Cloud-Umgebungen via Terraform und Kubernetes.
      startDate: Jan 2023
      endDate: Dec 2023
      summary: |
        - Entwicklung eines Backstage-Plugins für Self-Service-Deployments
        - Integration von Terraform-Modulen und GitOps-Workflows
        - Reduzierung der Bereitstellungszeit neuer Umgebungen von Tagen auf unter 30 Minuten
      keywords:
        - Terraform
        - Backstage
        - Kubernetes
        - GitOps
    - name: Cluster-Autoscaler-Optimierung
      url: https://github.com/lhoffmann-devops/cluster-autoscaler-benchmark
      description: Benchmark und Optimierung des Kubernetes Cluster-Autoscalers für
        gemischte Workloads.
      startDate: Mar 2022
      endDate: Aug 2022
      summary: |
        - Analyse von Skalierungsverhalten unter Last und Implementierung von PriorityClasses
        - Senkung der AWS-Kosten um 18 % bei gleichbleibender Performance
      keywords:
        - Kubernetes
        - AWS
        - Autoscaling
        - Kostenoptimierung
  interests:
