      url: https://www.hongyuan-soft.com
      position: 系統維運工程師
      startDate: 'Aug 1, 2016'
      endDate: 'Jun 30, 2018'
      summary: |
        - 負責 Linux 伺服器維運、效能調校與故障排除，維持 99.95% 服務可用性
        - 撰寫 Shell 與 Python 自動化腳本，減少 50% 例行維運工時
        - 參與機房搬遷與網路架構優化，確保核心系統零中斷
        - 建置 Nagios 與 Cacti 監控，提前發現潛在容量與效能問題
      keywords:
        - Linux
        - Shell
        - Python
        - Nagios
        - 效能調校
        - 網路維運
