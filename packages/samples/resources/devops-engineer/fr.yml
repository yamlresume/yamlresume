  education:
    - institution: Université Paris-Saclay
      url: https://www.universite-paris-saclay.fr
      degree: Master
      area: Informatique - Systèmes distribués et cloud
      score: "Mention Très Bien"
      startDate: Sep 1, 2019
      endDate: Jul 1, 2021
      courses:
        - Architectures cloud et virtualisation
        - Systèmes distribués et tolérance aux pannes
        - Sécurité des infrastructures
        - Automatisation et Infrastructure as Code
        - Observabilité et performance
      summary: |
        - Spécialisation en systèmes distribués, cloud computing et automatisation
        - Projet de fin d'études : orchestration Kubernetes multi-cloud avec Terraform
        - Major de promotion en architecture cloud et sécurité
    - institution: Université de Lille
