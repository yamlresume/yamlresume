      url: https://www.hashicorp.com/certifications/terraform-associate

  publications:
    - name: Escalando clusters Kubernetes com Karpenter no Amazon EKS
      publisher: Blog Técnico Nuvem Viva
      releaseDate: Aug 14, 2023
      url: https://medium.com/@rafaelnalmeida/escalando-clusters-kubernetes-com-karpenter-no-amazon-eks-9f1c2b7a4d13
      summary: |
        - Artigo técnico sobre provisionamento dinâmico de nós e redução de custos em clusters EKS
        - Comparativo entre Cluster Autoscaler e Karpenter em cargas de trabalho variáveis
        - Apresenta resultados reais com economia de 30% em custos de computação

  projects:
    - name: Plataforma de Autoatendimento de Infraestrutura
      url: https://github.com/rafaelnalmeida/plataforma-autoatendimento
      description: Plataforma interna que permite às squads provisionar ambientes
        completos por meio de pull requests.
      startDate: Mar 1, 2023
      endDate: Nov 30, 2023
      summary: |
        - Construída com Backstage, Terraform, Argo CD e Kubernetes em modelo GitOps
        - Reduziu de 3 dias para 25 minutos o tempo de criação de ambientes de homologação
        - Adotada por 32 squads, com mais de 400 ambientes provisionados no primeiro semestre
      keywords:
        - Backstage
        - Terraform
        - Argo CD
        - Kubernetes
        - GitOps
    - name: Observabilidade para Pagamentos em Tempo Real
      description: Stack de métricas, logs e traces para monitorar transações críticas
        24 horas por dia.
      startDate: Feb 1, 2021
      endDate: Oct 15, 2021
      summary: |
        - Instrumentação de serviços com OpenTelemetry e correlação de traces ponta a ponta
        - Dashboards e alertas baseados em SLOs de latência e taxa de erro
        - Redução de 55% no tempo médio de diagnóstico de falhas em produção
      keywords:
        - OpenTelemetry
        - Grafana
        - Datadog
        - SLO

  interests:
    - name: Esportes
