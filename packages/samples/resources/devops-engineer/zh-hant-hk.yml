content:
  basics:
    name: 陳嘉俊
    headline: '資深 DevOps 工程師 | 雲端架構與自動化交付專家'
    phone: '+852 9123 4567'
    email: kachun.chan@example.com
    url: https://kachunchan.dev
    summary: |
      - 8 年雲端基礎架構與 DevOps 經驗，專注於大規模容器化平台、CI/CD 自動化與可觀測性建設
      - 主導單體式系統重構為 Kubernetes 微服務架構，部署頻率由每月 2 次提升至每日 10 次以上
      - 以 Terraform 與 Ansible 全面實踐基礎架構即程式碼（IaC），環境建置時間由 3 個工作日縮短至 45 分鐘
      - 建立 Prometheus、Grafana 與 ELK 監控堆疊，平均故障恢復時間（MTTR）下降 70%，系統可用率達 99.98%
      - 雲端成本治理經驗豐富，透過資源調度與預留實例策略，每年節省逾 180 萬港元雲端支出

      熱衷推動 DevOps 文化與 blameless 事後檢討機制，擅長跨部門溝通協作，並定期主持內部技術工作坊與新人培訓。
  location:
    address: 香港九龍觀塘鴻圖道 88 號創紀大廈 12 樓
    city: 香港
    region: 九龍
    country: Hong Kong
  profiles:
    - network: GitHub
      url: https://github.com/kachunchan
      username: kachunchan
    - network: LinkedIn
      url: https://www.linkedin.com/in/kachunchan
      username: kachunchan
    - network: Stack Overflow
      url: https://stackoverflow.com/users/1842371/kachunchan
      username: kachunchan
  education:
    - institution: 香港科技大學
      url: https://www.ust.hk
      degree: Bachelor
      area: 計算機科學
      score: '3.6'
      startDate: Sep 2012
      endDate: Jun 2016
      courses:
        - 資料結構與演算法
        - 作業系統
        - 電腦網絡
        - 資料庫系統
        - 分散式系統
        - 雲端運算導論
        - 資訊安全基礎
      summary: |
        - 主修計算機科學，成績位列全系前 15%，連續三年獲院長嘉許名單
        - 畢業專題為以容器技術建置校園課程排程系統，獲得學系最佳專題獎
        - 擔任計算機學會幹事，籌辦校內黑客松與技術講座
  work:
    - name: 雲際科技（香港）有限公司
      url: https://www.cloudhorizon.com.hk
      position: 資深 DevOps 工程師
      startDate: Apr 2021
      summary: |
        - 帶領 5 人平台工程小組，負責 12 條產品線的 Kubernetes（Amazon EKS）多集群架構設計、升級與維運
        - 以 Terraform 模組化管理 AWS 資源（VPC、EKS、RDS、IAM、S3），將新環境交付時間由 3 個工作日縮短至 45 分鐘
        - 建置 GitLab CI 與 Argo CD 的 GitOps 流水線，實現每日 10 次以上零停機部署，回滾時間少於 3 分鐘
        - 導入 Prometheus、Grafana、Loki 與 OpenTelemetry，建立 SLO 告警與錯誤預算機制，MTTR 由 90 分鐘降至 25 分鐘
        - 推動雲端成本治理（FinOps），透過 Karpenter 自動擴縮與 Savings Plans 規劃，年度雲端支出下降 32%
        - 主持每月內部技術工作坊及事故事後檢討，推動知識文件化與值班輪替制度
      keywords:
        - Kubernetes
        - Terraform
        - GitOps
        - Observability
        - FinOps
    - name: 亞太數據服務有限公司
      url: https://www.apacdata.com.hk
      position: DevOps 工程師
      startDate: Jul 2018
      endDate: Mar 2021
      summary: |
        - 將單體式 Java 應用拆分為 20 個微服務並容器化部署至 Kubernetes，發佈週期由季度縮短至雙週
        - 以 Jenkins 與 Ansible 建立自動化建置、測試與部署流程，人工操作步驟減少 85%
        - 設計香港與新加坡多區域災難復原架構，RTO 由 8 小時降至 30 分鐘，RPO 控制在 5 分鐘內
        - 導入 HashiCorp Vault 集中管理密鑰與憑證，消除設定檔中的明文密碼與共用帳號
        - 與開發團隊協作推行測試自動化與品質閘門，單元測試覆蓋率由 42% 提升至 81%
      keywords:
        - Jenkins
        - Ansible
        - Docker
        - Vault
        - Disaster Recovery
    - name: 凱達資訊科技顧問有限公司
      url: https://www.kaidata-its.com
      position: 系統運維工程師
      startDate: Aug 2016
      endDate: Jun 2018
      summary: |
        - 負責 200 多台 Linux 伺服器的日常維運、效能調校、修補管理與容量規劃
        - 建置 Zabbix 與 Nagios 監控告警系統，將被動故障處理轉為主動預警
        - 撰寫 Shell 與 Python 自動化腳本，將例行備份與巡檢工作壓縮至每日 15 分鐘內完成
        - 協助三家客戶完成 AWS EC2 與 RDS 遷移，平均節省 40% 自建機房維運成本
      keywords:
        - Linux
        - Shell
        - Python
        - Zabbix
  languages:
    - language: Cantonese
      fluency: Native or Bilingual Proficiency
      keywords:
        - 母語
    - language: English
      fluency: Full Professional Proficiency
      keywords:
        - IELTS 7.5
        - 商務書信與技術簡報
    - language: Mandarin
      fluency: Full Professional Proficiency
      keywords:
        - 普通話水平測試二級甲等
  skills:
    - name: 雲端平台
      level: Expert
      keywords:
        - AWS
        - Google Cloud
        - Azure
        - Amazon EKS
        - Lambda
    - name: 容器與編排
      level: Expert
      keywords:
        - Docker
        - Kubernetes
        - Helm
        - Istio
        - Karpenter
    - name: 基礎架構即程式碼
      level: Advanced
      keywords:
        - Terraform
        - Ansible
        - Pulumi
        - CloudFormation
    - name: CI/CD 與 GitOps
      level: Advanced
      keywords:
        - GitLab CI
        - Jenkins
        - GitHub Actions
        - Argo CD
    - name: 監控與可觀測性
      level: Advanced
      keywords:
        - Prometheus
        - Grafana
        - Loki
        - OpenTelemetry
        - ELK Stack
    - name: 程式語言與腳本
      level: Advanced
      keywords:
        - Python
        - Go
        - Bash
        - SQL
  awards:
    - title: 年度卓越工程團隊獎
      awarder: 雲際科技（香港）有限公司
      date: Dec 2023
      summary: |
        表揚在雲端成本治理專案中的傑出表現，透過自動擴縮與資源調度策略，於 12 個月內為公司節省逾 180 萬港元雲端支出，同時維持服務可用率 99.98%。
    - title: 最佳自動化專案獎
      awarder: 亞太數據服務有限公司
      date: Jan 2020
      summary: |
        肯定在 CI/CD 自動化改造專案中的貢獻，將部署流程由人工操作轉為全自動流水線，發佈失誤率下降 76%。
  certificates:
    - name: Certified Kubernetes Administrator (CKA)
      issuer: Cloud Native Computing Foundation
      date: Mar 2022
      url: https://www.cncf.io/certification/cka/
    - name: Certified Kubernetes Security Specialist (CKS)
      issuer: Cloud Native Computing Foundation
      date: Aug 2023
      url: https://www.cncf.io/certification/cks/
    - name: AWS Certified DevOps Engineer – Professional
      issuer: Amazon Web Services
      date: Nov 2021
      url: https://aws.amazon.com/certification/
    - name: 'HashiCorp Certified: Terraform Associate'
      issuer: HashiCorp
      date: May 2023
      url: https://www.hashicorp.com/certification
  publications:
    - name: 以 GitOps 實現多集群 Kubernetes 的零停機交付
      publisher: 香港雲端原生技術年刊 2023
      releaseDate: Aug 2023
      url: https://www.cloudnativehk.org/journal/2023/gitops-multi-cluster
      summary: |
        - 探討以 Argo CD 與 ApplicationSet 管理跨區域多集群部署的實務模式
        - 比較 push-based 與 pull-based 交付流程在合規與安全層面的差異
        - 分享將回滾時間由 20 分鐘壓縮至 3 分鐘的具體調校經驗
  projects:
    - name: KubeSaver
      url: https://github.com/kachunchan/kubesaver
      description: 開源的 Kubernetes 資源使用率分析與成本優化工具，協助團隊找出閒置工作負載並提出調整建議
      startDate: Mar 2022
      summary: |
        - 以 Go 語言開發，定期抓取 Prometheus 指標並計算每個命名空間的成本分攤
        - 提供 CLI 與網頁儀表板，可輸出建議的 requests/limits 調整清單
        - 累積超過 1,200 個 GitHub Star，並獲多間香港初創企業採用於內部成本治理
      keywords:
        - Kubernetes
        - FinOps
        - Go
        - Prometheus
    - name: CICD 樣板庫
      url: https://github.com/kachunchan/pipeline-templates
      description: 為公司內部 30 多個專案提供一致化的 CI/CD 樣板與安全掃描閘門
      startDate: Sep 2021
      endDate: Jun 2022
      summary: |
        - 整合 Trivy、Semgrep 與 SBOM 產生流程，於流水線中自動攔截高風險漏洞
        - 將新專案導入 CI/CD 的時間由 2 日縮短至 30 分鐘內完成
      keywords:
        - GitLab CI
        - DevSecOps
        - Trivy
  interests:
    - name: 運動
      keywords:
        - 長跑
        - 龍舟
        - 游泳
    - name: 個人興趣
      keywords:
        - 攝影
        - 開源社群
        - 手沖咖啡
  volunteer:
    - organization: 香港雲端原生社群
      url: https://www.cloudnativehk.org
      position: 講者及工作坊導師
      startDate: Mar 2021
      summary: |
        - 每季主持 Kubernetes、CI/CD 及可觀測性主題工作坊，累計參與人數超過 600 人
        - 協助籌辦年度香港 DevOps 年會，負責議程規劃、講者邀請與現場技術支援
        - 為初創團隊提供雲端架構諮詢，協助其在有限預算下建立可靠的自動化交付流程
  references:
    - name: 李婉婷
      relationship: 雲際科技（香港）有限公司 平台工程總監
      email: wendy.lee@example.com
      phone: '+852 2765 4321'
      summary: |
        嘉俊在任職期間主導了我們整個 Kubernetes 平台的現代化工程，他不僅技術紮實，更具備難得的推動力與溝通能力，能將複雜的架構議題轉化為團隊可執行的路線圖，是任何工程組織都值得擁有的人才。

