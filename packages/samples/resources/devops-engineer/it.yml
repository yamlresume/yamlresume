  publications:
    - name: Pratiche SRE per piattaforme Kubernetes multi-tenant
      publisher: DevOps Italia Magazine
      releaseDate: Apr 2020
      url: https://www.devopsitalia.it/articoli/sre-kubernetes
      summary: |
        - Analisi delle strategie di osservabilità e gestione degli incidenti
        - Case study su riduzione del MTTR e automazione dei runbook
  projects:
    - name: Piattaforma di self-service per team di sviluppo
      url: https://github.com/marcobianchi-devops/devportal
      description: Portale interno per il provisioning automatizzato di ambienti cloud
      startDate: Jan 2021
      endDate: Dec 2022
      summary: |
        - Progettazione di un portale basato su Backstage per l'accesso self-service a risorse cloud
        - Integrazione con Terraform e Argo CD per il deploy automatico degli ambienti
        - Riduzione del time-to-market dei team di sviluppo del 40%
      keywords:
