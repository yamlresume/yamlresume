        - Innsiktskartlegging
    - name: Dataanalyse
      level: Intermediate
      keywords:
        - SQL
        - Google Analytics
        - Amplitude
        - A/B-testing
  awards:
    - title: Årets produktleder 2023
      date: Mar 1, 2023
      awarder: Digital Ledelse Norge
      summary: |
        Hederspris for fremragende produktledelse og utviklingen av en mobilbank med tydelig brukerfokus.
  certificates:
    - name: Certified Scrum Product Owner (CSPO)
      url: https://www.scrumalliance.org/
      issuer: Scrum Alliance
      date: Nov 1, 2017
    - name: Google Analytics Individual Qualification
      url: https://skillshop.exceedlms.com/
      issuer: Google
      date: Feb 1, 2022
  publications:
    - name: Fra innsikt til handling – slik bygger du produkter folk vil bruke
      publisher: Produktledelse.no
      releaseDate: Sep 15, 2022
      url: https://www.produktledelse.no/artikler/fra-innsikt-til-handling
      summary: |
        Praktisk artikkel om hvordan kvalitative og kvantitative innsikter kombineres for å forbedre produktbeslutninger.
  projects:
    - name: Nordvik Mobil
      url: https://www.nordvikbank.no/mobil
      description: Ny mobilbank med økt selvbetjening og personlig økonomioversikt.
      startDate: Mar 1, 2021
      endDate: Nov 1, 2022
      summary: |
        - Ledet produktutviklingen fra konsept til lansering
        - Etablerte tett samarbeid mellom design, utvikling og forretning
        - Økte brukertilfredsheten (NPS) med 18 poeng
        - Leverte appen i tråd med personvern- og sikkerhetskrav
      keywords:
        - Mobilbank
        - NPS
        - Produktlansering
        - Fintech
    - name: Pensjonsportalen
      url: https://www.aktivdigital.no/pensjon
      description: Selvbetjeningsportal for pensjonsinnsikt og sparing.
      startDate: Jan 1, 2018
      endDate: Dec 1, 2019
      summary: |
        - Gjennomførte brukerintervjuer og konsepttester
        - Utviklet enklere språk og tydeligere informasjonsarkitektur
        - Reduserte henvendelser til kundesenter med 22 prosent
      keywords:
        - Selvbetjening
        - Pensjon
        - Brukerinnsikt
        - UX
  interests:
