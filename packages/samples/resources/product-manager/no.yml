  projects:
    - name: PengePilot – personlig økonomi-app
      startDate: Jan 2020
      summary: >
        Sideprosjekt sammen med to utviklere for å hjelpe unge voksne med
        sparing og budsjettering.
      description: >
        Utformet konseptet, gjennomførte brukertester og ledet utviklingen av en
        MVP som fikk over 10 000 nedlastinger det første halvåret.
      endDate: Jun 2020
      keywords:
        - Sparing
        - Budsjett
        - App-utvikling
      url: https://www.pengepilot.no
  publications:
    - name: Hvordan bygge digitale produkter brukerne faktisk vil ha
      publisher: Produktbloggen.no
      releaseDate: Jun 2021
      summary: >
        En praktisk guide til å kombinere kvalitativ brukerinnsikt med
        kvantitativ analyse i produktutvikling.
      url: https://produktbloggen.no/hvordan-bygge-digitale-produkter
  skills:
    - level: Expert
      name: Produktstrategi
      keywords:
        - Produktroadmap
        - Go-to-market
        - OKR
        - Konkurranseanalyse
        - Forretningsforståelse
    - level: Advanced
      name: Brukerinnsikt
      keywords:
        - Brukerintervjuer
        - Personas
        - Service design
        - Prototyping
        - Tilgjengelighet
    - level: Advanced
      name: Data og analyse
      keywords:
        - SQL
        - Google Analytics
        - Amplitude
        - A/B-testing
        - KPI-dashboards
  volunteer:
    - organization: Girls in Tech Norway
      position: Mentor
      startDate: Jan 2020
      summary: >
        Mentor for unge kvinner som ønsker å utvikle seg innen produktledelse og
        teknologi. Holder jevnlige workshops i produktutvikling og
        karriereveiledning.
      endDate: Dec 2023
      url: https://girlsintechnorway.com/
  work:
    - name: Vipps AS
      position: Senior Produktleder
      startDate: Jan 1, 2021
      summary: >
        - Ansvarlig for produktområdet betaling i nettbutikk med årlig
        transaksjonsverdi i milliarder av kroner

        - Leder tverrfaglige team av utviklere, designere og dataanalytikere i
        Scrum

        - Utarbeider strategi og roadmap i tett samarbeid med interessenter og
        kunder

        - Gjennomfører brukerintervjuer, kvantitative analyser og A/B-tester for
        å forbedre konvertering og brukeropplevelse

        - Etablerer og følger opp OKR-er som rapporteres til konsernledelsen
      endDate: null
      keywords:
        - Betaling
        - E-handel
        - Vekst
        - OKR
        - Agile
      url: https://www.vipps.no
    - name: DNB
      position: Produktleder
      startDate: Aug 1, 2018
      summary: >
        - Ansvarlig for mobilbankens spare- og budsjetteringsfunksjoner

        - Forbedret opplevelsen for 1,5 millioner månedlige aktive brukere

        - Reduserte churn gjennom datadrevne tiltak og personaliserte tips

        - Jobbet tett med compliance og risikostyring for å sikre trygge og
        bærekraftige produkter
      endDate: Dec 31, 2020
      keywords:
        - Mobilbank
        - Finans
        - Brukerinnsikt
        - KPI
      url: https://www.dnb.no
    - name: Schibsted
      position: Produktansvarlig
      startDate: Jan 1, 2017
      summary: >
        - Produktansvarlig for anbefalingsmotor på en av Norges største
        nyhetsplattformer

        - Samarbeidet med redaksjonen og data science-team for å optimalisere
        innholdsdistribusjon

        - Økte brukerengasjement og lesetid med 15 prosent gjennom
        personalisering
      endDate: Jul 31, 2018
      keywords:
        - Nyhetsmedier
        - Personalisering
        - Data science
      url: https://www.schibsted.com
