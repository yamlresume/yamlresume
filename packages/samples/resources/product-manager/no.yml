content:
  basics:
    name: Ingrid Larsen
    email: ingrid.larsen@produktleder.no
    headline: Produktleder med fokus på brukeropplevelse og strategisk vekst
    phone: +47 912 34 567
    summary: >
      - Produktleder med 8 års erfaring fra finans- og mediebransjen

      - Sterk på produktstrategi, brukerinnsikt og datadrevet utvikling

      - Erfaring med å lede tverrfaglige team og bygge en tydelig produktkultur

      - Resultatorientert med stort engasjement for brukeropplevelse og
      forretningsverdi
    url: https://no.linkedin.com/in/ingridlarsen
  education:
    - area: Industriell økonomi og teknologiledelse
      institution: NTNU – Norges teknisk-naturvitenskapelige universitet
      degree: Master
      courses:
        - Produkt- og prosjektledelse
        - Markedsføring og strategi
        - Datateknologi og programmering
        - Statistikk og dataanalyse
        - Innovasjon og entreprenørskap
      endDate: Jun 1, 2016
      startDate: Aug 1, 2011
      summary: |
        - Masteroppgave om datadrevet produktutvikling i norske scaleups
        - Fordypning i teknologi, økonomi og organisasjonsdesign
        - Erfaringsbasert læring gjennom teamprosjekter og case-oppgaver
      score: "4.8"
      url: https://www.ntnu.no/
  awards:
    - awarder: Produktlederforeningen i Norge
      title: Årets produktleder 2022
      date: Mar 2022
      summary: >
        Tildelt for fremragende produktledelse og evnen til å skape
        brukerfokuserte løsninger med tydelige forretningsresultater.
  certificates:
    - issuer: Scrum Alliance
      name: Certified Scrum Product Owner (CSPO)
      date: Feb 2019
      url: https://www.scrumalliance.org/
    - issuer: Amplitude
      name: Product Analytics Certification
      date: Oct 2021
      url: https://amplitude.com/
  interests:
    - name: Friluftsliv
      keywords:
        - Fjellturer
