  work:
    - name: 樂灣科技股份有限公司
      position: 資深產品經理
      startDate: Mar 1, 2021
      summary: |
        - 負責訂閱制 SaaS 產品線，掌管產品藍圖與季度開發優先序，年度營收成長 45%
        - 建立用戶訪談與使用數據分析機制，找出關鍵流失環節，將 30 日留存率提升 22%
        - 導入 A/B testing 流程並與工程團隊協作，優化註冊轉換率，從 12% 提升至 18%
        - 主導跨部門（業務、行銷、客服）溝通，確保需求蒐集與產品發布策略一致
      keywords:
        - 產品策略
        - A/B 測試
        - 敏捷開發
        - 資料分析
      url: https://www.lovewan.tw
    - name: 智慧雲端股份有限公司
      position: 產品經理
      startDate: Jul 1, 2018
      summary: |
        - 負責 B2B 雲端人資系統之產品規劃，涵蓋薪資計算、請假打卡與績效考核模組
        - 訪談超過 30 家企業客戶，歸納痛點並轉化為產品需求文件，縮短需求確認時程 40%
        - 協調設計與工程團隊進行敏捷開發，定期主持 Sprint 規劃與回顧會議
        - 與客戶成功團隊合作，建立產品使用手冊與教育訓練內容，降低入門障礙
      endDate: Feb 1, 2021
      keywords:
        - B2B SaaS
        - 需求訪談
        - Scrum
        - 產品文件
      url: https://www.smartcloud.com.tw
    - name: 宏遠資訊有限公司
      position: 助理產品經理
      startDate: Jul 1, 2016
      summary: |
        - 協助產品經理進行競品分析、市場調查與用戶問卷設計，並產出分析報告供團隊決策
        - 管理產品需求清單與 Bug 追蹤表，定期整理版本發布說明並與利害關係人同步
        - 參與 App 改版專案，協助進行 UI Flow 繪製與原型測試，累積扎實的產品實務經驗
      endDate: Jun 1, 2018
      keywords:
        - 競品分析
        - 原型設計
        - 專案管理
      url: https://www.hongyuan.com.tw
