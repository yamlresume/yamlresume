content:
  basics:
    name: 林佳穎
    headline: 產品經理 | 8 年軟體與金融科技產品經驗 | 數據驅動決策
    phone: "+886 912 345 678"
    email: chia.ying.lin@example.tw
    url: https://www.linkedin.com/in/chiaying-lin
    summary: |
      擁有 8 年以上軟體與金融科技產品管理經驗的產品經理，擅長從 0 到 1 打造產品，也熟悉產品成熟期的迭代與優化。

      - 主導過 20+ 個跨國、跨團隊專案，涵蓋行動支付、數位帳戶、電商推薦等領域
      - 以數據分析與用戶研究為核心，制定產品策略與路線圖，成功提升 DAU 與轉換率
      - 熟悉 Scrum 開發流程，善於與工程、設計、業務團隊協作，建立高效敏捷團隊
      - 具備 SQL、Amplitude、Google Analytics 等數據工具能力，能獨立完成分析並驅動決策

  location:
    city: 台北市
    region: 大安區
    country: Taiwan
    postalCode: "106"

  profiles:
    - network: LinkedIn
      url: https://www.linkedin.com/in/chiaying-lin
      username: chiaying-lin
    - network: GitHub
      url: https://github.com/chiayinglin
      username: chiayinglin

  education:
    - institution: 國立臺灣大學
      url: https://www.ntu.edu.tw
      degree: Bachelor
      area: 資訊管理學系
      score: "3.9"
      startDate: Sep 1, 2011
      endDate: Jun 1, 2015
      courses:
        - 資料庫管理
        - 系統分析與設計
        - 行銷管理
        - 統計學
        - 電子商務
      summary: |
        - 主修資訊管理，具備扎實的資訊系統與商業管理雙領域知識
        - 以「線上購物平台的推薦系統」專題獲選為畢業專題競賽佳作

  work:
    - name: 雲端金融科技股份有限公司
      position: 資深產品經理
      startDate: Mar 1, 2022
      summary: |
        - 負責行動支付 App 之產品策略、路線圖規劃與需求優先級排序，涵蓋 iOS、Android、Web 三端
        - 帶領 2 位產品設計師與 3 位數據分析師，與 6 個 Scrum Team 協作，年度目標達成率 120%
        - 主導「一鍵轉帳」與「電子發票載具」功能，上線 3 個月內提升月活躍用戶 35%
        - 建立用戶回饋與數據監控機制，運用 SQL 與 Amplitude 進行留存分析，降低 15% 用戶流失率
      keywords:
        - 產品策略
        - 行動支付
        - Scrum
        - SQL
        - Amplitude
    - name: 樂購電子商務股份有限公司
      position: 產品經理
      startDate: Jul 1, 2019
      endDate: Feb 1, 2022
      summary: |
        - 負責電商平台會員系統與個人化推薦功能，與工程、設計、行銷團隊協作完成季度產品目標
        - 運用 A/B 測試優化商品詳情頁，將下單轉換率提升 18%
        - 導入用戶訪談與問卷調查機制，整理 200+ 位用戶回饋，驅動產品迭代方向
        - 透過 GA 與內部數據儀表板監控關鍵指標，建立產品績效追蹤流程
      keywords:
        - 電商平台
        - A/B 測試
        - Google Analytics
        - 用戶研究
    - name: 數位導航科技股份有限公司
      position: 助理產品經理
      startDate: Jul 1, 2017
      endDate: Jun 1, 2019
      summary: |
        - 協助產品經理進行競品分析、需求文件撰寫與原型設計
        - 負責地圖導航 App 之數據報表產出，定期追蹤 DAU、留存率與功能使用率
        - 與客服團隊合作建立問題分級機制，縮短 30% 問題回應時間
      keywords:
        - 競品分析
        - Axure
        - 數據報表

  skills:
    - name: 產品管理
      level: Expert
      keywords:
        - 產品策略
        - 產品路線圖
        - 需求分析
        - 競品分析
        - 用戶故事
        - 優先級排序
    - name: 數據分析
      level: Advanced
      keywords:
        - SQL
        - Amplitude
        - Google Analytics
        - A/B 測試
        - Tableau
    - name: 專案管理
      level: Advanced
      keywords:
        - Scrum
        - Kanban
        - JIRA
        - Confluence
        - Figma

  languages:
    - language: Chinese
      fluency: Native or Bilingual Proficiency
      keywords:
        - 母語
    - language: English
      fluency: Full Professional Proficiency
      keywords:
        - TOEIC 910
        - 商務簡報
        - 跨國會議

  awards:
    - title: 年度最佳產品獎
      date: Dec 2023
      awarder: 雲端金融科技股份有限公司
      summary: |
        以「電子發票載具」專案獲得內部年度最佳產品獎，肯定其對用戶價值與商業指標的卓越貢獻。

  certificates:
    - name: Certified Scrum Product Owner (CSPO)
      issuer: Scrum Alliance
      date: Jun 2021
      url: https://www.scrumalliance.org/
    - name: Google Analytics Individual Qualification
      issuer: Google
      date: Feb 2020
      url: https://skillshop.exceedlms.com/

  publications:
    - name: 從用戶數據到產品決策：行動支付產品經理實戰筆記
      publisher: 產品思維電子報
      releaseDate: Mar 2023
      url: https://medium.com/@chiaying-lin/product-data-decision
      summary: |
        分享行動支付產品在用戶增長與留存優化上的數據分析方法與實務經驗。

  projects:
    - name: 個人化商品推薦系統
      url: https://github.com/chiayinglin/recommendation-system
      startDate: Mar 1, 2021
      endDate: Aug 1, 2021
      summary: |
        主導電商平台個人化推薦系統建置，整合用戶行為數據與商品標籤，提升整體點擊率。
      description: |
        與資料科學團隊合作，導入 LightGBM 與協同過濾演算法，並設計 A/B 測試驗證成效。最終將首頁推薦點擊率提升 25%，並降低 10% 的跳出率。
      keywords:
        - 推薦系統
        - A/B 測試
        - LightGBM
    - name: 行動支付用戶成長計畫
      startDate: Jan 1, 2023
      endDate: Jun 1, 2023
      summary: |
        跨部門推動用戶成長專案，透過分眾行銷與產品功能優化，達成新增用戶翻倍目標。
      description: |
        結合用戶分眾、推播通知與新戶引導流程優化，在 6 個月內將每月新增用戶數提升 120%，並有效改善新戶次月留存率。
      keywords:
        - 用戶成長
        - 行銷自動化
        - 留存分析

  interests:
    - name: 閱讀
      keywords:
        - 產品設計
        - 行為經濟學
    - name: 旅行
      keywords:
        - 自助旅行
        - 美食探索

  volunteer:
    - organization: 女力科技社群 Taiwan
      position: 產品管理導師
      startDate: Jan 1, 2022
      summary: |
        擔任產品管理線上課程導師，協助 30 位以上女性職場夥伴建立產品思維，並提供職涯發展建議。

