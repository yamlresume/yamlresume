  awards:
    - title: 香港金融科技發展獎（最佳流動支付體驗）
      date: Oct 2021
      awarder: 香港金融科技協會
      summary: |
        憑藉數碼錢包產品的創新功能和用戶體驗設計，獲頒「最佳流動支付體驗」獎項，表揚團隊在支付流程簡化及安全合規方面的卓越表現。
  certificates:
    - name: Certified Scrum Product Owner (CSPO)
      issuer: Scrum Alliance
      date: Jun 2019
      url: https://www.scrumalliance.org/
    - name: 高級產品管理專業證書
      issuer: 香港產品管理學會
      date: Aug 2020
      url: https://www.hkpm.org.hk
  publications:
    - name: 數碼產品經理必須掌握的數據分析方法
      publisher: Medium
      releaseDate: Mar 15, 2022
      url: https://medium.com/@ngatingchan/data-driven-product-management
      summary: |
        分享如何利用 SQL 及 A/B 測試制定產品決策，並以實際案例說明數據分析在金融科技產品中的應用。
  projects:
    - name: 投資知識學習平台「理財新手村」
      url: https://www.finlearn.hk
      description: 一款專為年輕用戶設計的互動理財學習應用程式，利用遊戲化元素提升金融知識普及率。
      startDate: Jan 1, 2023
      endDate: Jul 1, 2023
      summary: |
        - 針對 18-30 歲用戶缺乏理財知識的痛點，主導產品概念開發及用戶驗證
        - 與教育機構及設計顧問合作，設計 12 個互動課程及投資情境模擬
        - 上線三個月內錄得超過 10,000 名註冊用戶，課程完成率達 68%
      keywords:
        - 金融教育
        - 遊戲化
        - 用戶研究
        - 產品設計
  interests:
