content:
  basics:
    name: 陳雅婷
    headline: 資深產品經理 | 金融科技與數碼解決方案
    phone: "+852 9123 4567"
    email: ngating.chan@example.com
    url: https://www.linkedin.com/in/ngatingchan
    summary: |
      擁有超過 8 年產品管理經驗的資深產品經理，專注於金融科技、電子商貿及流動應用程式領域。擅長由 0 到 1 建立產品，並通過數據驅動決策、用戶研究及跨團隊協作，持續提升產品價值及用戶體驗。

      - 主導多個大型數碼產品項目，涵蓋流動銀行、數碼支付及零售電商，累計服務用戶超過 200 萬
      - 熟悉敏捷開發、精實啟動及 OKR 管理，能夠有效協調工程、設計、市場及業務團隊
      - 擁有數據分析及 A/B 測試實戰經驗，利用 SQL、Amplitude、Mixpanel 等工具制定產品策略
      - 具備國際視野及本地市場洞察，能靈活應對瞬息萬變的業務需求
  location:
    address: 香港鰂魚涌英皇道 979 號
    city: 香港
    region: 香港島
    country: Hong Kong
  profiles:
    - network: LinkedIn
      url: https://www.linkedin.com/in/ngatingchan
      username: ngatingchan
    - network: Medium
      url: https://medium.com/@ngatingchan
      username: ngatingchan
  education:
    - institution: 香港中文大學
      url: https://www.cuhk.edu.hk/
      degree: Bachelor
      area: 工商管理學士（資訊系統）
      score: "3.7"
      startDate: Sep 1, 2010
      endDate: Jul 1, 2014
      courses:
        - 產品管理與開發
        - 數據庫管理
        - 電子商貿策略
        - 市場研究與分析
        - 資訊系統審計
        - 企業架構
      summary: |
        - 主修資訊系統，副修市場學，畢業論文探討流動支付在香港的普及因素
        - 擔任學生會資訊科技幹事，統籌校園數碼轉型項目
        - 獲院長嘉許名單（Dean's List）兩次
  work:
    - name: 智融香港有限公司
      url: https://www.smartfintech.com.hk
      position: 高級產品經理
      startDate: Apr 1, 2022
      summary: |
        - 主導新一代流動銀行應用程式的產品規劃，由研究、設計、開發至上市全程管理，用戶評分提升至 4.8 星
        - 與工程、設計、風控及合規團隊緊密合作，確保產品符合金管局監管要求及銀行安全標準
        - 制定並執行產品路線圖，利用 OKR 框架與持份者對齊目標，按季度交付 15 項以上功能更新
        - 建立數據分析機制，透過 A/B 測試優化入門流程，令新用戶轉換率提升 32%
        - 帶領 3 名產品助理及 2 名產品設計師，建立以用戶為中心的產品文化
      keywords:
        - 金融科技
        - 流動銀行
        - 產品路線圖
        - A/B 測試
        - 敏捷開發
        - 持份者管理
    - name: 數碼支付香港有限公司
      url: https://www.digitalpay.com.hk
      position: 產品經理
      startDate: Jul 1, 2018
      endDate: Mar 1, 2022
      summary: |
        - 負責數碼錢包及電子支付產品的端到端交付，包括 QR Code 支付、P2P 轉賬及商戶管理系統
        - 與超過 50 間合作商戶進行需求訪談，設計並推出商家促銷及會員積分功能，帶動交易量增長 45%
        - 利用 SQL 及 Amplitude 分析用戶行為，提出並落實減低支付失敗率的措施，成功將失敗率由 3.5% 降至 1.8%
        - 參與 Scrum 團隊，擔任 Product Owner，撰寫用戶故事及驗收準則，確保每個 Sprint 按時交付
      keywords:
        - 數碼支付
        - Fintech
        - 用戶研究
        - SQL
        - Product Owner
        - 電子錢包
    - name: 環球電商方案有限公司
      url: https://www.globalecom.io
      position: 助理產品經理
      startDate: Aug 1, 2015
      endDate: Jun 1, 2018
      summary: |
        - 協助高級產品經理管理 B2B 電子商貿平台的功能開發，涵蓋商品管理、訂單處理及物流追蹤模組
        - 撰寫產品需求文件（PRD），與工程師及設計師協作進行功能驗收，確保產品質素
        - 定期分析網站流量及銷售數據，為團隊提供營運建議，推動平均訂單價值提升 18%
        - 協調客戶服務部門處理用戶反饋，整理常見問題並優化自助服務流程
      keywords:
        - B2B
        - 電子商貿
        - PRD
        - 數據分析
        - 客戶成功
  skills:
    - name: 產品管理
      level: Expert
      keywords:
        - 產品策略
        - 路線圖規劃
        - 用戶故事
        - 敏捷／Scrum
