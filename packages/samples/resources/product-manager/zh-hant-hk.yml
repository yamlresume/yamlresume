      url: https://www.hkpmassociation.org
      position: 義務導師
      startDate: Jan 1, 2020
      endDate: Dec 31, 2023
      summary: |
        - 為轉職產品管理人士提供一對一職業指導，分享求職及面試技巧
        - 定期主持工作坊，主題包括「從 0 到 1 建立產品」及「數據驅動決策」
        - 協助協會舉辦年度研討會，邀請業界領袖分享最新產品管理趨勢

