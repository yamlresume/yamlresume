  work:
    - name: Nixal Digital
      position: Senior Product Manager
      startDate: Jan 1, 2022
      summary: >
        - Defino la visión y estrategia de producto para dos líneas principales:
        banca móvil y soluciones de pago.

        - Lidero un equipo de 8 personas entre ingeniería, diseño y datos.

        - Priorizo el backlog mediante OKRs, análisis de impacto y entrevistas
        con clientes.

        - Lancé una nueva funcionalidad de pagos que incrementó la retención un
        12 %.

        - Acompaño al equipo en la medición de KPIs con Mixpanel, SQL y Google
        Analytics.
      keywords:
        - Product Strategy
        - OKRs
        - FinTech
        - Agile
        - SaaS
        - Data Analysis
      url: https://nixal.digital
    - name: Wandatech
      position: Product Manager
      startDate: Jun 1, 2019
      summary: >
        - Gestioné el ciclo de vida completo de un SaaS B2B de automatización de
        marketing.

        - Creé el roadmap, épicas e historias de usuario en Jira.

        - Coordiné con equipos comerciales y de éxito del cliente para
        identificar oportunidades de mejora.

        - Rediseñé el onboarding de la plataforma y reduje el churn un 20 %.
      endDate: Dec 31, 2021
      keywords:
        - SaaS
        - B2B
        - Marketing Automation
        - Jira
        - Roadmap
      url: https://wandatech.io
    - name: Innova Retail Solutions
      position: Product Manager Jr.
      startDate: Sep 1, 2016
      summary: >
