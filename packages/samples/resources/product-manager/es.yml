        requisitos.

        - Diseñé y ejecuté pruebas de usabilidad con clientes reales.

        - Elaboré informes semanales de métricas y propuestas de mejora.

        - Colaboré con el equipo de desarrollo en la resolución de incidencias.
      endDate: May 31, 2019
      keywords:
        - Retail
        - Usabilidad
        - Analítica
        - Requirements
      url: https://innovaretail.es
