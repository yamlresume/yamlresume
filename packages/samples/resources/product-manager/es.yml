      - Aplico metodologías ágiles y tomo decisiones basadas en datos.

      - Experiencia en descubrimiento de clientes, priorización de backlog y
      medición de KPIs.

      - Colaboro estrechamente con diseño e ingeniería para ofrecer experiencias
      de usuario impactantes.
    url: https://www.luciafernandezpm.com
