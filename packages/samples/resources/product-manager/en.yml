      startDate: Jan 2022
      endDate: Dec 2022
      summary: |
        - Led the launch of iOS and Android apps reaching 500K downloads in the first quarter
        - Defined core mobile value proposition and MVP scope
        - Collaborated with engineering on offline-first architecture
      keywords:
