      phone: "(555) 234-5678"
      relationship: Former VP of Product
      email: jennifer.lee@example.com
      summary: |
        Marcus is a strategic product leader who consistently delivers results while keeping teams aligned and motivated.
  projects:
    - name: CloudSync Mobile
      url: https://cloudsync.example.com/mobile
