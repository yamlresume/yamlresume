      degree: Master
      area: Business Administration
      score: "3.7"
      startDate: Sep 1, 2014
      endDate: May 1, 2016
      summary: |
        - Focused on technology strategy, entrepreneurship, and product management
        - Led a student consulting project for an early-stage fintech startup
    - institution: University of Michigan
      url: https://umich.edu/
      degree: Bachelor
      area: Economics
      score: "3.8"
      startDate: Sep 1, 2010
      endDate: May 1, 2014
      summary: |
        - Graduated with high distinction
        - Co-founded the campus product management club
  work:
    - name: CloudSync
      url: https://cloudsync.example.com
      startDate: Mar 1, 2020
      endDate:
      position: Senior Product Manager
      summary: |
        - Own the product roadmap for the core collaboration platform used by 2M+ users
        - Drove a 25% increase in activation rate through onboarding redesign
        - Lead a team of 3 product managers, 8 engineers, and 2 designers
        - Partner with sales and customer success to close enterprise deals
      keywords:
        - SaaS
        - Roadmapping
        - Activation
        - Enterprise
    - name: ShopFlow
      url: https://shopflow.example.com
      startDate: Jun 1, 2016
      endDate: Feb 1, 2020
      position: Product Manager
      summary: |
        - Launched the merchant analytics dashboard used by 50,000+ sellers
        - Conducted user interviews and usability tests to inform feature prioritization
        - Defined OKRs and metrics framework for the seller experience team
      keywords:
        - E-commerce
        - Analytics
        - OKRs
        - User Research
