    name: Marcus Williams
    headline: Senior Product Manager
    phone: "(212) 555-0456"
    email: marcus.williams@example.com
    url: https://marcuswilliams.pm
    summary: |
      - Product leader with 8+ years of experience shipping B2B SaaS and consumer products
      - Proven track record of driving 0-to-1 product launches and scaling products to millions of users
      - Strong background in user research, data-informed prioritization, and cross-functional leadership
      - Advocate for agile methodologies, transparent roadmaps, and customer-centric design
  location:
    address: 789 Broadway
    city: New York
    region: New York
    country: United States
    postalCode: "10003"
  profiles:
    - network: LinkedIn
      url: https://linkedin.com/in/marcuswilliams
      username: marcuswilliams
    - network: Twitter
      url: https://twitter.com/marcuswilliams
      username: marcuswilliams
  education:
    - institution: Harvard Business School
