content:
  basics:
    name: Rizky Adi Prakoso
    email: rizky.adiprakoso@gmail.com
    headline: Manajer Produk dengan 8+ Tahun Pengalaman di Produk Digital
    phone: +62 811-2345-6789
    summary: >
      Manajer produk yang berorientasi pada dampak bisnis dan kebutuhan
      pengguna, dengan pengalaman lebih dari 8 tahun dalam membangun serta
      mengembangkan produk digital di sektor e-commerce, fintech, dan logistik.


      - Terbiasa memimpin siklus hidup produk secara end-to-end, mulai dari
      riset pengguna, product discovery, hingga go-to-market

      - Berpengalaman menggunakan pendekatan data-driven dan eksperimen A/B
      testing untuk meningkatkan retensi, aktivasi, dan pendapatan produk

      - Mampu berkolaborasi lintas fungsi bersama tim engineering, desain, data,
      pemasaran, dan compliance

      - Memiliki kemampuan komunikasi dan kepemimpinan yang kuat dalam menyusun
      visi produk serta memprioritaskan peta jalan produk
    url: https://rizkyadiprakoso.id
  education:
    - area: Sistem Informasi
      institution: Universitas Indonesia
      degree: Bachelor
      courses:
        - Analisis dan Perancangan Sistem Informasi
        - Manajemen Proyek Teknologi Informasi
        - Interaksi Manusia dan Komputer
        - Basis Data Lanjutan
        - Pemasaran Digital
        - Kewirausahaan Teknologi
      endDate: Jul 1, 2016
      startDate: Aug 1, 2012
      summary: >
        - Lulus dengan predikat cum laude dan fokus pada pengembangan produk
        digital

        - Aktif dalam organisasi mahasiswa dan menjadi ketua panitia seminar
        teknologi nasional 2015

        - Menyelesaikan proyek akhir tentang perancangan aplikasi mobile untuk
        UMKM lokal
      score: "3.72"
      url: https://www.ui.ac.id/
  awards:
    - awarder: Asosiasi E-Commerce Indonesia
      title: Manajer Produk Terbaik 2023
      date: Dec 15, 2023
      summary: >
        Penghargaan tahunan yang diberikan atas kontribusi luar biasa dalam
        pengembangan produk digital yang berdampak pada pertumbuhan industri
        e-commerce nasional.
  certificates:
    - issuer: Scrum Alliance
      name: Certified Scrum Product Owner (CSPO)
      date: Mar 1, 2021
      url: https://www.scrumalliance.org/certifications/cspo
    - issuer: Google
      name: Google Project Management Certificate
      date: Aug 1, 2022
      url: https://www.coursera.org/professional-certificates/google-project-management
  interests:
