      language: Indonesian
      keywords:
        - Bahasa Ibu
    - fluency: Full Professional Proficiency
      language: English
      keywords:
        - TOEFL iBT 100
        - IELTS 7.5
  location:
    city: Jakarta Selatan
    address: Jl. Kemang Raya No. 12
    country: Indonesia
    postalCode: "12190"
    region: DKI Jakarta
  profiles:
    - network: LinkedIn
      username: rizkyadiprakoso
      url: https://www.linkedin.com/in/rizkyadiprakoso
    - network: Medium
      username: rizkyadiprakoso
      url: https://medium.com/@rizkyadiprakoso
  projects:
    - name: Platform Analitik Produk
      startDate: Feb 1, 2022
      summary: >
        - Merancang kebutuhan produk bersama tim data untuk memvisualisasikan
        metrik utama

        - Mengurangi waktu penyusunan laporan mingguan dari 6 jam menjadi 30
        menit

        - Mendorong adopsi pengambilan keputusan berbasis data di seluruh
        organisasi
      description: Dasbor analitik internal untuk memantau kesehatan produk dan
        perilaku pengguna secara real-time.
      endDate: Aug 1, 2022
      keywords:
        - Data Analytics
        - Dashboard
        - Product Metrics
        - SQL
      url: https://analitik.produk.id/
    - name: Program On-boarding Pengguna
      startDate: Sep 1, 2023
      summary: >
        - Memimpin eksperimen A/B testing pada alur on-boarding dengan lebih
        dari 50 ribu pengguna

        - Meningkatkan tingkat aktivasi hari pertama sebesar 18% melalui
        penyederhanaan alur dan pesan yang relevan
      description: Rangkaian eksperimen untuk meningkatkan aktivasi pengguna baru pada
        aplikasi KirimKilat.
      endDate: Mar 1, 2024
      keywords:
        - A/B Testing
        - Onboarding
        - Activation
  publications:
    - name: Membangun Produk Digital yang Berpusat pada Pengguna
      publisher: Medium
      releaseDate: Jun 1, 2022
      summary: >
        Artikel yang membahas pendekatan product discovery, validasi ide, dan
        pentingnya budaya eksperimen dalam tim produk.
      url: https://medium.com/@rizkyadiprakoso/membangun-produk-digital
  skills:
    - level: Expert
      name: Manajemen Produk
      keywords:
        - Product Roadmap
        - User Stories
        - Scrum
        - Agile
        - Go-to-Market
    - level: Advanced
      name: Analisis Data
      keywords:
        - SQL
        - Google Analytics
        - Mixpanel
        - Tableau
        - A/B Testing
    - level: Advanced
      name: Riset Pengguna
      keywords:
        - Wawancara Pengguna
        - Survey
        - Persona
        - Usability Testing
    - level: Intermediate
      name: Prototyping
      keywords:
        - Figma
        - Whimsical
        - Miro
  volunteer:
    - organization: Yayasan Cinta Literasi Digital
      position: Fasilitator Pelatihan
      startDate: Jan 1, 2020
      summary: >
        - Mengajar literasi digital dan keamanan internet kepada 500 pelajar dan
        guru di 10 kota

        - Menyusun modul pelatihan praktis tentang penggunaan aplikasi
        produktivitas dan pengenalan karier teknologi
      endDate: Dec 1, 2023
      url: https://cintaliterasi.or.id/
    - organization: Komunitas Produk Indonesia
      position: Mentor Produk
      startDate: Jul 1, 2021
      summary: >
        - Menjadi mentor bagi calon product manager dari berbagai latar belakang
        melalui program mentoring bulanan

        - Memberikan sesi berbagi pengetahuan tentang product discovery,
        prioritisasi, dan kolaborasi lintas tim
      url: https://produkindonesia.id/
  work:
    - name: PT Maju Digital Nusantara
      position: Manajer Produk
      startDate: Jan 1, 2021
      summary: >
        - Memimpin pengembangan aplikasi superapp logistik KirimKilat dengan
        lebih dari 2 juta pengguna aktif bulanan

        - Menyusun visi, strategi, dan peta jalan produk bersama pemangku
        kepentingan lintas fungsi

        - Meningkatkan retensi pengguna sebesar 35% melalui optimasi on-boarding
        dan personalisasi fitur

        - Mengelola backlog produk serta memprioritaskan inisiatif berdasarkan
        dampak bisnis, data analitik, dan riset pengguna

        - Berkolaborasi dengan tim engineering, desain, data, dan pemasaran
        untuk memastikan kecepatan dan kualitas pengiriman
      keywords:
        - Product Roadmap
        - Agile
        - Scrum
        - User Research
        - Data-Driven
        - Stakeholder Management
      url: https://www.majudigital.co.id/
    - name: PT Fintek Sejahtera
      position: Manajer Produk Digital
      startDate: Apr 1, 2018
      summary: >
        - Mengelola produk pinjaman digital dengan portofolio lebih dari 500
        ribu pengguna

        - Memimpin proses penemuan produk melalui wawancara pengguna, survei,
        dan analisis data perilaku

        - Meluncurkan fitur limit kredit dinamis yang meningkatkan pendapatan
        bunga sebesar 22% dalam enam bulan

        - Berkoordinasi dengan tim compliance dan risk untuk memastikan
        kepatuhan terhadap regulasi OJK
      endDate: Dec 1, 2020
      keywords:
        - Fintech
        - Kepatuhan
        - Analisis Data
        - A/B Testing
        - Regulasi
      url: https://finteksejahtera.id/
    - name: PT Media Kreatif Indonesia
      position: Product Owner
      startDate: Jun 1, 2016
      summary: >
        - Berperan sebagai penghubung antara tim pengembang dan pemangku
        kepentingan untuk produk media digital

        - Menulis cerita pengguna, menyusun kriteria penerimaan, dan
        memprioritaskan backlog sprint

        - Mendukung peluncuran situs web portofolio dan platform manajemen
        konten dengan 200 ribu kunjungan bulanan
      endDate: Mar 1, 2018
      keywords:
        - Product Backlog
        - JIRA
        - Prototyping
        - User Stories
      url: https://mediakreatif.co.id/
