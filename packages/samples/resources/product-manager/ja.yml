      name: データ分析
      keywords:
        - SQL
        - Google Analytics
        - Tableau
        - A/Bテスト
        - ユーザー行動分析
    - level: Advanced
      name: アジャイル開発
      keywords:
        - Scrum
        - スプリントマネジメント
        - Jira
        - Confluence
        - ふりかえり
    - level: Intermediate
