      title: 日本ネット経済新聞「デジタルプロダクト賞」
      date: Nov 2023
      summary: |
        自社SaaSプロダクトの顧客獲得力と使いやすさが評価され受賞。
    - awarder: 株式会社ネクストイノベーション
      title: 社内MVP
      date: Dec 2022
      summary: |
        新規プロダクトの立ち上げを成功に導き、年間売上目標を120%達成。
  certificates:
