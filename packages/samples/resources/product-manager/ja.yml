content:
  basics:
    name: 鈴木 彩花
    headline: 顧客価値と事業成長を両立するプロダクトマネージャー
    phone: "+81 90-1234-5678"
    email: ayaka.suzuki@example.jp
    url: https://ayakasuzuki.example.jp
    summary: |
      ユーザー中心のプロダクトマネジメントを専門とし、SaaSプロダクトの企画から改善まで一貫してリードしてきたプロダクトマネージャーです。データに基づく仮説立案と定量・定性調査を組み合わせ、KPI改善と顧客満足度向上を両立させます。ステークホルダーとの合意形成やクロスファンクショナルなチーム推進を強みとし、グローバル展開を見据えたプロダクト戦略にも経験があります。
  location:
    address: 東京都千代田区丸の内1-2-3
    city: 千代田区
    region: 東京都
    postalCode: "100-0005"
    country: Japan
  profiles:
    - network: LinkedIn
      url: https://www.linkedin.com/in/ayaka-suzuki
      username: ayaka-suzuki
    - network: GitHub
      url: https://github.com/ayaka-suzuki
      username: ayaka-suzuki
  education:
    - institution: 早稲田大学
      url: https://www.waseda.jp
      degree: Bachelor
      area: 経営工学
      score: "3.7"
      startDate: Apr 1, 2014
      endDate: Mar 31, 2018
      courses:
        - マーケティングリサーチ
        - データサイエンス入門
        - プロジェクトマネジメント
        - 組織行動論
        - サービスイノベーション
      summary: |
        - 経営工学を専攻し、データ分析・マーケティング・組織マネジメントを学ぶ
        - チームでのプロジェクト演習を通じて、課題発見から解決策の提案までを経験
        - 卒業研究では「顧客ロイヤルティ向上要因の分析」をテーマに調査・分析を実施
  work:
    - name: 株式会社ネクストソリューションズ
      url: https://www.next-sol.example.jp
      position: シニアプロダクトマネージャー
      startDate: Apr 1, 2021
      summary: |
        - B2B SaaSプロダクト「TeamFlow」のプロダクトマネージャーとして、ロードマップ策定から機能開発、ローンチまでを統括
        - ユーザーインタビューや利用ログ分析に基づき、オンボーディング機能を再設計し、アクティベーション率を45%から68%に改善
        - 営業・カスタマーサクセス・開発チームと連携し、顧客フィードバックを優先順位付けする仕組みを構築
        - 四半期ごとのKPIレビューを主導し、プロダクト改善サイクルを定着させた
      keywords:
        - プロダクト戦略
        - ロードマップ
        - ステークホルダー管理
        - KPI改善
        - データ分析
    - name: 株式会社デジタルイノベーション
      url: https://www.digital-innovation.example.jp
      position: プロダクトマネージャー
      startDate: Apr 1, 2018
      endDate: Mar 31, 2021
      summary: |
        - 自社メディア向けCMSのリニューアルプロジェクトに参画し、要件定義からリリースまでを主導
        - 編集者・営業チームへのヒアリングを実施し、業務効率化に貢献する編集ワークフロー機能を企画・実装
        - A/Bテストを活用したUI改善を繰り返し、記事編集時間を平均30%削減
        - エンジニア・デザイナー約10名のチームをプロジェクトマネジメントとして支援
      keywords:
        - 要件定義
        - アジャイル開発
        - A/Bテスト
        - UI改善
        - プロジェクト推進
  skills:
    - name: プロダクトマネジメント
      level: Expert
      keywords:
        - ロードマップ策定
        - 要求分析
        - KPI設計
        - 顧客インタビュー
        - プライオリティ管理
    - name: データ分析
      level: Advanced
      keywords:
        - SQL
        - Google Analytics
        - Tableau
        - A/Bテスト
        - コホート分析
    - name: UI/UXデザイン
      level: Intermediate
      keywords:
        - Figma
        - プロトタイピング
        - ユーザビリティテスト
        - ワイヤーフレーム
  languages:
    - language: Japanese
      fluency: Native or Bilingual Proficiency
      keywords:
        - ビジネス文書作成
        - プレゼンテーション
    - language: English
      fluency: Full Professional Proficiency
      keywords:
        - TOEIC 905
        - 海外チームとの会議
  awards:
    - title: 2023年度 ベストプロダクト賞
      date: Mar 2024
      awarder: 株式会社ネクストソリューションズ
      summary: |
        - TeamFlowの大型リニューアルプロジェクトをリードし、顧客満足度の大幅向上と売上成長に貢献したことが評価され受賞
  certificates:
    - name: PMP
      issuer: PMI日本支部
      date: Jun 2022
      url: https://www.pmi.org/certifications/project-management-pmp
  publications:
    - name: データドリブンなプロダクト改善の実践
      publisher: note
      releaseDate: May 2023
      url: https://note.example.jp/ayaka-suzuki/datadriven-pm
      summary: |
        - プロダクトマネージャー向けに、KPI設計やA/Bテストの進め方、ステークホルダーを巻き込む方法を事例付きで紹介
  projects:
    - name: TeamFlow オンボーディング改善
      url: https://www.next-sol.example.jp/teamflow
      description: B2B SaaSプロダクトにおけるオンボーディング機能のリニューアルプロジェクト
      startDate: Jul 2022
      endDate: Feb 2023
      summary: |
        - ユーザーインタビューと利用ログ分析を実施し、離脱要因を特定
        - ステップ形式のガイドとテンプレート機能を新たに設計・実装
        - アクティベーション率を45%から68%に改善し、解約率を削減
      keywords:
        - オンボーディング
        - ユーザーリサーチ
        - プロダクト改善
    - name: メディア向けCMS編集ワークフロー設計
      url: https://www.digital-innovation.example.jp/cms
      description: 自社CMSに搭載する編集ワークフロー機能の企画・設計プロジェクト
      startDate: Sep 2019
      endDate: Mar 2020
      summary: |
        - 編集者と営業チームの業務プロセスを可視化し、課題を整理
        - 承認フローとタスク管理機能の要件定義を実施
        - 編集時間を平均30%削減し、業務効率化に貢献
      keywords:
        - 業務分析
        - 要件定義
        - UX設計
  interests:
    - name: 旅行
      keywords:
        - 国内旅行
        - 写真
    - name: 読書
      keywords:
        - ビジネス書
        - デザイン
  volunteer:
    - organization: PMラーニングコミュニティ
      url: https://www.pm-learning.example.jp
      position: メンター
      startDate: Jun 2022
      summary: |
        - 若手プロダクトマネージャー向けの勉強会で講師を務め、ロードマップ策定やKPI設計の実践的なノウハウを共有
        - 参加者からの相談に定期的に応じ、キャリア形成の支援を行った

locale:
  language: ja
