content:
  basics:
    name: 佐藤 健一
    email: kenichi.sato@example.jp
    headline: データドリブンなプロダクト開発で顧客体験を向上させるプロダクトマネージャー
    phone: 090-1234-5678
    summary: |
      - 10年以上にわたり、B2B SaaS・モバイルアプリ領域でプロダクトマネジメントを牽引
      - ユーザーインタビューやデータ分析を活用した仮説検証サイクルを構築し、主要KPIである継続率を30%改善
      - エンジニア・デザイナー・営業など多様なステークホルダーを巻き込みながら、ロードマップ策定からローンチ、グロースまでを一気通貫で推進
      - プロダクト戦略の策定、要件定義、UI/UX改善、アジャイル開発のリードなど、上流から下流まで幅広いスキルを持つ
    url: https://kenichi-sato.example.jp
  education:
    - area: 経済学部 経営学科
      institution: 東京大学
      degree: Bachelor
      courses:
        - 経営戦略論
        - マーケティング論
        - 統計学
        - 情報科学入門
      endDate: Mar 31, 2012
      startDate: Apr 1, 2008
      summary: |
        - 在学中にマーケティングゼミに所属し、消費者の意思決定プロセスに関する研究を行う
        - 学園祭の実行委員会で企画責任者を務め、来場者数1.5倍を達成
      score: "3.7"
      url: https://www.u-tokyo.ac.jp/
  awards:
