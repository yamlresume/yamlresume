  projects:
    - name: 顧客分析ダッシュボードの再設計
      startDate: Jun 1, 2022
      summary: |
        - ユーザーが主要指標を一目で把握できるダッシュボードを企画・設計
        - 導線改善により、ダッシュボードの週次利用率が45%向上
      endDate: Dec 31, 2022
      keywords:
        - データ可視化
        - UX改善
        - SQL
        - Tableau
      url: https://example.jp/projects/dashboard
    - name: モバイルアプリ「ハビットログ」企画
      startDate: Jan 1, 2023
      summary: |
        - 習慣化を支援するiOSアプリのコンセプト立案からリリースまでを実施
        - リリース後3ヶ月でダウンロード数1万件を突破
      endDate: Mar 31, 2023
      keywords:
        - モバイルアプリ
        - 習慣化
        - UXリサーチ
        - プロダクトローンチ
      url: https://example.jp/projects/habitlog
