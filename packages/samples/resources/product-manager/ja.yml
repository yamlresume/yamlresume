  volunteer:
    - organization: 日本プロダクトマネージャー協会
      position: コミュニティ運営スタッフ
      startDate: Apr 1, 2021
      summary: |
        - PM勉強会の企画・運営を担当し、毎回100名以上の参加者を集める
        - 若手PMのメンタリングプログラムを立ち上げ、累計30名をサポート
      endDate: Mar 31, 2024
      url: https://www.pmkyoukai.example.org
  work:
    - name: 株式会社ネクストイノベーション
      position: シニアプロダクトマネージャー
      startDate: Apr 1, 2022
      summary: |
        - 新規SaaSプロダクト「KPIダッシュボード」の企画・立ち上げをリードし、ローンチから半年で有償契約25社を獲得
        - ユーザーインタビューとアクセス解析を組み合わせ、優先順位付けの仕組みを確立。継続率を30%改善
        - エンジニア・デザイナー・セールスからなるクロスファンクショナルチームを結成し、アジャイル開発を推進
        - 経営陣への定期的な進捗報告とKPIレビューを実施し、プロダクト戦略の透明性を向上
      keywords:
        - プロダクト戦略
        - ロードマップ
        - データ分析
        - 顧客インタビュー
        - アジャイル
      url: https://www.nextinnovation.co.jp
    - name: 株式会社ビジョンテック
      position: プロダクトマネージャー
      startDate: Apr 1, 2019
      summary: |
        - B2B向け営業支援システムのリニューアルプロジェクトを担当し、UI/UXを抜本的に改善
        - ユーザーストーリーマッピングを導入し、開発チームと要件認識のズレを解消。リリース後の問い合わせ件数を45%削減
        - A/Bテストを活用したランディングページ改善により、資料請求率を2.3倍に向上
        - 顧客サポートチームと連携し、NPS調査の仕組みを構築。スコアを10ポイント向上させた
      endDate: Mar 31, 2022
      keywords:
        - 要件定義
        - UI/UX改善
        - A/Bテスト
        - ステークホルダー管理
      url: https://www.visiontech.example.co.jp
    - name: 株式会社ブリッジソリューションズ
      position: プロジェクトマネージャー / プロダクトオーナー
      startDate: Apr 1, 2015
      summary: |
        - 複数クライアントのWebシステム開発案件において、要件定義から納品までを一貫してマネジメント
        - プロジェクトの進捗管理・リスク管理・予算管理を担当し、全12案件を納期内で完遂
        - オフショア開発チームとのブリッジエンジニアとしてコミュニケーション体制を構築し、手戻り工数を30%削減
        - 社内標準の開発プロセスを策定し、プロジェクトの属人化を防止
      endDate: Mar 31, 2019
      keywords:
        - プロジェクトマネジメント
        - 要件定義
        - オフショア開発
        - 品質管理
      url: https://www.bridgesol.example.co.jp
