content:
  basics:
    name: Sanne van Dijk
    email: sanne.vandijk@example.nl
    headline: Productmanager | Digital Product Strategy | Agile
    phone: +31 6 12345678
    summary: >
      Gedreven productmanager met 7+ jaar ervaring in het bouwen van digitale

      producten die gebruikers waarderen en bedrijven laten groeien. Expertise

      in het vertalen van klantinzichten naar een heldere productstrategie en

      roadmap. Sterk in het leiden van cross-functionele teams en het creëren

      van draagvlak bij stakeholders.


      - Ervaring met zowel B2B- als B2C-producten in e-commerce en financiële
      dienstverlening

      - Bewezen track record in het verbeteren van conversie en
      klanttevredenheid

      - Data-gedreven besluitvorming met oog voor UX en technische haalbaarheid

      - Gecertificeerd Professional Scrum Product Owner
    url: https://www.linkedin.com/in/sannevandijk
  education:
    - area: Information Studies (Human-Centred Multimedia)
      institution: University of Amsterdam
      degree: Master
      courses:
        - Design Research
        - User Experience
        - Data Analytics
        - Product Strategy
      endDate: Jul 1, 2020
      startDate: Sep 1, 2018
      summary: >
        - Afgestudeerd met een scriptie over de inzet van AI bij het
        personaliseren van digitale producten

        - Praktische ervaring opgedaan met usability-onderzoek en rapid
        prototyping
      url: https://www.uva.nl/
    - area: Information Science
      institution: Rijksuniversiteit Groningen
      degree: Bachelor
      courses:
        - Human-Computer Interaction
        - Web Technology
        - Organizational Science
        - Business Intelligence
      endDate: Jul 1, 2018
      startDate: Sep 1, 2015
      summary: |
        - Minor in Marketing en Bedrijfskunde
        - Bachelorproef over de adoptie van fintech-apps onder jongeren
      url: https://www.rug.nl/
  awards:
    - awarder: Dutch Design Foundation
      title: Best Product Concept - Dutch Design Week
      date: Oct 2021
      summary: >
        Award voor het concept "Duurzaam op Reis", een app die reizigers helpt
        om duurzame keuzes te maken.
