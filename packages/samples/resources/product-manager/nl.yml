  work:
    - name: BrightAnalytics
      url: https://www.brightanalytics.nl
      position: Senior Productmanager
      startDate: Mar 1, 2021
      summary: |
        - Verantwoordelijk voor de productstrategie en roadmap van het analytics-platform met meer dan 500 B2B-klanten.
        - Leidde een cross-functioneel team van 7 engineers, 2 designers en 1 data scientist in een Agile/Scrum-omgeving.
        - Introductie van een selfservice-onboarding-flow, resulterend in 30% hogere activatiegraad.
        - Opzetten van continu klantonderzoek en een A/B-testprogramma, bijdragend aan een 15% stijging in NPS.
        - Samen met sales en marketing gewerkt aan positionering en go-to-marketstrategie voor nieuwe modules.
      keywords:
        - Productstrategie
        - Roadmap
        - SaaS
        - Agile
        - A/B-testen
        - NPS
    - name: HealthHub
      position: Productmanager
      startDate: Jan 1, 2018
      endDate: Feb 1, 2021
      summary: |
        - Beheerde het volledige productlevenscyclus van een webportaal voor zorgverleners, van concept tot lancering en opschaling.
        - Initieerde en implementeerde een gebruikersfeedbackcyclus met interviews, surveys en usabilitytests.
        - Realiseerde een stijging van 40% in maandelijkse actieve gebruikers door gerichte productverbeteringen.
        - Werkte nauw samen met engineers, compliance en klantsupport om aan wet- en regelgeving te voldoen.
      keywords:
        - Productlevenscyclus
        - Klantonderzoek
        - Gebruikersgericht ontwerp
        - Compliance
        - Stakeholdermanagement
    - name: DigiWorks
      position: Junior Productmanager
      startDate: Aug 1, 2016
      endDate: Dec 1, 2017
      summary: |
        - Ondersteunde senior productmanagers bij het specificeren van requirements en het prioriteren van backlogitems.
        - Analyseerde gebruikersdata en maandelijkse productmetrics om inzichten te verschaffen voor het productteam.
        - Coördineerde usabilitytestsessies en verwerkte resultaten in productverbeteringen.
      keywords:
        - Backlog
        - Requirements
        - Data-analyse
    - name: StartUp365
      position: Product Owner
      startDate: Sep 1, 2014
      endDate: Jul 1, 2016
      summary: |
        - Startte als projectmedewerker en groeide door naar product owner voor een nieuw e-commerceplatform.
        - Verantwoordelijk voor het schrijven van user stories en het accepteren van opgeleverde features.
        - Vertaalde samen met de CTO de technische roadmap naar een haalbare sprintplanning.
      keywords:
        - Product Owner
        - User Stories
        - Sprint Planning
