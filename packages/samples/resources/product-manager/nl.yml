  volunteer:
    - organization: Women in Tech Netherlands
      position: Mentor
      startDate: Jan 1, 2022
      summary: >
        - Begeleidt vrouwelijke professionals in de technieksector bij hun
        loopbaan in productmanagement

        - Geeft workshops over personal branding en datagedreven werken
      url: https://www.womenintech.nl/
  work:
    - name: Bol.com
      position: Senior Productmanager
      startDate: Jan 1, 2023
      summary: >
        Verantwoordelijk voor de zoek- en navigatiebeleving in de mobiele app
        van Bol.com, met meer dan 5 miljoen maandelijkse actieve gebruikers.

        - Ontwikkelde een nieuwe zoekgedrag-analyse die leidde tot een
        conversiestijging van 18%

        - Leidt een cross-functioneel team van 8 ontwikkelaars, designers en
        data-analisten

        - Introduceerde een experimenteerplatform dat het aantal A/B-tests per
        kwartaal verdrievoudigde

        - Werkt nauw samen met merken en fulfilmentpartners om de klantreis te
        verbeteren
      keywords:
        - Productstrategie
        - Roadmap
        - A/B-testen
        - Mobiele app
        - E-commerce
      url: https://www.bol.com/nl/nl/
    - name: Takeaway.com
      position: Productmanager
      startDate: Nov 1, 2020
      summary: >
        Productmanager voor de klantreis van bestellen tot bezorging in de
        internationale bestelapp.

        - Leverde een herontwerp van de checkout op, resulterend in 12% minder
        afhakers

        - Werkte samen met lokale marketeers in 12 landen om de app per markt te
        optimaliseren

        - Startte een feedbackloop met restaurantpartners die leidde tot een
        NPS-stijging van 8 punten

        - Beheerde de feature roadmap en prioriteerde met behulp van RICE en
        jobs-to-be-done
      endDate: Dec 31, 2022
      keywords:
        - Product discovery
        - Checkout optimalisatie
        - Internationale markten
        - NPS
      url: https://www.takeaway.com/
    - name: ING Nederland
      position: Productmanager
      startDate: Sep 1, 2018
      summary: >
        Productmanager binnen het domein Internet Banking, met focus op personal
        finance management.

        - Introduceerde een nieuwe spaarfunctionaliteit die binnen een half jaar
        door 250.000 klanten werd gebruikt

        - Werkte samen met UX designers en data scientists om gebruikersgedrag
        te vertalen naar productverbeteringen

        - Droeg bij aan de agile transformatie van het team als Scrum Product
        Owner

        - Begeleidde twee junior productmanagers in hun ontwikkeling
      endDate: Oct 31, 2020
      keywords:
        - Financiële dienstverlening
        - Personal finance
        - Agile transformatie
        - Mentoring
      url: https://www.ing.nl/
