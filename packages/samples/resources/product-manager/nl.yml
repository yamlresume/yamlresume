      releaseDate: Apr 2023
      summary: >
        - Praktijkartikel over het opzetten van een experimenteercultuur binnen
        een productorganisatie

        - Beschrijft concrete methodes zoals A/B-testen, feature flags en
        feedback loops
      url: https://medium.com/@sannevandijk/de-kracht-van-continu-experimenteren
