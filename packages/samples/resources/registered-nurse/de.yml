  publications:
    - name: Delirprävention in der Intensivpflege – Eine Bestandsaufnahme
      publisher: Pflegezeitschrift
      releaseDate: May 2024
      url: https://www.pflegezeitschrift.de/artikel/delirpraevention
      summary: |
        - Überblick über aktuelle Studien und Leitlinien zur Delirprävention
        - Praxisnahe Empfehlungen für die pflegerische Versorgung auf Intensivstationen
        - Diskussion der Rolle von Angehörigen und interprofessionellen Teams

  projects:
    - name: Einführung der digitalen Pflegedokumentation
      startDate: Jan 2023
      endDate: Nov 2023
      description: Projekt zur Umstellung der papierbasierten Pflegedokumentation auf
        ein digitales System
      summary: |
        - Analyse bestehender Dokumentationsabläufe und Erstellung eines Anforderungskatalogs
        - Schulung von über 40 Pflegekräften im Umgang mit der neuen Software
        - Begleitung der Pilotphase und Auswertung von Anwenderfeedback
      keywords:
        - Digitalisierung
        - Pflegedokumentation
        - Schulung
    - name: Delirpräventionsprogramm Station 4B
      startDate: Apr 2022
      endDate: Dec 2022
      description: Multiprofessionelles Programm zur Früherkennung und Prävention von
        Delirien
      summary: |
        - Einführung eines standardisierten Screenings bei allen über 65-jährigen Patienten
        - Entwicklung von Schulungsmaterialien für Pflege und Medizin
        - Reduktion der Delirinzidenz um 18 Prozent im Projektzeitraum
      keywords:
        - Delirprävention
        - Screening
        - Multiprofessionell

  interests:
