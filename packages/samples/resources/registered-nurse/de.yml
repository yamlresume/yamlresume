      date: Dec 2023
      awarder: Universitätsklinikum Rheinbach
      summary: |
        Auszeichnung für herausragendes Engagement in der Intensivpflege und in der Anleitung neuer Mitarbeitender.

  certificates:
    - name: Fachweiterbildung Intensiv- und Anästhesiepflege
      issuer: Deutsche Krankenhausakademie
      date: Jun 2023
