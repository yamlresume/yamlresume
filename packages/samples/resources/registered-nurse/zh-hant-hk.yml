  publications:
    - name: 長者跌倒風險評估工具於內科病房的應用
      publisher: 香港護理雜誌
      releaseDate: Dec 2023
      url: https://www.hkna.org.hk/
      summary: |
        - 回顧常用跌倒風險評估工具在本地內科及老人科病房的適用性
        - 分析護理人員執行評估時的常見困難及改善建議
        - 提出結合電子健康紀錄提示的可行方案
  projects:
    - name: 病房跌倒預防質素改善計劃
      url: https://www.ha.org.hk/qmh
      description: 針對內科及老人科病房設計的跌倒預防改善項目
      startDate: Mar 2023
      endDate: Nov 2023
      summary: |
        - 分析病房跌倒事件數據及環境風險因素
        - 設計床邊提示卡、家屬教育單張及夜間巡房流程
        - 與物理治療師合作推行長者平衡訓練
        - 計劃推行後病房跌倒率下降約 18%
      keywords:
        - 跌倒預防
        - 質素改善
        - 病人安全
        - 長者護理
  interests:
