content:
  basics:
    name: 陳嘉怡
    headline: 註冊護士｜內科及老人科護理
    phone: "+852 9123 4567"
    email: chankayi.rn@gmail.com
    url: https://www.linkedin.com/in/chankayi-rn
    summary: |
      具備五年內科及老人科臨床經驗的註冊護士，專注於病人評估、藥物管理、感染控制及出院規劃。能在高壓環境中保持細心、冷靜，並與跨專業團隊緊密合作。

      - 熟悉香港公立醫院臨床流程及電子健康紀錄系統
      - 擅長與長者、家屬及照顧者溝通，提供適切健康教育
      - 曾參與病房質素改善項目，提升跌倒預防及壓瘡護理成效
      - 持有 BLS、ACLS 及感染控制相關證書
  location:
    address: 九龍旺角彌敦道 700 號
    city: 香港
    region: 九龍
    country: Hong Kong
  profiles:
    - network: LinkedIn
      url: https://www.linkedin.com/in/chankayi-rn
      username: chankayi-rn
    - network: Medium
      url: https://medium.com/@chankayi.rn
      username: chankayi.rn
  education:
    - institution: 香港大學護理學院
      url: https://nursing.hku.hk/
      degree: Bachelor
      area: 護理學
      score: "3.6/4.0"
      startDate: Sep 1, 2016
      endDate: Jun 30, 2020
      courses:
        - 基礎護理學
        - 內科護理學
        - 外科護理學
        - 老人科護理
        - 急症及創傷護理
        - 藥理學
        - 感染控制
        - 社區健康護理
      summary: |
        - 完成超過 1,000 小時臨床實習，涵蓋內科、外科、急症室及社區護理
        - 畢業論文探討長者跌倒風險評估工具在病房中的應用
        - 獲選為護理學院臨床傑出表現學生
  work:
    - name: 瑪麗醫院
      url: https://www.ha.org.hk/qmh
      position: 註冊護士（內科及老人科）
      startDate: Jan 3, 2022
      summary: |
        - 負責內科及老人科病房約 30 名病人的日常護理，包括生命表徵監測、藥物管理及傷口護理
        - 進行入院評估、跌倒風險及壓瘡風險篩查，制定個人化護理計劃
        - 與醫生、物理治療師、職業治療師及社工協作，安排出院規劃及社區支援
        - 指導新入職護士及護士學生，提供臨床技巧及感染控制培訓
        - 參與病房質素改善小組，推行跌倒預防及手部衛生依從性提升計劃
      keywords:
        - 內科護理
        - 老人科護理
        - 出院規劃
        - 臨床評估
        - 感染控制
    - name: 伊利沙伯醫院
      url: https://www.ha.org.hk/qeh
      position: 註冊護士（急症室）
      startDate: Jul 1, 2020
      endDate: Dec 31, 2021
      summary: |
        - 於急症室分流站進行初步評估及生命表徵監測，按病情優先次序安排診治
        - 協助醫生進行急救、縫合、石膏固定及小型手術程序
        - 處理靜脈輸液、藥物注射、血液樣本採集及化驗安排
        - 向病人及家屬解釋治療流程，提供離院護理指示及社區資源轉介
        - 參與急症室感染控制及災難應變演練
      keywords:
        - 急症護理
        - 病人分流
        - 急救護理
        - 靜脈治療
        - 災難應變
  skills:
