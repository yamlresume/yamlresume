  awards:
    - title: 護理學院臨床傑出表現獎
      date: Jun 2020
      awarder: 香港大學護理學院
      summary: |
        表揚在臨床實習中展現卓越護理技巧、專業態度及病人溝通的畢業生。
    - title: 優秀護士獎
      date: Nov 2023
      awarder: 瑪麗醫院內科及老人科
      summary: |
        表揚在跌倒預防及病人安全教育方面的積極貢獻。
  certificates:
