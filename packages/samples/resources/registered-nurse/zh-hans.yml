        - 总结老年心血管疾病患者跌倒风险评估与分级护理经验
        - 通过多学科协作和健康教育降低住院期间跌倒发生率
        - 为病区护理质量改进提供实践参考
  projects:
    - name: 心血管内科跌倒风险闭环管理项目
