      summary: |
        - 负责心血管内科病区护理小组日常管理，协调床位、排班及危重患者护理资源
        - 参与制定并落实跌倒、压疮、静脉血栓等风险评估与闭环管理流程
        - 带教新入职护士及实习护生，完成护理操作示范与考核
        - 组织科室业务学习和应急演练，提升团队急救配合与突发事件处置能力
        - 参与护理质量指标监测与PDCA持续改进，推动护理文书规范化
      keywords:
        - 护理管理
        - 心血管护理
        - 患者安全
        - 临床带教
        - 质量改进
