      description: 针对心血管内科住院患者跌倒风险开展评估、干预、追踪和复盘的护理质量改进项目。
      startDate: '2022-01-01'
      endDate: '2022-12-31'
      summary: |
        - 建立入院、转科、出院前动态跌倒风险评估流程
        - 设计高风险患者标识、床旁宣教和环境改造清单
        - 通过月度数据分析和PDCA循环持续优化护理措施
        - 项目实施后病区跌倒发生率较上一年度下降
