      url: https://www.renjiheart.cn
      position: 注册护士
      startDate: '2018-07-01'
      endDate: '2021-02-28'
      summary: |
        - 负责心血管内科患者入院评估、生命体征监测、用药观察及健康宣教
        - 熟练执行心电监护、静脉穿刺、输液泵和微量泵使用及危重患者护理
        - 配合医生完成介入术后护理、胸痛中心流程及抢救工作
        - 规范书写护理记录，参与交接班和不良事件上报
      keywords:
        - 心电监护
        - 静脉治疗
        - 介入护理
        - 健康宣教
        - 急救配合
    - name: 北京康泰综合医院
      url: https://www.kangtai-hospital.cn
      position: 注册护士
      startDate: '2016-07-01'
      endDate: '2018-06-30'
      summary: |
        - 在内科病区完成基础护理、生命体征监测、给药及护理记录书写
        - 参与夜班轮值与患者安全巡查，熟悉住院患者全流程护理
        - 接受急救技能培训并参与科室应急演练
      keywords:
        - 基础护理
        - 内科护理
        - 患者安全
        - 护理记录
