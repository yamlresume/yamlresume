      publisher: Tijdschrift voor Verpleegkunde
      releaseDate: 2023-06-01
      url: https://www.tvz.nl
      summary: |
        - Artikel over knelpunten en verbeteringen bij medicatieoverdracht tussen ziekenhuis en thuiszorg
        - Gebaseerd op een kwaliteitsproject binnen de Sint-Maartens Kliniek
  projects:
    - name: Medicatieprotocol revalidatieafdeling
      startDate: 2022-01-01
      endDate: 2022-12-31
      description: Implementatie van een vernieuwd medicatieprotocol om
        overdrachtsfouten te verminderen.
      summary: |
        - Analyseerde incidentmeldingen en observeerde medicatieprocessen
        - Ontwikkelde samen met apotheek en artsen een checklist voor medicatieoverdracht
        - Verzorgde trainingen aan verpleegkundigen en verzorgenden
        - Leidde tot 25% minder geregistreerde medicatie-incidenten
      keywords:
