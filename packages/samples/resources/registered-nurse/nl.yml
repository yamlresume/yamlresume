content:
  basics:
    name: Sanne de Vries
    headline: Geregistreerde verpleegkundige met focus op acute en chronische zorg
    phone: "+31 6 1234 5678"
    email: sanne.devries@zorgmail.nl
    url: https://www.sanne-de-vries.nl
    summary: |
      Geregistreerde verpleegkundige met meer dan zes jaar ervaring in de ziekenhuiszorg en de eerstelijnszorg. Sterk in het leveren van persoonsgerichte zorg, het opstellen en evalueren van zorgplannen en het veilig uitvoeren van medicatie- en wondzorg.

      - Ervaren in acute zorg, chronische zorg en palliatieve zorg
      - Vaardig met elektronische patiëntendossiers (HiX, EPIC) en zorgtechnologie
      - Communicatief sterk, sociaal en gericht op samenwerking met patiënten, naasten en multidisciplinaire teams
      - Proactief in kwaliteitsverbetering, patiëntveiligheid en professionele ontwikkeling
  location:
    address: Maliebaan 45
    city: Utrecht
    region: Utrecht
    country: Netherlands
    postalCode: "3512 JE"
  profiles:
    - network: LinkedIn
      url: https://www.linkedin.com/in/sanne-de-vries-rn
      username: sanne-de-vries-rn
    - network: Medium
      url: https://medium.com/@sannezorg
      username: sannezorg
  education:
    - institution: Hogeschool Utrecht
      url: https://www.hu.nl
      degree: Bachelor
      area: HBO-Verpleegkunde
      score: "8.4"
      startDate: 2014-09-01
      endDate: 2018-07-01
      courses:
        - Verpleegkundig handelen
        - Anatomie en fysiologie
        - Pathologie
        - Farmacologie
        - Verpleegkundige ethiek
        - Communicatie en gespreksvoering
        - Kwaliteit en veiligheid in de zorg
        - Zorgtechnologie
      summary: |
        - Afgestudeerd met een brede basis in ziekenhuiszorg, chronische zorg en preventie
        - Tijdens stages ervaring opgedaan op een chirurgische afdeling en in de wijkverpleging
        - Afstudeeronderzoek gedaan naar medicatieveiligheid bij ouderen
  work:
    - name: Sint-Maartens Kliniek
      url: https://www.sintmaartenskliniek.nl
      position: Verpleegkundige
      startDate: 2021-03-01
      summary: |
        - Verantwoordelijk voor de verpleegkundige zorg aan patiënten op de afdeling orthopedie en revalidatie
        - Stelt zorgplannen op, voert deze uit en evalueert ze samen met patiënt en naasten
        - Voert medicatiebeheer, wondzorg en pijnmanagement uit volgens protocollen
        - Werkt samen met artsen, fysiotherapeuten, apothekers en verzorgenden in een multidisciplinair team
        - Draagt bij aan kwaliteitsverbetering door deelname aan audits en het melden van incidenten
      keywords:
        - Klinische zorg
        - Patiëntveiligheid
        - Zorgplanning
        - Medicatiebeheer
        - Wondzorg
        - Revalidatie
    - name: Zorgcentrum Parkzicht
      url: https://www.zorgcentrumparkzicht.nl
      position: Verpleegkundige
      startDate: 2018-08-01
      endDate: 2021-02-28
      summary: |
        - Verleende persoonsgerichte zorg aan ouderen met complexe somatische en psychogeriatrische zorgvragen
        - Coördineerde zorgprocessen, bewaakte veiligheid en ondersteunde verzorgenden bij de uitvoering van zorg
        - Voerde verpleegtechnische handelingen uit, waaronder wondzorg, insulinetoediening en katheterzorg
        - Had aandachtsgebied palliatieve zorg en begeleidde families in de laatste levensfase
        - Nam deel aan multidisciplinair overleg en familiegesprekken
      keywords:
        - Ouderenzorg
        - Palliatieve zorg
        - Zorgcoördinatie
        - Psychogeriatrie
        - Familiebegeleiding
