  volunteer:
    - organization: Norsk programmering
      position: Mentor
      startDate: Jan 2022
      summary: |
        - Var mentor for ungdommer som lærte seg programmering i fritiden
        - Laget øvelser og oppgaver i Python og web-utvikling
      endDate: Dec 2023
      url: https://www.norskprogrammering.no
  work:
    - name: BEKK
      position: Systemutvikler
      startDate: Jan 1, 2021
      summary: >
        - Utvikler og vedlikeholder skalerbare mikrotjenester med TypeScript,
        Node.js og PostgreSQL

        - Ledet utviklingen av et nytt offentlig API for kundeidentifisering som
        håndterer over 10K forespørsler per sekund

        - Innførte kontinuerlig levering med GitHub Actions og AWS, noe som
        reduserte produksjonstid fra uker til timer

        - Veileder juniorutviklere gjennom code review og interne fagmøter

        - Deltar i krav- og designprosesser sammen med produkteiere og
        arkitekter
      keywords:
        - Node.js
        - TypeScript
        - PostgreSQL
        - AWS
        - CI/CD
        - Microservices
      url: https://www.bekk.no
    - name: Knowit Solutions
      position: Utvikler
      startDate: Aug 1, 2018
      summary: >
        - Utviklet frontend og backend for selvbetjeningsløsninger i offentlig
        sektor

        - Bygget REST-APIer i Java Spring Boot og React-baserte
        admin-grensesnitt

        - Arbeidet i tverrfaglige team med designere og prosjektledere for å
        levere brukervennlige tjenester

        - Bisto i å sette opp automatiserte tester og forbedret testdekningen
        til over 80 %
      endDate: Dec 31, 2020
      keywords:
        - Java
        - Spring Boot
        - React
        - REST
        - Testing
      url: https://www.knowit.no
