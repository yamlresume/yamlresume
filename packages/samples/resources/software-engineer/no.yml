content:
  basics:
    name: Maren Eriksen
    email: maren.eriksen@outlook.com
    headline: Backend-utvikler med fokus på skalerbare tjenester
    phone: +47 912 34 567
    summary: >
      Backend-utvikler med fem års erfaring fra web- og skybaserte systemer i
      offentlig og privat sektor.

      Opptatt av å bygge løsninger som er robuste, skalerbare og enkle å drifte,
      og har stort engasjement for godt håndverk og smidig prosess.

      Trives med tett samarbeid med produkt, design og drift, og med å lære opp
      nye kolleger.
    url: https://maren-eriksen.dev
  education:
    - area: Informatikk
      institution: Norges teknisk-naturvitenskapelige universitet (NTNU)
      degree: Bachelor
      courses:
