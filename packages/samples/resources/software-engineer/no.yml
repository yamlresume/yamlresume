        - Databasesystemer
        - Programmeringsspråk
        - Programvarearkitektur
        - Maskinvare nær programmering
      endDate: Jun 1, 2018
      startDate: Aug 1, 2015
      summary: >
        - Spesialisering i programvareutvikling med fordypning i distribuerte
        systemer

        - Bacheloroppgave om smidig IoT-utvikling, som fikk karakter A

        - Erfaring med både faglig og sosialt miljø gjennom verv i
        linjeforeningen
      score: "3.7"
      url: https://www.ntnu.no
  awards:
