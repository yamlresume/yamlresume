    - name: Turplanlegger
      startDate: Mar 2020
      summary: |
        - Utviklet en fullstack-app med React, TypeScript, GraphQL og PostgreSQL
        - Integrert med kartdata fra OpenStreetMap og rute-API fra entur.no
        - Publisert som open source med Apache 2.0-lisens
      description: Åpen kildekode-app for planlegging av turer til fots og på sykkel.
      endDate: Sep 2020
      keywords:
        - React
        - GraphQL
        - PostgreSQL
        - Open Source
      url: https://github.com/marenkode/turplanlegger
