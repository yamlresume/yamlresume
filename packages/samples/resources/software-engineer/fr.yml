    - network: LinkedIn
      username: claire-moreau
      url: https://www.linkedin.com/in/claire-moreau
  projects:
    - name: TraceFlow
      startDate: 2023-04-01
      summary: >
        - Collecte et visualisation de métriques, logs et traces en temps réel

        - Interface web développée avec React et TypeScript

        - Agent de collecte léger en Go, configurable par simple fichier YAML

        - Export des données au format OpenTelemetry et intégration avec
        Prometheus
      description: Plateforme open source d'observabilité pour applications distribuées
      keywords:
        - Observabilité
        - OpenTelemetry
        - Go
        - TypeScript
      url: https://traceflow.io
    - name: OpenPlanner
      startDate: 2020-02-01
      summary: >
        - Développement d'une progressive web app avec React, Node.js et
        PostgreSQL

        - Synchronisation collaborative des plannings via WebSocket

        - Authentification via OAuth2 et gestion fine des rôles

        - Déploiement automatisé sur une instance Kubernetes légère
      description: Application de gestion de planning pour associations et petites équipes
      endDate: 2021-01-31
      keywords:
        - PWA
        - WebSocket
        - OAuth2
        - Kubernetes
      url: https://openplanner.fr
  publications:
    - name: Observabilité des architectures microservices avec OpenTelemetry
      publisher: Revue Informatique & Industries
      releaseDate: 2022-12-15
      summary: >
        - Article technique présentant les bonnes pratiques pour instrumenter
        une plateforme cloud native.

        - Retour d'expérience sur l'adoption d'OpenTelemetry dans une équipe de
        15 développeurs.

        - Méthodologie pour corréler métriques, logs et traces sans dégrader les
        performances.
      url: https://doi.org/10.1000/xyz123
  skills:
    - level: Expert
      name: Développement full-stack
      keywords:
