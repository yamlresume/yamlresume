        - Kafka
        - API REST
        - CI/CD
    - level: Intermediate
      name: Gestion de projet agile
      keywords:
        - Scrum
        - Kanban
        - Jira
        - Méthodes agiles
  volunteer:
    - organization: Association Les Débrouillards du Numérique
      position: Mentor bénévole
      startDate: 2019-01-01
      summary: >
        - Accompagnement d'étudiants issus de milieux éloignés du numérique dans
        la découverte du code

        - Animation d'ateliers hebdomadaires sur la création de pages web et de
        petits jeux en Python

        - Participation à l'organisation de deux événements 'coding goûter' par
        an
      endDate: 2023-12-31
      url: https://debrouillards-numerique.fr
  work:
    - name: Avantiotech
      position: Ingénieure logicielle full-stack
      startDate: 2022-03-01
      summary: >
        - Conception et développement d'une plateforme SaaS de gestion
        documentaire utilisée par plus de 200 000 utilisateurs

        - Refonte progressive d'un monolithe en microservices avec Node.js,
        Kafka et PostgreSQL

        - Mise en place d'une chaîne CI/CD complète avec GitHub Actions et Argo
        CD, réduisant le temps de déploiement de 45 %

        - Encadrement de deux développeurs juniors et animation des rituels
        agiles

        - Collaboration étroite avec les équipes produit et design pour affiner
        les spécifications techniques
      endDate: null
      keywords:
        - Node.js
        - TypeScript
        - PostgreSQL
        - Kafka
        - Kubernetes
        - CI/CD
        - Mentorat
      url: https://avantiotech.fr
    - name: Sylveo
      position: Développeuse full-stack
      startDate: 2019-09-01
      summary: >
        - Développement d'API REST et GraphQL en TypeScript pour des
        applications web et mobiles

        - Contribution à la création d'une bibliothèque de composants React
        réutilisables

        - Optimisation des requêtes PostgreSQL et mise en place de mesures de
        performance réduisant le temps de réponse de 30 %

        - Participation aux revues de code, aux tests de charge avec k6 et aux
        audits de sécurité
      endDate: 2022-02-28
      keywords:
        - React
        - GraphQL
        - API REST
        - Performance
        - Sécurité
        - Agile
      url: https://sylveo.io
    - name: WebAtlas
      position: Développeuse web junior
      startDate: 2018-01-15
      summary: >
        - Développement de sites vitrines et d'applications internes en PHP et
        JavaScript

        - Intégration de maquettes Figma et mise en place de tests d'acceptation
        avec Cypress

        - Maintenance corrective et évolutive de plusieurs outils métiers

        - Rédaction de documentations techniques et de guides de démarrage pour
        l'équipe
      endDate: 2019-08-31
      keywords:
        - PHP
        - JavaScript
        - Cypress
        - Figma
        - Maintenance
      url: https://webatlas.fr
