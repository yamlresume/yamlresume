content:
  basics:
    name: Claire Moreau
    email: claire.moreau@proton.me
    headline: Ingénieure logicielle full-stack passionnée par les systèmes distribués
    phone: +33 6 12 34 56 78
    summary: >
      - Ingénieure logicielle full-stack avec plus de 6 ans d'expérience dans la
      conception d'applications web scalables

      - Passionnée par les systèmes distribués, l'observabilité et les
      architectures cloud natives

      - Habituée aux environnements agiles et à la collaboration avec des
      équipes produit, design et ops

      - Attachée à la qualité du code, au partage des connaissances et à
      l'accompagnement des développeurs juniors
    url: https://clairemoreau.dev
  education:
    - area: Ingénierie logicielle et systèmes distribués
      institution: Télécom Paris
      degree: Master
      courses:
        - Programmation avancée en C++ et Java
        - Architectures logicielles et conception orientée objet
        - Systèmes distribués et tolérance aux pannes
        - Bases de données avancées et entrepôts de données
        - Génie logiciel et méthodes agiles
        - "Projet de fin d'études : supervision d'infrastructures cloud"
      endDate: 2018-07-01
      startDate: 2016-09-01
      summary: >
        - Acquisition de solides compétences en conception et en développement
        d'applications distribuées

        - Travail sur des projets de groupe appliqués à des cas réels
        d'entreprises partenaires

        - Réalisation d'un mémoire sur l'observabilité des architectures
        microservices
      score: 3.7/4.0
      url: https://www.telecom-paris.fr/
    - area: Informatique
      institution: Université de Rennes 1
      degree: Bachelor
      courses:
        - Algorithmique et structures de données
        - Programmation orientée objet en Java
        - Introduction aux bases de données relationnelles
        - Systèmes d'exploitation
      endDate: 2016-06-30
      startDate: 2015-09-01
      summary: >
        - Formation généraliste en informatique avec une forte composante
        pratique

        - Projet de fin de licence : développement d'une application de gestion
        de bibliothèque
      score: 3.5/4.0
      url: https://www.univ-rennes1.fr/
  awards:
    - awarder: Paris Open Source Summit
      title: Prix de l'innovation open source
      date: 2022-06-23
      summary: >
        - Récompense pour la conception de la plateforme d'observabilité
        TraceFlow et sa contribution à l'écosystème open source.
