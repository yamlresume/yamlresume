  projects:
    - name: Petinder - Adoção de Animais
      url: https://github.com/lucasalmeida-dev/petinder
      description: Plataforma web para facilitar a adoção responsável de animais de
        estimação, conectando ONGs a tutores em potencial.
      startDate: Apr 2021
      endDate: Oct 2021
      summary: |
        - Desenvolvido com React, Node.js e PostgreSQL, incluindo painel administrativo e sistema de busca com filtros
        - Implementou autenticação JWT, envio de e-mails transacionais e integração com mapas
        - Projeto de código aberto com mais de 300 estrelas no GitHub
      keywords:
        - React
        - Node.js
        - PostgreSQL
        - Open Source
    - name: Plataforma de Feedback Contínuo
      url: https://github.com/lucasalmeida-dev/feedback360
