    summary: >
      - Engenheiro de software com mais de 9 anos de experiência no projeto,
      desenvolvimento e operação de aplicações web escaláveis

      - Especialista em arquiteturas de microsserviços, integração de APIs REST
      e boas práticas de qualidade e segurança de software

      - Experiência sólida com Java, Node.js, React, bancos de dados relacionais
      e não relacionais, além de serviços em nuvem como AWS e Azure

      - Atuação em equipes ágeis, com forte comunicação, mentoria técnica e foco
      em entregas de alto valor para o negócio
