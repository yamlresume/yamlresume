        - Configurei pipeline de CI/CD com GitHub Actions e deploy automatizado
        em contêineres Docker

        - Alcancei redução de 30% no tempo de processamento de relatórios
        gerenciais
      description: Sistema integrado de gestão de estoque, compras e vendas para
        pequenas e médias empresas.
