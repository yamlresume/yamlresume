      startDate: 2019-04-01
      summary: >
        - Ministrei oficinas de lógica de programação e desenvolvimento web para
        jovens em situação de vulnerabilidade

        - Auxiliei na elaboração de material didático e na realização de
        hackathons educacionais

        - Contribuí para a formação inicial de mais de 100 estudantes na área de
        tecnologia
      endDate: 2021-11-30
      url: https://institutocodificar.org.br
  work:
    - name: TechNova Soluções
      position: Engenheiro de Software Sênior
      startDate: 2021-03-01
      summary: >
        - Lidero o desenvolvimento de uma plataforma de gestão financeira para
        clientes empresariais, atendendo mais de 250 mil usuários

        - Desenho e implemento microsserviços em Node.js e Java, reduzindo o
        tempo de resposta das APIs em 40%

        - Atuo na definição da arquitetura de software, conduzo code reviews e
        estabeleço padrões de qualidade e segurança

        - Oriento engenheiros júnior e pleno, promovendo boas práticas de testes
        automatizados, CI/CD e documentação

        - Colaboro com product managers e designers para transformar requisitos
        de negócio em soluções técnicas robustas
      keywords:
        - Microsserviços
        - Node.js
        - Java
        - AWS
        - Kubernetes
        - Mentoria
      url: https://technova.com.br
    - name: Fintech InovaPay
      position: Desenvolvedor de Software Pleno
      startDate: 2018-02-01
      summary: >
        - Atuei no desenvolvimento full stack de um aplicativo de pagamentos
        móveis utilizado por mais de 1 milhão de pessoas

        - Implementei funcionalidades com React Native e Node.js, integrando
        gateways de pagamento e sistemas antifraude

        - Melhorei a cobertura de testes automatizados de 35% para 78%,
        reduzindo incidentes em produção

        - Participei de cerimônias ágeis e colaborei com times de engenharia,
        produto e suporte ao cliente
      endDate: 2021-02-26
      keywords:
        - React Native
        - Node.js
        - APIs REST
        - Testes automatizados
        - Pagamentos
      url: https://inovapay.com.br
    - name: Agência Web Mídia Digital
      position: Desenvolvedor Full Stack Júnior
      startDate: 2015-01-05
      summary: >
        - Desenvolvi e mantive websites e sistemas web para clientes de diversos
        segmentos

        - Trabalhei com JavaScript, HTML, CSS, PHP e WordPress, criando
        interfaces responsivas e otimizadas para SEO

        - Colaborei no aperfeiçoamento de processos internos e na migração de
        projetos legados para versões mais modernas

        - Aprendi e apliquei princípios de design responsivo e acessibilidade
        digital
      endDate: 2018-01-19
      keywords:
        - JavaScript
        - PHP
        - WordPress
        - SEO
        - Responsive Design
      url: https://webmidia.com.br
