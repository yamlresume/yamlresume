      endDate: 2020-09
      url: https://jugendhackt.org/
  work:
    - name: CloudNative Solutions GmbH
      position: Senior Software Engineer
      startDate: Apr 1, 2022
      summary: >
        - Entwicklung und Betrieb einer Kubernetes-basierten SaaS-Plattform für
        datenintensive Anwendungen

        - Verantwortlich für die technische Architektur neuer Microservices und
        die Weiterentwicklung bestehender Systeme

        - Einführung von Infrastructure-as-Code mit Terraform, wodurch die
        Bereitstellungszeit um 40 % reduziert wurde

        - Durchführung von Code-Reviews, Architektur-Workshops und Mentoring für
        fünf Entwickler:innen
      keywords:
        - Kubernetes
        - AWS
        - Microservices
        - Terraform
        - Mentoring
      url: https://www.cloudnative-solutions.example
    - name: DataPulse AG
      position: Software Engineer
      startDate: Aug 1, 2017
      summary: >
        - Implementierung von Java- und TypeScript-basierten Backend-Diensten
