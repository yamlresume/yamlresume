content:
  basics:
    name: Jonas Weber
    email: jonas.weber@beispiel-software.de
    headline: Senior Software Engineer für Cloud- und Full-Stack-Anwendungen
    phone: +49 30 23456789
    summary: >
      - Full-Stack-Softwareentwickler mit über 8 Jahren Erfahrung in der
      Entwicklung skalierbarer Webanwendungen

      - Umfassende Kenntnisse in Java, TypeScript, React und Cloud-Technologien
