        - Umsetzung responsiver UI-Komponenten und Anbindung an
        REST-Schnittstellen

        - Unterstützung bei der Einführung von automatisierten Tests mit Jest
        und Cypress
      endDate: Jul 1, 2017
      keywords:
        - Angular
        - Node.js
        - REST
        - MySQL
      url: https://www.webcraft.example
