        - Migration einer monolithischen Anwendung zu einer
        Microservice-Architektur mit Spring Boot

        - Aufbau von CI/CD-Pipelines mit Jenkins und GitLab CI

        - Enge Zusammenarbeit mit Product Management und QA zur termingerechten
        Auslieferung neuer Features
      endDate: Mar 1, 2022
      keywords:
        - Java
        - Spring Boot
        - TypeScript
        - CI/CD
        - Big Data
      url: https://www.datapulse.example
    - name: WebCraft GmbH
      position: Junior Full-Stack Developer
      startDate: Sep 1, 2015
      summary: >
        - Entwicklung und Wartung von Kundenwebseiten mit Angular, Node.js und
