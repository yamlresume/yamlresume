        - 主導微服務架構設計，將單體式後端拆分為 20 餘個可獨立部署的服務
        - 導入 Kubernetes 與 GitOps 流程，縮短部署時間由 40 分鐘降至 8 分鐘
        - 設計並實作高流量 API 閘道，每日處理超過 5,000 萬次請求
        - 帶領 4 人小組開發會員與訂單系統，並負責程式碼審查與技術決策
