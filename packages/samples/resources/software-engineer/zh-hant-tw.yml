  projects:
    - name: 微服務監控平台
      startDate: Mar 1, 2023
      summary: |
        - 內部開源專案，用於收集與視覺化微服務之間的呼叫鏈路
        - 自動偵測異常服務並發送警報，協助團隊快速定位問題
      description: >
        這是一個為團隊量身打造的微服務監控平台。系統透過 OpenTelemetry 收集分散式追蹤資料，並以 Go
        撰寫資料收集器，將資料正規化後儲存於 ClickHouse。前端使用 React 與 D3.js
        繪製服務拓撲圖，讓工程師可以直觀地掌握服務間的相依關係與延遲狀況。此外，平台也提供自訂告警規則，當服務錯誤率或延遲超過門檻時，會透過 Slack
        與電子郵件通知值班人員。
      endDate: Sep 1, 2023
      keywords:
        - OpenTelemetry
        - Go
        - React
        - ClickHouse
      url: https://www.guanyu.dev/projects/microservice-monitor
    - name: 智慧庫存預測系統
      startDate: Jan 1, 2021
      summary: |
        - 協助零售業客戶預測商品需求量，降低缺貨與庫存過剩風險
        - 使用時間序列模型與歷史銷售資料，產生每日預測報表
      description: >
        基於 Python 與 Prophet 建置之庫存預測系統，串接客戶既有 ERP 的銷售資料，並以 FastAPI
        提供預測服務。系統每日批次更新模型，並將預測結果寫入資料庫，供管理儀表板與採購流程使用。專案上線後，客戶平均庫存周轉天數減少約 20%。
      endDate: Jun 1, 2021
      keywords:
        - Python
        - FastAPI
        - Prophet
        - ERP
      url: https://www.guanyu.dev/projects/inventory-forecast
  publications:
