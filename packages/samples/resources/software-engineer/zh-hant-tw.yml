        - 技術文件撰寫

  awards:
    - title: 書卷獎
      date: Oct 2017
      awarder: 國立臺灣大學
      summary: |
        頒發給學業成績優異之碩士班學生，全學期 GPA 4.0 且排名系所前 5%。
    - title: 最佳專題獎
      date: Jun 2016
      awarder: 國立臺灣科技大學資訊工程系
      summary: |
        大學畢業專題「基於深度學習之即時手寫辨識系統」獲評審評選為最佳專題。

  certificates:
    - name: AWS Certified Solutions Architect – Associate
      url: https://aws.amazon.com/verification
      issuer: Amazon Web Services
      date: Mar 2022
    - name: Certified Kubernetes Application Developer (CKAD)
      url: https://www.cncf.io/certification/ckad/
      issuer: Cloud Native Computing Foundation
      date: Aug 2021

  publications:
    - name: Multi-objective Scheduling for Containerized Applications in Edge-Cloud
        Continuum
      publisher: IEEE International Conference on Cloud Computing
      releaseDate: Jul 2021
      url: https://doi.org/10.1109/CLOUD.2021.00045
      summary: |
        提出一個多目標最佳化的容器排程演算法，同時考慮延遲、能耗與資源利用率，實驗結果顯示相較於既有方法可降低 22% 平均回應時間並減少 15% 能耗。

  projects:
    - name: KubeCost Advisor
      url: https://github.com/poyuchen/kubecost-advisor
      description: Kubernetes 成本分析與資源建議工具
      startDate: Jan 2023
      summary: |
        - 串接 Kubernetes Metrics API 與 Prometheus，收集 Pod 資源使用歷史資料
        - 以 React 與 TypeScript 建置互動式儀表板，呈現成本分佈與資源瓶頸
        - 提供自動化資源 Request/Limit 建議，協助團隊平均節省 25% 叢集成本
      keywords:
        - Kubernetes
        - React
        - Python
        - Prometheus
    - name: 即時聊天服務 LunchBot
      url: https://github.com/poyuchen/lunchbot
      description: 用於辦公室午餐揪團的 LINE Bot 與 Web 管理後台
      startDate: Sep 2019
      endDate: Dec 2019
      summary: |
        - 使用 Node.js 與 LINE Messaging API 開發聊天機器人，處理點餐與投票流程
        - 建置 React 管理後台，讓餐廳業者管理菜單與訂單狀態
        - 導入 PostgreSQL 儲存訂單與使用者資料，並部署至 AWS Elastic Beanstalk
      keywords:
        - Node.js
        - LINE Bot
        - React
        - PostgreSQL
        - AWS

