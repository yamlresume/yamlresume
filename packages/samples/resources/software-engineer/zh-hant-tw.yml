  education:
    - institution: 國立臺灣大學
      url: https://www.ntu.edu.tw
      degree: Master
      area: 資訊工程學系
      score: "3.92"
      startDate: Sep 1, 2016
      endDate: Jul 1, 2018
      courses:
        - 分散式系統
        - 雲端運算
        - 機器學習
        - 高等演算法
        - 大數據分析
        - 網路安全
      summary: |
        研究主題為容器化應用程式之資源排程最佳化，畢業論文提出一套基於多目標最佳化的排程演算法，於模擬環境中降低 22% 的平均回應時間。
    - institution: 國立臺灣科技大學
      url: https://www.ntust.edu.tw
      degree: Bachelor
      area: 資訊工程系
      score: "3.85"
      startDate: Sep 1, 2012
      endDate: Jun 1, 2016
      courses:
        - 程式設計（一）（二）
        - 資料結構
        - 作業系統
        - 計算機網路
        - 資料庫系統
        - 軟體工程
      summary: |
        以書卷獎畢業，修習多門軟硬體相關課程，並參與網頁開發專題。

  work:
    - name: Appier
      url: https://www.appier.com
      position: 資深軟體工程師
      startDate: Jan 1, 2022
      summary: |
        - 負責廣告推薦與預測平台的後端服務開發，使用 Go 與 Python 建置高效能 API，日均處理數千萬請求
        - 主導 Kubernetes 叢集遷移與資源調度優化，基礎設施成本下降 35%
        - 建立 CI/CD 流程與觀測系統（Prometheus、Grafana），提升部署頻率與服務可靠性
        - 帶領 3 人小組開發即時資料處理管線，串接 Kafka 與 ClickHouse
      keywords:
        - Go
        - Kubernetes
        - Kafka
        - ClickHouse
        - CI/CD
    - name: 趨勢科技（Trend Micro）
      url: https://www.trendmicro.com
      position: 軟體工程師
      startDate: Jul 1, 2018
      endDate: Dec 31, 2021
      summary: |
        - 開發雲端資安產品之管理平台，使用 React、TypeScript 與 Node.js，支援多租戶架構
        - 設計 RESTful API 與資料模型，並導入 GraphQL 以減少前端過度抓取問題
        - 與威脅研究團隊合作，開發即時威脅儀表板，協助客戶快速掌握資安事件
        - 參與 Scrum 開發流程，並定期進行程式碼審查與技術分享
      keywords:
        - React
        - TypeScript
        - Node.js
        - GraphQL
        - Scrum

