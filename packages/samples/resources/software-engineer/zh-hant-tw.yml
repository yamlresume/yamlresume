content:
  basics:
    name: 陳柏宇
    headline: 軟體工程師｜全端開發・雲端架構・DevOps
    phone: "+886 912 345 678"
    email: poyu.chen.dev@gmail.com
    url: https://poyuchen.dev
    summary: |
      具 8 年經驗的軟體工程師，專注於全端應用開發、分散式系統與雲端架構設計。擅長從需求分析、系統設計到部署維運的完整開發流程，並致力於以簡潔、可維護的方式交付高品質軟體。

      - 熟悉 TypeScript、Node.js、Python 與 Go，具備 React/Next.js 前端開發經驗
      - 設計與維運 Kubernetes 叢集、CI/CD 管線與雲端基礎設施，降低成本並提升穩定性
      - 樂於技術分享與跨部門協作，曾帶領 3 人小組完成多項關鍵功能交付

  location:
    address: 台北市大安區羅斯福路四段 100 號
    city: 台北市
    region: 大安區
    country: Taiwan
    postalCode: "10617"

  profiles:
    - network: GitHub
      url: https://github.com/poyuchen
      username: poyuchen
    - network: LinkedIn
      url: https://www.linkedin.com/in/poyuchen-tw
