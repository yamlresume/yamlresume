      Senior software engineer with 8+ years of experience designing, building, and scaling web applications for startups and growth-stage technology companies. I care about clean architecture, pragmatic testing, and delivering measurable business value through reliable software.

      - Expert in TypeScript, Node.js, React, and modern DevOps practices such as Docker, Kubernetes, and CI/CD
      - Strong track record of leading cross-functional delivery, mentoring engineers, and reducing incidents
      - Passionate about developer experience, API design, and building inclusive engineering cultures
  location:
