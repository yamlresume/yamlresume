      startDate: Nov 1, 2019
      endDate: Jun 1, 2021
      summary: |
        - Created an open-source dashboard for monitoring background job queues across Redis and RabbitMQ
        - Built with React, TypeScript, and Express; visualizes throughput, failure rates, and job latency
        - Adopted by 300+ developers and featured in several Node.js newsletters
      keywords:
