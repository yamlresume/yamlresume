  work:
    - name: CloudShift Technologies
      url: https://cloudshift.io
      position: Senior Software Engineer
      startDate: Mar 1, 2020
      summary: |
        - Led a platform team responsible for a multi-tenant SaaS infrastructure serving over 2M monthly users
        - Redesigned the core event-ingestion pipeline using Node.js, Kafka, and AWS Lambda, reducing infrastructure costs by 38%
        - Introduced GraphQL federation across 6 services, enabling product teams to ship features 40% faster
        - Championed reliability engineering practices including SLOs, error budgets, and chaos experiments
        - Mentored 5 engineers, led interview loops, and contributed to a 95% employee retention rate on the team
      keywords:
        - TypeScript
        - 'Node.js'
        - GraphQL
        - AWS
        - Kafka
        - Kubernetes
        - SLOs
        - Mentorship
    - name: FinScale Analytics
      url: https://finscale.io
      position: Software Engineer
      startDate: Jun 1, 2016
      endDate: Feb 1, 2020
      summary: |
        - Built a real-time financial reporting dashboard using React, Redux, and WebSockets for institutional clients
        - Developed a Python and Django service that aggregated data from 15+ sources and cut report generation time by 70%
        - Implemented resumable file uploads and background job processing for large CSV and Excel datasets
        - Worked in an agile pod of 6 engineers and collaborated closely with product and design teams
        - Automated CI/CD pipelines with GitHub Actions, increasing release frequency from biweekly to daily
      keywords:
