content:
  basics:
    name: 佐藤 健太
    headline: Webアプリケーション開発とクラウド運用が得意なソフトウェアエンジニア
    phone: 080-1234-5678
    email: kenta.sato@example.jp
    url: https://kentasato.dev
    summary: |
      - バックエンドからフロントエンドまで一貫して開発できるソフトウェアエンジニア
      - TypeScript / Node.js / React を用いたWebアプリケーション開発に6年の実務経験
      - AWSでのクラウドインフラ設計・運用や、CI/CDパイプライン構築にも従事
      - チーム開発を円滑に進めるため、コードレビューや技術共有を積極的に実施
      - プロダクトの価値を最大化することを常に意識し、要件定義から運用保守まで幅広く対応
  location:
    address: 東京都渋谷区神南1-2-3
    city: 渋谷区
    region: 東京都
    country: Japan
    postalCode: "150-0041"
  profiles:
    - network: GitHub
      url: https://github.com/kentasato
      username: kentasato
    - network: LinkedIn
      url: https://www.linkedin.com/in/kentasato
      username: kentasato
  education:
    - institution: 東京大学
      url: https://www.u-tokyo.ac.jp/
      degree: Bachelor
      area: 工学部 システム創成学科
      score: 3.8/4.0
      startDate: Apr 1, 2015
      endDate: Mar 31, 2019
      courses:
        - アルゴリズムとデータ構造
        - オペレーティングシステム
        - ソフトウェア工学
        - データベース設計
        - コンピュータネットワーク
        - 機械学習基礎
        - ヒューマンコンピュータインタラクション
        - 分散システム
      summary: |
        - アルゴリズム、データ構造、ソフトウェア工学の基礎を中心に学ぶ
        - 学部3年次からWebアプリケーション開発の研究プロジェクトに参加
        - 卒業研究として「クラウド環境における機械学習パイプラインの効率化」をテーマに実装と検証を実施
  work:
    - name: 株式会社テックイノベーション
      url: https://www.techinnovation.co.jp
      position: シニアソフトウェアエンジニア
      startDate: Apr 1, 2022
      summary: |
        - 自社SaaSプロダクトのアーキテクチャ設計、実装、運用をリード
        - TypeScript / React / Node.jsを中心としたモノレポ構成への移行を推進
        - AWS上でのインフラ構築・運用を担当し、コスト最適化と可用性向上を実現
        - チームの開発プロセス改善に取り組み、四半期ごとのデプロイ頻度を2倍に向上
        - シニアエンジニアとしてメンタリングやコードレビューを担当し、チーム全体の品質向上に貢献
      keywords:
        - アーキテクチャ設計
        - チームリーダー
        - アジャイル開発
        - AWS移行
        - 技術メンタリング
    - name: 株式会社デジタルソリューション
      url: https://www.digital-solution.co.jp
      position: ソフトウェアエンジニア
      startDate: Apr 1, 2019
      endDate: Mar 31, 2022
      summary: |
        - 金融業界向けの業務システム開発に従事し、フロントエンドからバックエンドまで幅広く担当
        - Reactを用いた管理画面の刷新プロジェクトで、ユーザビリティと表示速度を大幅に改善
        - REST APIの設計・実装・テストを担当し、第三者システムとの連携を安定化
        - Docker導入による開発環境の統一を行い、新入メンバーのセットアップ時間を短縮
        - スクラム開発におけるスプリント計画や振り返りを積極的にリード
      keywords:
        - React
        - Node.js
        - REST API
        - Docker
        - スクラム開発
    - name: 株式会社ウェブクラフト
      url: https://www.webcraft.co.jp
      position: Webエンジニア（インターン）
      startDate: Jun 1, 2018
      endDate: Mar 31, 2019
      summary: |
        - 店舗向け予約管理システムのフロントエンド実装を担当
        - Vue.jsを用いたUIコンポーネントの開発を通じて、実務での開発フローを習得
        - テストコード作成やドキュメント整備にも参加し、品質向上に寄与
      keywords:
        - Vue.js
        - フロントエンド開発
        - テスト自動化
  languages:
    - language: Japanese
      fluency: Native or Bilingual Proficiency
      keywords:
        - 日本語能力試験N1
    - language: English
      fluency: Full Professional Proficiency
      keywords:
        - TOEIC 900
        - 実務での英語コミュニケーション
  skills:
    - name: フロントエンド開発
      level: Expert
      keywords:
        - TypeScript
        - React
        - Next.js
        - Vue.js
        - CSS
        - アクセシビリティ
    - name: バックエンド開発
      level: Advanced
      keywords:
        - Node.js
        - Python
        - Ruby
        - REST API
        - GraphQL
        - マイクロサービス
    - name: クラウド / DevOps
      level: Advanced
      keywords:
        - AWS
        - Docker
        - Kubernetes
        - Terraform
        - CI/CD
    - name: データベース
      level: Intermediate
      keywords:
        - PostgreSQL
        - MySQL
        - Redis
  awards:
    - title: 社内MVP受賞
      awarder: 株式会社テックイノベーション
      date: Dec 2022
      summary: |
        - 大規模なレガシーシステムのクラウド移行をリードし、運用コストの削減とサービス品質向上に大きく貢献したことが評価され、社内MVPとして表彰された。
  certificates:
    - name: AWS認定ソリューションアーキテクト – アソシエイト
      issuer: Amazon Web Services
      date: Jun 2023
      url: https://aws.amazon.com/certification/
    - name: 応用情報技術者試験
      issuer: 経済産業省
      date: Oct 2020
      url: https://www.jitec.ipa.go.jp/
  publications:
    - name: TypeScriptによる型安全なAPIクライアント設計
      publisher: Zenn
      releaseDate: Mar 15, 2023
      url: https://zenn.dev/kentasato/articles/typed-api-client
      summary: |
        - 実践的なTypeScriptの型設計パターンを整理
        - REST APIのレスポンスを型安全に扱うための実装例を公開
        - フロントエンド開発者向けに、保守性の高いデータフェッチ層の設計手法を解説
  projects:
    - name: 在宅勤務管理システム
      url: https://github.com/kentasato/work-from-home-manager
      description: 従業員の出退勤や在宅勤務スケジュールを可視化するWebアプリケーション
      startDate: Apr 1, 2023
      endDate: Sep 30, 2023
      summary: |
        - チームメンバーの在宅・出社予定を一元管理するためのダッシュボードを開発
        - React + TypeScriptでフロントエンドを構築し、Node.js + PostgreSQLでバックエンドAPIを実装
        - GitHub Actionsを活用した自動テスト・自動デプロイ体制を整備
      keywords:
        - TypeScript
        - React
        - Node.js
        - PostgreSQL
        - GitHub Actions
    - name: オープンソースのタスク管理ツール
      url: https://github.com/kentasato/taskflow
      description: シンプルで拡張性の高いタスク管理ツール
      startDate: Jan 1, 2022
      endDate: Jun 30, 2022
      summary: |
        - コマンドラインとWeb UIの両方から操作できるタスク管理ツールを開発
        - オープンソースとして公開し、国内外の開発者からフィードバックを受けて改善
        - 外部サービスとの連携を可能にするプラグイン機構を設計
      keywords:
        - OSS
        - Node.js
        - プラグイン設計
        - コマンドラインツール
  interests:
    - name: 技術書の読書
      keywords:
        - ソフトウェア設計
        - クラウドアーキテクチャ
        - セキュリティ
    - name: ランニング
      keywords:
        - マラソン
        - トレイルラン
        - 体力づくり
    - name: 旅行
      keywords:
        - 国内旅行
        - 温泉
        - 写真撮影
  volunteer:
    - organization: PyCon JP 実行委員会
      url: https://pycon.jp/
      position: ボランティアスタッフ
      startDate: Apr 1, 2022
      endDate: Nov 30, 2022
      summary: |
        - PyCon JP 2022の運営スタッフとして、セッション運営や参加者サポートを担当
        - Webサイト更新やSNSでの情報発信を支援し、イベントの成功に貢献

locale:
  language: ja
