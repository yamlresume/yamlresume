content:
  basics:
    name: 陳俊傑
    headline: '軟件工程師 | 全端開發 | 雲端應用'
    phone: '+852 9123 4567'
    email: chun.kit.chan@example.com
    url: https://ckchan.dev
    summary: |
      具超過 5 年經驗的軟件工程師，專注於全端開發、微服務架構及雲端應用。擅長以 TypeScript、Python 及 Go 構建高效且可擴展的系統，並熱衷於透過最佳實踐及自動化測試提升軟件品質。

      - 曾帶領團隊由單體架構遷移至微服務，提升系統可靠性和部署效率。
      - 熟悉 AWS 及 Kubernetes，擁有大型分散式系統設計及維運經驗。
      - 具備良好跨部門溝通與項目管理能力，能將業務需求轉化為實際技術方案。
  location:
    city: 香港
    region: 香港
    country: Hong Kong
  profiles:
    - network: GitHub
      url: https://github.com/ckchan-dev
      username: ckchan-dev
    - network: LinkedIn
      url: https://www.linkedin.com/in/ckchan-dev
      username: ckchan-dev
  education:
    - institution: 香港科技大學
      url: https://www.hkust.edu.hk
      degree: Bachelor
      area: 計算機科學
      score: 3.6/4.0
      startDate: 2014-09-01
      endDate: 2018-06-30
      courses:
        - 數據結構與算法
        - 操作系統
        - 數據庫系統
        - 計算機網絡
        - 軟件工程
        - 分散式系統
        - 編譯原理
      summary: |
        主修計算機科學，專注於軟件工程及系統設計。畢業項目為「基於區塊鏈的供應鏈追蹤系統」，獲得系內最佳畢業項目獎。
  work:
    - name: 星辰科技（香港）有限公司
      url: https://www.startechhk.com
      position: 高級軟件工程師
      startDate: 2022-03-01
      summary: |
        - 主導團隊為金融科技客戶設計及開發分散式交易系統，支援每日數百萬宗交易。
        - 將單體應用遷移至 Kubernetes 微服務架構，部署時間由 45 分鐘縮短至 8 分鐘。
        - 推行 CI/CD 流程及基礎設施即程式碼（IaC），提升環境一致性及交付效率。
        - 與產品經理及業務單位緊密合作，將複雜業務需求拆解為可執行的技術方案。
        - 指導初級工程師進行代碼審查及系統設計，提升團隊整體工程文化。
      keywords:
        - 微服務
        - Kubernetes
        - 系統設計
        - 團隊管理
        - 金融科技
    - name: 藍海軟件開發有限公司
      url: https://www.blueocean-soft.com.hk
      position: 軟件工程師
      startDate: 2019-07-01
      endDate: 2022-02-28
      summary: |
        - 負責開發及維護 B2B 電子商貿平台的前端及後端功能，服務超過 500 家企業客戶。
        - 使用 React、Node.js 及 PostgreSQL 構建實時庫存管理系統，提升營運效率 30%。
        - 設計並整合 RESTful API 至第三方物流及支付服務，簡化訂單處理流程。
        - 參與 Scrum 團隊，進行衝刺規劃、代碼審查及單元測試，確保產品質素。
      keywords:
        - React
        - Node.js
        - PostgreSQL
        - RESTful API
        - Scrum
  skills:
    - name: 程式語言
      level: Expert
      keywords:
        - TypeScript
        - Python
        - Go
        - Java
        - 'C#'
        - SQL
    - name: 前端開發
      level: Advanced
      keywords:
        - React
        - Vue.js
        - Next.js
        - HTML5
        - CSS3
        - Tailwind CSS
    - name: 後端開發
      level: Expert
      keywords:
        - Node.js
        - Express
        - Django
        - Gin
        - RESTful API
        - GraphQL
    - name: 雲端與 DevOps
      level: Advanced
      keywords:
        - AWS
        - Docker
        - Kubernetes
        - Terraform
        - CI/CD
        - Prometheus
        - Grafana
    - name: 數據庫
      level: Advanced
      keywords:
        - PostgreSQL
        - MySQL
        - MongoDB
        - Redis
        - Elasticsearch
  languages:
    - language: Chinese
      fluency: Native or Bilingual Proficiency
      keywords:
        - 粵語（母語）
        - 普通話（流利）
        - 繁體中文寫作
    - language: English
      fluency: Full Professional Proficiency
      keywords:
        - 'HKDSE 英文 5*'
        - IELTS 7.5
  awards:
    - title: 院長嘉許名單
      date: 2016-12-01
      awarder: 香港科技大學
      summary: |
        於 2016-2017 學年因學業成績優異而獲列入院長嘉許名單。
    - title: 最佳畢業項目獎
      date: 2018-06-01
      awarder: 香港科技大學
      summary: |
        畢業項目「基於區塊鏈的供應鏈追蹤系統」獲評為年度最佳計算機科學畢業項目。
  certificates:
    - name: AWS 解決方案架構師 – 助理級
      issuer: Amazon Web Services
      date: 2021-05-01
      url: https://aws.amazon.com/certification/
    - name: Certified Kubernetes Application Developer
      issuer: CNCF
      date: 2022-08-01
      url: https://www.cncf.io/certification/ckad/
  publications:
    - name: 以領域驅動設計提升微服務系統可維護性之研究
      publisher: 香港軟件工程協會期刊
      releaseDate: 2023-10-01
      url: https://example.com/publications/ddd-microservices
      summary: |
        探討如何運用領域驅動設計（DDD）於微服務劃分及業務邏輯建模，並以實際案例驗證其對系統可維護性、測試性及團隊協作效率的正面影響。
  projects:
    - name: 即時協作文檔平台
      url: https://github.com/ckchan-dev/realtime-collab-doc
      description: 一個支援多人實時協作編輯的文檔平台，採用 CRDT 演算法自動合併衝突。
      startDate: 2022-06-01
      endDate: 2022-10-31
      summary: |
        - 以 TypeScript、React 及 WebSocket 開發，支援離線編輯及自動同步。
        - 使用 Yjs CRDT 演算法處理多端同時編輯的衝突，確保一致性。
        - 加入操作歷史及版本回溯功能，提升協作效率與用戶體驗。
      keywords:
        - React
        - TypeScript
        - WebSocket
        - CRDT
        - Yjs
    - name: 容器化微服務監控系統
      url: https://github.com/ckchan-dev/k8s-monitoring-platform
      description: 基於 Kubernetes 的微服務監控及日誌聚合平台。
      startDate: 2021-09-01
      endDate: 2022-01-31
      summary: |
        - 整合 Prometheus、Grafana 與 Loki，提供多租戶的即時監控告警。
        - 自訂 Helm Chart 簡化部署流程，令新服務接入監控只需數分鐘。
        - 設計告警規則及儀表板，協助團隊快速定位系統異常。
      keywords:
        - Kubernetes
        - Prometheus
        - Grafana
        - Loki
        - Helm
  interests:
    - name: 科技創新
      keywords:
        - 開源軟件
        - 區塊鏈
        - 人工智能
    - name: 戶外活動
      keywords:
        - 遠足
        - 露營
        - 攝影
  volunteer:
    - organization: 香港軟件開發者社群
      url: https://hkdevcommunity.org
      position: 技術導師
      startDate: 2020-01-01
      endDate: 2023-12-31
      summary: |
        - 定期主持 Web 開發工作坊及編程入門講座，協助初學者學習現代前端技術。
        - 為開源項目提供代碼審查及技術諮詢，促進本地開發者社群交流。
        - 籌辦年度黑客松活動，吸引超過 200 名參與者。

locale:
  language: zh-hant-hk
