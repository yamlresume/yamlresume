        - 設計並優化 MySQL 及 Redis 數據存取層，將查詢響應時間平均降低 40%
        - 與風控團隊合作實現實時交易監控系統，透過消息隊列處理每日逾百萬筆交易事件
        - 參與敏捷開發流程，定期進行 sprint 規劃及回顧，持續改善團隊交付效率
      endDate: Jun 30, 2020
      keywords:
        - Java
        - Spring Boot
        - Angular
        - MySQL
        - Redis
        - Kafka
        - Docker
      url: https://www.excellencefintech.com.hk
    - name: 初創網絡科技有限公司
      position: 程式設計員
      startDate: Jun 1, 2016
      summary: |
        - 負責開發及維護多個中小企網站及內容管理系統，支援客戶自訂版面及功能
        - 使用 JavaScript、Python 及 MongoDB 構建伺服器端應用程式，並整合第三方 API
        - 配合設計師進行響應式網頁開發，確保跨瀏覽器及流動裝置的用戶體驗
        - 參與代碼部署及伺服器配置，熟悉 Linux 環境及 Shell 指令操作
      endDate: Jul 31, 2017
      keywords:
        - JavaScript
        - Python
        - MongoDB
        - Express.js
        - HTML/CSS
        - Linux
      url: https://www.initwebtech.com.hk
