      startDate: Jun 1, 2022
      summary: |
        - 採用 React、Redux Toolkit 及 WebSocket 實現任務卡片的實時同步與拖放操作
        - 後端以 Express.js 及 MongoDB 建構，使用 JWT 進行身份驗證及授權
        - 設計可擴展的任務狀態機，支援自訂 workflow，並以 Socket.IO 處理衝突與重連機制
      description: 支援多用戶實時協作的敏捷開發看板工具。
