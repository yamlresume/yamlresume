        - Node.js
        - React
        - Kubernetes
        - Microservices
        - CI/CD
        - AWS
      url: https://www.zhiyuntech.com.hk
    - name: 卓越金融科技有限公司
      position: 軟件工程師
      startDate: Aug 1, 2017
      summary: |
