      startDate: Jan 1, 2021
      summary: >
        - 以 TypeScript 及 Node.js 開發，提供授權碼流程、client credentials 及 refresh token
        支援

        - 使用 PostgreSQL 儲存用戶及 client 資料，並透過 Redis 快取 session 提升效能

