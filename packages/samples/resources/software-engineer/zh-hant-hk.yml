      position: 高級軟件工程師
      startDate: Jul 1, 2020
      summary: |
        - 主導三個核心產品的後端系統重構，將單體架構遷移至 Kubernetes 微服務架構，服務可用性提升至 99.99%
        - 帶領 5 人團隊開發及維護客戶管理系統，採用 React、GraphQL 及 PostgreSQL，支援超過 10 萬名用戶
        - 制定及推行程式碼審查與自動化測試策略，將單元測試覆蓋率由 45% 提升至 85%
        - 透過引入 Terraform 及 Argo CD 完善 CI/CD 流程，令部署時間由每週一次縮短至每日多次
      keywords:
