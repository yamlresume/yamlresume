content:
  basics:
    name: Lars van den Berg
    email: lars@vandenberg.dev
    headline: Softwareontwikkelaar met focus op schaalbare cloudapplicaties
    phone: +31 6 12345678
    summary: >
      - Softwareontwikkelaar met ruim 8 jaar ervaring in het ontwerpen en bouwen
      van schaalbare webapplicaties

      - Specialisatie in backendontwikkeling met .NET en Node.js, aangevuld met
      ervaring in React en TypeScript

      - Ervaren met cloudplatforms als Azure en AWS, CI/CD-pipelines en
      containerisatie met Docker en Kubernetes

      - Gedreven door clean code, testbaarheid en het verbeteren van
      developmentprocessen

      - Sterke samenwerker in agile teams, met oog voor zowel techniek als
      bedrijfswaarde
    url: https://larsvandenberg.dev
  education:
    - area: Hbo-ict
      institution: Hogeschool van Amsterdam
      degree: Bachelor
      courses:
        - Objectgeoriënteerd programmeren
        - Databases en SQL
        - Webdevelopment
        - Software Engineering
        - Projectmanagement
        - Netwerken en security
      endDate: Jul 1, 2015
      startDate: Sep 1, 2011
      summary: >
        - Afstudeerrichting Software Engineering

        - Afstudeerproject: ontwikkelen van een webshop-platform voor een
        mkb-bedrijf

        - Minor: Mobile Application Development
      score: "8.2"
      url: https://www.hva.nl/
  awards:
    - awarder: TechNova B.V.
      title: TechNova Innovatieprijs
      date: Dec 1, 2023
      summary: >
        Toegekend voor het initiatief om de CI/CD-pijplijn te versnellen en de
        ontwikkelervaring van het team te verbeteren.
