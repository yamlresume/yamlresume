content:
  basics:
    name: Lars van den Berg
    headline: Software Engineer met passie voor schaalbare cloud-native systemen
    phone: "+31 6 12345678"
    email: lars@vandenberg.dev
    url: https://www.larsvandenberg.dev
    summary: |
      Software Engineer met ruim 8 jaar ervaring in het ontwerpen en bouwen van
      schaalbare, cloud-native applicaties. Specialist in backend-ontwikkeling met
      Python, Java en Go, en uitgebreide ervaring met AWS en Kubernetes.

      - Ontwerpen van event-gedreven microservices met hoge beschikbaarheid
      - Automatiseren van deployment pipelines met CI/CD en Infrastructure as Code
      - Sterke focus op codekwaliteit, testbaarheid en maintainability
      - Ervaren in het begeleiden van junior ontwikkelaars en agile samenwerking
  location:
    address: Oudegracht 123
    city: Utrecht
    region: Utrecht
    country: Netherlands
    postalCode: "3511 AB"
  profiles:
    - network: GitHub
      url: https://github.com/larsvandenberg
      username: larsvandenberg
    - network: LinkedIn
      url: https://www.linkedin.com/in/larsvandenberg
      username: larsvandenberg
  education:
    - institution: Technische Universiteit Delft
      url: https://www.tudelft.nl
      degree: Master
      area: Informatica
      score: "8.0"
      startDate: Sep 1, 2013
      endDate: Aug 1, 2015
      courses:
        - Distributed Systems
        - Machine Learning
        - Software Architecture
        - Big Data Processing
      summary: |
        Afstudeeronderzoek gericht op schaalbare, event-gebaseerde architecturen.
        Ontwikkelde een prototype voor een event-sourcing platform dat gebruikt
        werd door meerdere onderzoeksgroepen.
    - institution: Hogeschool Utrecht
      url: https://www.hu.nl
      degree: Bachelor
      area: Informatica
      score: "7.8"
      startDate: Sep 1, 2010
      endDate: Aug 1, 2013
      courses:
        - Objectgeoriënteerd programmeren
        - Databases
        - Software Engineering
        - Webtechnologie
      summary: |
        Bachelorstage uitgevoerd bij een fintech-bedrijf, waar ik een
        realtime-transactiemonitor bouwde met Java en WebSocket.
  work:
    - name: CloudNimbus B.V.
      url: https://www.cloudnimbus.nl
      position: Senior Backend Engineer
      startDate: Feb 1, 2022
      summary: |
        - Verantwoordelijk voor de architectuur en ontwikkeling van meerdere event-gedreven microservices
        - Migreerde een monolithische applicatie naar Kubernetes en AWS EKS
        - Introduceerde Infrastructure as Code met Terraform, wat de deploymenttijd met 70% verminderde
        - Begeleidde een team van vijf ontwikkelaars middels code reviews en technische workshops
        - Werkt nauw samen met productowners om technische roadmap en sprints te bepalen
      keywords:
        - Microservices
        - Kubernetes
        - AWS
        - Terraform
        - Java
        - Mentoring
    - name: DataVault Solutions
      url: https://www.datavault.nl
      position: Software Engineer
      startDate: Jun 1, 2018
      endDate: Jan 1, 2022
      summary: |
        - Ontwikkelde en onderhield een API-platform voor veilige data-uitwisseling
        - Implementeerde OAuth2 en JWT-authenticatie voor meerdere externe partijen
        - Optimaliseerde databasequery's, wat leidde tot een significante verlaging van de responstijden
        - Droeg bij aan de inrichting van CI/CD-pipelines met GitLab CI
        - Werkte in een multidisciplinair team volgens de Scrum-methodiek
      keywords:
        - Python
        - FastAPI
        - PostgreSQL
        - OAuth2
        - GitLab CI
    - name: BrightCode
      url: https://www.brightcode.nl
      position: Junior Software Engineer
      startDate: Jul 1, 2016
      endDate: May 1, 2018
      summary: |
        - Ontwikkelde webapplicaties met Java Spring Boot en Angular
        - Vulde user stories aan met technische ontwerpen en testplannen
        - Schreef unit- en integratietests om de kwaliteit van de software te waarborgen
        - Participeerde in dagelijkse stand-ups en sprint retrospectives
      keywords:
        - Java
        - Spring Boot
        - Angular
        - JUnit
        - Scrum
