    - network: LinkedIn
      username: budisantoso
      url: https://www.linkedin.com/in/budisantoso
  projects:
    - name: SiUMKM
      startDate: Jan 2020
      summary: >
        - Membangun aplikasi web full-stack dengan fitur manajemen stok, laporan
        penjualan, dan integrasi marketplace.

        - Digunakan oleh lebih dari 50 UMKM binaan pada program inkubasi bisnis.
      description: Platform manajemen inventori dan pemasaran digital untuk UMKM
      endDate: Jun 2020
      keywords:
        - React
        - Node.js
        - PostgreSQL
        - UMKM
      url: https://github.com/budisantoso-dev/siumkm
    - name: Dashboard Analitik Real-Time
      startDate: Feb 2022
      summary: >
        - Mengembangkan dashboard analitik yang menampilkan metrik penjualan,
        stok, dan prediksi permintaan.

        - Menggunakan WebSocket untuk pembaruan data secara langsung dan Google
        Charts untuk visualisasi.
      description: Dashboard visualisasi data penjualan secara real-time untuk
        perusahaan ritel
      endDate: Dec 2022
      keywords:
        - React
        - WebSocket
        - Data Visualization
        - Node.js
      url: https://github.com/budisantoso-dev/dashboard-analitik
  publications:
    - name: Arsitektur Microservices untuk Sistem E-Commerce pada Platform UMKM
      publisher: Jurnal Teknologi Informasi dan Ilmu Komputer (JTIIK)
      releaseDate: Jul 2022
      summary: >
        Artikel ini membahas perancangan dan implementasi arsitektur
        microservices pada sistem e-commerce, mencakup strategi komunikasi
        antar-layanan dan manajemen data terdistribusi.
      url: https://jtiik.ub.ac.id/index.php/jtiik/article/view/12345
  skills:
    - level: Expert
      name: Pengembangan Web
      keywords:
        - TypeScript
        - React
