        - GitHub Actions
    - level: Advanced
      name: Testing & Kualitas
      keywords:
        - Jest
        - Cypress
        - Playwright
        - SonarQube
  volunteer:
    - organization: Komunitas Developer Indonesia
      position: Mentor Pemrograman Web
      startDate: Jan 2021
      summary: >
        Menjadi mentor dalam program pelatihan pemrograman web bagi mahasiswa
        dan profesional muda. Mendampingi peserta dalam membangun portofolio dan
        persiapan karier.
      endDate: Dec 2023
      url: https://komunitasdeveloper.id
    - organization: Yayasan Pendidikan Anak Nusantara
      position: Relawan Pengajar Coding
      startDate: Jun 2019
      summary: >
        Mengajar dasar-dasar logika pemrograman dan Scratch kepada siswa sekolah
        dasar di daerah terpencil.
      endDate: Dec 2020
  work:
    - name: PT Nusantara Digital Solusi
      position: Senior Software Engineer
      startDate: Mar 1, 2023
      summary: >
        - Memimpin pengembangan backend layanan pembayaran dengan arsitektur
        microservices menggunakan Go dan Kafka.

        - Menerapkan desain API yang aman dan efisien, mengurangi waktu respons
        rata-rata hingga 35%.

        - Berkolaborasi dengan tim produk, desain, dan QA untuk menghadirkan
        fitur-fitur baru secara iteratif.

        - Melakukan mentoring kepada 4 engineer junior dan melakukan code review
        secara berkala.

        - Meningkatkan keandalan sistem melalui observability, logging, dan
        otomatisasi deployment.
      endDate: null
      keywords:
        - Microservices
        - Go
        - Kafka
        - REST API
        - AWS
        - Scrum
      url: https://nusantaradigitalsolusi.co.id
    - name: PT Kreatif Media Indonesia
      position: Software Engineer
      startDate: Jul 1, 2019
      summary: >
        - Mengembangkan aplikasi web untuk klien termasuk dashboard analitik dan
        platform e-commerce.

        - Membangun frontend dengan React dan TypeScript, serta backend API
        menggunakan Node.js dan PostgreSQL.

        - Mengintegrasikan payment gateway dan layanan pihak ketiga untuk
        mendukung proses transaksi.

        - Menulis skrip CI/CD dengan GitHub Actions dan Docker untuk mempercepat
        proses delivery.

        - Berpartisipasi dalam perencanaan sprint dan melakukan grooming backlog
        bersama product owner.
      endDate: Feb 28, 2023
      keywords:
        - React
        - Node.js
        - PostgreSQL
        - Docker
        - CI/CD
        - E-commerce
      url: https://kreatifmedia.co.id
    - name: PT Solusi Teknologi Nusantara
      position: Software Engineer Intern
      startDate: Jan 1, 2019
      summary: >
        - Membantu pengembangan fitur manajemen pengguna pada aplikasi internal
        perusahaan.

        - Menulis unit test dengan Jest dan melakukan debugging pada aplikasi
        produksi.

        - Mendokumentasikan API dan menyusun panduan penggunaan sistem untuk tim
        teknis.
      endDate: Jun 30, 2019
      keywords:
        - JavaScript
        - Jest
        - REST API
        - Dokumentasi
      url: https://solusiteknologi.co.id
