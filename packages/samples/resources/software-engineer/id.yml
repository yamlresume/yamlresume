content:
  basics:
    name: Budi Santoso
    email: budi.santoso.dev@gmail.com
    headline: Software Engineer Berpengalaman dalam Aplikasi Web Skala Besar
    phone: +62 811 9876 5432
    summary: >
      - Software engineer dengan **4+ tahun** pengalaman membangun aplikasi web
      dan backend yang scalable.

      - Mahir dalam pengembangan full-stack menggunakan *TypeScript*, *React*,
      *Node.js*, dan *Go*.

      - Berpengalaman mendesain arsitektur microservices dan mengelola
      infrastruktur cloud di AWS/GCP.

      - Terbiasa dengan praktik CI/CD, containerization, dan Infrastructure as
      Code.

      - Berorientasi pada detail, kolaborasi tim, dan pengembangan produk
      berkualitas.
    url: https://budisantoso.id
  education:
    - area: Teknik Informatika
      institution: Universitas Indonesia
      degree: Bachelor
      courses:
        - Struktur Data dan Algoritma
        - Pemrograman Berorientasi Objek
        - Sistem Operasi
        - Basis Data
        - Jaringan Komputer
        - Rekayasa Perangkat Lunak
        - Kecerdasan Buatan
        - Keamanan Informasi
      endDate: Jul 1, 2019
      startDate: Aug 1, 2015
      summary: >
        - Lulus dengan predikat cum laude dan IPK 3.78/4.00.

        - Aktif dalam organisasi mahasiswa dan asisten dosen untuk mata kuliah
        Struktur Data.

        - Proyek akhir: pengembangan platform manajemen inventori berbasis web
        untuk UMKM.
      score: "3.78"
      url: https://www.ui.ac.id/
  awards:
    - awarder: Asia Pacific ICT Alliance (APICTA)
      title: Best Innovation in Smart City
      date: Nov 2021
      summary: >
        Penghargaan atas inovasi aplikasi pelaporan publik berbasis smart city
        yang dikembangkan bersama tim.
  certificates:
    - issuer: Amazon Web Services
      name: AWS Certified Developer - Associate
      date: Mar 2022
      url: https://aws.amazon.com/certification/
    - issuer: Google Cloud
      name: Professional Cloud Developer
      date: Sep 2023
      url: https://cloud.google.com/certification/
  interests:
