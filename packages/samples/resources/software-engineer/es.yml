content:
  basics:
    name: Carlos Mendoza Ríos
    headline: Ingeniero de Software Full Stack
    phone: "+34 612 345 678"
    email: carlos.mendoza@example.com
    url: https://carlosmendoza.dev
    summary: |
      - Ingeniero de software full stack con más de 7 años de experiencia creando aplicaciones web escalables y servicios en la nube.
      - Especialista en arquitectura de microservicios, APIs REST y diseño de interfaces con React.
      - Amplia experiencia en DevOps: Docker, Kubernetes y pipelines de CI/CD sobre AWS.
      - Orientado a la calidad, con buenas prácticas de testing, code review y documentación técnica.
      - Acostumbrado a trabajar en equipos ágiles y a colaborar con perfiles técnicos y de negocio.
  location:
    city: Madrid
    region: Comunidad de Madrid
    country: Spain
    postalCode: "28013"
  profiles:
    - network: GitHub
      url: https://github.com/carlosmendoza-dev
      username: carlosmendoza-dev
    - network: LinkedIn
      url: https://www.linkedin.com/in/carlosmendoza-dev
      username: carlosmendoza-dev
  education:
    - institution: Universidad Politécnica de Madrid
      url: https://www.upm.es/
      degree: Bachelor
      area: Ingeniería Informática
      score: "8.7/10"
      startDate: Sep 1, 2012
      endDate: Jun 1, 2017
      courses:
        - Estructuras de Datos y Algoritmos
        - Bases de Datos Avanzadas
        - Ingeniería del Software
        - Sistemas Operativos
        - Redes de Computadores
        - Arquitectura de Computadores
        - Sistemas Distribuidos
        - Programación Concurrente
      summary: |
        - Graduado con una media de 8.7/10, con especialización en ingeniería del software, bases de datos y sistemas distribuidos.
        - Trabajo de fin de grado orientado al desarrollo de una plataforma web colaborativa, reconocido con el Premio Extraordinario.
  work:
    - name: CloudNova Technologies
      url: https://www.cloudnova.dev
      startDate: Mar 1, 2022
      position: Ingeniero de Software Senior
      summary: |
        - Lidero el diseño e implementación de microservicios en Node.js y Python, reduciendo el tiempo de despliegue en un 40%.
        - Coordino un equipo de 5 desarrolladores aplicando metodologías ágiles y revisiones de código.
        - Impulso la adopción de Kubernetes y Helm para la gestión de entornos cloud.
        - Colaboro con arquitectura y producto para definir soluciones técnicas alineadas con los objetivos de negocio.
      keywords:
        - Microservicios
        - Node.js
        - Kubernetes
        - AWS
        - Liderazgo
    - name: InnoSoft Labs
      url: https://www.innosoft.es
      startDate: Jul 1, 2019
      endDate: Feb 1, 2022
      position: Desarrollador Full Stack
      summary: |
        - Desarrollé aplicaciones web con React, TypeScript y Node.js para clientes del sector bancario.
        - Diseñé e integré APIs REST y GraphQL con bases de datos PostgreSQL y MongoDB.
        - Automatizé los flujos de prueba e integración continua con GitHub Actions y Jest.
        - Participé en la migración de una aplicación monolítica a una arquitectura de microservicios.
      keywords:
        - React
        - TypeScript
        - GraphQL
        - PostgreSQL
        - CI/CD
    - name: TechPoint Solutions
      url: https://www.techpoint.es
      startDate: Jun 1, 2017
      endDate: Jun 1, 2019
      position: Desarrollador de Software
      summary: |
        - Implementé funcionalidades frontend y backend en proyectos de comercio electrónico.
        - Optimicé consultas SQL y el rendimiento general de la aplicación, reduciendo los tiempos de respuesta en un 30%.
        - Colaboré en la creación de un sistema interno de gestión documental.
      keywords:
        - JavaScript
        - AngularJS
        - Java
        - SQL
        - Scrum
  languages:
    - language: Spanish
      fluency: Native or Bilingual Proficiency
      keywords:
        - Nativo
    - language: English
      fluency: Full Professional Proficiency
      keywords:
        - C1 Advanced
        - TOEIC 945
  skills:
    - name: Desarrollo web
      level: Expert
      keywords:
        - React
        - 'Node.js'
        - TypeScript
        - HTML5
        - CSS3
    - name: Lenguajes de programación
      level: Expert
      keywords:
        - JavaScript
        - Python
        - Java
        - 'C++'
    - name: DevOps
      level: Advanced
      keywords:
        - Docker
        - Kubernetes
        - AWS
        - Terraform
        - CI/CD
    - name: Bases de datos
      level: Advanced
      keywords:
        - PostgreSQL
        - MongoDB
        - Redis
        - SQL
  awards:
    - title: Premio Extraordinario de Ingeniería Informática
      date: Oct 1, 2017
      awarder: Universidad Politécnica de Madrid
      summary: |
        Reconocimiento académico otorgado al mejor expediente de la promoción de Ingeniería Informática.
  certificates:
    - name: AWS Certified Developer - Associate
      url: https://aws.amazon.com/certification/
      issuer: Amazon Web Services
      date: Mar 1, 2023
  publications:
    - name: Guía práctica de observabilidad en microservicios
      publisher: Revista Tecnología y Software
      releaseDate: May 15, 2021
      url: https://www.tecnologiaysoftware.es/articulos/observabilidad-microservicios
      summary: |
        - Artículo técnico sobre la implementación de trazabilidad, métricas y logs en entornos de microservicios.
        - Incluye ejemplos reales de instrumentación con OpenTelemetry y su integración en Kubernetes.
  projects:
    - name: Plataforma de Gestión de Incidencias TI
      url: https://github.com/carlosmendoza-dev/incidentes-ti
      description: Aplicación full stack para la gestión de incidencias de soporte
        técnico en tiempo real.
      startDate: Sep 1, 2020
      endDate: Dec 1, 2020
      summary: |
        - Aplicación web con React, Redux y Node.js para la creación, asignación y seguimiento de incidencias.
        - Autenticación mediante JWT y panel de administración con estadísticas en tiempo real.
        - Despliegue automatizado en AWS mediante Docker y GitHub Actions.
      keywords:
        - React
        - Node.js
        - JWT
        - AWS
        - Docker
  interests:
    - name: Deporte
      keywords:
        - Running
        - Senderismo
        - Ciclismo
    - name: Tecnología
      keywords:
        - Open Source
        - Inteligencia Artificial
        - Domótica
  volunteer:
    - organization: Asociación Informática Solidaria
      url: https://www.infosolidaria.org
      position: Voluntario y mentor
      startDate: Jan 1, 2018
      endDate: Dec 1, 2020
      summary: |
        - Impartí talleres de introducción a la programación para estudiantes de secundaria.
        - Colaboré en el desarrollo de una aplicación web para la gestión de donaciones de la asociación.
        - Mentoricé a personas en riesgo de exclusión digital en competencias tecnológicas básicas.
