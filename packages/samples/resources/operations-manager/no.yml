        - Digitalisering
        - Prosessforbedring
        - Endringsledelse

    - name: Lean-program for lageravdeling
      startDate: 'Mar 1, 2018'
      endDate: 'Nov 30, 2018'
      url: https://www.fjordservice.no/prosjekter/lean-lager
      description: Forbedringsprogram for lager og utlasteri med fokus på flyt,
        standardisering og sikkerhet.
      summary: |
        - Gjennomførte verdistrømsanalyse og identifiserte flaskehalser i vareflyten.
        - Standardiserte arbeidsinstrukser og innførte tavlemøter for daglig styring.
        - Reduserte gjennomsnittlig ordrebehandlingstid med 19 prosent og HMS-avvik med 30 prosent.
      keywords:
