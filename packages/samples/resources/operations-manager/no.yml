    - name: Digital bemanningsplanlegging
      startDate: 'Feb 1, 2022'
      endDate: 'Aug 30, 2022'
      url: https://www.nordviklogistikk.no/prosjekter/digital-bemanning
      description: Innføring av digitalt bemanningsverktøy for fem terminaler med mål
        om bedre ressursutnyttelse og lavere overtid.
      summary: |
        - Kartla bemanningsbehov og etablerte felles planleggingsprosess på tvers av lokasjoner.
        - Innførte verktøy og opplærte 40 ledere og planleggere i nye rutiner.
        - Oppnådde 14 prosent lavere overtidsbruk og 9 prosent høyere produktivitet i pilotperioden.
      keywords:
