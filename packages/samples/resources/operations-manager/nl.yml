        foodsector'
      publisher: Logistiek Magazine
      releaseDate: Mar 2023
      url: https://www.logistiekmagazine.nl/artikelen/datagedreven-operations
      summary: |
        - Praktijkartikel over het verbinden van voorraadsturing aan klantwaarde en servicegraden.
        - Gaat in op KPI-keuzes, forecastverbetering en samenwerking tussen operations en commercie.
  projects:
    - name: Implementatie nieuw WMS
      url: https://www.freshflowdistributie.nl/projecten/wms
      description: Uitrol van een warehouse management systeem voor magazijn, planning
        en transport.
      startDate: Mar 2022
      endDate: Nov 2022
      summary: |
        - Leidde de operationele implementatie van een nieuw WMS binnen een live omgeving.
        - Betrok teamleiders en key users bij procesontwerp, testen en training.
        - Realiseerde een hogere voorraadnauwkeurigheid en kortere inwerktijd voor nieuwe medewerkers.
      keywords:
        - WMS
        - Implementatie
        - Procesontwerp
        - Training
    - name: Procesoptimalisatie orderpicking
      url: https://www.freshflowdistributie.nl/projecten/orderpicking
      description: Herinrichting van pickroutes en pickmethoden om doorlooptijd en
        kwaliteit te verbeteren.
      startDate: Jan 2023
      endDate: Jun 2023
      summary: |
        - Analyseerde pickdata en observeerde werkprocessen op de werkvloer.
        - Testte nieuwe routeplanning en artikelplaatsing in een pilot.
        - Verlaagde de gemiddelde picktijd met 14% en verminderde orderfouten.
      keywords:
        - Orderpicking
        - Lean
        - Data-analyse
        - Kwaliteit
