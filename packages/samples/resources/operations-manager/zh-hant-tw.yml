      startDate: '2021-03-01'
      summary: |
        - 參與中小企業營運診斷志工服務，協助在地店家建立營運指標與庫存管理流程。
        - 定期分享門市管理、客訴處理與流程改善實務，協助學員提升營運管理能力。

