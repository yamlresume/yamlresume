content:
  basics:
    name: 林雅婷
    headline: 營運經理｜跨部門流程優化與供應鏈管理
    phone: '+886 2 8765 4321'
    email: yating.lin@example.com
    url: https://yatinglin-ops.tw
    summary: |
      - 8 年以上零售與電商營運管理經驗，擅長從數據中找出流程瓶頸並推動跨部門改善。
      - 曾帶領 30 人以上營運團隊，負責門市、倉儲、客服與物流的日常管理與關鍵指標達成。
      - 熟悉預算規劃、供應鏈協調、標準作業流程建置與專案管理，能在快速變動環境中穩定交付成果。
      - 具備良好溝通與問題解決能力，致力於提升客戶滿意度與營運效率。

  location:
    address: 台北市信義區松高路 88 號 12 樓
    city: 台北市
    region: 信義區
    country: Taiwan
    postalCode: "110"

  profiles:
