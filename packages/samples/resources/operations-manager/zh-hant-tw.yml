        - 分享如何透過關鍵指標與每日檢視機制，提升門市營運透明度與問題反應速度。
        - 以零售與電商案例說明跨部門流程改善的推動方法與常見挑戰。

  projects:
    - name: 門市營運數位儀表板
      url: https://yatinglin-ops.tw/projects/ops-dashboard
      description: 整合門市銷售、庫存與客訴資料的營運管理儀表板。
      startDate: '2022-01-10'
      endDate: '2022-09-30'
      summary: |
        - 與資訊及資料團隊合作，定義營運關鍵指標與資料來源。
        - 建立每日自動更新機制，讓門市主管即時掌握來客數、客單價與缺貨率。
        - 上線後協助區域主管每週進行數據檢討，提升營運問題的反應速度。
      keywords:
        - 營運儀表板
        - 數據視覺化
        - 關鍵指標管理
        - 零售分析
    - name: 電商倉儲出貨流程優化
      url: https://yatinglin-ops.tw/projects/warehouse-flow
      description: 針對促銷期間出貨瓶頸進行流程重設與人力調度優化。
      startDate: '2019-03-01'
      endDate: '2019-12-31'
      summary: |
        - 分析訂單波動與揀貨動線，重新規劃尖峰時段的人力配置。
        - 建立出貨檢查清單與異常回報機制，降低出貨錯誤率。
        - 與物流夥伴協調配送時段，提升促銷期間訂單準時出貨比例。
      keywords:
        - 電商營運
        - 倉儲流程
        - 人力調度
        - 物流協調

