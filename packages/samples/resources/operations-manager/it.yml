content:
  basics:
    name: Lorenzo Bianchi
    headline: Responsabile Operativo | Logistica e Miglioramento Continuo
    phone: '+39 347 123 4567'
    email: lorenzo.bianchi@example.com
    url: https://www.lorenzobianchi.it
    summary: |
      - Responsabile Operativo con oltre 8 anni di esperienza nella gestione di processi logistici, produzione e filiera logistica in contesti industriali e retail.
      - Comprovata capacità di guidare team multidisciplinari, ridurre i costi operativi e migliorare l'efficienza attraverso metodologie Lean Six Sigma e decisioni basate sui dati.
      - Esperienza nella pianificazione della domanda, gestione dei fornitori, ottimizzazione delle scorte e implementazione di sistemi ERP e WMS.
      - Orientato ai risultati, con solide competenze nella gestione del cambiamento, nella negoziazione e nel miglioramento continuo.

  location:
    address: Via Torino 45
    city: Milano
    region: Lombardia
    country: Italy
    postalCode: '20123'

  profiles:
    - network: LinkedIn
      url: https://www.linkedin.com/in/lorenzo-bianchi-ops
      username: lorenzo-bianchi-ops
    - network: Medium
      url: https://medium.com/@lorenzobianchi
      username: lorenzobianchi

  education:
    - institution: Politecnico di Milano
      url: https://www.polimi.it/
      degree: Master
      area: Ingegneria Gestionale
      score: '108/110'
      startDate: 'Sep 2011'
      endDate: 'Jul 2013'
      courses:
        - Gestione della Produzione e dei Servizi
        - Logistica e Supply Chain Management
        - Sistemi Informativi Aziendali
        - Ricerca Operativa
        - Economia e Organizzazione Aziendale
        - Gestione dei Progetti
      summary: |
        - Approfondimento di modelli di pianificazione, controllo di gestione e operations management
        - Progetto di tesi sull'ottimizzazione dei flussi logistici in un'azienda manifatturiera
        - Partecipazione a laboratori su Lean Six Sigma e simulazione di processi produttivi
    - institution: Università di Bologna
      url: https://www.unibo.it/
      degree: Bachelor
      area: Ingegneria Industriale
      score: '105/110'
      startDate: 'Sep 2008'
      endDate: 'Jul 2011'
      courses:
        - Statistica
        - Ricerca Operativa
        - Tecnologie Meccaniche
        - Sistemi di Produzione
        - Economia Aziendale
      summary: |
        - Basi solide di analisi quantitativa e gestione industriale
        - Esperienza di tirocinio in un reparto di pianificazione della produzione
        - Sviluppo di competenze nella risoluzione di problemi e nel lavoro di squadra

  work:
    - name: Logistica Adriatica S.p.A.
      url: https://www.logisticaadriatica.it
      position: Responsabile Operativo
      startDate: 'Jan 2020'
      summary: |
        - Direzione di 4 responsabili di area e 45 operatori distribuiti su 3 magazzini, con gestione di un budget operativo annuo di 8 milioni di euro.
        - Riduzione del 18% dei costi di movimentazione e del 12% degli scarti tramite progetti Lean Six Sigma e riorganizzazione dei flussi.
        - Implementazione di un nuovo WMS integrato con SAP, con miglioramento della precisione delle scorte dal 92% al 98,5%.
        - Definizione di KPI settimanali su produttività, puntualità delle consegne e sicurezza, con reportistica Power BI per il management.
        - Coordinamento di fornitori di trasporto e logistica, con rinegoziazione dei contratti e riduzione del 9% delle tariffe.
      keywords:
        - Filiera logistica
        - Lean Six Sigma
        - WMS
        - SAP
        - KPI
        - Budget
        - Sicurezza
        - Negoziazione
    - name: Gruppo Meccanica Verona S.r.l.
      url: https://www.gruppomeccanicaverona.it
      position: Responsabile di Produzione
      startDate: 'Mar 2016'
      endDate: 'Dec 2019'
      summary: |
        - Gestione di 2 linee produttive e di un team di 28 persone, con pianificazione della domanda e della capacità produttiva.
        - Introduzione di cicli di pianificazione settimanale e strumenti di visual management, con aumento dell'OEE dal 68% al 78%.
        - Riduzione dei fermi macchina del 15% attraverso manutenzione preventiva e analisi delle cause profonde.
        - Collaborazione con ufficio acquisti e qualità per ridurre i reclami clienti del 20%.
      keywords:
        - Produzione
        - OEE
        - Manutenzione
        - Pianificazione
        - Qualità
        - Visual Management
        - Team
    - name: Retail Italia S.r.l.
      url: https://www.retailitalia.it
      position: Coordinatore Logistico
      startDate: 'Jun 2013'
      endDate: 'Feb 2016'
      summary: |
        - Gestione della distribuzione verso 120 punti vendita, con pianificazione delle rotte e ottimizzazione dei carichi.
        - Riduzione del 14% dei costi di trasporto tramite consolidamento delle spedizioni e accordi con vettori.
        - Implementazione di procedure di controllo inventariale e riduzione delle differenze di stock dal 3,2% all'1,1%.
      keywords:
        - Distribuzione
        - Trasporti
        - Inventario
        - Ottimizzazione
        - Retail

