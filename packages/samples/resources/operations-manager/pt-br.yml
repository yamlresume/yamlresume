    - name: Scrum Master Certified
      issuer: Scrum Alliance
      date: 'Mar 2022'
      url: https://www.scrumalliance.org/get-certified/scrum-master-track/certified-scrummaster
  publications:
    - name: Análise preditiva aplicada à gestão de estoques no varejo
      publisher: Revista Brasileira de Logística
      releaseDate: 'Aug 2022'
      url: https://www.revistabrasileiradelogistica.com.br/artigos/analise-preditiva-estoques
      summary: |
        - Estudo sobre o uso de modelos preditivos para melhorar a acuracidade de estoque
        - Discussão de impactos na redução de rupturas e no capital de giro
        - Apresentação de casos práticos em operações de distribuição
  projects:
    - name: Centro de Controle Logístico
      startDate: 'Jan 2022'
      endDate: 'Jul 2022'
      description: Projeto de centralização do monitoramento de entregas e indicadores
        operacionais.
      summary: |
        - Implantação de sala de controle com acompanhamento em tempo real das operações
        - Integração de dados de WMS, TMS e atendimento ao cliente
        - Redução de 12% no tempo de resposta a ocorrências logísticas
      keywords:
        - Logística
        - Controle operacional
        - KPIs
        - Integração de sistemas
    - name: Programa Lean na Distribuição
      startDate: 'Mar 2019'
      endDate: 'Nov 2019'
      description: Programa de melhoria contínua aplicado aos processos de separação e
        expedição.
      summary: |
        - Mapeamento de fluxo de valor e identificação de desperdícios
        - Implantação de padrões operacionais e rotinas de gestão à vista
        - Ganho de 20% em produtividade nas equipes de separação
      keywords:
        - Lean
        - Melhoria contínua
        - Produtividade
        - Gestão à vista
  interests:
