        - Desenvolvimento de talentos
    - name: Gestão de Projetos
      level: Advanced
      keywords:
        - PMBOK
        - Scrum
        - Melhoria contínua
        - Gestão de mudanças
  awards:
    - title: Prêmio de Excelência Operacional
      date: 'Nov 2023'
      awarder: LogiRota Soluções Logísticas
      summary: |
        Reconhecimento pela liderança do projeto de centralização do controle logístico, com ganho de 15% em produtividade e melhoria consistente no nível de serviço ao cliente.
    - title: Reconhecimento por Redução de Custos
      date: 'Dec 2020'
      awarder: Distribuidora Nova Era
      summary: |
        Premiação pelo resultado de redução de 22% no lead time de entrega e melhoria da acuracidade de estoque nas operações regionais.
  certificates:
    - name: Lean Six Sigma Green Belt
      issuer: ASQ
      date: 'Jun 2019'
      url: https://asq.org/cert/lean-six-sigma-green-belt
    - name: Certified Supply Chain Professional (CSCP)
      issuer: ASCM
      date: 'Sep 2020'
