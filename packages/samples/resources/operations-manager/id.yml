  awards:
    - title: Penghargaan Kinerja Terbaik
      date: '2022-12-01'
      awarder: PT Nusantara Retail Mandiri
      summary: |
        Diberikan kepada manajer operasional dengan pencapaian KPI tertinggi dan kontribusi signifikan terhadap efisiensi biaya regional.
    - title: Inisiatif Efisiensi Biaya
      date: '2019-08-01'
      awarder: PT Sentra Logistik Cepat
      summary: |
        Mengakui keberhasilan program pengurangan biaya distribusi melalui optimasi rute dan negosiasi vendor.
  certificates:
    - name: Sertifikasi Manajemen Rantai Pasok Profesional
      issuer: Asosiasi Logistik Indonesia
      date: '2020-03-01'
      url: https://www.asosiasilogistik.id/sertifikasi
    - name: Lean Six Sigma Green Belt
      issuer: Lembaga Produktivitas Nasional
      date: '2021-11-01'
      url: https://www.lpn.go.id/lean-six-sigma
    - name: Ahli K3 Umum
      issuer: Kementerian Ketenagakerjaan RI
      date: '2018-02-01'
      url: https://www.kemnaker.go.id
  publications:
    - name: Optimalisasi Persediaan dengan Analisis ABC dan Forecast Permintaan
      publisher: Majalah Logistik Indonesia
      releaseDate: '2023-04-01'
      url: https://www.majalahlogistik.id/artikel/optimalisasi-persediaan
      summary: |
        - Membahas pendekatan praktis untuk mengklasifikasikan persediaan berdasarkan nilai dan tingkat perputaran.
        - Menjelaskan integrasi forecast permintaan dengan analisis ABC untuk mengurangi biaya penyimpanan.
        - Studi kasus pada jaringan ritel regional dengan lebih dari 500 SKU.
  references:
    - name: Dewi Lestari
      email: dewi.lestari@nusantararetail.co.id
      phone: '+62 811 2233 4455'
      relationship: Atasan Langsung di PT Nusantara Retail Mandiri
      summary: |
        Rizky adalah manajer operasional yang berorientasi pada hasil dan mampu memimpin tim besar dengan jelas. Ia konsisten dalam mencapai target dan membangun proses yang lebih efisien.
    - name: Budi Santoso
      email: budi.santoso@sentralogistik.co.id
      phone: '+62 813 9988 7766'
      relationship: Mantan Atasan di PT Sentra Logistik Cepat
      summary: |
        Selama bekerja bersama, Rizky menunjukkan kemampuan analitis yang kuat dan komitmen tinggi terhadap perbaikan berkelanjutan. Ia layak dipercaya untuk peran kepemimpinan operasional.
  projects:
    - name: Transformasi Digital Operasional Gudang
      url: https://www.nusantararetail.co.id/proyek/digital-gudang
      description: Implementasi sistem WMS dan otomasi pelaporan KPI di 12 gudang regional.
      startDate: '2022-01-01'
      endDate: '2023-11-01'
      summary: |
        - Memimpin implementasi WMS untuk meningkatkan akurasi stok dan visibilitas persediaan.
        - Mengotomasi pelaporan KPI harian sehingga waktu pelaporan berkurang dari 4 jam menjadi 30 menit.
        - Melatih 80 staf gudang dan supervisor dalam penggunaan sistem baru.
      keywords:
        - WMS
        - Otomasi
        - KPI
        - Manajemen Perubahan
    - name: Program Pengurangan Biaya Logistik
      url: https://www.sentralogistik.co.id/program/efisiensi-biaya
      description: Inisiatif lintas fungsi untuk menurunkan biaya distribusi tanpa
        mengurangi kualitas layanan.
      startDate: '2019-03-01'
      endDate: '2020-12-01'
      summary: |
        - Menganalisis data pengiriman dan mengidentifikasi peluang konsolidasi rute.
        - Bernegosiasi dengan vendor transportasi untuk mendapatkan tarif yang lebih kompetitif.
        - Mencapai penghematan biaya logistik sebesar 12% dalam 18 bulan.
      keywords:
        - Efisiensi Biaya
        - Rute Distribusi
        - Negosiasi
        - Analisis Data
  interests:
    - name: Olahraga
      keywords:
        - Lari
