    - name: Automatisert månedsrapport for kredittportefølje
      url: https://www.nordlysbank.no/om-oss/rapportering
      description: Python-basert rapportløsning som samler kredittdata og nøkkeltall
      startDate: Feb 2019
      endDate: Nov 2020
      summary: |
        - Reduserte manuell rapporttid fra tre dager til fire timer
        - Sikret konsistent datakvalitet og sporbarhet i rapporteringen
        - Bygget dashboards for ledelsen i Power BI
      keywords:
