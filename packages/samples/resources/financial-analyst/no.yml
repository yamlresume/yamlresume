  publications:
    - name: Kredittrisiko i nordiske obligasjonsfond
      publisher: Nordisk tidsskrift for finans
      releaseDate: Nov 2018
      url: https://www.nordiskfinans.no/artikler/kredittrisiko-i-nordiske-obligasjonsfond
      summary: |
        - Analyserer hvordan likviditet og kredittspreader påvirker avkastning i nordiske obligasjonsfond
        - Funn tyder på at stresstester bør inkludere likviditetspremier i større grad
  projects:
    - name: ESG-risikomodell for nordiske aksjer
