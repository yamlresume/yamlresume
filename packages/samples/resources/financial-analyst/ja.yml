      description: '経営層と事業部門向けに、予算・実績・予測を一元管理するFP&Aダッシュボードを再構築'
      summary: |
        - 部門別の予算消化率、売上・利益の差異要因、キャッシュフロー予測を可視化
        - SQLによるデータ整備とPower BIによるレポート自動更新を設計
        - 経営会議の意思決定に必要な分析リードタイムを従来比で約50%短縮
      keywords:
