  publications:
    - name: L'impact des taux bas sur la valorisation des entreprises
      publisher: 'Revue Finance & Stratégie'
      releaseDate: 'Nov 2022'
      url: https://www.finance-strategie.fr/publications/taux-bas-valorisation
      summary: |
        - Analyse des effets persistants des taux d'intérêt bas sur les primes de risque et les multiples de valorisation
        - Étude de cas sur des entreprises européennes du secteur industriel
  projects:
    - name: Tableau de bord de pilotage budgétaire
      startDate: 'Jan 2022'
      endDate: 'Jun 2022'
      description: Conception d'un tableau de bord consolidé pour suivre le budget,
        les écarts et les prévisions de trésorerie.
      summary: |
        - Centralisation des données de trois entités dans un modèle unique
        - Automatisation des actualisations mensuelles avec Power Query et Power BI
        - Réduction du temps de préparation du reporting de 40 %
      keywords:
        - Pilotage budgétaire
        - Power BI
        - Automatisation
        - Prévisions
      url: https://www.axium-finance.fr/projets/tableau-bord
    - name: Modèle de valorisation d'une PME industrielle
      startDate: 'Mar 2021'
      endDate: 'Sep 2021'
      description: Construction d'un modèle DCF et d'une analyse par comparables pour
        préparer une opération de cession.
      summary: |
        - Élaboration de scénarios de croissance et de marges sur cinq ans
        - Analyse de sensibilité au coût du capital et au taux de croissance perpétuelle
        - Présentation des conclusions au comité d'investissement
      keywords:
        - Valorisation
        - DCF
        - Analyse de sensibilité
        - PME
      url: https://www.axium-finance.fr/projets/valorisation-pme
