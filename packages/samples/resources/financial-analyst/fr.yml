content:
  basics:
    name: Camille Moreau
    headline: Analyste financière senior spécialisée en valorisation et pilotage
      budgétaire
    phone: '+33 1 44 55 66 77'
    email: camille.moreau@example.fr
    url: https://www.camille-moreau.fr
    summary: |
      Analyste financière senior avec plus de 8 ans d'expérience en analyse de performance, modélisation financière et pilotage budgétaire. Solide expertise en valorisation d'entreprises, reporting consolidé et accompagnement des décisions d'investissement.

      - Élaboration de modèles financiers robustes (DCF, comparables, scénarios)
      - Analyse de rentabilité, de trésorerie et des risques financiers
      - Préparation de reportings destinés à la direction générale et aux investisseurs
      - Maîtrise d'Excel, Power BI, SQL et Python pour l'automatisation des analyses
  location:
    address: 24 rue de la Banque
    city: Paris
    region: Île-de-France
    country: France
    postalCode: '75002'
  profiles:
    - network: LinkedIn
      url: https://www.linkedin.com/in/camille-moreau-finance
      username: camille-moreau-finance
    - network: Twitter
      url: https://twitter.com/camillem_finance
      username: camillem_finance
  education:
    - institution: Université Paris-Dauphine
      url: https://dauphine.psl.eu/
      degree: Master
      area: Finance
      score: Mention Très Bien
      startDate: 'Sep 1, 2015'
      endDate: 'Jun 30, 2017'
      courses:
        - Finance de marché
