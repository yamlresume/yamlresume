  publications:
    - name: Dampak Suku Bunga terhadap Kinerja Sektor Perbankan Indonesia
      publisher: Jurnal Riset Keuangan Nusantara
      releaseDate: Jun 2022
      url: https://www.jrkn.ac.id/artikel/dampak-suku-bunga-perbankan
      summary: |
        - Menganalisis hubungan antara perubahan suku bunga acuan dan profitabilitas bank umum.
        - Menemukan bahwa kualitas kredit dan likuiditas memoderasi dampak suku bunga terhadap margin bunga bersih.
        - Memberikan rekomendasi kebijakan bagi manajemen risiko perbankan.
  projects:
    - name: Dasbor Pemantauan Kinerja Keuangan
      url: https://www.sentosa-kapital.co.id/proyek/dashboard-keuangan
      description: Dasbor internal untuk memantau KPI keuangan, arus kas, dan eksposur
        risiko portofolio.
      startDate: Jan 2023
      endDate: Aug 2023
      summary: |
        - Merancang metrik utama dan tata kelola data untuk dasbor manajemen.
        - Mengotomatiskan laporan bulanan menggunakan SQL, Python, dan Power BI.
        - Memangkas waktu penyusunan laporan dari 5 hari menjadi 1 hari.
      keywords:
        - Dasbor
        - Power BI
        - Otomasi Laporan
        - KPI Keuangan
        - Tata Kelola Data
    - name: Model Valuasi Sektor Energi Terbarukan
      url: https://www.sentosa-kapital.co.id/proyek/valuasi-energi
      description: Model valuasi untuk menilai peluang investasi di sektor energi
        terbarukan.
      startDate: Mar 2022
      endDate: Dec 2022
      summary: |
        - Membangun model DCF dan skenario sensitivitas harga listrik serta biaya modal.
        - Menyusun komparasi perusahaan dan analisis risiko regulasi.
        - Menyajikan rekomendasi investasi kepada komite investasi.
      keywords:
        - DCF
        - Energi Terbarukan
        - Analisis Skenario
        - Risiko Regulasi
        - Komite Investasi
