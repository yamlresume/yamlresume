      score: "3.85"
      startDate: Sep 1, 2014
      endDate: Jul 1, 2016
      courses:
        - Analisis Investasi
        - Manajemen Risiko Keuangan
        - Pasar Modal dan Portofolio
        - Akuntansi Manajemen Lanjutan
        - Ekonomi Moneter
      summary: |
        - Memperdalam teknik valuasi perusahaan, analisis risiko, dan strategi portofolio.
        - Menyelesaikan tesis tentang dampak suku bunga terhadap kinerja sektor perbankan.
    - institution: Universitas Nusantara Ekonomi
      url: https://www.une.ac.id
      degree: Bachelor
      area: Akuntansi
      score: "3.72"
      startDate: Sep 1, 2010
