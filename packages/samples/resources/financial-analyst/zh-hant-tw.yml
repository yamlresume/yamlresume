      publisher: 財務管理學刊
      releaseDate: Dec 2020
      url: https://www.twnfinancejournal.org/articles/2020-sme-cashflow
      summary: |
        - 探討中小企業現金流量管理對財務韌性與融資成本的影響。
        - 使用台灣上市櫃與中小企業資料進行迴歸分析，提出營運資金管理建議。

  projects:
    - name: 智慧預算編製平台
      startDate: Jan 2024
      endDate: Nov 2024
      url: https://www.hongyuancapital.com.tw/projects/budget-platform
      description: 整合預算編製、版本控管與差異分析的內部平台，協助財務團隊提升預測效率與資料透明度。
      summary: |
        - 設計預算資料模型與權限流程，支援多部門協作與版本追蹤。
        - 以 Power BI 建置預算執行儀表板，讓管理層即時掌握預算差異與現金流量狀況。
        - 將人工彙整流程自動化，降低重複作業與人為錯誤。
      keywords:
        - 預算自動化
        - 資料視覺化
        - 流程改善
    - name: 零售業信用風險儀表板
      startDate: Mar 2022
