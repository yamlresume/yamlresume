      url: https://www.twd-fintech.com.tw/projects/credit-dashboard
      description: 針對零售客戶建立信用風險監控儀表板，整合還款行為、額度使用與逾期指標。
      summary: |
        - 以 SQL 清理與整合客戶交易及還款資料，建立風險分群指標。
        - 設計逾期預警規則與視覺化報表，協助風險團隊優先處理高風險帳戶。
        - 與風險管理部門合作定義 KPI，提升監控頻率與決策反應速度。
