    name: 佐藤 健太
    headline: シニアビジネスアナリスト
    phone: '+81 90-1234-5678'
    email: kenta.sato@example.jp
    url: https://www.kenta-sato.jp
    summary: |
      6年以上の経験を持つビジネスアナリストとして、金融・製薬・小売業界の業務改革を支援。
      業務要件定義、現行業務の可視化、課題分析、改善施策の立案から実行までを一貫して担当。
      ステークホルダー間の合意形成を重視し、業務プロセス改善とシステム導入を橋渡しする。
      - 要件定義・業務設計・データ分析・プロジェクト推進を横断的に経験
      - エグゼクティブから現場担当者まで、多様な関係者との円滑なコミュニケーションを強みとする
      - データドリブンな意思決定を支援し、業務効率化と売上貢献に寄与
