      url: https://learn.microsoft.com/en-us/certifications/power-bi-data-analyst-associate/
  publications:
    - name: Gestão de requisitos em projetos de transformação digital
      publisher: Revista Brasileira de Gestão e Inovação
      releaseDate: Jun 2023
      url: https://www.revistabgi.com.br/artigos/gestao-de-requisitos-em-projetos-de-transformacao-digital
      summary: |
        - Artigo sobre práticas de levantamento, priorização e rastreabilidade de requisitos em iniciativas de transformação digital.
        - Discussão de indicadores de sucesso e lições aprendidas em projetos dos setores financeiro e de serviços.
  projects:
    - name: Mapeamento da Jornada do Cliente
      startDate: Apr 1, 2022
      endDate: Oct 30, 2022
      description: Redesenho da jornada de entrada de clientes, com pesquisa
        qualitativa, mapeamento de pontos de dor e priorização de melhorias.
      summary: |
        - Condução de entrevistas e oficinas com áreas de negócio, atendimento e tecnologia.
        - Mapeamento da jornada atual e proposição de melhorias com foco em autoatendimento e redução de etapas manuais.
        - Definição de indicadores de sucesso e acompanhamento dos resultados após a implantação.
      keywords:
        - Jornada do cliente
        - Desenho de serviços
        - BPMN
    - name: Painel Executivo de Indicadores
      startDate: Feb 1, 2023
      endDate: Jul 20, 2023
      description: Painel gerencial para acompanhamento de indicadores operacionais e
        financeiros, utilizado pela diretoria na tomada de decisão.
      summary: |
        - Levantamento de requisitos e definição de indicadores-chave junto às áreas de negócio.
        - Modelagem de dados em SQL e construção de visualizações no Power BI.
        - Documentação de regras de negócio e treinamento de usuários-chave.
      keywords:
        - Power BI
        - Indicadores-chave
        - SQL
        - Governança de dados
  interests:
