      publisher: Blog de Producto y Datos
      releaseDate: Mar 2024
      url: https://www.productoydatos.es/guias/moscow-requisitos
      summary: |
        - Artículo sobre técnicas de priorización de requisitos en proyectos con múltiples stakeholders.
        - Incluye criterios prácticos para equilibrar valor de negocio, esfuerzo técnico y riesgo.
  projects:
    - name: Rediseño del proceso de alta de clientes
      url: https://www.aurearetail.es/casos/alta-clientes
      description: Proyecto de transformación operativa para simplificar la
        contratación y mejorar la experiencia del cliente.
      startDate: Mar 2023
      endDate: Nov 2023
      summary: |
        - Mapeo del proceso actual y definición del proceso objetivo con negocio, operaciones y tecnología.
        - Especificación de requisitos funcionales, reglas de validación y criterios de aceptación.
        - Seguimiento de indicadores de adopción, tiempo de tramitación y satisfacción de usuarios internos.
      keywords:
        - BPMN
        - Power BI
        - Gestión del cambio
        - Experiencia de cliente
    - name: Cuadro de mando comercial omnicanal
      url: https://www.aurearetail.es/casos/cuadro-mando-omnicanal
      description: Solución de reporting para unificar métricas de ventas, tráfico y
        conversión en tienda y canal online.
      startDate: Jan 2022
      endDate: Dec 2022
      summary: |
        - Definición de KPIs y reglas de negocio junto a dirección comercial y equipos de datos.
        - Diseño de dashboards en Power BI para el seguimiento semanal de objetivos por canal y región.
        - Documentación de fuentes de datos, definiciones métricas y procesos de actualización.
      keywords:
        - Power BI
        - KPIs
        - Omnicanalidad
        - Modelo de datos
  interests:
