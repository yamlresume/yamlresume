      date: Dec 2023
      awarder: PT Bank Nusantara Digital
      summary: |
        Diberikan atas kontribusi dalam mempercepat peluncuran fitur kredit digital dan meningkatkan kolaborasi lintas fungsi.
    - title: Penghargaan Inovasi Proses
      date: Nov 2020
      awarder: PT Solusi Retail Indonesia
      summary: |
        Diakui karena merancang perbaikan alur inventori yang menurunkan waktu rekonsiliasi stok.
