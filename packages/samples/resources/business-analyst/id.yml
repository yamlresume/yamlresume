  publications:
    - name: Meningkatkan Efisiensi Proses Onboarding Nasabah Digital
      publisher: Jurnal Sistem Informasi Indonesia
      releaseDate: Apr 2023
      url: https://jurnal-sii.example.id/artikel/onboarding-digital
      summary: |
        - Membahas pemetaan proses dan identifikasi titik hambatan pada onboarding nasabah digital.
        - Menyoroti peran analis bisnis dalam menyelaraskan kebutuhan pengguna, kepatuhan, dan teknologi.
        - Memberikan rekomendasi prioritas perbaikan berbasis data operasional.
  projects:
    - name: Transformasi Proses Kredit Digital
      url: https://www.banknusantaradigital.co.id/proyek/kredit-digital
      description: Inisiatif untuk mempercepat proses pengajuan hingga persetujuan
        kredit nasabah digital.
      startDate: Jan 2022
      endDate: Nov 2022
      summary: |
        - Memetakan proses as-is dan to-be bersama tim produk, risiko, dan kepatuhan.
        - Menyusun user story dan kriteria penerimaan untuk fitur pengajuan kredit.
        - Mendukung UAT dan peluncuran bertahap dengan pemantauan metrik waktu proses.
      keywords:
        - Kredit Digital
        - BPMN
        - User Story
        - UAT
    - name: Dashboard Retensi Pelanggan
      url: https://www.solusiretail.co.id/proyek/dashboard-retensi
      description: Dashboard untuk memantau retensi pelanggan dan efektivitas program
        loyalitas.
      startDate: Mar 2020
      endDate: Oct 2020
      summary: |
        - Mendefinisikan KPI retensi dan segmentasi pelanggan bersama tim pemasaran.
        - Merancang kebutuhan data dan tata letak dashboard untuk pengguna manajerial.
        - Memvalidasi hasil analisis dengan tim operasional dan pemasaran.
      keywords:
        - Retensi
        - KPI
        - Power BI
        - Segmentasi
