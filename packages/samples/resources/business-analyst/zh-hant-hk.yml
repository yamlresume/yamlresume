        - Scrum
        - 瀑布模型
        - JIRA
        - Confluence
        - 風險管理
    - name: 工具
      level: Intermediate
      keywords:
        - Visio
        - Lucidchart
        - UML
        - BPMN
        - MS Project
        - Google Analytics
  languages:
    - language: Cantonese
      fluency: Native or Bilingual Proficiency
      keywords:
        - 母語
    - language: English
      fluency: Full Professional Proficiency
      keywords:
        - IELTS 7.5
        - 商業書寫
    - language: Mandarin
      fluency: Limited Working Proficiency
      keywords:
        - HSK 5
        - 基本會話
  awards:
    - title: 傑出員工獎
      awarder: 匯豐銀行
      date: Dec 2023
      summary: |
        表彰在數字化轉型項目中的卓越貢獻，成功提升客戶數據整合效率。
    - title: 院長嘉許名單
      awarder: 香港大學
      date: Jun 2017
      summary: |
        表揚學術成績優異，位列學院前10%。
  certificates:
    - name: 認證業務分析師 (CBAP)
      issuer: IIBA
      date: Nov 2022
      url: https://www.iiba.org/certification/cbap/
    - name: 敏捷分析認證 (IIBA-AAC)
      issuer: IIBA
      date: May 2021
      url: https://www.iiba.org/certification/agile-analysis/
    - name: Project Management Professional (PMP)
      issuer: PMI
      date: Aug 2020
      url: https://www.pmi.org/certifications/project-management-pmp
  publications:
    - name: 數據驅動的業務分析：香港金融業的實踐
      publisher: 香港資訊科技雜誌
      releaseDate: Mar 2023
      url: https://www.hkitjournal.com/data-driven-business-analysis
      summary: |
        探討如何利用數據分析提升業務決策效率，並分享香港金融業的實際案例。
  projects:
    - name: 客戶關係管理系統升級
      startDate: Jan 2023
      endDate: Dec 2023
      description: 為匯豐銀行零售銀行部門升級CRM系統，整合客戶數據並提升銷售效率。
      summary: |
        - 負責需求收集與業務流程分析，定義系統功能與用戶故事
        - 協調IT團隊與業務部門，確保系統按時交付
        - 設計UAT測試案例，培訓用戶，系統上線後客戶滿意度提升15%
      keywords:
        - CRM
        - Salesforce
        - 需求收集
        - UAT
    - name: 實時業務儀表板開發
      startDate: Mar 2022
      endDate: Sep 2022
      description: 為香港電訊建立實時業務績效儀表板，監控關鍵指標。
      summary: |
        - 使用Tableau和SQL開發儀表板，視覺化呈現銷售與運營數據
        - 與管理層合作定義KPI，確保儀表板滿足決策需求
        - 儀表板上線後，報告生成時間減少50%
      keywords:
        - Tableau
        - SQL
        - 數據可視化
        - KPI
  interests:
