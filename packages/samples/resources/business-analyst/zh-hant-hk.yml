content:
  basics:
    name: 陳偉明
    headline: 資深業務分析師 | 數據驅動決策與流程優化
    phone: "+852 9123 4567"
    email: chan.waiming@example.com
    url: https://www.linkedin.com/in/chanwaiming
    summary: |
      - 擁有超過6年業務分析經驗，專注於金融與電訊行業的數字化轉型
      - 擅長需求收集、業務流程建模、數據分析及利益相關者管理
      - 精通敏捷開發方法，熟練運用SQL、Tableau、Power BI等工具
      - 具備優秀的溝通與協調能力，能有效橋接業務與技術團隊
      - 持有CBAP、PMP及IIBA-AAC等專業認證
  location:
    address: 中環皇后大道中99號
    city: 香港
    region: 香港島
    country: Hong Kong
  profiles:
    - network: LinkedIn
      url: https://www.linkedin.com/in/chanwaiming
      username: chanwaiming
  education:
    - institution: 香港大學
      url: https://www.hku.hk
      degree: Bachelor
      area: 工商管理學士（資訊系統）
      score: "3.6/4.0"
      startDate: Sep 1, 2014
      endDate: Jun 30, 2018
      courses:
        - 商業分析
        - 資料庫管理
        - 系統分析與設計
        - 項目管理
        - 統計學
        - 財務會計
        - 市場營銷
        - 運營管理
      summary: |
        - 主修資訊系統，副修統計學，成績優異
        - 曾獲院長嘉許名單，並於畢業論文研究電子商務用戶行為
        - 積極參與商業案例競賽，獲得校內二等獎
  work:
    - name: 匯豐銀行
      url: https://www.hsbc.com.hk
      position: 高級業務分析師
      startDate: Mar 1, 2021
      summary: |
        - 領導零售銀行數字化轉型項目，負責需求收集與業務流程分析
        - 與IT團隊協作，將業務需求轉化為技術規格，確保交付符合預期
        - 主導CRM系統升級，提升客戶數據整合效率達30%
        - 建立實時業務儀表板，監控關鍵績效指標，輔助管理層決策
        - 指導初級分析師，推動團隊採用敏捷實踐
      keywords:
        - 需求收集
        - 流程改善
        - 數據分析
        - 敏捷開發
        - SQL
        - Tableau
        - 利益相關者管理
    - name: 香港電訊
      url: https://www.hkt.com
      position: 業務分析師
      startDate: Jul 1, 2018
      endDate: Feb 28, 2021
      summary: |
        - 負責電訊業務支撐系統的需求分析與流程優化
        - 使用BPMN和UML繪製業務流程圖，識別瓶頸並提出改善方案
        - 撰寫用戶故事與驗收標準，協調UAT測試，確保系統上線質量
        - 參與跨部門項目，成功將訂單處理時間縮短20%
      keywords:
        - 業務流程建模
        - BPMN
        - UML
        - 用戶故事
        - UAT
        - 流程優化
    - name: 香港交易所
      url: https://www.hkex.com.hk
      position: 業務分析實習生
      startDate: Jun 1, 2017
      endDate: Aug 31, 2017
      summary: |
        - 協助分析市場數據，製作每週交易報告
        - 參與需求研討會，記錄並整理業務需求
        - 支援團隊完成系統測試案例編寫
      keywords:
        - 數據分析
        - 報告製作
        - 需求整理
  skills:
    - name: 業務分析
      level: Expert
      keywords:
        - 需求收集
        - 流程改善
        - 差距分析
        - 利益相關者管理
        - 業務流程建模
        - 用戶故事
        - 驗收測試
    - name: 數據分析
      level: Advanced
      keywords:
        - SQL
        - Python
        - Tableau
        - Power BI
        - Excel
        - 統計分析
        - A/B測試
    - name: 項目管理
