        - Kimball
    - name: Streaming en messaging
      level: Advanced
      keywords:
        - Kafka
        - Kinesis
        - Event Hubs
    - name: Datagovernance
      level: Intermediate
      keywords:
        - Datakwaliteit
        - Lineage
        - AVG
        - Metadata
    - name: Programmeren
      level: Advanced
      keywords:
        - Python
        - Scala
        - Bash
        - Git

  languages:
    - language: Dutch
      fluency: Native or Bilingual Proficiency
    - language: English
      fluency: Full Professional Proficiency
      keywords:
        - Cambridge C1
        - Werktaal
    - language: German
      fluency: Limited Working Proficiency
      keywords:
        - Goethe B1
        - Leesvaardig

  awards:
    - title: Data Engineer of the Year
      awarder: Rabobank
      date: Dec 2023
      summary: |
        Erkend voor het ontwerpen van een schaalbaar en kostenefficiënt dataplatform dat meerdere teams binnen Risk & Compliance ondersteunt.

  certificates:
    - name: AWS Certified Data Analytics - Specialty
      issuer: Amazon Web Services
      date: Jun 2022
      url: https://aws.amazon.com/certification/
    - name: 'Microsoft Certified: Azure Data Engineer Associate'
      issuer: Microsoft
      date: Nov 2020
      url: https://learn.microsoft.com/en-us/certifications/azure-data-engineer/

  publications:
    - name: Schaalbare datapipelines in de cloud
      publisher: Data Magazine NL
      releaseDate: Mar 2022
      url: https://www.datamagazine.nl/artikelen/schaalbare-datapipelines
      summary: |
        - Praktijkartikel over het ontwerpen van betrouwbare en schaalbare datapipelines
        - Gaat in op orchestratie, datakwaliteit en kostenbeheersing in cloudomgevingen
        - Gebaseerd op ervaringen met AWS, Spark, Airflow en dbt

  projects:
    - name: EnergieDashboard
      url: https://github.com/sannedevries/energiedashboard
      description: Open-source dashboard voor het inzichtelijk maken van
        energieverbruik in Nederlandse wijken
      startDate: Jan 2023
      endDate: Jun 2023
      summary: |
        - Verzamelt en verwerkt openbare energie- en weerdata via API's
        - Pipeline gebouwd met Python, dbt en DuckDB, georkestreerd met Airflow
        - Dashboard in Streamlit voor bewoners en beleidsmakers
      keywords:
        - Open Data
        - Duurzaamheid
        - Python
        - Streamlit

  interests:
