      url: https://www.ithome.com.tw/
      summary: |
        - 探討湖倉架構在金融業資料整合與治理上的實務經驗。
        - 分享資料品質監控、血緣追蹤與成本優化策略。
  projects:
    - name: 即時風控資料管線
      url: https://github.com/yantinglin/realtime-risk-pipeline
      description: 支援金融交易風控的即時事件處理與特徵計算平台
      startDate: Jan 2022
      endDate: Dec 2023
      summary: |
        - 使用 Kafka、Spark Structured Streaming 與 Redis 建置毫秒級事件處理流程。
        - 設計可回溯的特徵版本管理與延遲監控，支援風控模型即時推論。
        - 將規則更新到上線的週期由兩週縮短至兩天。
      keywords:
        - Kafka
        - Spark
        - Redis
        - 風控
    - name: 資料品質監控平台
      url: https://github.com/yantinglin/data-quality-hub
      description: 集中管理資料品質規則、告警與健康度儀表板
      startDate: Mar 2021
      endDate: Oct 2022
      summary: |
        - 建立可配置的資料品質規則引擎，支援空值、重複、分布偏移與時效檢查。
        - 整合 Airflow 與 Prometheus，提供自動告警與 SLA 報表。
        - 覆蓋 150+ 核心資料表，協助團隊提前發現重大資料異常。
      keywords:
        - Data Quality
        - Airflow
        - Prometheus
        - Observability
