content:
  basics:
    name: 林彥廷
    headline: 資深資料工程師｜資料平台與即時資料管線
    phone: "+886 912 345 678"
    email: yanting.lin@dataops.tw
    url: https://www.yantinglin.dev
    summary: |
      - 具備 10 年以上資料與軟體工程經驗，其中 8 年專注於資料平台、ETL/ELT 與即時串流管線設計。
      - 熟悉 Python、SQL、Spark、Airflow、Kafka 與 dbt，能將複雜業務需求轉化為可維運的資料產品。
      - 具備雲端資料倉儲與湖倉架構實戰經驗，曾協助企業降低 40% 資料處理成本並提升資料交付效率。
      - 重視資料品質、可觀測性與跨團隊協作，樂於推動資料治理與工程最佳實踐。
  location:
    address: 信義區松仁路 88 號
    city: 臺北市
    region: 臺北市
    country: Taiwan
    postalCode: "110"
  profiles:
    - network: LinkedIn
      url: https://www.linkedin.com/in/yanting-lin-data
      username: yanting-lin-data
    - network: GitHub
      url: https://github.com/yantinglin
      username: yantinglin
  education:
    - institution: 國立臺灣大學
      url: https://www.ntu.edu.tw/
      degree: Master
      area: 資訊工程學系
      score: "3.9/4.0"
      startDate: Sep 2012
      endDate: Jul 2014
      courses:
        - 資料庫系統
        - 分散式系統
        - 資料探勘
        - 雲端計算
        - 大數據分析
        - 機器學習
      summary: |
        - 專注於分散式資料處理與資料庫系統研究，畢業論文探討即時串流查詢最佳化。
        - 擔任資料庫課程助教，協助學生理解關聯式與 NoSQL 資料模型。
        - 參與產學合作專案，建置校內研究資料交換平台。
    - institution: 國立清華大學
      url: https://www.nthu.edu.tw/
      degree: Bachelor
      area: 資訊工程學系
      score: "3.7/4.0"
      startDate: Sep 2008
      endDate: Jun 2012
      courses:
        - 資料結構
        - 演算法
        - 作業系統
        - 計算機網路
        - 軟體工程
      summary: |
        - 奠定程式設計、演算法與系統設計基礎。
        - 參與系學會資訊組，維護活動報名與資料統計系統。
  work:
    - name: 瀚宇金融科技股份有限公司
      position: 資深資料工程師
      startDate: Mar 2020
      summary: |
        - 主導企業級資料湖倉平台建置，整合 20+ 業務系統，支援每日 5 TB 以上批次與串流資料。
        - 設計以 Airflow、dbt 與 Spark 為核心的 ELT 流程，將資料交付週期由 3 天縮短至 4 小時。
        - 建立資料品質監控與告警機制，涵蓋完整性、即時性與一致性檢查，降低線上資料事故 60%。
        - 推動資料治理規範與指標字典，與資料分析、風控及產品團隊協作定義核心資料資產。
        - 帶領 4 人資料工程小組，負責技術選型、程式碼審查與初階工程師培育。
      keywords:
        - 資料湖倉
        - Apache Spark
        - Airflow
        - dbt
        - Kafka
        - 資料治理
    - name: 遠景電信數據股份有限公司
      position: 資料工程師
      startDate: Aug 2016
      endDate: Feb 2020
      summary: |
        - 建置電信用戶行為資料管線，處理每日百萬級事件資料並匯入雲端資料倉儲。
        - 使用 Python 與 SQL 開發批次 ETL 作業，支援行銷名單、流失預測與個人化推薦。
        - 導入 Kafka 與 Spark Streaming 處理即時流量資料，提供近即時營運儀表板。
        - 優化資料分割與查詢策略，降低 BigQuery 掃描量與月結成本約 35%。
        - 與資料科學家合作特徵工程流程，提升模型訓練資料準備效率。
      keywords:
        - Python
        - SQL
        - Kafka
        - Spark Streaming
        - BigQuery
        - ETL
    - name: 凌雲資訊服務股份有限公司
      position: 軟體工程師
      startDate: Jul 2014
      endDate: Jul 2016
      summary: |
        - 開發政府與企業資料交換系統，負責資料轉檔、排程與監控模組。
        - 使用 Java 與 Oracle 資料庫實作批次匯入流程，確保跨系統資料一致性。
        - 協助建立系統監控與錯誤重試機制，提升批次作業穩定度。
      keywords:
        - Java
        - Oracle
        - ETL
        - Shell
