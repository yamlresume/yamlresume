        - Agile/Scrum
  awards:
    - title: Premio Data Innovation
      awarder: Data Summit Italia
      date: Nov 2023
      summary: |
        Riconoscimento per il progetto di osservabilità delle pipeline dati che ha ridotto del 40% il tempo medio di risoluzione degli incidenti.
    - title: "Miglior Progetto Dati dell'Anno"
      awarder: Retail Analytics S.p.A.
      date: Dec 2020
      summary: |
        Premio interno per la realizzazione del data warehouse su BigQuery e delle dashboard self-service per il team commerciale.
  certificates:
    - name: AWS Certified Data Engineer - Associate
      issuer: Amazon Web Services
      date: Mar 2024
      url: https://aws.amazon.com/certification/certified-data-engineer-associate/
    - name: Google Professional Data Engineer
      issuer: Google Cloud
      date: Jun 2022
      url: https://cloud.google.com/learn/certification/data-engineer
    - name: dbt Analytics Engineering Certification
      issuer: dbt Labs
      date: Sep 2023
      url: https://www.getdbt.com/certifications/analytics-engineer/
  publications:
    - name: 'Pipeline dati affidabili: pattern di osservabilità per team analytics'
      publisher: Rivista Italiana di Data Engineering
      releaseDate: Apr 2023
      url: https://www.ridata.it/articoli/osservabilita-pipeline-dati
      summary: |
        - Articolo tecnico su metriche di qualità, monitoraggio e gestione degli incidenti nelle pipeline dati
        - Condivisione di pattern applicabili con Airflow, dbt e Great Expectations
        - Casi pratici tratti da contesti fintech e retail
  projects:
    - name: Data Quality Radar
      startDate: Jan 2023
      endDate: Jun 2023
      description: Framework open source per il monitoraggio della qualità dei dati
        nelle pipeline Airflow.
      url: https://github.com/lucabianchi-data/data-quality-radar
      summary: |
        - Progettazione di controlli di qualità riutilizzabili per tabelle Snowflake e BigQuery
        - Integrazione con Airflow per l'esecuzione schedulata e la notifica degli alert
        - Documentazione e rilascio su PyPI con oltre 300 download mensili
      keywords:
        - Data Quality
        - Great Expectations
        - Apache Airflow
        - Python
    - name: Self-Service Analytics Hub
      startDate: Mar 2021
      endDate: Nov 2022
      description: Piattaforma interna per l'accesso governato ai dati e la creazione
        di dashboard self-service.
      url: https://github.com/lucabianchi-data/analytics-hub
      summary: |
        - Modellazione di dataset certificati in dbt e Snowflake per i team business
        - Definizione di ruoli e permessi per l'accesso ai dati sensibili
        - Formazione di oltre 60 utenti su Looker e sulle best practice di analytics
      keywords:
        - Analytics
        - Looker
        - Snowflake
        - dbt
  interests:
