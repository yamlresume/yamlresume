content:
  basics:
    name: 陳家豪
    headline: 資深數據工程師
    phone: "+852 9123 4567"
    email: kaho.chan@example.com
    url: https://kahochan.dev
    summary: |
      資深數據工程師，擁有超過八年設計與建置現代數據平台嘅經驗，專注於即時數據管道、數據倉儲同雲端數據架構。擅長將複雜業務需求轉化為可擴展、可靠且易維護嘅數據解決方案。

      - 精通 Python、SQL、Spark 及 dbt，熟悉 Kafka、Airflow 同 Snowflake 等現代數據工具鏈
      - 曾領導跨職能團隊完成多個大型數據遷移及實時分析項目，平均延遲降低 40%
      - 重視數據品質、可觀測性同成本效益，致力推動數據治理最佳實踐
  location:
    address: 中環皇后大道中99號
    city: 香港
    region: 香港島
    country: Hong Kong
  profiles:
    - network: GitHub
      url: https://github.com/kahochan-data
      username: kahochan-data
    - network: LinkedIn
      url: https://www.linkedin.com/in/kahochan-data
      username: kahochan-data
  education:
    - institution: 香港科技大學
      url: https://www.ust.hk
      degree: Bachelor
      area: 計算機科學
      score: "3.7"
      startDate: Sep 1, 2012
      endDate: Jun 30, 2016
      courses:
