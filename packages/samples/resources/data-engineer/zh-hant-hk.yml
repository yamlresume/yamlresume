  projects:
    - name: 實時欺詐偵測管道
      url: https://github.com/kahochan-data/fraud-pipeline
      description: 基於 Kafka、Spark Structured Streaming 及 Redis 嘅實時欺詐偵測系統
      startDate: Jan 2023
      endDate: Aug 2023
      summary: |
        - 設計及實作每秒處理 5,000 筆交易嘅串流管道，端到端延遲低於 2 秒
        - 整合機器學習模型評分服務，實現自動化風險決策
        - 建立監控及告警機制，確保管道可用性達 99.9%
      keywords:
        - Kafka
        - Spark
        - Redis
        - 實時數據
    - name: 數據品質自動化框架
      url: https://github.com/kahochan-data/dq-framework
      description: 以 dbt 及 Great Expectations 為核心嘅數據品質測試框架
      startDate: Mar 2022
      endDate: Dec 2022
      summary: |
        - 提供宣告式數據品質規則，支援欄位級及表級驗證
        - 自動產生數據品質報告並整合至 CI/CD 流程
        - 於三個業務團隊推行，數據事故平均修復時間縮短 50%
      keywords:
        - dbt
        - Great Expectations
        - CI/CD
        - 數據品質
