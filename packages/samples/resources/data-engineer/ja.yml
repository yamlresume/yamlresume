  publications:
    - name: データ基盤の内製化におけるAirflow活用事例
      publisher: 技術評論社
      releaseDate: 2022-11-01
      url: https://gihyo.jp/article/data-platform-airflow
      summary: |
        - データ基盤の内製化を進める際のAirflow活用方法を解説
        - パイプライン設計、運用監視、チーム体制づくりに焦点
        - 実案件での課題と解決策を紹介
  projects:
    - name: 顧客360度データ基盤の構築
      url: https://www.dataforge.example.jp/case/customer360
      description: 顧客データを統合し、マーケティングとサービス改善を支援するデータ基盤
      startDate: 2022-01-01
      endDate: 2022-12-31
      summary: |
        - 複数システムの顧客データをSnowflakeに統合
        - dbtによるデータモデル整備と品質テストの自動化
        - BIツール向けのセマンティックレイヤーを設計
        - マーケティング部門と連携し、施策立案のリードタイムを短縮
      keywords:
        - 顧客データ
        - Snowflake
        - dbt
        - データモデリング
  interests:
    - name: オープンソース
      keywords:
        - Airflow
        - dbt
        - コミュニティ活動
    - name: 読書
      keywords:
        - 技術書
        - データアーキテクチャ
  volunteer:
    - organization: データエンジニア勉強会コミュニティ
      url: https://data-engineer-community.example.jp
      position: メンター
      startDate: 2020-01-01
      summary: |
        - データエンジニアを目指す参加者向けに勉強会やハンズオンを実施
        - キャリア相談や技術的な質問への回答を通じて成長を支援
        - コミュニティ運営にも携わり、継続的な学びの場を提供

