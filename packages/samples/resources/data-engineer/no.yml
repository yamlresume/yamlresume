      Dataingeniør med seks års erfaring fra å bygge skalerbare datapipelines, datavarehus og sanntidsløsninger. Sterk bakgrunn i Python, SQL, dbt, Airflow og skytjenester, med fokus på datakvalitet, automatisering og kostnadseffektivitet.

      - Utvikler og drifter satsvise og strømmende datapipelines for analyse og maskinlæring
      - Erfaren med modellering av datavarehus og datakontrakter i tverrfaglige team
      - Opptatt av robust dataobserverbarhet, dokumentasjon og kontinuerlig forbedring
