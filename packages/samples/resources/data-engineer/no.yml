        - Ledet utviklingen av en skybasert dataplattform på Azure for 40+ interne brukere
        - Designet og implementert satsvise og strømmende datapipelines med Python, Databricks og Airflow
        - Etablerte datakontrakter, datakvalitetstester og overvåking som reduserte dataincidenter med 45 %
