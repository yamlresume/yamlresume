      startDate: 'Jan 1, 2020'
      endDate: 'Aug 1, 2022'
      summary: |
        - Apoyé al equipo social en la limpieza y análisis de datos de programas de asistencia.
        - Automaticé informes mensuales en Power BI para facilitar la toma de decisiones.

