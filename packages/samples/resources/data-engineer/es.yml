  publications:
    - name: Diseño de pipelines de datos en tiempo real para analítica operativa
      publisher: Revista Española de Ingeniería de Datos
      releaseDate: 'Oct 2022'
      url: https://www.revista-ingenieria-datos.example.com/articulos/pipelines-tiempo-real
      summary: |
        - Artículo técnico sobre patrones de ingestión y procesamiento continuo con Kafka y Spark Structured Streaming.
        - Analiza estrategias de particionado, exactly-once y monitorización de latencia.
  projects:
    - name: Observatorio de Datos Abiertos
      url: https://github.com/luciafdez/observatorio-datos-abiertos
      description: Plataforma reproducible para ingerir, validar y publicar datasets
        abiertos de administraciones públicas.
      startDate: 'Jan 1, 2023'
      endDate: 'Jun 1, 2023'
      summary: |
        - Diseñé un pipeline con Airflow y dbt que ingesta datos de portales open data y genera tablas analíticas listas para consulta.
        - Implementé tests de calidad y documentación automática del linaje de datos.
        - Desplegué la solución en Google Cloud Run y BigQuery con costes controlados.
      keywords:
        - Open Data
        - Airflow
        - dbt
        - BigQuery
    - name: Motor de Recomendación para Retail
      url: https://github.com/luciafdez/retail-recommender
      description: Prototipo de motor de recomendación basado en datos transaccionales
        anonimizados.
      startDate: 'Mar 1, 2020'
      endDate: 'Nov 1, 2020'
      summary: |
        - Construí un pipeline de features con Spark y un modelo de filtrado colaborativo en Python.
        - Evalué el rendimiento con métricas de precisión y recall sobre un conjunto de validación temporal.
        - Documenté la arquitectura y los resultados en un informe técnico reproducible.
      keywords:
        - Spark
        - Python
        - Recomendación
        - Retail
  interests:
