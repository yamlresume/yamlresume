    - network: GitHub
      url: https://github.com/luciafdez
      username: luciafdez
  education:
    - institution: Universidad Politécnica de Madrid
      url: https://www.upm.es
      degree: Master
      area: Ciencia de Datos e Ingeniería de Datos
      score: '9.1'
      startDate: 'Sep 1, 2012'
      endDate: 'Jul 1, 2014'
      courses:
        - Arquitecturas de Datos Escalables
        - Procesamiento Distribuido
        - Minería de Datos
        - Bases de Datos Avanzadas
        - Aprendizaje Automático
      summary: |
        - Formación avanzada en diseño de sistemas de datos, analítica y aprendizaje automático.
        - Proyecto fin de máster centrado en la optimización de pipelines de ingestión en tiempo real.
    - institution: Universidad de Sevilla
      url: https://www.us.es
      degree: Bachelor
      area: Ingeniería Informática
      score: '8.7'
      startDate: 'Sep 1, 2008'
      endDate: 'Jun 1, 2012'
      courses:
