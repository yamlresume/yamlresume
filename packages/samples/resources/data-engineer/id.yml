  projects:
    - name: Pipeline Data Real-Time untuk Dashboard Operasional
      url: https://github.com/rizkypnugroho/realtime-ops-pipeline
      description: Membangun pipeline streaming untuk menyediakan metrik operasional
        near real-time bagi tim gudang dan logistik.
      startDate: Mar 1, 2023
      endDate: Sep 30, 2023
      summary: |
        - Mengintegrasikan Apache Kafka, Spark Structured Streaming, dan BigQuery untuk aliran data berlatensi rendah.
        - Menerapkan monitoring, alerting, dan idempotensi pipeline agar kualitas data tetap terjaga.
        - Menyusun runbook dan dokumentasi arsitektur untuk tim operasi data.
      keywords:
        - Apache Kafka
        - Spark Streaming
        - BigQuery
        - Observability
        - Kualitas Data
    - name: Modernisasi Data Warehouse Perusahaan Ritel
      url: https://github.com/rizkypnugroho/retail-dw-modernization
      description: Memodernisasi gudang data legacy menjadi model dimensional yang
        lebih skalabel dan mudah dipelihara.
      startDate: Jun 1, 2021
      endDate: Dec 31, 2021
      summary: |
        - Memigrasikan tabel legacy ke Snowflake dengan strategi cutover bertahap.
        - Membangun model dbt dan test kualitas data untuk dimensi pelanggan, produk, dan penjualan.
        - Mendokumentasikan lineage data dan metrik bisnis bersama tim analitik.
      keywords:
        - Snowflake
        - dbt
        - Data Warehouse
        - Data Modeling
        - Migrasi Data

