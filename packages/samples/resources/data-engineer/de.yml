  publications:
    - name: Skalierbare Echtzeit-Datenpipelines mit Kafka und Spark
      publisher: Datenbank-Spektrum
      releaseDate: 2021-11-01
      url: https://link.springer.com/journal/13222
      summary: |
        Fachartikel über Architekturmuster und Betriebserfahrungen mit Streaming-Datenpipelines in der Cloud.
  projects:
    - name: Echtzeit-Analyseplattform für IoT-Daten
      url: https://github.com/lukashoffmann/iot-analytics
      description: Aufbau einer skalierbaren Streaming-Plattform zur Verarbeitung von
        Sensordaten in Echtzeit.
      startDate: 2022-03-01
      endDate: 2023-06-30
      summary: |
        - Architektur und Implementierung einer Echtzeit-Pipeline mit Kafka, Spark Structured Streaming und AWS Kinesis
        - Verarbeitung von ca. 10.000 Ereignissen pro Sekunde mit Sub-Sekunden-Latenz
        - Aufbau eines Dashboards zur Visualisierung von Anomalien und Betriebskennzahlen
      keywords:
        - IoT
        - Kafka
        - Spark
        - AWS
        - Echtzeit
    - name: Open-Source Data Quality Framework
      url: https://github.com/lukashoffmann/dq-framework
      description: Entwicklung eines Python-Frameworks zur automatisierten
        Datenqualitätsprüfung in ETL-Pipelines.
      startDate: 2021-01-01
      summary: |
        - Open-Source-Bibliothek zur Definition und Ausführung von Datenqualitätsregeln in Python
        - Integration in Airflow und dbt zur automatischen Validierung von Pipeline-Ergebnissen
        - Über 200 Sterne auf GitHub und Nutzung durch mehrere Unternehmen
      keywords:
        - Python
        - Data Quality
        - Open Source
        - Airflow
  interests:
