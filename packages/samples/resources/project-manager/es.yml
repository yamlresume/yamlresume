      publisher: Revista de Dirección de Proyectos
      releaseDate: '2022-05-01'
      url: https://www.revistadeproyectos.es/guia-pmo-agil
      summary: |
        Artículo que describe un marco práctico para implantar una oficina de proyectos ágil en organizaciones medianas.
    - name: Métricas de valor en proyectos de transformación digital
      publisher: Congreso Internacional de Gestión de Proyectos
      releaseDate: '2021-10-15'
      url: https://www.congresoproyectos.org/metricas-valor
      summary: |
        Ponencia sobre indicadores clave para medir el retorno de inversión en iniciativas de transformación digital.
  projects:
    - name: Plataforma de Gestión de Proyectos Interna
      url: https://www.telefonicatech.com/proyectos/pm-tool
      startDate: '2022-01-10'
      endDate: '2022-12-20'
      description: Desarrollo de una herramienta interna para centralizar la gestión
        de proyectos y recursos.
      summary: |
        - Lideré el proyecto desde la definición de requisitos hasta el despliegue en producción.
        - Coordiné un equipo de 8 desarrolladores, 2 diseñadores y 1 analista de negocio.
        - Implementé integraciones con Jira y Power BI para la automatización de informes.
        - Reduje el tiempo de reporting semanal en un 60%.
      keywords:
        - Jira
        - Power BI
        - Gestión de proyectos
        - Automatización
    - name: Transformación Digital del Proceso de Onboarding
      url: https://www.santander.com/onboarding-digital
      startDate: '2020-03-01'
      endDate: '2021-01-31'
      description: Digitalización del proceso de incorporación de clientes para una
        entidad bancaria.
      summary: |
        - Dirigí la implementación de un flujo digital de onboarding con firma electrónica.
        - Reduje el tiempo de alta de clientes de 5 días a 2 horas.
        - Gestioné la coordinación entre equipos de negocio, IT, legal y cumplimiento normativo.
        - Aseguré el cumplimiento de la normativa KYC y GDPR.
      keywords:
        - Transformación digital
        - Banca
        - KYC
        - GDPR
        - Onboarding
