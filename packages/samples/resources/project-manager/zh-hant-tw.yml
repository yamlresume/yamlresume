content:
  basics:
    name: 陳昱翰
    headline: 資深專案經理 | 敏捷開發與跨部門協作
    phone: "+886 912 345 678"
    email: yuhan.chen@example.com
    url: https://www.yuhanchen-pm.com
    summary: |
      - 擁有 8 年以上軟體與數位產品專案管理經驗，擅長從需求訪談、範疇定義到交付驗收的完整生命週期。
      - 精通 Agile/Scrum 與 Waterfall 方法論，能依專案特性調整整體節奏與資源配置。
      - 具備跨部門溝通與利害關係人管理能力，成功協調工程、設計、行銷與營運團隊達成目標。
      - 數據驅動決策，熟悉 Jira、Confluence、Asana 與 Tableau，持續優化流程與交付品質。
  location:
    address: 台北市信義區松高路 1 號
    city: 台北市
    region: 台北市
    country: Taiwan
    postalCode: "110"
  profiles:
    - network: LinkedIn
      url: https://www.linkedin.com/in/yuhan-chen-pm
      username: yuhan-chen-pm
    - network: GitHub
      url: https://github.com/yuhanchen-pm
      username: yuhanchen-pm
  education:
    - institution: 國立臺灣大學
      url: https://www.ntu.edu.tw
      degree: Master
      area: 資訊管理學系
      score: "4.0"
      startDate: 2014-09-01
      endDate: 2016-06-30
      courses:
        - 專案管理
        - 資訊系統分析與設計
        - 資料庫管理
        - 企業流程再造
        - 敏捷軟體開發
      summary: |
        - 碩士論文以「敏捷式專案管理在台灣軟體產業之應用」為題，訪談 12 家企業。
        - 擔任資訊管理研究所學會會長，籌辦產學講座與企業參訪。
        - 獲選為管理學院優秀研究生，並取得斐陶斐榮譽會員資格。
  work:
    - name: 智邦科技股份有限公司
      url: https://www.accton.com.tw
      position: 資深專案經理
      startDate: 2021-03-01
      summary: |
        - 負責企業級網通軟體專案，管理 5 個跨功能團隊、共 40 位成員，年度專案預算達新台幣 8,000 萬元。
        - 導入 Scrum 與 Kanban 混合式管理，將版本交付週期由 12 週縮短至 8 週，提升 33% 交付效率。
        - 建立標準化風險管理流程，提前識別關鍵風險並制定緩解計畫，降低 25% 專案延遲率。
        - 主導與歐美客戶的季度業務審查，協調需求優先級與範疇變更，維持客戶滿意度 95% 以上。
        - 輔導 3 位初階專案經理取得 PMP 證照，建立內部專案管理知識庫。
      keywords:
        - 敏捷開發
        - 跨部門協作
        - 風險管理
        - 利害關係人溝通
        - 預算控管
    - name: 趨勢科技股份有限公司
      url: https://www.trendmicro.com
      position: 專案經理
      startDate: 2017-07-01
      endDate: 2021-02-28
      summary: |
        - 管理雲端安全產品專案，從需求確認、開發排程到全球發布，年均完成 6 個主要版本。
        - 與產品經理合作定義產品路線圖，將客戶回饋轉化為可執行的使用者故事與驗收條件。
        - 協調 QA、DevOps 與技術支援團隊，建立自動化測試與持續整合流程，減少 40% 回歸測試時間。
        - 每月向高階管理層彙報專案健康度、資源使用與里程碑達成率。
      keywords:
        - 雲端安全
        - 產品交付
        - 持續整合
        - 資源規劃
    - name: 資拓宏宇國際股份有限公司
      url: https://www.iisigroup.com
      position: 專案管理師
      startDate: 2016-07-01
      endDate: 2017-06-30
      summary: |
        - 參與政府資訊系統標案，負責需求訪談、規格書撰寫與專案進度追蹤。
        - 協助導入 Jira 與 Confluence，統一專案文件與問題追蹤流程。
        - 支援驗收測試與教育訓練，確保系統順利上線並移交維運團隊。
      keywords:
        - 政府標案
        - 需求分析
        - 文件管理
        - 驗收測試
