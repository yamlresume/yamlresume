  awards:
    - title: 年度最佳專案經理
      date: 2023-12-15
      awarder: 智邦科技股份有限公司
      summary: |
        表彰在企業級網通軟體專案中展現卓越領導力、風險管理與跨部門協調能力，並成功將交付週期縮短 33%。
    - title: 專案管理卓越獎
      date: 2020-11-20
      awarder: 趨勢科技股份有限公司
      summary: |
        肯定在雲端安全產品全球發布專案中的傑出表現，達成 100% 里程碑並維持客戶滿意度 95% 以上。
