      endDate: 2023-12-31
      summary: |
        - 擔任敏捷與專案管理課程志工講師，累計授課 30 場、學員超過 600 人。
        - 協助籌辦年度專案管理論壇，負責議程規劃與講者邀請。
        - 參與偏鄉資訊教育志工活動，指導高中生專題製作與簡報技巧。

