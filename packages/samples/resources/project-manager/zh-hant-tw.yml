  publications:
    - name: 敏捷式專案管理在台灣軟體產業之應用
      publisher: 國立臺灣大學資訊管理學系碩士論文
      releaseDate: 2016-06-30
      url: https://hdl.handle.net/11296/example
      summary: |
        - 探討敏捷式方法在台灣軟體公司的導入現況與挑戰。
        - 訪談 12 家企業、回收 180 份問卷，提出混合式管理框架。
        - 研究結果獲得多家受訪企業採用於內部流程改善。
  projects:
    - name: 企業級網通軟體交付平台
      url: https://www.accton.com.tw
      startDate: 2022-01-10
      endDate: 2023-08-31
      description: 整合需求管理、測試追蹤與版本發布的內部專案管理平台
      summary: |
        - 主導平台導入，涵蓋 5 個產品線、超過 40 位使用者。
        - 建立自動化儀表板，即時呈現專案健康度與資源負載。
        - 縮短 30% 專案狀態彙報時間，並提升資料透明度。
      keywords:
        - 專案管理平台
        - 數據視覺化
        - 流程自動化
    - name: 雲端安全產品全球發布專案
      url: https://www.trendmicro.com
      startDate: 2019-03-01
      endDate: 2020-12-31
      description: 面向全球企業客戶的雲端安全解決方案發布計畫
      summary: |
        - 協調台灣、美國、日本與印度團隊，完成 6 個主要版本發布。
        - 建立跨時區溝通機制，將決策週期縮短 20%。
        - 專案達成率 100%，客戶滿意度維持 95% 以上。
      keywords:
        - 全球發布
        - 跨時區協作
        - 雲端安全
