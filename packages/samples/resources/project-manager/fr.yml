      endDate: Nov 2019
      summary: |
        - Gestion du projet en méthode Scrum avec des sprints de 2 semaines
        - Collaboration étroite avec les équipes médicales et techniques
        - Obtention d'un taux de satisfaction utilisateur de 4,7/5
