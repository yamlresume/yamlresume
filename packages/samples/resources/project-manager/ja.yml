      startDate: Sep 1, 2019
      summary: |
        - 就職・転職を目指す若年層に対して、IT業界のキャリア相談と面接対策を月2回実施
        - プロジェクトマネジメント入門講座の講師を年4回担当し、延べ120名以上が受講
        - 協会の運営ボランティアとして、講座カリキュラムの見直しと改善提案を担当

