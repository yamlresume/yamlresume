    - network: Twitter
      url: https://twitter.com/kenichi_pm
      username: kenichi_pm
  education:
    - institution: 慶應義塾大学大学院
      url: https://www.keio.ac.jp/
      degree: Master
      area: 経営管理研究科 経営管理専攻（MBA）
      score: "3.8"
      startDate: Apr 1, 2010
      endDate: Mar 31, 2012
      courses:
        - プロジェクトマネジメント特論
        - オペレーションズ・マネジメント
        - 企業財務と投資評価
        - 組織行動論
        - 情報システム戦略
        - データ分析と意思決定
      summary: |
        - プロジェクトの ROI 評価とポートフォリオマネジメントを中心に研究
        - 修了研究では「IT投資プロジェクトの成功率を高めるガバナンス設計」をテーマに事例分析を実施
        - 社会人学生とのグループワークを通じ、部門横断のリーダーシップとファシリテーション力を習得
    - institution: 東京理科大学
      url: https://www.tus.ac.jp/
      degree: Bachelor
      area: 工学部 情報工学科
      score: "3.6"
      startDate: Apr 1, 2006
      endDate: Mar 31, 2010
      courses:
        - ソフトウェア工学
        - データベースシステム
        - アルゴリズムとデータ構造
        - オペレーティングシステム
        - ネットワーク工学
        - 経営情報システム
      summary: |
        - ソフトウェア開発の基礎とシステム設計の考え方を体系的に習得
        - 卒業研究として業務プロセス可視化ツールの設計・開発に取り組む
  work:
    - name: 株式会社ネクストソリューションズ
      url: https://www.next-solutions.example.com
      position: シニアプロジェクトマネージャー
      startDate: Apr 1, 2021
      summary: |
        - 金融・製造業向けの基幹システム刷新プロジェクトを同時に6件統括し、総額18億円の予算を管理
        - 見積り・WBS策定・進捗管理・課題管理のプロセスを標準化し、納期遵守率を82%から96%へ改善
        - 経営層向けの月次レポートとステアリングコミッティを運営し、意思決定のリードタイムを平均2週間短縮
        - 若手PM5名のメンタリングを担当し、社内PMOの育成プログラムを設計・運用
        - ベンダー選定と契約交渉を主導し、外部委託コストを年間約12%削減
      keywords:
        - プロジェクトマネジメント
        - 予算管理
        - ステークホルダー管理
        - PMO
        - リスク管理
    - name: 株式会社メディアクリエイト
      url: https://www.mediacreate.example.co.jp
      position: プロジェクトマネージャー
      startDate: Apr 1, 2017
      endDate: Mar 31, 2021
      summary: |
        - ECサイトのリニューアル案件を年間3〜4件、20名規模のチームで完遂
        - スクラムを導入し、スプリントレビューとレトロスペクティブを定着させてリリース頻度を月1回から隔週へ向上
        - 要件定義から受入テストまでを一貫して管理し、本番障害件数を前期比60%削減
        - 海外拠点のエンジニアと協働し、時差を考慮した開発プロセスとドキュメント運用を整備
        - 顧客満足度アンケートで3年連続「非常に満足」評価を獲得
      keywords:
        - スクラム
        - 要件定義
        - 品質保証
        - ベンダーマネジメント
    - name: 株式会社メディアクリエイト
      url: https://www.mediacreate.example.co.jp
      position: システムエンジニア / サブリーダー
      startDate: Apr 1, 2012
      endDate: Mar 31, 2017
      summary: |
        - 業務系Webアプリケーションの設計・開発・保守を担当し、Java と Oracle を用いた基盤構築を経験
        - 5名の開発チームのサブリーダーとして、タスク割当とコードレビューを実施
        - 運用保守フェーズの問い合わせ対応フローを整備し、一次対応時間を平均40%短縮
        - 新人エンジニア3名のOJTトレーナーを担当
      keywords:
        - Java
        - Oracle
        - 詳細設計
        - 保守運用
