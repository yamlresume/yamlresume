      url: https://www.pmi-japan.example.org/journal
      summary: |
        - ウォーターフォールとアジャイルを組み合わせた運用手法について、実案件のデータを基に考察
        - 大規模組織におけるガバナンス設計とステークホルダー合意形成の要点を整理
        - プロジェクト成功率を高めるための実践的なチェックリストを提示
  projects:
    - name: 基幹業務システムのクラウド移行プロジェクト
      url: https://www.next-solutions.example.com/cases/cloud-migration
      description: オンプレミスで運用していた基幹業務システムをAWSへ段階的に移行するプロジェクト
      startDate: May 1, 2022
      endDate: Oct 31, 2023
      summary: |
        - 総額6億円・関係者80名規模のプロジェクトを統括し、計画通りに本番稼働を完了
        - 移行リスクを洗い出して段階的なカットオーバー計画を策定し、本番障害ゼロを達成
        - 運用保守体制の内製化を推進し、インフラ運用コストを年間25%削減
      keywords:
