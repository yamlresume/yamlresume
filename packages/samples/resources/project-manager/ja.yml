  awards:
    - title: 年間最優秀プロジェクト賞
      awarder: 株式会社ネクストソリューションズ
      date: Dec 2022
      summary: |
        基幹システム刷新プロジェクトにおいて、予算内・予定通りでの完遂と顧客満足度の大幅な向上が評価され受賞。
    - title: 社長表彰（業務改善貢献）
      awarder: 株式会社メディアクリエイト
      date: Dec 2019
      summary: |
        アジャイル開発プロセスの全社展開を主導し、リリース頻度の向上と障害件数の削減に貢献した功績により受賞。
