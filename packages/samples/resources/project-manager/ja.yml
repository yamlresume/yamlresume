content:
  basics:
    name: 佐藤 健一
    headline: シニアプロジェクトマネージャー | ITシステム開発・DX推進
    phone: "+81 90-1234-5678"
    email: kenichi.sato@example.com
    url: https://kenichi-sato.example.com
    summary: |
      IT業界で12年以上の実務経験を持ち、そのうち7年間はプロジェクトマネージャーとして基幹系システムの企画・開発・刷新をリードしてきました。

      - ウォーターフォールとアジャイルの両手法に精通し、案件特性に応じたハイブリッド型マネジメントを実践
      - 最大50名規模の多国籍チームを統括し、予算・スケジュール・品質・リスクを一貫してマネジメント
      - 経営層と開発現場をつなぐ橋渡し役として、ステークホルダー間の合意形成と意思決定の迅速化を推進
      - PMBOKおよびスクラムのベストプラクティスを組み合わせ、継続的なプロセス改善とPM人材育成を主導
  location:
    address: 東京都渋谷区渋谷2-14-5 ネクサスビル8F
    city: 渋谷区
    region: 東京都
    country: Japan
    postalCode: "150-0002"
  profiles:
    - network: LinkedIn
      url: https://www.linkedin.com/in/kenichi-sato-pm
      username: kenichi-sato-pm
    - network: GitHub
      url: https://github.com/kenichisato-pm
