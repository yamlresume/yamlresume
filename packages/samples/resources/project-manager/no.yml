content:
  basics:
    name: Ingrid Solberg
    headline: Erfaren prosjektleder med lidenskap for smidig metodikk og verdiskapning
    phone: "+47 123 45 678"
    email: ingrid.solberg@example.no
    url: https://www.ingridsolberg.no
    summary: |
      - Prosjektleder med over 8 års erfaring fra teknologi- og energibransjen
      - Dokumentert suksess med å lede tverrfaglige team og levere prosjekter innen tid og budsjett
      - Sterk kompetanse innen smidige metoder (Scrum, Kanban) og tradisjonell prosjektstyring (PMBOK)
      - Strategisk tenker med fokus på kontinuerlig forbedring og bærekraftige løsninger
      - Gode kommunikasjons- og lederegenskaper, vant til å samarbeide med interessenter på alle nivåer
  location:
    address: Karl Johans gate 15
    city: Oslo
    region: Oslo
    country: Norway
    postalCode: "0150"
  profiles:
    - network: LinkedIn
      url: https://www.linkedin.com/in/ingridsolberg
      username: ingridsolberg
    - network: GitHub
      url: https://github.com/ingridsolberg
      username: ingridsolberg
    - network: Twitter
      url: https://twitter.com/ingridsolberg
      username: ingridsolberg
  education:
    - institution: Norges teknisk-naturvitenskapelige universitet (NTNU)
      url: https://www.ntnu.no/
      degree: Master
      area: Industriell økonomi og teknologiledelse
      score: "3.8"
      startDate: Aug 1, 2015
      endDate: Jun 30, 2017
      courses:
        - Prosjektledelse
        - Risikostyring
        - Smidig utvikling
        - Strategisk ledelse
        - Finansstyring
        - Forhandlingsteknikk
      summary: |
        - Spesialisering i prosjektledelse og innovasjonsledelse
        - Gjennomførte masteroppgave om smidig prosjektstyring i energisektoren
        - Verv som leder for studentorganisasjonen Prosjektforum
    - institution: Handelshøyskolen BI
