      fluency: Native or Bilingual Proficiency
      keywords:
        - Bahasa Ibu
    - language: English
      fluency: Full Professional Proficiency
      keywords:
        - TOEFL 110
        - IELTS 7.5
  awards:
    - title: Project Manager Terbaik
      awarder: PT Teknologi Maju
      date: Dec 2022
      summary: |
        Diberikan sebagai pengakuan atas kepemimpinan luar biasa dalam menyelesaikan proyek strategis perusahaan dengan hasil melebihi target.
    - title: Inovasi Proses Bisnis
      awarder: PT Digital Solusi
      date: Nov 2019
      summary: |
        Penghargaan atas kontribusi dalam merancang ulang proses manajemen proyek yang meningkatkan efisiensi tim sebesar 25%.
  certificates:
    - name: Project Management Professional (PMP)
      issuer: Project Management Institute
      date: Jun 2021
      url: https://www.pmi.org/certifications/project-management-pmp
    - name: Certified ScrumMaster (CSM)
      issuer: Scrum Alliance
      date: Mar 2019
      url: https://www.scrumalliance.org/certifications
  publications:
    - name: "Meningkatkan Keberhasilan Proyek TI melalui Kombinasi Agile dan
        Waterfall"
      publisher: Jurnal Manajemen Proyek Indonesia
      releaseDate: Aug 2020
      url: https://www.jmpi.id/artikel/agile-waterfall
      summary: |
        - Artikel ini membahas pendekatan hybrid dalam manajemen proyek teknologi informasi.
        - Menyajikan studi kasus dari beberapa proyek enterprise di Indonesia.
        - Memberikan rekomendasi praktis untuk manajer proyek dalam memilih metodologi yang tepat.
  projects:
    - name: Platform E-Commerce Terintegrasi
      url: https://www.teknologimaju.co.id/proyek/ecommerce
      description: Pengembangan platform e-commerce untuk perusahaan ritel besar di
        Indonesia
      startDate: Jan 2021
      endDate: Dec 2021
      summary: |
        - Memimpin tim berisi 15 orang dalam membangun platform e-commerce dari awal.
        - Mengimplementasikan arsitektur microservices dan integrasi dengan sistem pembayaran.
        - Mencapai waktu muat halaman di bawah 2 detik dan meningkatkan konversi penjualan sebesar 40%.
      keywords:
        - E-Commerce
        - Microservices
        - Agile
    - name: Sistem Informasi Rumah Sakit
      url: https://www.digitalsolusi.co.id/proyek/simrs
      description: Sistem manajemen rumah sakit untuk digitalisasi rekam medis dan
        operasional
      startDate: Mar 2018
      endDate: Nov 2019
      summary: |
        - Mengelola proyek pengembangan SIMRS untuk tiga rumah sakit di Jakarta.
        - Berkoordinasi dengan tenaga medis dan staf administrasi untuk mengumpulkan kebutuhan.
        - Sistem berhasil mengurangi waktu pemrosesan rekam medis hingga 50%.
      keywords:
        - Kesehatan
        - SIMRS
        - Waterfall
