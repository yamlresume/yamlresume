content:
  basics:
    name: Camille Laurent
    headline: Account Executive | Spécialiste de la vente SaaS B2B
    phone: "+33 6 12 34 56 78"
    email: camille.laurent@example.fr
    url: https://www.camillelaurent.fr
    summary: |
      - Account Executive avec plus de 5 ans d'expérience dans la vente de solutions SaaS B2B.
      - Expertise dans la gestion du cycle de vente complet, de la prospection à la signature.
      - Capacité à dépasser les objectifs : 150 % du quota atteint en 2023.
      - Passionné par la relation client et la construction de partenariats durables.
      - Maîtrise des outils CRM (Salesforce, HubSpot) et des méthodologies de vente (MEDDIC, SPIN).
  location:
    address: 45 rue de la Boétie
    city: Paris
    region: Île-de-France
    country: France
    postalCode: "75008"
  profiles:
    - network: LinkedIn
      url: https://www.linkedin.com/in/camillelaurent
      username: camillelaurent
    - network: Twitter
      url: https://twitter.com/camille_laurent
      username: camille_laurent
  education:
    - institution: Université Paris-Dauphine
      url: https://www.dauphine.psl.eu/
      degree: Master
      area: Management Commercial et Négociation
      score: Mention Très Bien
      startDate: Sep 1, 2017
      endDate: Jul 1, 2019
      courses:
        - Négociation commerciale avancée
        - Stratégie d'entreprise
        - Marketing B2B
        - Gestion de la relation client
        - Analyse financière
        - Droit des affaires
      summary: |
        - Formation d'excellence orientée vers la vente et la négociation.
        - Projets pratiques en partenariat avec des entreprises du CAC 40.
        - Mémoire sur l'optimisation du cycle de vente SaaS.
    - institution: Université Paris 1 Panthéon-Sorbonne
      url: https://www.pantheonsorbonne.fr/
      degree: Bachelor
      area: Économie et Gestion
      score: Mention Bien
      startDate: Sep 1, 2014
      endDate: Jun 1, 2017
      courses:
        - Microéconomie
        - Macroéconomie
        - Comptabilité
        - Statistiques
        - Marketing
        - Management
      summary: |
        - Solides bases en économie et gestion d'entreprise.
        - Engagement associatif au sein du bureau des étudiants.
        - Semestre d'échange à l'Université de Montréal.
  work:
    - name: Leaflow
      url: https://www.leaflow.fr
      position: Account Executive
      startDate: Jan 2, 2023
      summary: |
        - Gestion d'un portefeuille de 80 comptes PME/ETI avec un quota annuel de 1,2 M€.
        - Développement du territoire français par la prospection ciblée et les partenariats.
        - Négociation et closing de contrats SaaS complexes (cycle de vente de 3 à 6 mois).
        - Collaboration étroite avec les équipes marketing, produit et customer success.
        - Dépassement du quota à 150 % en 2023 et 120 % en 2024.
      keywords:
        - Prospection
        - Négociation
        - SaaS
        - CRM
        - Closing
    - name: Datavance
      url: https://www.datavance.fr
      position: Account Executive
      startDate: Mar 1, 2020
      endDate: Dec 31, 2022
      summary: |
        - Vente de solutions de data intelligence auprès de grands comptes (CAC 40).
        - Élaboration de stratégies de compte et gestion de cycles de vente longs (6 à 12 mois).
        - Atteinte de 110 % du quota en 2021 et 130 % en 2022.
        - Participation à la refonte du playbook commercial et formation des nouveaux arrivants.
      keywords:
        - Grands Comptes
        - Data
        - Méddic
        - Négociation
        - Prévisions
    - name: CloudNova
      url: https://www.cloudnova.fr
      position: Business Developer
      startDate: Sep 2, 2019
      endDate: Feb 28, 2020
      summary: |
        - Prospection téléphonique et digitale pour générer des opportunités qualifiées.
        - Organisation de démonstrations produit et suivi des leads jusqu'à la signature.
        - Contribution à l'augmentation de 40 % du pipeline commercial en 6 mois.
      keywords:
        - Prospection
        - Leads
        - Qualification
        - Salesforce
  skills:
    - name: Vente et Négociation
      level: Expert
      keywords:
        - Prospection
