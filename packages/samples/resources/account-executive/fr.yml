      awarder: Leaflow
      date: Jan 2024
      summary: |
        - Récompense pour avoir dépassé 150 % du quota annuel.
        - Génération de plus de 1,2 M€ de revenus nouveaux.
    - title: "Meilleur Vendeur de l'Année"
      awarder: Datavance
      date: Dec 2022
      summary: |
        - Classé n°1 sur 25 commerciaux.
        - Taux de satisfaction client de 98 %.
  certificates:
    - name: Salesforce Certified Sales Cloud Consultant
      issuer: Salesforce
      date: Mar 2021
