    - name: HubSpot Inbound Sales Certification
      issuer: HubSpot
      date: Jun 2020
      url: https://academy.hubspot.com/
  publications:
    - name: "Optimiser la prospection B2B à l'ère du numérique"
      publisher: Revue Française du Marketing
      releaseDate: Oct 2022
      url: https://www.revue-marketing.fr/
      summary: |
        - Article sur les stratégies de prospection multicanale.
        - Analyse de l'utilisation de l'IA pour qualifier les leads.
  projects:
    - name: Refonte du processus de vente
      description: Projet d'optimisation du cycle de vente pour réduire le temps de
        closing de 30 %.
      startDate: Jan 2023
      endDate: Jun 2023
      summary: |
        - Mise en place d'un nouveau playbook commercial.
        - Formation des équipes et intégration d'outils d'automatisation.
      keywords:
        - Processus
        - Vente
        - Automatisation
    - name: Programme de fidélisation client
      description: Lancement d'un programme d'upsell et de cross-sell pour les comptes
        stratégiques.
      startDate: Sep 2021
      endDate: Dec 2022
      summary: |
        - Augmentation du chiffre d'affaires de 25 % sur le portefeuille existant.
        - Déploiement d'une campagne de réengagement personnalisée.
      keywords:
        - Fidélisation
        - Upsell
        - Stratégie
