  awards:
    - title: Top Sales Enterprise 2023
      date: Dec 15, 2023
      awarder: SolusiNusa Teknologi
      summary: |
        Diberikan kepada Account Executive dengan pencapaian kuota tertinggi dan kontribusi pendapatan terbesar di segmen enterprise.
    - title: Best Account Executive Q3 2019
      date: Sep 30, 2019
