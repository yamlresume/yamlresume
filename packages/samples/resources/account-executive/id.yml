      url: https://www.bisnisdigital.id/artikel/consultative-selling-enterprise
      summary: |
        - Membahas pentingnya discovery mendalam dan pemetaan stakeholder dalam penjualan enterprise.
        - Memberikan kerangka praktis untuk meningkatkan win rate di pasar B2B Indonesia.

  projects:
    - name: Program Akselerasi Onboarding Klien Enterprise
      url: https://www.solusinusa.co.id/program-onboarding
      startDate: Jan 2023
      endDate: Jun 2023
      description: Program kolaboratif untuk mempercepat waktu onboarding klien
        enterprise dari 90 hari menjadi 45 hari.
      summary: |
        - Memimpin inisiatif lintas fungsi antara sales, product, dan customer success.
        - Menganalisis hambatan proses dan merancang playbook onboarding baru.
        - Hasil: waktu onboarding turun 50% dan skor kepuasan klien naik menjadi 4.8/5.
      keywords:
        - Onboarding
        - Customer Success
        - Playbook
        - Enterprise

