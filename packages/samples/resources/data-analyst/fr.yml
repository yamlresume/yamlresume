    - name: "Google Data Analytics"
      issuer: Google
      date: Nov 2021
      url: https://grow.google/intl/fr_fr/products/certificates/data-analytics/
  awards:
    - title: "Prix de l'innovation data"
      date: Dec 2023
      awarder: DataSquad Conseil
      summary: |
        - Récompensée pour la conception d'un outil interne de suivi automatisé de la qualité des données clients.
  projects:
    - name: "Tableau de bord des performances e-commerce"
      url: https://github.com/clairemoreau/ecommerce-dashboard
      description: "Projet personnel de création d'un tableau de bord interactif à
        partir de données e-commerce publiques."
      startDate: Jan 2024
      endDate: May 2024
      summary: |
        - Récupération et nettoyage de données de ventes avec Python et Pandas
        - Modélisation d'un schéma en étoile et chargement dans une base SQLite
        - Développement d'un rapport Power BI avec indicateurs de ventes, panier moyen et rétention client
      keywords:
        - Power BI
        - Pandas
        - SQLite
        - E-commerce
    - name: "Analyse des avis consommateurs"
      url: https://github.com/clairemoreau/sentiment-analysis
      description: "Analyse de sentiments appliquée aux avis consommateurs pour
        identifier les facteurs de satisfaction."
      startDate: Sep 2023
      endDate: Dec 2023
      summary: |
        - Collecte et prétraitement de plus de 50 000 avis en français
        - Utilisation de modèles de traitement du langage naturel : TF-IDF et régression logistique
        - Visualisation des thèmes émergents et formulation de recommandations d'amélioration produit
      keywords:
        - NLP
        - Python
        - Scikit-learn
        - Avis clients
  volunteer:
