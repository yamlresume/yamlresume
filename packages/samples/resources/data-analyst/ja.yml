      date: Dec 2022
      awarder: 株式会社インサイト
      summary: |
        購買データを用いた顧客離反予測モデルを提案し、社内のビジネスコンテストで最優秀賞を受賞。
  certificates:
    - name: 統計検定2級
      issuer: 日本統計学会
      date: Jun 2022
      url: https://www.toukei-kentei.jp/
    - name: Google Data Analytics Professional Certificate
      issuer: Google
      date: Mar 2021
      url: https://www.coursera.org/professional-certificates/google-data-analytics
  publications:
    - name: 'データドリブンマーケティングの実践: 小売業における顧客セグメント分析'
      publisher: 社内テクニカルレポート
      releaseDate: Nov 2023
      url: https://misaki-sato.dev/articles/data-driven-marketing
      summary: |
        小売業の購買データを活用した顧客セグメンテーションの実践手法をまとめた。RFM分析とクラスタリングを組み合わせたアプローチを紹介。
  projects:
    - name: EC売上予測ダッシュボード
      url: https://misaki-sato.dev/projects/ec-sales-forecast
      startDate: Jan 2023
      endDate: Jun 2023
      description: ECサイトの売上予測モデルと可視化ダッシュボードを開発。
      summary: |
        - 過去3年分の売上データを基に、季節性を考慮した予測モデルを構築
        - StreamlitとPlotlyを用いて、担当者が簡単に予測を確認できるダッシュボードを提供
        - 在庫計画やプロモーション効果の事前検証に貢献
      keywords:
        - Python
        - Streamlit
        - Plotly
        - 時系列分析
    - name: 顧客セグメンテーション分析
      url: https://misaki-sato.dev/projects/segmentation
      startDate: Apr 2022
      endDate: Sep 2022
      description: 購買履歴を基にした顧客セグメンテーションの分析プロジェクト。
      summary: |
        - RFM分析とk-meansクラスタリングを組み合わせて顧客を分類
        - セグメントごとの特徴を分析し、マーケティング施策の提案につなげた
        - リピート率向上に向けた施策の優先順位付けを支援
      keywords:
        - RFM分析
        - k-means
        - Tableau
        - マーケティング
  interests:
