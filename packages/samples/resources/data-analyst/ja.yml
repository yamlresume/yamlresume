        - 顧客セグメンテーション
        - A/Bテスト
    - name: 機械学習
      level: Intermediate
      keywords:
        - scikit-learn
        - 回帰分析
        - クラスタリング
        - 意思決定木
  languages:
    - language: Japanese
      fluency: Native or Bilingual Proficiency
      keywords:
        - 母国語
    - language: English
      fluency: Full Professional Proficiency
      keywords:
        - TOEIC 920
        - ビジネス文書作成
  awards:
