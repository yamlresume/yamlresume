content:
  basics:
    name: 佐藤美咲
    headline: データアナリスト | データ可視化・ビジネスインサイト
    phone: "080-1234-5678"
    email: misaki.sato@example.com
    url: https://misaki-sato.dev
    summary: |
      データに基づく意思決定を支援するデータアナリスト。小売・EC業界でSQL・Python・Tableauを駆使し、売上分析、顧客セグメンテーション、予測モデル構築などに従事。ビジネス課題を数値で可視化し、チームのKPI改善に貢献。統計・機械学習の知識を活かした実践的な分析に強みを持つ。
  location:
    address: 東京都渋谷区神南1-2-3
    city: 東京都
    region: 渋谷区
    country: Japan
    postalCode: "150-0001"
  profiles:
    - network: GitHub
      url: https://github.com/misaki-sato
      username: misaki-sato
    - network: LinkedIn
      url: https://www.linkedin.com/in/misaki-sato
      username: misaki-sato
  education:
    - institution: 東京大学
      url: https://www.u-tokyo.ac.jp/
      degree: Bachelor
      area: 経済学部 経済学科
      score: "3.7"
      startDate: Apr 1, 2017
      endDate: Mar 1, 2021
      courses:
        - 統計学
        - 計量経済学
        - データ解析基礎
        - プログラミング入門 (Python)
        - マーケティングリサーチ
      summary: |
        - 統計学・計量経済学を中心に、データ分析の基礎を学ぶ
        - 卒業論文では、POSデータを用いた購買行動分析を実施
        - 学外のデータ分析コンテストに参加し、可視化とプレゼンテーションを経験
  work:
    - name: 株式会社インサイト
      url: https://www.insight-example.co.jp
      position: データアナリスト
      startDate: Apr 1, 2021
      summary: |
        - 小売・EC事業の売上・在庫・顧客データを統合し、ダッシュボードを構築
        - SQL・Pythonによるデータ抽出・加工・分析を行い、週次・月次レポートを自動作成
        - 顧客セグメンテーション分析を実施し、マーケティング施策の効果検証を支援
        - Tableauを用いて経営陣向けのKPIダッシュボードを開発し、意思決定を支援
      keywords:
        - SQL
        - Python
        - Tableau
        - KPI分析
        - ダッシュボード
    - name: 株式会社ブライトリサーチ
      url: https://www.bright-research-example.co.jp
      position: リサーチアシスタント
      startDate: Jul 1, 2020
      endDate: Mar 1, 2021
      summary: |
        - 市場調査データのクリーニング・集計を担当
        - Excel・Rを用いた統計解析と結果の可視化を支援
        - 調査レポートの作成に協力し、クライアントへの提案を補助
      keywords:
        - Excel
        - R
        - 統計解析
        - 市場調査
  skills:
