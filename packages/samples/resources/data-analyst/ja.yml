        - ハンズオン
  volunteer:
    - organization: NPO法人 データ支援ネット
      url: https://www.data-support-npo.example.org
      position: データ分析ボランティア
      startDate: Apr 2022
      summary: |
        - 非営利団体向けに、アンケート集計や業務改善のためのデータ分析を支援
        - 事務局メンバー向けにExcelや可視化ツールの使い方研修を実施
