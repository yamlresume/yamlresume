  projects:
    - name: Modelo de detección de fraude en transacciones
      url: https://github.com/carlosmendez/fraud-detection
      description: Proyecto de machine learning para identificar transacciones
        fraudulentas en tiempo real utilizando datos sintéticos y técnicas de
        aprendizaje supervisado.
      startDate: Jan 2023
      endDate: May 2023
      summary: |
        - Implementé un pipeline completo de limpieza, ingeniería de características y entrenamiento con XGBoost.
        - Alcancé una precisión del 96 % y un AUC-ROC de 0,98 en el conjunto de prueba.
        - Desarrollé una API sencilla con FastAPI para servir las predicciones.
