  projects:
    - name: Churnvoorspelling telecomklanten
      url: https://github.com/sannevandenberg/churn-voorspelling
      description: Machine learning-model om klantverloop in de telecomsector te
        voorspellen en de belangrijkste risicofactoren te identificeren.
      startDate: Jan 1, 2023
      endDate: Apr 1, 2023
      summary: |
        - Bouwde een Random Forest-classificatiemodel in Python met scikit-learn
        - Verbeterde de voorspellingskracht met 18 procent ten opzichte van het bestaande model
        - Leverde een interactief Power BI-dashboard op met de belangrijkste KPI's en risicofactoren
      keywords:
