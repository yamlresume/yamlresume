content:
  basics:
    name: Sanne van den Berg
    headline: Data-analist met passie voor datagedreven besluitvorming
    phone: "+31 6 12345678"
    email: sanne.vandenberg@voorbeeld.nl
    url: https://www.linkedin.com/in/sannevandenberg
    summary: |
      Data-analist met ruim 9 jaar ervaring in het omzetten van ruwe data naar
      concrete inzichten voor financiële en commerciële teams. Ik combineer
      sterke technische vaardigheden in SQL, Python en Power BI met een
      gestructureerde, adviserende werkwijze.

      - Ontwikkel en beheer dashboards en datapijplijnen voor diverse stakeholders
      - Ervaren in A/B-testen, statistische analyses en datamodellering
      - Sterke focus op datakwaliteit, reproduceerbaarheid en heldere rapportage
      - Werk graag op het snijvlak van data, business en technologie
  location:
    address: Keizersgracht 123
    city: Amsterdam
    region: Noord-Holland
    country: Netherlands
    postalCode: "1016 CJ"
  profiles:
    - network: LinkedIn
      url: https://www.linkedin.com/in/sannevandenberg
      username: sannevandenberg
    - network: GitHub
      url: https://github.com/sannevandenberg
      username: sannevandenberg
  education:
    - institution: Vrije Universiteit Amsterdam
      url: https://www.vu.nl
      degree: Bachelor
      area: Econometrie en Operationele Research
      score: "7.8"
      startDate: Sep 1, 2011
      endDate: Jul 1, 2014
      courses:
        - Statistiek
        - Wiskundige economie
        - Operationele research
        - Econometrie
      summary: |
        - Afstudeerrichting toegepaste econometrie met nadruk op data-analyse en modellering
        - Scriptie over de voorspellende waarde van consumentenvertrouwen voor de detailhandel
    - institution: Universiteit van Amsterdam
      url: https://www.uva.nl
      degree: Master
      area: Data Science and Business Analytics
      score: "8.2"
      startDate: Sep 1, 2014
      endDate: Jul 1, 2016
      courses:
