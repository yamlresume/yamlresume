  projects:
    - name: Dashboard de Vendas Interativo
      url: https://github.com/beatrizcarvalho/dashboard-vendas
      description: Desenvolvimento de um dashboard em Power BI para acompanhamento de
        metas comerciais.
      startDate: Feb 2023
      endDate: Mar 2023
      summary: |
        - Modelei dados de vendas no Power Query e DAX.
        - Criei indicadores de receita, ticket médio e margem por região e
          categoria.
        - Publiquei o dashboard como portfólio de análise de dados.
      keywords:
        - Power BI
        - DAX
        - SQL
        - Vendas

    - name: Análise de Churn de Clientes
      url: https://github.com/beatrizcarvalho/churn-analysis
      description: Projeto de análise exploratória e predição de churn para uma base
        de clientes de telecomunicações.
      startDate: Nov 2022
      endDate: Dec 2022
      summary: |
        - Apliquei técnicas de análise exploratória e testes de hipóteses.
        - Construí modelo de regressão logística com scikit-learn.
        - Apresentei os principais fatores associados ao cancelamento de clientes.
      keywords:
        - Python
        - Pandas
        - scikit-learn
        - Churn

  volunteer:
