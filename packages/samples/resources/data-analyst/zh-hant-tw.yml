content:
  basics:
    name: 林怡君
    headline: 數據分析師｜商業智慧與資料視覺化
    phone: "+886 912 345 678"
    email: yichun.lin@datainsight.tw
    url: https://github.com/yichunlin-data
    summary: |
      具 5 年資料分析實務經驗，擅長從龐雜數據中挖掘商業洞見，並以視覺化工具協助決策。熟悉 SQL、Python 與 Tableau，曾主導客戶分群、流失預測與行銷成效分析專案，為企業提升營收與營運效率。具備跨部門溝通能力，能將分析結果轉化為具體行動方案。
  location:
