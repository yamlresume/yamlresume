      awarder: 台灣資料科學協會
      date: 2021-12-10
      summary: |
        與團隊以電商客戶流失預測模型參賽，在 200 餘隊中獲得第二名，並於成果發表會展示分析流程。
  projects:
    - name: 客戶流失預測模型
      url: https://github.com/yichunlin-data/churn-prediction
      description: 以電商訂單與會員互動資料建立流失預測模型，提供行銷團隊精準名單
      startDate: 2021-03-01
      endDate: 2021-08-31
      summary: |
        - 清理並整合 50 萬筆會員交易資料，設計 30 餘個特徵
        - 比較 Logistic Regression、Random Forest 與 XGBoost 模型，最終 AUC 達 0.87
        - 以 SHAP 解釋模型重要變數，並轉換為行動建議供行銷團隊使用
      keywords:
        - Python
        - Scikit-learn
        - XGBoost
        - SHAP
        - Feature Engineering
    - name: 即時銷售儀表板
      url: https://public.tableau.com/app/profile/yichunlin-data
      description: 串接 POS 系統資料，建立零售銷售即時監控儀表板
      startDate: 2022-10-01
      endDate: 2023-01-31
      summary: |
        - 使用 Tableau Prep 清理每日銷售資料，並以 Tableau 建立互動式儀表板
        - 提供店鋪、商品、時段等多維度分析視圖，協助營運團隊掌握銷售趨勢
      keywords:
        - Tableau
