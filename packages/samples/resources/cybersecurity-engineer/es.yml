      - Especializado en pentesting, análisis de vulnerabilidades y respuesta a incidentes, con certificaciones OSCP y CISSP.
      - Sólidos conocimientos en herramientas SIEM, firewalls y sistemas de detección de intrusiones.
      - Apasionado por la seguridad ofensiva y la formación de equipos, con habilidades de comunicación y trabajo en equipo.
