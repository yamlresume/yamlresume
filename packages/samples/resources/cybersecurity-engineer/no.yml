  projects:
    - name: Sanntids trusseldeteksjon for OT-nettverk
      url: https://github.com/siljebakken/ot-threat-detection
      description: Et åpent kildekode-prosjekt for å detektere unormal aktivitet i
        industrielle kontrollsystemer.
      startDate: Jan 2020
      endDate: Dec 2020
      summary: |
        - Utviklet en deteksjonsmotor basert på Python og Scapy for å analysere Modbus- og DNP3-trafikk.
        - Implementerte varsling til Slack og Microsoft Teams ved mistenkelig aktivitet.
        - Testet løsningen i et simulert OT-miljø med gode resultater.
