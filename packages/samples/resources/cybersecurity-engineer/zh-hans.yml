        - 参与等保 2.0 三级测评与整改，完成 60+ 项安全控制措施落地，顺利通过外部审计
        - 编写 Python 自动化脚本，实现漏洞扫描、资产梳理与报告生成，节省每周 10 小时人工成本
        - 组织季度安全意识培训与钓鱼演练，员工安全事件上报率提升 2 倍
      keywords:
        - SIEM
        - 等保 2.0
        - ELK
        - Python
        - 威胁检测
        - 安全意识
