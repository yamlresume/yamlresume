        - 主导红蓝对抗与攻防演练，优化检测规则 300+ 条，将高危事件平均响应时间缩短 45%
        - 推动 DevSecOps 建设，将 SAST、DAST、SCA 集成至 CI/CD 流水线，上线前漏洞修复率提升至 95%
        - 建立安全运营中心（SOC）指标体系，定期输出威胁情报与风险报告，支撑管理层决策
        - 指导 5 人安全团队，制定培训与演练计划，提升团队渗透测试与应急响应能力
