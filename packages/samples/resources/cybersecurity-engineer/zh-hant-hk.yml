        - PCI DSS
        - NIST CSF
        - 零信任
        - 安全政策
  awards:
    - title: 網絡安全卓越獎
      date: Mar 2023
      awarder: 香港金融科技協會
      summary: |
        表揚在金融雲端安全轉型及事故應變流程優化上的突出貢獻。
    - title: 年度最佳安全項目
      date: Nov 2020
      awarder: 駿達零售集團
      summary: |
        表彰在支付系統弱點管理及 ISO 27001 認證準備中的卓越表現。
  certificates:
    - name: CISSP
      issuer: ISC2
      date: Aug 2022
