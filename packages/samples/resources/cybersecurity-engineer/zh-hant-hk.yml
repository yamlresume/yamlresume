  publications:
    - name: 雲端原生環境的零信任存取實踐
      publisher: 香港資訊安全期刊
      releaseDate: Jun 2023
      url: https://www.hksecurityjournal.com/articles/zero-trust-cloud
      summary: |
        - 探討零信任架構在混合雲環境的落地方法
        - 分享身份治理、微分段與持續驗證的實務經驗
  projects:
    - name: 企業零信任轉型計劃
      url: https://www.chanhk-security.com/projects/zero-trust
      description: 為跨國金融機構設計及實施零信任安全架構
      startDate: Jan 2022
      endDate: Dec 2023
      summary: |
        - 重新設計身份驗證與存取控制流程，覆蓋 3,000 名員工及 200 個應用系統
        - 導入微分段及持續風險評估，降低橫向移動風險
        - 與 IT 及合規團隊協作，確保符合監管要求
      keywords:
        - 零信任
        - 身份治理
        - 微分段
        - 合規
    - name: 自動化弱點管理平台
      url: https://www.chanhk-security.com/projects/vuln-management
      description: 整合掃描、風險評分與修復追蹤的自動化平台
      startDate: Mar 2021
      endDate: Oct 2021
      summary: |
        - 以 Python 串接 Nessus 與 Jira，自動建立修復工單
        - 建立風險導向評分模型，協助團隊優先處理高風險漏洞
        - 將平均修復週期由 45 天縮短至 18 天
      keywords:
        - Python
        - Nessus
        - Jira
        - 自動化
        - 風險評分
