    - name: Phishingdetectieplatform
      startDate: '2021-02-01'
      endDate: '2021-12-31'
      url: https://github.com/sannevandijk/phishing-detection-platform
      description: Platform dat e-mailheaders, URL-reputatie en gebruikersmeldingen
        combineert om phishing sneller te detecteren.
      summary: |
        - Verwerkte dagelijks meer dan 50.000 e-mails en reduceerde valse positieven met 27%.
        - Integreerde automatische verrijking met dreigingsinformatie en SOAR-playbooks.
