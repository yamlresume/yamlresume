  education:
    - institution: Université Paris-Dauphine
      url: https://www.dauphine.psl.eu/
      degree: Master
      area: Management et Stratégie d'Entreprise
      score: Mention Bien
      startDate: Sep 1, 2014
      endDate: Jun 30, 2016
      courses:
        - Stratégie d'entreprise
        - Marketing B2B
        - Négociation commerciale
        - Gestion de la relation client
        - Analyse financière
      summary: |
        - Formation spécialisée en management et stratégie, avec un focus sur la relation client et le développement commercial.
        - Projet de fin d'études sur l'optimisation de l'expérience client dans le secteur SaaS.
    - institution: Université Paris 1 Panthéon-Sorbonne
      url: https://www.pantheonsorbonne.fr/
      degree: Bachelor
      area: Économie et Gestion
      score: Mention Assez Bien
      startDate: Sep 1, 2011
      endDate: Jun 30, 2014
