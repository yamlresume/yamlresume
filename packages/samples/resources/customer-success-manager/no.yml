      awarder: Visma
      date: '2023-12-15'
      summary: |
        Tildelt for eksepsjonell innsats med å øke kundetilfredshet og opprettholdelse i et krevende marked.
  certificates:
    - name: Certified Customer Success Manager (CCSM)
      url: https://www.successcoaching.com/certification
      issuer: SuccessCoaching
      date: '2022-05-20'
    - name: Salesforce Certified Administrator
      url: https://trailhead.salesforce.com
      issuer: Salesforce
      date: '2021-10-10'
  publications:
    - publisher: Magma – Tidsskrift for økonomi og ledelse
      url: https://www.magma.no
      name: Hvordan bruke kundedata til å drive lønnsom vekst
      releaseDate: '2023-04-15'
      summary: |
        - Artikkelen utforsker hvordan SaaS-selskaper kan bruke kundedata for å forbedre opprettholdelse og øke omsetning.
        - Presenterer en modell for proaktiv kundeoppfølging basert på helsescore og bruksmønstre.
  projects:
    - name: Kundehelse-dashboard
      url: https://www.ingridsolberg.no/prosjekter/kundehelse
      description: Utviklet et dashboard for å visualisere kundehelse og identifisere
        churn-risiko i sanntid.
      startDate: '2022-09-01'
      endDate: '2023-02-28'
      summary: |
        - Integrerte data fra Salesforce og produktbruk for å lage en helhetlig kundehelsescore
        - Automatiserte varsler til kundesuksessansvarlige ved fall i engasjement
        - Reduserte tiden brukt på manuell rapportering med 60 %
      keywords:
        - Dashboard
        - Kundehelse
        - Automatisering
    - name: Onboarding 2.0
      url: https://www.ingridsolberg.no/prosjekter/onboarding
      description: Redesignet onboardingprogrammet for nye kunder for å øke tid-til-verdi.
      startDate: '2021-06-01'
      endDate: '2022-01-31'
      summary: |
        - Kartla kundereisen og identifiserte flaskehalser i implementeringsfasen
        - Utviklet nye maler, sjekklister og opplæringsvideoer
        - Kortet ned gjennomsnittlig onboardingtid fra 45 til 28 dager
      keywords:
        - Onboarding
        - Prosessforbedring
        - Tid-til-verdi
  interests:
    - name: Friluftsliv
      keywords:
        - Fjellturer
        - Ski
        - Kajakk
    - name: Samfunn
      keywords:
