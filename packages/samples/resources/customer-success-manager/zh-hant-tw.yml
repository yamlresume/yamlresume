        - 心理學
  volunteer:
    - organization: 台灣偏鄉教育發展協會
      url: https://www.ruraledu.tw
      position: 志工講師
      startDate: Sep 2019
      endDate: Jun 2023
      summary: |
        - 每月前往偏鄉國小教授商業基礎與職涯探索課程，累計服務 200+ 小時
        - 設計互動式教案，提升學生學習動機與自信心
        - 協助協會舉辦年度營隊，招募並培訓 30 位大專院校志工
  references:
    - name: 王大明
      relationship: 雲端脈動科技股份有限公司 營運副總
      email: ming.wang@cloudpulse.tw
      phone: "+886 2 1234 5678"
      summary: |
        林雅婷在客戶成功領域表現卓越，具備數據驅動思維與卓越的溝通能力，能有效帶領團隊達成目標，是難得的人才。

