content:
  basics:
    name: 林雅婷
    headline: 資深客戶成功經理 | 專注於 SaaS 與企業軟體
    phone: "+886 912 345 678"
    email: yating.lin@gmail.com
    url: https://www.linkedin.com/in/yatinglin
    summary: |
      具備 6 年以上客戶成功與帳戶管理經驗，專精於 SaaS 與企業軟體產業。擅長透過數據驅動策略提升客戶續約率、擴展收入與滿意度，並帶領團隊達成組織目標。

      - 管理超過 30 家中大型企業客戶，年度續約率維持 95% 以上，淨收入留存率 (NRR) 達 118%
      - 建立客戶健康度評分模型與主動關懷流程，成功降低客戶流失風險 40%
      - 領導 5 人客戶成功團隊，制定 onboarding 標準作業程序，縮短新客戶上線時間 35%
      - 熟悉 Salesforce、HubSpot、Tableau 等工具，具備 SQL 與數據分析能力
      - 卓越的跨部門溝通與談判技巧，能有效協調產品、工程與業務團隊
  location:
    address: 台北市信義區松高路 88 號 12 樓
    city: 台北市
    region: 信義區
    country: Taiwan
    postalCode: "110"
  profiles:
    - network: LinkedIn
      url: https://www.linkedin.com/in/yatinglin
      username: yatinglin
    - network: GitHub
      url: https://github.com/yatinglin
      username: yatinglin
    - network: Medium
      url: https://medium.com/@yatinglin
      username: yatinglin
  education:
    - institution: 國立臺灣大學
      url: https://www.ntu.edu.tw/
      degree: Bachelor
      area: 企業管理學系
      score: "3.9/4.3"
      startDate: Sep 1, 2014
      endDate: Jun 30, 2018
      courses:
        - 行銷管理
        - 消費者行為
        - 策略管理
        - 人力資源管理
        - 財務管理
        - 商業分析
        - 專案管理
        - 談判理論
      summary: |
        - 主修企業管理，輔修資訊管理，奠定商業策略與數據分析基礎
        - 擔任系學會公關長，籌辦多場企業參訪與講座，提升溝通與協調能力
        - 畢業專題「以客戶旅程地圖優化 SaaS onboarding 流程」獲教授推薦
  work:
    - name: 雲端脈動科技股份有限公司
      url: https://www.cloudpulse.tw
      position: 資深客戶成功經理
      startDate: Jan 1, 2022
      summary: |
        - 負責管理 30+ 家中大型企業客戶，年度續約率維持 95% 以上，淨收入留存率 (NRR) 達 118%
        - 領導 5 人客戶成功團隊，制定客戶健康度評分模型與主動關懷流程，降低流失風險 40%
        - 與產品團隊協作，根據客戶回饋推動 12 項功能優化，提升客戶滿意度 (CSAT) 至 4.8/5.0
        - 建立客戶成功手冊與 onboarding 標準作業程序，將新客戶上線時間縮短 35%
        - 定期舉辦客戶成功工作坊與用戶社群活動，促進客戶間交流與產品採用
      keywords:
        - 客戶關係管理
        - 續約策略
        - 數據分析
        - 團隊領導
        - SaaS
    - name: 智創軟體服務有限公司
      url: https://www.smartsoft.com.tw
      position: 客戶成功經理
      startDate: Jul 1, 2018
      endDate: Dec 31, 2021
      summary: |
        - 管理 50+ 家中小企業客戶，負責產品導入、教育訓練與日常諮詢，客戶續約率達 90%
        - 導入 CRM 系統 (Salesforce) 並優化客戶歷程追蹤，提升團隊工作效率 25%
        - 分析客戶使用數據，主動識別潛在流失客戶並制定挽回計畫，成功挽回 15% 即將流失客戶
        - 擔任客戶與產品部門之間的橋樑，每季彙整客戶需求並優先級排序，協助產品路線圖規劃
        - 獲得 2020 年度最佳客戶成功經理獎項，表彰卓越客戶服務與跨部門協作
      keywords:
        - 客戶導入
        - 教育訓練
        - Salesforce
        - 客戶留存
        - 跨部門溝通
  skills:
    - name: 客戶成功與關係管理
      level: Expert
      keywords:
        - 客戶生命週期管理
        - 續約與擴展
        - 客戶健康度分析
        - 淨推薦值 (NPS)
        - 客戶滿意度 (CSAT)
        - QBR 規劃
    - name: 數據分析與工具
      level: Advanced
      keywords:
        - Salesforce
        - HubSpot
        - Tableau
        - Excel
        - SQL
        - Google Analytics
    - name: 專案與團隊管理
      level: Advanced
      keywords:
        - 敏捷開發
        - Jira
        - Confluence
        - 跨部門協作
        - 團隊領導
        - 簡報技巧
    - name: 語言與溝通
      level: Expert
      keywords:
        - 中文 (母語)
        - 英文 (專業)
        - 談判
        - 客戶簡報
        - 衝突解決
  languages:
    - language: Chinese
      fluency: Native or Bilingual Proficiency
      keywords:
        - 繁體中文
        - 台語
    - language: English
      fluency: Full Professional Proficiency
      keywords:
        - TOEIC 950
        - 商業書信
        - 國際客戶溝通
  awards:
    - title: 年度最佳客戶成功經理
      date: Dec 2020
      awarder: 智創軟體服務有限公司
      summary: |
        表彰在客戶續約率、客戶滿意度及跨部門協作方面的卓越表現，全年客戶留存率達 92%，為團隊最高。
    - title: 卓越服務獎
      date: Jun 2023
      awarder: 雲端脈動科技股份有限公司
      summary: |
        因成功輔導三家大型企業客戶完成數位轉型，客戶 NPS 達 75 分，獲公司季度卓越服務獎。
  certificates:
    - name: Salesforce 認證管理員
      issuer: Salesforce
      date: Mar 2021
      url: https://trailhead.salesforce.com/en/credentials/administrator
    - name: Google 數據分析專業認證
      issuer: Google
      date: Aug 2022
      url: https://grow.google/certificates/data-analytics/
    - name: 專案管理專業人士 (PMP) 認證
      issuer: PMI
      date: Nov 2019
      url: https://www.pmi.org/certifications/project-management-pmp
  publications:
    - name: 以客戶成功為核心的 SaaS 訂閱經濟策略
      publisher: 台灣管理學刊
      releaseDate: Sep 2021
      url: https://www.tamjournal.org.tw/article/12345
      summary: |
        - 探討 SaaS 企業如何透過客戶成功管理提升續約率與客戶終身價值
        - 提出客戶健康度評分模型與主動關懷機制，並以台灣企業個案驗證
        - 獲選為當期最佳實務案例論文
  projects:
    - name: 客戶健康度儀表板
      url: https://github.com/yatinglin/customer-health-dashboard
      description: 基於 Python 與 Tableau 開發的客戶健康度監控系統
      startDate: Jan 2022
      endDate: Jun 2022
      summary: |
        - 整合 Salesforce、產品使用數據與客服工單，計算客戶健康度分數
        - 提供即時警示與建議行動，協助客戶成功團隊主動管理風險客戶
        - 導入後客戶流失率降低 25%，團隊工作效率提升 30%
      keywords:
        - Python
        - Tableau
        - Salesforce API
        - 數據視覺化
    - name: SaaS 客戶 onboarding 自動化流程
      url: https://www.cloudpulse.tw/onboarding
      description: 設計並導入自動化 onboarding 流程，縮短客戶上線時間
      startDate: Mar 2023
      endDate: Aug 2023
      summary: |
        - 使用 HubSpot 與 Zapier 建立自動化郵件序列與任務分派
        - 將新客戶上線時間從 14 天縮短至 9 天，提升客戶早期採用率
        - 專案成果獲選為公司年度最佳內部流程改善案例
      keywords:
        - HubSpot
        - Zapier
        - 流程自動化
        - 客戶體驗
  interests:
    - name: 志工服務
      keywords:
        - 偏鄉教育
