        - 環保
    - name: 個人興趣
      keywords:
        - 遠足
        - 攝影
        - 閱讀
        - 咖啡
  volunteer:
    - organization: 香港青年創業家協會
      url: https://www.hkyea.example.com
      position: 客戶成功導師
      startDate: Sep 2021
      summary: |
        - 為青年創業者提供客戶成功及客戶關係管理指導
        - 協助制定客戶獲取及留存策略，參與每月導師聚會
        - 分享 SaaS 行業經驗，幫助初創企業建立可持續增長模式
    - organization: 香港客戶成功協會
      url: https://www.hkcsa.example.com
      position: 活動籌委
      startDate: Jan 2020
      endDate: Dec 2021
      summary: |
        - 籌辦年度客戶成功研討會及工作坊，吸引超過 300 名參與者
        - 負責講者邀請、議程設計及場地協調
        - 促進香港客戶成功專業社群交流與知識分享
  references:
    - name: 黃志明
      relationship: 香港雲端方案有限公司 營運總監
      email: chi-ming.wong@hkcloudsolutions.example.com
      phone: "+852 9876 5432"
      summary: |
        陳嘉欣在客戶成功領域表現卓越，具備出色的策略思維及團隊領導能力，能有效提升客戶留存及滿意度，是任何企業都不可多得的人才。

