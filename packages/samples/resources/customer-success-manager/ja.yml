  volunteer:
    - organization: 一般社団法人 キャリア支援ネットワーク
      url: https://example.com/volunteer
      position: メンター
      startDate: Sep 2019
      summary: |
        - 若手社会人や学生向けに、キャリア相談とビジネススキル向上のメンタリングを実施
        - 月1回のワークショップを企画し、コミュニケーションや顧客対応の基礎を指導
        - メンティーの成長を支援し、延べ50名以上を担当

