  publications:
    - name: "Détection de fraude financière par réseaux de neurones profonds"
      publisher: Revue Française de Data Science
      releaseDate: Feb 2022
      url: https://www.rfds.fr/articles/detection-fraude
      summary: |
        Publication co-écrite présentant une approche de deep learning pour détecter des transactions frauduleuses en temps réel. L'article détaille les architectures comparées et les résultats sur un jeu de données bancaires anonymisé.
  projects:
    - name: Système de recommandation de contenus
      url: https://github.com/camillemoreau/reco-system
      description: Moteur de recommandation de contenus culturels basé sur le filtrage
        collaboratif et le deep learning.
      startDate: Jan 2023
      endDate: Jun 2023
      summary: |
        - Conception d'un système de recommandation hybride combinant filtrage collaboratif et embeddings
        - Amélioration de 12 % du taux de clics sur une plateforme de streaming culturel
        - APIs Dockerisées déployées sur AWS Elastic Beanstalk
      keywords:
        - Recommandation
        - TensorFlow
        - AWS
        - API
    - name: Analyse de sentiments des tweets
      url: https://github.com/camillemoreau/sentiment-twitter
      description: Outil d'analyse d'opinions en temps réel à partir de Twitter.
      startDate: Sep 2022
      endDate: Dec 2022
      summary: |
        - Modèle de NLP basé sur BERT pour classer les tweets en sentiments positifs, négatifs ou neutres
        - Pipeline de collecte de données avec Twitter API et Kafka
        - Visualisation des tendances avec Grafana
      keywords:
        - NLP
        - BERT
        - Kafka
        - Grafana
