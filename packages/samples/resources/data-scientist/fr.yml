content:
  basics:
    name: Camille Moreau
    email: camille.moreau@email.fr
    headline: Data Scientist Senior | Machine Learning & Analyse Prédictive
    phone: +33 6 12 34 56 78
    summary: >
      - Data Scientist Senior avec plus de 5 ans d'expérience dans la conception
      et le déploiement de modèles prédictifs

      - Expertise en machine learning, statistiques et traitement de données
      massives pour accompagner la décision stratégique

      - Solide maîtrise de l'écosystème Python, des outils Big Data et des
      plateformes cloud

      - Esprit d'analyse, rigueur scientifique et forte capacité à vulgariser
      les résultats auprès des parties prenantes métier
    url: https://camillemoreau.fr
  education:
    - area: Data Science et Intelligence Artificielle
      institution: Université Paris-Saclay
      degree: Master
      courses:
        - Apprentissage automatique avancé
        - Deep Learning
        - Statistiques bayésiennes
        - Big Data et architectures distribuées
        - Visualisation de données
        - Éthique de la donnée
      endDate: Sep 1, 2020
      startDate: Sep 1, 2018
      summary: >
        - Formation approfondie en mathématiques appliquées et en apprentissage
        automatique

        - Réalisation d'un projet de fin d'études sur la détection de fraude par
        réseaux de neurones

        - Obtention de la mention Très Bien
      score: "3.9"
      url: https://www.universite-paris-saclay.fr/
    - area: Mathématiques et Informatique
      institution: Université Claude Bernard Lyon 1
      degree: Bachelor
      courses:
        - Algèbre linéaire
        - Probabilités
        - Programmation en Python
        - Bases de données
        - Algorithmique
      endDate: Jun 1, 2018
      startDate: Sep 1, 2015
      summary: |
        - Acquisition des fondamentaux en mathématiques et en programmation
        - Stage de fin de licence sur l'analyse exploratoire de données de santé
      score: "3.6"
      url: https://www.univ-lyon1.fr/
  awards:
    - awarder: Association Data for Good
      title: Prix "Data for Good" 2022
      date: Jun 1, 2022
      summary: >
        Récompense pour la conception d'un modèle d'optimisation des tournées de
        livraison permettant de réduire les émissions de CO2 de 12 % pour une
        association caritative.
  certificates:
    - issuer: Amazon Web Services
      name: AWS Certified Machine Learning – Specialty
      date: Mar 1, 2023
      url: https://aws.amazon.com/certification/
    - issuer: deeplearning.ai / Coursera
      name: Deep Learning Specialization
      date: Dec 1, 2020
      url: https://www.coursera.org/specializations/deep-learning
  interests:
    - name: Data Visualisation
      keywords:
        - D3.js
        - Tableau
        - Infographies
    - name: Sport
      keywords:
        - Course à pied
        - Randonnée
        - Natation
  languages:
