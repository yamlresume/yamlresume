        * Durchführung von Workshops zu Python und Datenanalyse für
        Einsteiger*innen
      endDate: Dec 2023
      url: https://correlaid.org
  work:
    - name: Nordlicht Analytics GmbH
      position: Data Scientistin
      startDate: Nov 1, 2021
      summary: >
        * Konzeption und Entwicklung von NLP-Modellen zur automatisierten
        Auswertung von Kundenfeedback

        * Aufbau einer MLOps-Pipeline mit Docker, Airflow und AWS SageMaker zur
