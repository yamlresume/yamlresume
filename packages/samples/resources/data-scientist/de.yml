    - name: Feedbackradar – NLP-Dashboard
      startDate: Jan 2022
      summary: >
        * Automatische Extraktion von Themen und Stimmungen aus mehrsprachigen
        Kundenrezensionen

        * Einsatz von Sentence-BERT und Latent Dirichlet Allocation

        * Visualisierung der Ergebnisse in einem Streamlit-Dashboard
      description: Interaktives Dashboard zur Analyse von Kundenbewertungen mit Topic
        Modeling und Stimmungsanalyse.
      endDate: Jun 2022
      keywords:
        - NLP
        - Streamlit
        - Topic Modeling
      url: https://github.com/elenavogt/feedbackradar
    - name: Churn-Prediction Pipeline
      startDate: Mar 2021
      summary: |
        * Feature Engineering auf Transaktions- und Interaktionsdaten
        * Modellvergleich mit Cross-Validation und Hyperparameter-Optimierung
        * Deployment als REST-API mit FastAPI und Docker
      description: End-to-End-ML-System zur Vorhersage von Kundenabwanderung für einen
        SaaS-Anbieter.
      endDate: Aug 2021
      keywords:
        - FastAPI
        - Docker
        - XGBoost
      url: https://github.com/elenavogt/churn-pipeline
  publications:
