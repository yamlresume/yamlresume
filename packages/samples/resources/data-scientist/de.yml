      position: Ehrenamtliche Data Scientistin
      startDate: Jan 2021
      summary: >
        * Unterstützung gemeinnütziger Organisationen bei der Datenauswertung
        und Visualisierung

        * Mitentwicklung eines Bildungsprojekts zu ethischen Fragestellungen in
