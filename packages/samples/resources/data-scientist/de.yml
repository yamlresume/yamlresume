        * Entwicklung eines Open-Source-Toolkits zur Reproduktion der Ergebnisse
      url: https://www.fairml-workshop.de/paper/2022/predictive
    - name: BERT-basierte Klassifikation medizinischer Dokumente im klinischen Alltag
      publisher: Proceedings der Tagung Datenwissenschaft & KI 2023
      releaseDate: Mar 2023
      summary: >
        * Veröffentlichung der Ergebnisse einer Machbarkeitsstudie zum Einsatz
        von Transfer Learning für die automatische Dokumentenklassifikation

        * Kooperation mit einem Berliner Klinikum und dem Fachbereich
        Medizininformatik
      url: https://www.dwki2023.de/publikationen/bert-medizin
