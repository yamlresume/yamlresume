      institution: Humboldt-Universität zu Berlin
      degree: Master
      courses:
        - Maschinelles Lernen
        - Deep Learning
        - Statistische Modellierung
        - Natural Language Processing
        - Big-Data-Infrastrukturen
        - Datenvisualisierung
      endDate: Sep 1, 2019
      startDate: Oct 1, 2017
      summary: >
        * Abschluss als Jahrgangsbeste mit Gesamtnote 1.3

        * Fokus auf angewandte Machine-Learning-Verfahren und NLP

        * Masterarbeit: "Transfer Learning für die Klassifikation medizinischer
        Dokumente"
      score: "1.3"
      url: https://www.hu-berlin.de
    - area: Informatik
      institution: Technische Universität Berlin
      degree: Bachelor
      courses:
