content:
  basics:
    name: Elena Vogt
    email: elena.vogt@posteo.de
    headline: Data Scientistin mit Schwerpunkt Machine Learning & NLP
    phone: +49 151 12345678
    summary: >
      Data Scientistin mit über 5 Jahren Erfahrung in der Entwicklung
      produktionsreifer Machine-Learning-Modelle. Schwerpunkt auf Natural
      Language Processing, Predictive Analytics und MLOps.


      * Entwicklung von Modellen, die messbare Geschäftsergebnisse verbessern

      * Enge Zusammenarbeit mit Product und Engineering, um ML-Lösungen in
      skalierbare Services zu überführen

      * Erfahrung mit Cloud-Plattformen (AWS, GCP) und Container-Technologien

      * Leidenschaft für klare Datenkommunikation und datengetriebene
      Entscheidungsfindung
    url: https://www.elenavogt-data.de
  education:
