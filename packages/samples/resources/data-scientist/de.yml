        * Reduktion der Modell-Latenz um 40% durch Optimierung der
        Inferenz-Infrastruktur

        * Leitung eines Data-Science-Mentoring-Programms für neue Teammitglieder
      keywords:
        - NLP
        - MLOps
        - AWS SageMaker
        - Airflow
        - Python
      url: https://www.nordlicht-analytics.de
    - name: Berliner Gesundheitsdaten AG
      position: Junior Data Scientistin
      startDate: Oct 1, 2019
      summary: >
        * Entwicklung von Vorhersagemodellen zur Identifikation von
        Risikopatienten (Python, scikit-learn)

        * Automatisierte Datenqualitätsprüfung und ETL-Prozesse mit SQL und
        Pandas

        * Erstellung interaktiver Dashboards in Tableau für medizinische
        Fachabteilungen

        * Mitarbeit an einem Forschungsprojekt zur Anonymisierung von
        Gesundheitsdaten
      endDate: Sep 30, 2021
      keywords:
        - Python
        - SQL
        - Tableau
        - ETL
        - Modellvalidierung
      url: https://www.berliner-gesundheitsdaten.de
    - name: Datenwerk Solutions (Werkstudentin)
      position: Data-Analytics-Werkstudentin
      startDate: Apr 1, 2018
      summary: >
        * Unterstützung des Beratungsteams bei explorativen Datenanalysen und
        Reportings

        * Implementierung wiederkehrender Auswertungen mit Python und Excel

        * Dokumentation von Datenquellen und Ableitung von Qualitätsmetriken
      endDate: Aug 31, 2019
      keywords:
        - Data Analysis
        - Python
        - Reporting
      url: https://www.datenwerk.solutions
