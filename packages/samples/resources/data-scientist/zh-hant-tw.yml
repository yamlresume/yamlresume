content:
  basics:
    name: 陳怡君
    headline: '資料科學家 | 機器學習與數據分析'
    phone: "+886 912 345 678"
    email: yichun.chen@datasci.tw
    url: https://yichun-ds.tw
    summary: |
      我是一位擁有 6 年經驗的資料科學家，專精於機器學習、統計分析與大數據處理，擅長從複雜資料中挖掘商業洞見。

      - 主導多項端到端資料科學專案，包括推薦系統、客戶流失預測與需求預測
      - 具備將模型導入生產環境的實務經驗，熟悉 GCP、AWS 等雲端服務
      - 重視跨部門溝通，能將技術成果轉化為具體商業決策
      - 持續學習新技術，並熱衷於透過 Medium 分享資料科學知識
  location:
    address: 台北市大安區信義路三段 100 號
    city: 台北市
    region: 台北市
    country: Taiwan
    postalCode: "106"
  profiles:
    - network: GitHub
      url: https://github.com/yichun-data
      username: yichun-data
    - network: LinkedIn
      url: https://www.linkedin.com/in/yichunchen
      username: yichunchen
    - network: Medium
      url: https://medium.com/@yichun.ds
      username: yichun.ds
  education:
    - institution: 國立臺灣大學
      url: https://www.ntu.edu.tw
      degree: Master
      area: 資料科學學程
      score: "4.2"
      startDate: Sep 1, 2015
      endDate: Jul 1, 2017
      courses:
        - 機器學習
        - 統計推論
        - 深度學習
        - 大數據分析
        - 資料視覺化
      summary: |
        研究方向為可解釋機器學習與推薦系統，碩士論文題目為「基於注意力機制之可解釋推薦模型」。擔任統計學助教，並協助教授整理實驗資料。
    - institution: 國立清華大學
      url: https://www.nthu.edu.tw
      degree: Bachelor
      area: 數學系（雙主修資訊工程）
      score: "3.9"
      startDate: Sep 1, 2011
      endDate: Jul 1, 2015
      courses:
        - 微積分
        - 線性代數
        - 機率論
        - 統計學
        - 程式設計
      summary: |
        建立紮實的數學與程式基礎，參與系上專題競賽，並於大三暑期至科技公司實習，負責資料前處理與初步分析。
  work:
    - name: 雲端數據科技股份有限公司
      url: https://www.datacloud.com.tw
      position: 資深資料科學家
      startDate: Mar 1, 2021
      summary: |
        - 主導客戶流失預測專案，整合 CRM、交易與行為數據，建立 XGBoost 模型，精準率提升 25%
        - 開發個人化推薦系統，結合協同過濾與深度學習，帶動部門營收成長 18%
        - 設計 A/B 測試評估框架，協助產品團隊建立數據驅動的決策流程
        - 負責資料科學團隊的 code review 與技術分享，提升團隊整體開發品質
      keywords:
        - 客戶流失預測
        - 推薦系統
        - 深度學習
        - A/B 測試
        - 團隊領導
    - name: 智慧零售顧問有限公司
      url: https://www.smartretail.tw
      position: 資料科學家
      startDate: Aug 1, 2017
      endDate: Feb 28, 2021
      summary: |
        - 建立門市銷售預測模型，整合歷史銷售、天氣與促銷活動資料，預測誤差降低 30%
        - 建置客戶分群系統，利用 RFM 分析與 K-Means 分群，協助行銷團隊規劃精準行銷活動
        - 開發自動化報表流程，以 Python 與 Airflow 取代人工產出，每月節省 20 人時
        - 與工程團隊協作，將模型包裝為 RESTful API 並部署至雲端環境
      keywords:
        - 銷售預測
        - RFM 分析
        - K-Means
        - Airflow
        - API 部署
  languages:
    - language: Chinese
      fluency: Native or Bilingual Proficiency
      keywords:
        - 母語
        - 商務溝通與簡報
    - language: English
      fluency: Full Professional Proficiency
      keywords:
        - TOEIC 950
        - 技術文件閱讀與撰寫
  skills:
    - name: 機器學習
      level: Expert
      keywords:
        - Python
        - scikit-learn
        - XGBoost
        - PyTorch
        - 自然語言處理
    - name: 資料分析與統計
      level: Expert
      keywords:
        - SQL
        - R
        - 統計檢定
        - 時間序列分析
        - 實驗設計
    - name: 資料工程
      level: Advanced
      keywords:
        - Apache Spark
        - Airflow
        - dbt
        - Docker
        - 雲端服務
    - name: 資料視覺化
      level: Advanced
      keywords:
        - Tableau
        - Looker
        - Matplotlib
        - Plotly
        - 資料故事化
  awards:
    - title: 台灣資料科學競賽金牌獎
      date: Nov 15, 2022
      awarder: 台灣資料科學協會
      summary: |
        以自動化機器學習平台參賽，自 300 多組隊伍中脫穎而出，獲得金牌獎。
  certificates:
    - name: AWS Certified Machine Learning – Specialty
      url: https://aws.amazon.com/certification/
      issuer: Amazon Web Services
      date: Apr 15, 2023
    - name: Google Professional Data Engineer
      url: https://cloud.google.com/certification/data-engineer
      issuer: Google
      date: Jun 10, 2021
  publications:
    - name: 基於注意力機制之可解釋推薦模型
      publisher: 國際資料科學與分析期刊
      releaseDate: Mar 1, 2022
      url: https://doi.org/10.1007/s41060-022-00300-5
      summary: |
        提出結合注意力機制與可解釋性的推薦系統架構，在公開資料集上取得領先成果，並深入探討模型決策的透明性。
  projects:
    - name: 即時人流預測系統
      url: https://github.com/yichun-data/people-flow-forecast
      description: 整合政府開放資料與天氣資料，預測商圈即時人流，協助零售業者進行營運調度。
      startDate: Jan 1, 2023
      endDate: Jun 30, 2023
      summary: |
        - 使用 LightGBM 與時間序列特徵，預測準確度達 92%
        - 部署至 GCP Cloud Run，並提供 REST API 供內部系統串接
        - 設計資料監控流程，確保模型穩定性
      keywords:
        - 時間序列
        - LightGBM
        - GCP
        - 開放資料
    - name: 自動化機器學習平台
      url: https://github.com/yichun-data/automl-platform
      description: 建置可重現的 AutoML 流程，簡化模型訓練與部署。
      startDate: Mar 1, 2022
      endDate: Dec 31, 2022
      summary: |
        - 以 Kubeflow 與 MLflow 搭建機器學習生命週期管理平台
        - 支援多團隊協作與模型版本管理，降低 40% 模型上線時間
        - 整合 CI/CD 流程，提升開發效率與可靠性
      keywords:
        - AutoML
        - Kubeflow
        - MLflow
        - CI/CD
  interests:
    - name: 閱讀
      keywords:
        - 資料科學
        - 經濟學
        - 科幻小說
    - name: 戶外活動
      keywords:
        - 登山
        - 自行車
        - 路跑
  volunteer:
    - organization: 資料科學教育協會
      url: https://www.datascitw.org
      position: 志工講師
      startDate: Jan 1, 2019
      endDate: Dec 31, 2023
      summary: |
        - 協助舉辦資料科學工作坊與線上課程，累計教導超過 500 名學員
        - 維護開源教材，推廣資料素養教育
        - 輔導學生完成實作專案，並提供職涯建議

