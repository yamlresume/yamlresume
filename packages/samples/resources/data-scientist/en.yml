      endDate: Jun 1, 2021
      position: Data Scientist
      summary: |
        - Built recommendation engines that increased user engagement by 18%
        - Developed NLP pipelines for sentiment analysis and topic modeling
        - Created dashboards and self-service analytics tools for stakeholders
      keywords:
