  publications:
    - name: A Hybrid Deep Learning Approach for Urban Traffic Flow Prediction
      publisher: IEEE Access
      releaseDate: Jun 2022
      url: https://doi.org/10.1109/ACCESS.2022.1234567
      summary: |
        - 提出結合 CNN 及 LSTM 的混合深度學習模型，用於預測香港市區交通流量
        - 實驗結果顯示所提出的模型比傳統 ARIMA 減少 25% 預測誤差
        - 文章已獲 IEEE Access 收錄，並被多位學者引用
    - name: 應用自然語言處理於金融文本情感分析
      publisher: 香港數據科學期刊
      releaseDate: Dec 2020
      url: https://www.hkdsj.org/articles/2020/12
      summary: |
        - 探討如何利用 BERT 模型分析上市公司年報及新聞稿中的情感傾向
        - 結合金融領域知識詞典，提升情感分析模型於金融文本的準確度
  projects:
    - name: 香港樓價預測系統
      url: https://github.com/wingyanchan/hk-property-price
      description: 一個基於深度學習的香港物業估價及樓價預測平台
      startDate: Feb 2021
      endDate: Jun 2021
      summary: |
        - 整合差餉物業估價署、土地註冊處及公共交通數據
        - 使用 XGBoost 及深度神經網絡建立樓價預測模型，R² 達 0.91
        - 開發 Flask API 及 React 前端，讓用戶輸入物業資料即時獲得估價
      keywords:
        - Python
        - XGBoost
        - React
        - 房地產
        - 深度學習
    - name: 智能客戶服務聊天機器人
      url: https://github.com/wingyanchan/chatbot
      description: 為銀行客戶服務部門設計的粵語智能聊天機器人
      startDate: Sep 2022
      endDate: Mar 2023
      summary: |
        - 利用 RAG（檢索增強生成）架構結合領域知識庫，解答客戶常見問題
        - 使用 LangChain 及 OpenAI API 開發，並部署至企業 Kubernetes 集群
        - 聊天機器人成功處理 70% 的常見查詢，大幅減輕前線客服人員負擔
      keywords:
        - RAG
        - LangChain
        - Kubernetes
        - 生成式 AI
        - 客戶服務
  interests:
