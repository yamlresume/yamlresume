content:
  basics:
    name: 陳詠欣
    headline: "數據科學家｜機器學習與大數據分析專家"
    phone: "+852 9876 5432"
    email: wingyan@wingyanchan.com
    url: https://www.wingyanchan.com
    summary: |
      擁有超過 6 年數據科學及機器學習經驗，專注於金融科技、智慧城市及零售分析等領域。

      - 善於運用統計建模、機器學習及深度學習技術解決實際商業問題
      - 熟悉大數據平台（Spark、Hadoop）及雲端服務（AWS、Azure）
      - 具備端到端數據產品開發經驗，由數據收集、特徵工程到模型部署及監控
      - 熱衷於把複雜的數據分析結果轉化為清晰的商業決策建議
      - 擁有多項專業認證及期刊論文發表經驗
  location:
    address: 香港中環皇后大道中100號
    city: 香港
    region: 香港島
    country: Hong Kong
  profiles:
    - network: GitHub
      url: https://github.com/wingyanchan
      username: wingyanchan
    - network: LinkedIn
      url: https://www.linkedin.com/in/wingyanchan
      username: wingyanchan
    - network: Medium
      url: https://medium.com/@wingyanchan
      username: wingyanchan
  education:
    - institution: 香港大學
      url: https://www.hku.hk/
      degree: Master
      area: 數據科學
      score: 3.8/4.3
      startDate: Sep 2017
      endDate: Jul 2019
      courses:
        - 高級機器學習
        - 大數據分析
        - 統計學習理論
        - 深度學習
        - 數據可視化
        - 雲端運算
      summary: |
        - 以優異成績（Distinction）畢業，專注於機器學習及大數據分析
        - 畢業論文題目為「基於深度學習的香港樓價預測模型」，獲學院最佳論文獎
        - 擔任研究助理，協助教授進行自然語言處理相關研究
    - institution: 香港中文大學
      url: https://www.cuhk.edu.hk/
      degree: Bachelor
      area: 計算機科學
      score: 3.5/4.3
      startDate: Sep 2013
      endDate: Jul 2017
      courses:
        - 數據結構
        - 算法設計
        - 數據庫系統
        - 概率與統計
        - 人工智能
      summary: |
        - 副修統計學，建立扎實的數學及程式設計基礎
        - 參與多個編程比賽及黑客松，曾獲校內數據分析比賽冠軍
  work:
    - name: 智庫數據科技有限公司
      url: https://www.thinktankdata.io
      position: 高級數據科學家
      startDate: Jan 2020
      summary: |
        - 領導數據科學團隊，為銀行及零售客戶開發風險評估及客戶分群模型
        - 設計並部署基於 Python 及 Spark 的機器學習平台，將模型訓練時間縮短 40%
        - 與業務部門緊密合作，將分析結果轉化為可執行的商業策略
        - 推動 MLOps 實踐，建立自動化模型監控及重新訓練流程
        - 指導初級數據科學家，並定期舉辦內部培訓
      keywords:
        - Python
        - Spark
        - MLOps
        - 機器學習
        - 風險建模
    - name: 香港電訊有限公司
      url: https://www.hkt.com
      position: 數據科學家
      startDate: Aug 2019
      endDate: Dec 2019
      summary: |
        - 分析流動通訊客戶的使用行為及流失率，建立客戶流失預警模型
        - 利用 SQL 及 Hive 處理每日數十億條數據記錄，製作儀表板供管理層參考
        - 開發客戶生命週期價值（LTV）模型，協助市場部制定精準營銷策略
      keywords:
        - SQL
        - Hive
        - 客戶流失
        - Tableau
