      startDate: Jan 2021
      summary: |
        - 為非牟利機構提供免費數據分析諮詢
        - 定期主持數據科學工作坊，教授 Python 及數據可視化技巧
        - 協助設計「社企數據儀表板」，用於追蹤服務成效

