  publications:
    - publisher: Revista Brasileira de Inteligência Computacional
      url: https://www.rbic.org.br
      name: Previsão de inadimplência em carteiras de crédito usando aprendizado de
        máquina
      releaseDate: 2020-09-15
      summary: |
        - Apresenta uma comparação entre regressão logística, florestas aleatórias e redes neurais para predição de inadimplência.
        - Discute estratégias de balanceamento de classes e interpretabilidade de modelos em cenários reais de crédito.

  projects:
    - name: Plataforma de MLOps para Previsão de Churn
      url: https://github.com/anabeatriz-data/churn-mlops
      description: Pipeline end-to-end que combina automação de treinamento, validação
        e deploy de modelos de churn.
      startDate: 2022-03-01
      summary: |
        - Utiliza Docker, Airflow e MLflow para orquestrar as etapas do ciclo de vida do modelo.
        - Reduziu o tempo de atualização dos modelos de semanas para horas no ambiente de produção.
      keywords:
        - MLOps
        - Docker
        - Airflow
        - MLflow
        - Churn

    - name: Modelo de Séries Temporais para Previsão de Vendas
      url: https://github.com/anabeatriz-data/series-temporais-vendas
      description: Projeto de estudo com modelos ARIMA, Prophet e redes LSTM aplicados
        a uma base pública de vendas.
      startDate: 2020-01-01
      endDate: 2020-12-01
      summary: |
        - Análise comparativa de acurácia entre abordagens clássicas e neurais.
        - Desenvolvimento de um dashboard interativo em Streamlit para exploração dos resultados.
      keywords:
        - Séries Temporais
        - ARIMA
        - Prophet
        - LSTM
        - Streamlit

    - name: Painel de Indicadores de Negócio
      url: https://github.com/anabeatriz-data/dashboard-indicadores
      description: Dashboard criado com Power BI para monitoramento de metas
        comerciais e qualidade dos dados.
      startDate: 2019-08-01
      endDate: 2019-10-01
      summary: |
        - Consolidou mais de 15 fontes de dados em um único painel gerencial.
        - Facilitou a tomada de decisão semanal dos times comerciais.
      keywords:
        - Power BI
        - Indicadores
        - DAX
        - SQL

