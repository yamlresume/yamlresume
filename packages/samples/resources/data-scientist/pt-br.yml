content:
  basics:
    name: Ana Clara Souza
    email: ana.clara.souza@example.com.br
    headline: Cientista de Dados Sênior com foco em Machine Learning e Inteligência
      de Negócio
    phone: +55 11 98765-4321
    summary: >
      - Cientista de dados com mais de 8 anos de experiência em modelagem
      preditiva, análise estatística e machine learning

      - Especialista no desenvolvimento de soluções para crédito, cobrança e
      detecção de fraude no setor financeiro

      - Sólida experiência em Python, R, SQL e ferramentas de big data como
      Spark, Airflow e Docker

      - Capacidade de traduzir problemas complexos de negócio em modelos
      analíticos escaláveis e acionáveis

      - Perfil colaborativo, com histórico de mentoria, comunicação com
      stakeholders e desenvolvimento de times analíticos
    url: https://anaclarasouza.dev
  education:
    - area: Estatística
      institution: Universidade Estadual de Campinas (Unicamp)
      degree: Master
      courses:
        - Métodos de Regressão Avançada
        - Aprendizado de Máquina Supervisionado
        - Análise de Séries Temporais
        - Inferência Causal e Experimentação
        - Processos Estocásticos
      endDate: Feb 1, 2019
      startDate: Mar 1, 2017
      summary: >
        - Dissertação sobre detecção de anomalias em transações financeiras com
        técnicas de séries temporais e aprendizado de máquina

        - Publiquei artigo acadêmico em periódico qualificado a partir dos
        resultados da pesquisa

        - Apliquei métodos de validação cruzada e análise de sensibilidade para
        garantir robustez dos modelos
      score: "9.1"
      url: https://www.unicamp.br/
    - area: Estatística
      institution: Universidade de São Paulo (USP)
      degree: Bachelor
      courses:
        - Cálculo Diferencial e Integral
        - Probabilidade e Estatística
        - Modelos Lineares
        - Banco de Dados
        - Programação Científica com R
      endDate: Dec 1, 2016
      startDate: Mar 1, 2012
      summary: >
        - Iniciação científica em análise de sobrevivência aplicada a dados de
        saúde pública

        - Experiência em monitoria de disciplinas de estatística computacional e
        probabilidade

        - Participei de projetos de extensão envolvendo visualização de dados
        abertos do município de São Paulo
      score: "8.6"
      url: https://www.usp.br/
  awards:
    - awarder: Programa de Pós-Graduação em Estatística - Unicamp
      title: Menção Honrosa no Prêmio de Melhor Dissertação
      date: Feb 1, 2019
      summary: >
        Reconhecimento pela dissertação de mestrado que apresentou contribuição
        metodológica relevante para a detecção de fraudes financeiras com
        aprendizado de máquina.
  certificates:
