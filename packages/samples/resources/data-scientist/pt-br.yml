    address: Av. Paulista, 1578
    country: Brazil
    postalCode: 01310-100
    region: SP
  profiles:
    - network: LinkedIn
      username: anaclarasouza
      url: https://www.linkedin.com/in/anaclarasouza
    - network: GitHub
      username: anaclarasouza
      url: https://github.com/anaclarasouza
  projects:
    - name: Detector de Fraudes em Tempo Real
      startDate: Jan 1, 2023
      summary: >
        - Arquitetura de streaming com Kafka e PySpark para processamento de
        eventos em larga escala

        - Modelos de classificação treinados com dados sintéticos alcançaram AUC
        de 0.94

        - Inclui API REST para consulta de escore de risco em tempo real
      description: Pipeline open source para detecção de fraudes em transações
        financeiras com aprendizado de máquina.
      endDate: Dec 1, 2023
      keywords:
        - Kafka
        - PySpark
        - Machine Learning
        - Streaming
      url: https://github.com/anaclarasouza/fraud-detector
    - name: Dashboard de Análise de Churn
      startDate: Jun 1, 2021
      summary: >
        - Desenvolvido com Streamlit e Plotly para visualização interativa de
        métricas de retenção

        - Inclui segmentação de clientes com análise RFM e algoritmo K-means

        - Apoiou o time de retenção na priorização de ações para clientes de
        alto valor
      description: Painel interativo para monitoramento de churn e identificação de
        padrões de cancelamento.
      endDate: Sep 1, 2021
      keywords:
        - Streamlit
        - CRM
        - Segmentação
        - K-means
      url: https://github.com/anaclarasouza/churn-dashboard
  publications:
    - name: Detecção de anomalias em transações financeiras usando aprendizado de
        máquina e séries temporais
      publisher: Revista Brasileira de Computação Aplicada
      releaseDate: Jun 1, 2023
      summary: >
        - Propõe uma abordagem híbrida de modelos ARIMA e redes neurais para
        detecção de fraudes

        - Demonstra redução de 28% nos falsos positivos em relação a métodos
        tradicionais

        - Utiliza dados bancários sintéticos e métricas de negócio para validar
        a metodologia
      url: https://www.scielo.br/j/rbca
  skills:
