        - Tableau
        - Plotly
        - Matplotlib
        - Seaborn
  volunteer:
    - organization: Rede Analytics para Mulheres
      position: Mentora de Dados
      startDate: Jan 1, 2020
      summary: >
        - Mentorei mais de 30 profissionais em transição para a área de ciência
        de dados

        - Organizei workshops de Python, SQL e estatística aplicada para
        mulheres em tecnologia

        - Contribuí com a construção de trilhas de estudo e materiais didáticos
        de acesso aberto
      endDate: Dec 1, 2023
      url: https://www.redeanalytics.org.br
  work:
    - name: Aurora Bank S.A.
      position: Cientista de Dados Sênior
      startDate: Mar 1, 2021
      summary: >
        - Desenvolvi modelos de credit scoring e detecção de fraude em tempo
        real, contribuindo para redução de 34% nas perdas operacionais

        - Liderei a migração dos pipelines analíticos para uma arquitetura em
        Spark e Airflow, reduzindo o tempo de processamento em 60%

        - Conduzi experimentos A/B e análises de uplift para otimizar campanhas
        de retenção e relacionamento com clientes

        - Criei dashboards estratégicos em Power BI para acompanhamento de
        indicadores de risco e performance dos modelos

        - Atuei como mentora de cientistas de dados juniores em boas práticas de
        Python, versionamento de modelos e testes estatísticos
      keywords:
        - Credit Scoring
        - Detecção de Fraude
        - Spark
        - Airflow
        - Experimentação A/B
        - Modelos Preditivos
      url: https://www.aurorabank.com.br
    - name: DigiData Analytics LTDA.
      position: Cientista de Dados
      startDate: Jan 1, 2019
      summary: >
        - Construí pipelines de ingestão e tratamento de dados com Python e SQL
        para clientes de varejo, finanças e telecomunicações

        - Implementei modelos de churn e propensão à compra que aumentaram a
        conversão de campanhas em cerca de 21%

        - Desenvolvi visualizações interativas com Plotly e Dash para apoiar
        comitês executivos e reuniões de resultado

        - Estruturei metodologias de teste estatístico e amostragem para avaliar
        a efetividade de ações de marketing
      endDate: Feb 1, 2021
      keywords:
        - Python
        - SQL
        - Churn
        - Propensão à Compra
        - Plotly
        - Dash
      url: https://www.digidata.com.br
    - name: VarejoTech Soluções Inteligentes
      position: Analista de BI e Dados
      startDate: Jun 1, 2016
      summary: >
        - Estruturei o data warehouse da empresa utilizando modelagem
        dimensional em SQL Server

        - Construí relatórios e dashboards de vendas, estoque e performance
        comercial para as áreas de negócio

        - Automatizei processos de coleta e transformação de dados com scripts
        em Python e agendamentos no Pentaho

        - Apoiei decisões gerenciais com análises descritivas, indicadores de
        desempenho e acompanhamento de metas
      endDate: Dec 1, 2018
      keywords:
        - SQL Server
        - Business Intelligence
        - Dashboards
        - ETL
        - KPIs
      url: https://www.varejotech.com.br
