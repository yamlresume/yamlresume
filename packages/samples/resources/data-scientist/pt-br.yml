    - issuer: Coursera
      name: Deep Learning Specialization
      date: Aug 1, 2020
      url: https://www.coursera.org/specializations/deep-learning
  interests:
    - name: Esportes
      keywords:
        - Corrida de rua
        - Ciclismo
        - Futebol
    - name: Música
      keywords:
        - Violão
        - Jazz
    - name: Tecnologia e Comunidade
      keywords:
        - Open Source
        - Meetups de dados
  languages:
