      name: Machine Learning
      keywords:
        - Modelagem Preditiva
        - Classificação
        - Regressão
        - Séries Temporais
        - Scikit-learn
        - XGBoost
    - level: Expert
      name: Estatística
      keywords:
        - Inferência Estatística
        - Teste A/B
        - Modelos Lineares
        - Análise Exploratória
        - Amostragem Complexa
