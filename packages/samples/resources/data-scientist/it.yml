  publications:
    - name: Modelli predittivi per la manutenzione di reti elettriche intelligenti
      publisher: Rivista Italiana di Statistica Applicata
      releaseDate: '2022-12-01'
      url: https://doi.org/10.1234/risa.2022.12.004
      summary: |
        - Confronto tra modelli di serie temporali e apprendimento supervisionato per la manutenzione predittiva.
        - Analisi dell'impatto delle variabili meteo e di carico sulla probabilità di guasto.
    - name: Segmentazione dei clienti tramite apprendimento non supervisionato
      publisher: Atti della Conferenza Italiana di Data Science
      releaseDate: '2021-09-15'
      url: https://doi.org/10.5678/cids.2021.09.012
      summary: |
        - Applicazione di clustering e riduzione della dimensionalità a dati di consumo energetico.
        - Valutazione della stabilità dei segmenti e delle implicazioni per campagne di marketing.

  projects:
    - name: Previsione della Domanda Energetica
      startDate: '2021-03-01'
      endDate: '2021-12-20'
      description: "Sistema di previsione della domanda energetica per un'azienda
        utilities, con modelli a livello giornaliero e orario."
      summary: |
        - Costruito pipeline di feature engineering con dati storici, meteo e calendario.
        - Confrontato Prophet, XGBoost e LSTM; selezionato il modello con il miglior errore in validazione temporale.
        - Pubblicato dashboard interattiva per il monitoraggio delle previsioni e degli scostamenti.
      keywords:
        - Serie temporali
        - Prophet
        - XGBoost
        - Airflow
        - Dashboard
      url: https://github.com/giuliaferrari/energy-demand-forecast
    - name: Analisi della Soddisfazione Clienti
      startDate: '2020-06-01'
      endDate: '2020-11-30'
      description: Analisi di recensioni e sondaggi per identificare i fattori chiave
        della soddisfazione clienti.
      summary: |
        - Applicato NLP per estrarre topic e sentiment da recensioni in italiano.
        - Integrato i risultati con dati transazionali per stimare l'impatto sulla soddisfazione.
        - Presentato insight actionable al team customer experience.
      keywords:
        - NLP
        - Topic modeling
        - Sentiment analysis
        - Power BI
      url: https://github.com/giuliaferrari/customer-satisfaction

