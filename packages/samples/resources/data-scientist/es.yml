        - Airflow
        - dbt
    - name: Visualización de Datos
      level: Advanced
      keywords:
        - Tableau
        - Power BI
        - Matplotlib
        - ggplot2
        - Looker
  languages:
    - language: Spanish
      fluency: Native or Bilingual Proficiency
      keywords:
        - Lengua materna
    - language: English
      fluency: Full Professional Proficiency
      keywords:
        - TOEFL 110
        - Experiencia internacional
  awards:
    - title: Premio Nacional de Inteligencia Artificial Aplicada
      awarder: Asociación Española de Inteligencia Artificial (AEPIA)
      date: Nov 1, 2021
      summary: |
        Reconocimiento al proyecto "Detección temprana de enfermedades cardiovasculares mediante deep learning", desarrollado en colaboración con el Hospital Universitario de La Paz.
    - title: Mejor Comunicación en el Congreso de Ciencia de Datos
      awarder: Universidad Politécnica de Madrid
      date: Jun 1, 2016
      summary: |
        Premio al trabajo fin de máster por su contribución a la predicción de series temporales financieras con modelos híbridos.
  certificates:
    - name: AWS Certified Machine Learning - Specialty
      issuer: Amazon Web Services
      date: Mar 1, 2022
      url: https://aws.amazon.com/es/certification/
    - name: Professional Data Engineer
      issuer: Google Cloud
      date: Oct 1, 2020
      url: https://cloud.google.com/certification
  publications:
    - name: Técnicas de ensemble learning para la detección de fraude en seguros
      publisher: Revista Iberoamericana de Inteligencia Artificial
      releaseDate: Apr 1, 2022
      url: https://www.iberamia.org/revista
      summary: |
        - Propone un sistema híbrido basado en Random Forest, Gradient Boosting y redes neuronales para identificar patrones de fraude.
        - El modelo alcanza una AUC-ROC de 0,97 sobre un conjunto de datos real del sector asegurador.
        - Analiza la interpretabilidad de los modelos mediante SHAP para facilitar su adopción en entornos regulados.
  projects:
    - name: Detección de noticias falsas en redes sociales
      url: https://github.com/carlosmendoza/fake-news-detector
      description: Sistema de PLN basado en Transformers para clasificar noticias en
        español como verdaderas o falsas.
      startDate: Jan 1, 2023
      endDate: Jun 1, 2023
      summary: |
        - Fine-tuning de modelos BERT y RoBERTa sobre un corpus de noticias etiquetadas en español.
        - Desarrollo de una API REST con FastAPI y despliegue en un contenedor Docker en Google Cloud Run.
        - Publicación de los notebooks y el dataset procesado en GitHub como recurso educativo.
      keywords:
        - NLP
        - Transformers
        - FastAPI
        - Docker
    - name: Cuadro de mando integral para pymes
      url: https://github.com/carlosmendoza/dashboard-pymes
      description: Dashboard interactivo construido con Streamlit para visualizar KPIs
        financieros y operativos de pequeñas empresas.
      startDate: Mar 1, 2023
      endDate: Jul 1, 2023
      summary: |
        - Permite a los usuarios sin perfil técnico explorar sus datos de ventas, gastos y rentabilidad de forma intuitiva.
        - Incluye módulos de predicción de tesorería mediante Prophet y análisis de desviaciones.
      keywords:
        - Streamlit
        - Prophet
        - Dashboard
        - KPI
  interests:
    - name: Ajedrez
      keywords:
        - Competiciones locales
        - Táctica
    - name: Senderismo
      keywords:
        - Sierra de Guadarrama
        - Fotografía de naturaleza
    - name: Música
      keywords:
        - Piano
        - Jazz
  volunteer:
    - organization: Data Science for Social Good España
      url: https://www.datascienceforsocialgood.es
      position: Voluntario Científico de Datos
      startDate: May 1, 2019
      endDate: Dec 1, 2022
      summary: |
        - Colaboré con ONG en el análisis de datos socioeconómicos para optimizar la distribución de ayudas alimentarias.
        - Desarrollé modelos de predicción de desempleo a nivel comarcal para orientar políticas públicas locales.
        - Impartí talleres introductorios de Python y visualización de datos a estudiantes de secundaria en zonas rurales.
  references:
    - name: Dra. Lucía Fernández
      phone: "+34 655 123 987"
      relationship: Directora de Data Science en TechNova Analytics
      email: lucia.fernandez@technova-analytics.es
      summary: |
        Carlos es un profesional excepcional, con una gran capacidad para traducir problemas de negocio en soluciones analíticas. Su liderazgo técnico y visión estratégica han sido clave para el éxito de nuestro equipo.

