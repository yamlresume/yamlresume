content:
  basics:
    name: "Sanne van den Berg"
    headline: "Senior UX-designer met focus op toegankelijk en inclusief ontwerp"
    phone: "+31 6 12345678"
    email: "sanne@vandenberg.design"
    url: "https://sannevandenberg.design"
    summary: |
      Ontwerper met ruim 8 jaar ervaring in het creëren van gebruiksvriendelijke
      digitale producten voor webshops, SaaS-toepassingen en publieke diensten.
      Ik vertaal gebruikersbehoeften naar heldere interacties en inclusieve
      ontwerpen, met oog voor zowel businessdoelen als menselijke waarden.

      - Methodisch en onderzoekend: van contextanalyse tot usabilitytest
      - Ervaren met design systems, rapid prototyping en service design
      - Gedreven om digitale toegankelijkheid (WCAG 2.2) standaard te maken

  location:
    address: "Keizersgracht 123"
    city: Amsterdam
    region: Noord-Holland
    country: Netherlands
    postalCode: "1015 CJ"

  profiles:
    - network: LinkedIn
      url: "https://www.linkedin.com/in/sannevandenberg"
      username: sannevandenberg
    - network: Behance
      url: "https://www.behance.net/sannevandenberg"
      username: sannevandenberg
    - network: Dribbble
      url: "https://dribbble.com/sannevandenberg"
      username: sannevandenberg

  education:
    - institution: Hogeschool van Amsterdam
      url: "https://www.hva.nl"
      degree: Bachelor
      area: Communicatie en Multimedia Design
      score: "8.2"
      startDate: Sep 1, 2010
      endDate: Jul 1, 2014
      courses:
        - Onderzoeksmethoden voor Design
        - Interactieontwerp
        - Visual Interface Design
        - Mens-computerinteractie
        - Digitale Productie
        - Concepting en Creativiteit
        - Bedrijfskunde voor Creatieve Industrie
        - Afstudeerproject Apps voor Ouderen
      summary: |
        - Afstudeerrichting Interaction Design, afgestudeerd met een 8,2
        - Afstudeerproject: toegankelijke tabletapp voor senioren
        - Minor: Design for Social Change

  work:
    - name: Bluebird Digital
      url: "https://www.bluebird-digital.nl"
      position: Senior UX Designer
      startDate: Mar 1, 2021
      summary: |
        - Verantwoordelijk voor de UX-strategie van een B2B SaaS-platform met ruim 40.000 gebruikers.
        - Opgezet en doorontwikkeld design system met toegankelijke, herbruikbare componenten in Figma.
        - Begeleidde junior designers en gaf UX-workshops aan developers en productmanagers.
      keywords:
        - Design system
        - SaaS
        - WCAG 2.2
        - Agile/Scrum
        - Mentorschap

    - name: Startup Studio Amsterdam
      url: "https://www.startupstudio.amsterdam"
      position: Product Designer
      startDate: May 1, 2017
      endDate: Feb 1, 2021
      summary: |
        - Ontwikkelde UX-ontwerpen voor 12 startups in fintech, health en mobility.
        - Leidde wekelijks usabilitytesten en vertaalde inzichten naar prototypes.
        - Creëerde customer journeys en service blueprints voor complexe processen.
      keywords:
        - Fintech
        - Mobility
        - Usabilitytesten
        - Customer journey
        - Prototyping

    - name: Glow Online
      url: "https://www.glowonline.nl"
      position: Junior UX Designer
      startDate: Aug 1, 2014
      endDate: Apr 1, 2017
      summary: |
        - Ontwierp wireframes en interactieve prototypes voor e-commerce websites.
        - Voerde A/B-tests uit om conversie en gebruiksvriendelijkheid te verbeteren.
        - Werkte nauw samen met developers bij de implementatie van responsive designs.
      keywords:
        - E-commerce
        - Wireframes
        - A/B-testen
        - Responsive design
        - Conversie

  skills:
    - name: User Research
      level: Expert
      keywords:
        - Diepte-interviews
        - Usabilitytesten
        - A/B-testen
        - Contextanalyse
        - Persona's
    - name: Prototyping
      level: Expert
      keywords:
        - Figma
        - Interactieve prototypes
        - Wireframes
        - Design tokens
        - Clickdummy's
    - name: Interaction Design
      level: Advanced
      keywords:
        - Customer journeys
        - Service blueprints
        - Micro-interacties
        - Toegankelijk ontwerp
    - name: Visual Design
      level: Advanced
      keywords:
        - Design systems
        - Typografie
        - Kleurtoegankelijkheid
        - WCAG 2.2
    - name: Front-end Basics
      level: Intermediate
      keywords:
        - HTML
        - CSS
        - JavaScript
        - Storybook

  languages:
    - language: Dutch
      fluency: Native or Bilingual Proficiency
      keywords:
        - Moedertaal
    - language: English
      fluency: Full Professional Proficiency
      keywords:
        - Professioneel C1
    - language: German
      fluency: Limited Working Proficiency
      keywords:
        - Basisvaardigheden

  awards:
    - title: Publieksprijs Nederlandse UX Awards
      date: Nov 2022
      awarder: Dutch UX Association
      summary: |
        Bekroond voor het toegankelijk herontwerpen van een overheidsportaal voor
        mensen met een visuele beperking.

  certificates:
    - name: "Certified Professional in Accessibility Core Competencies (CPACC)"
      issuer: IAAP
      date: Jun 2023
      url: "https://www.accessibilityassociation.org/"
    - name: "Google UX Design Professional Certificate"
      issuer: Coursera
      date: Apr 2021
      url: "https://www.coursera.org/professional-certificates/google-ux-design"

  publications:
    - name: "Inclusief ontwerpen is geen trend, het is een vak"
      publisher: UX Magazine Nederland
      releaseDate: May 2023
      url: "https://www.uxmagazine.nl/artikel/inclusief-ontwerpen"
      summary: |
        Praktijkartikel over hoe je toegankelijkheid vanaf de start van het
        ontwerpproces meeneemt, met concrete voorbeelden uit de financiële sector.

  projects:
    - name: "OmniBank App Herontwerp"
      url: "https://sannevandenberg.design/projecten/omnibank"
      startDate: Jan 2023
      endDate: Jun 2023
      description: |
        Volledig herontwerp van de mobiele bankapp voor een grote Nederlandse
        bank, gericht op begrijpelijke taal, donkere modus en volledige
        ondersteuning van schermlezers.
      summary: |
        - Uitgebreid gebruikersonderzoek met 18 deelnemers, inclusief mensen met een visuele beperking.
        - Iteratieve prototypes getest in vijf rondes op toegankelijkheid.
        - Opgeleverd design package met componenten, tokens en richtlijnen voor developers.
      keywords:
        - Fintech
        - Toegankelijkheid
        - Figma
        - Co-creatie
        - Design system

  interests:
    - name: Duurzaamheid
      keywords:
        - Circulair design
        - Tweedehands meubels
        - Stadsmoestuin
    - name: Fotografie
      keywords:
        - Straatfotografie
        - Analoog
        - Zwart-wit
    - name: Muziek
      keywords:
        - Gitaar
        - Indie
        - Vinyl

  volunteer:
    - organization: Inclusive Design Collectief
      url: "https://www.inclusiefdesigncollectief.nl"
      position: Vrijwillig UX-adviseur
      startDate: Jan 2019
      summary: |
        - Help non-profitorganisaties met het toegankelijk maken van hun digitale kanalen.
        - Organiseer jaarlijkse toegankelijkheidssessies tijdens de Dutch Design Week.

  references:
    - name: "Dr. Liesbeth Jansen"
      phone: "+31 20 555 0199"
      relationship: "Design lead bij Bluebird Digital"
      email: "liesbeth.jansen@bluebird-digital.nl"
      summary: |
        Sanne is een van de meest zorgvuldige en empathische designers met wie ik
        heb gewerkt. Haar aanpak combineert onderzoek, creativiteit en oog voor
        detail met een sterke drive om digitale producten voor iedereen bruikbaar te maken.

