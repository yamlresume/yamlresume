content:
  basics:
    name: Eva van den Berg
    email: eva.vandenberg@designmail.nl
    headline: Senior UX Designer gespecialiseerd in design systems en toegankelijkheid
    phone: +31 6 2847 1936
    summary: >
      Gepassioneerde UX Designer met meer dan 7 jaar ervaring in het ontwerpen
      van digitale producten die gebruikers én bedrijven vooruithelpen. Ik
      combineer diepgaand gebruikersonderzoek met een sterk visueel
      ontwerpvermogen om intuïtieve, toegankelijke en schaalbare ervaringen te
      creëren.


      Ervaring in het leiden van design teams en het opzetten van design systems
      binnen agile organisaties. Sterk in het overbruggen van de kloof tussen
      ontwerp en ontwikkeling door middel van prototyping en heldere
      documentatie.
    url: https://evavandenberg.nl
  education:
    - area: Communicatie- en Multimediadesign
      institution: Hogeschool van Amsterdam
      degree: Bachelor
      courses:
        - Interactieontwerp
        - Gebruikersonderzoek
        - Visual Interface Design
        - Design Thinking
        - Prototyping
      endDate: Jul 1, 2016
      startDate: Sep 1, 2012
      summary: >
        - Verdiept in mens-computer interactie, visuele communicatie en
        gebruikersonderzoeksmethoden

        - Afgestudeerd met een uitstekend resultaat op een project gericht op
        zorgtechnologie en toegankelijkheid
      score: "8.2"
      url: https://www.hva.nl/
  awards:
    - awarder: Dutch Interactive Awards
      title: UX Design Award
      date: May 2023
      summary: >
        Erkenning voor het ontwerpen van het meest gebruiksvriendelijke
        B2B-platform binnen de financiële dienstverlening
  certificates:
    - issuer: UX Academy Nederland
      name: Gebruikersonderzoek Masterclass
      date: Nov 2022
      url: https://uxacademynl.nl/certificaat
