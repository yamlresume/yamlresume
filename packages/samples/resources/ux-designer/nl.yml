  volunteer:
    - organization: Stichting Digitaal Erfgoed
      position: UX Consultant
      startDate: Feb 2020
      summary: >
        - Adviseer non-profitorganisaties over het verbeteren van de digitale
        gebruikerservaring van hun online platforms

        - Ontwikkelde gratis wireframes en prototypes voor culturele
        erfgoedprojecten met een beperkt budget

        - Gaf workshops over toegankelijkheid en inclusief ontwerp aan
        vrijwilligers en medewerkers
      url: https://digitaalerfgoed.nl
  work:
    - name: CleverCode B.V.
      position: Senior UX Designer
      startDate: Mar 1, 2021
      summary: >
        - Ontwikkelde en implementeerde een compleet design system dat de
        time-to-market voor nieuwe features met 30% verkorte

        - Leidde kwalitatief en kwantitatief gebruikersonderzoek om strategische
        designbeslissingen te onderbouwen voor B2B-platformen

        - Creëerde toegankelijke interface-ontwerpen conform WCAG 2.1
        AA-richtlijnen en trainde het team in toegankelijkheidsbest practices

        - Begeleide twee junior designers en introduceerde gestructureerde
        design reviews en critiques binnen het team

        - Werkte nauw samen met product owners en ontwikkelaars in een
        agile/scrum omgeving
      keywords:
        - UX Strategy
        - Design Systems
        - User Research
        - Mentoring
        - Accessibility
      url: https://clevercode.nl
    - name: Blue Mango Digital
      position: UX Designer
      startDate: Aug 1, 2018
      summary: >
        - Ontworpen en geoptimaliseerd e-commerce ervaringen voor diverse
        A-merken, resulterend in een gemiddelde conversieverbetering van 15%

        - Gebouwd en getest interactieve prototypes in Figma en Sketch voor
        zowel mobiele als desktop applicaties

        - Uitgevoerd A/B-testen en heatmap-analyses om knelpunten in
        gebruikersstromen te identificeren en op te heffen

        - Gepresenteerd aan stakeholders en overtuigd van user-centered design
        aanpakken door middel van data-gedreven verhalen
      endDate: Feb 1, 2021
      keywords:
        - E-commerce
        - Prototyping
        - A/B Testing
        - Mobile Design
      url: https://bluemango.digital
    - name: Studio Verve
      position: Junior UI/UX Designer
      startDate: Sep 1, 2016
      summary: >
        - Ondersteund bij het ontwerpen van wireframes en visuele ontwerpen voor
        websites en mobiele applicaties

        - Geholpen bij het uitvoeren van usability tests en het verwerken van
        feedback in iteratieve ontwerpcycli

        - Samengewerkt met front-end developers om designs pixel-perfect te
        implementeren in HTML, CSS en JavaScript

        - Ontwikkelde een sterke basis in typografie, kleurtheorie en responsief
        ontwerp
      endDate: Jul 1, 2018
      keywords:
        - Wireframing
        - UI Design
        - Usability Testing
        - HTML/CSS
      url: https://studioverve.nl
