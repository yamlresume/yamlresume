  projects:
    - name: ZorgApp Redesign
      startDate: Jan 2022
      summary: >
        - Uitgevoerd diepgaand veldonderzoek onder thuiszorgmedewerkers om
        pijnpunten in de bestaande app in kaart te brengen

        - Ontworpen een intuïtief nieuw informatiearchitectuur dat de
        planningstijd significant verminderde

        - Gebouwd een schaalbaar componentensysteem in Figma dat de consistentie
        over iOS en Android waarborgde

        - Getest met 12 eindgebruikers en gevalideerd dat de nieuwe interface de
        foutmarge bij het invoeren van diensten met 40% verlaagde
      description: Complete herontwerp van een zorgplanning app voor thuiszorgmedewerkers
      endDate: Jun 2022
      keywords:
        - Zorg
        - Mobiel
        - Redesign
        - Toegankelijkheid
      url: https://evavandenberg.nl/project/zorgapp
  publications:
    - name: Het belang van toegankelijkheid in mobiele apps
      publisher: UX Collective Nederland
      releaseDate: Mar 2023
      summary: >
        - Beschrijft praktische methoden om WCAG 2.1-richtlijnen toe te passen
        in native iOS- en Android-applicaties

        - Bespreekt veelgemaakte fouten en biedt concrete oplossingen voor
        ontwerpers en ontwikkelaars
      url: https://uxcollective.nl/toegankelijkheid-mobiel
