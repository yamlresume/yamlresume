      date: Nov 1, 2022
      awarder: 台灣設計研究院
      summary: |
        以「記憶守護者」失智症照護 App 榮獲年度最佳設計獎，肯定其在介面設計、服務流程與社會關懷上的創新。
    - title: 設計系所優秀論文獎
