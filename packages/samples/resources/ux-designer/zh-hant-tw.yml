      summary: |
        - 碩士論文以「高齡者行動支付應用程式之介面設計研究」獲選為系所優秀論文
        - 協助教授執行科技部研究計畫，負責使用者訪談、數據整理與原型測試
    - institution: 國立臺北科技大學
