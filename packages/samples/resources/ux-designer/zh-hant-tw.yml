      position: 活動講師與工作坊引導師
      startDate: Mar 2019
      summary: |
        - 定期參與設計社群活動，分享產業實務經驗與設計趨勢觀察
        - 帶領設計思考與使用者研究工作坊，累積超過三百位學員
        - 協助籌辦年度設計年會，促進業界交流與知識傳遞
      endDate: null
      url: https://www.ixda.org.tw
  work:
    - name: 智匯金融科技股份有限公司
      position: 資深使用者體驗設計師
      startDate: Mar 1, 2021
      summary: |
        - 主導企業級設計系統建置，統一跨產品線設計語言，縮短設計交付週期 40%
        - 帶領五人設計團隊，建立標準化研究流程與設計評審機制
        - 推動以使用者研究為核心的產品開發流程，主導超過三十場深度訪談與易用性測試
        - 與產品經理及工程團隊緊密協作，將複雜的金融業務轉化為直覺的數位體驗
      endDate: null
      keywords:
        - 設計系統
        - 使用者研究
        - 產品策略
        - 團隊領導
      url: https://www.smartfintech.com.tw
    - name: 樂購電子商務股份有限公司
      position: 使用者體驗設計師
      startDate: Jul 1, 2018
      summary: |
        - 負責 iOS 與 Android 雙平台行動應用程式的 UX 設計，月活躍用戶超過兩百萬
        - 規劃並執行超過二十場易用性測試，迭代優化購物流程與會員系統
        - 建立完整的設計規範與元件庫，提升設計與前端協作效率
        - 透過 A/B 測試優化結帳流程，成功提升交易轉換率 18%
      endDate: Feb 1, 2021
      keywords:
        - 行動應用
        - 易用性測試
        - 線框圖
        - 設計規範
      url: https://www.lego-shop.tw
    - name: 創想互動設計有限公司
      position: UI/UX 設計師
      startDate: Aug 1, 2016
      summary: |
        - 參與多個網頁與行動應用專案的介面設計，涵蓋醫療、教育與零售產業
        - 繪製使用者流程圖與線框圖，協助客戶釐清產品需求與資訊架構
        - 製作高擬真互動原型，有效降低開發階段的溝通成本
        - 與前端工程師協作，確保設計細節能忠實呈現於最終產品
      endDate: Jun 1, 2018
