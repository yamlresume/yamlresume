  projects:
    - name: 智能理財應用程式改版設計
      startDate: Jan 2022
      summary: |
        - 透過深度訪談與問卷調查洞察投資新手痛點，重新定義產品定位
        - 重新設計資訊架構與導航系統，降低任務完成時間 35%
        - 建立可擴充的設計系統，統一跨平台設計語言與元件標準
        - 與產品及工程團隊協作導入迭代式開發流程，確保設計品質與開發效率
      description: 為台灣本土銀行重新設計行動理財應用程式，提升整體使用體驗與交易轉換率
      endDate: Dec 2022
      keywords:
        - 金融科技
        - 行動應用
        - 設計系統
        - 使用者研究
      url: https://siyuchen.design/projects/wealth-app
  publications:
    - name: 數位金融產品中的信任建構：以使用者為中心的設計策略
      publisher: 設計學報
      releaseDate: May 2022
      summary: |
        探討如何在金融科技產品中透過介面設計、資訊架構與互動回饋機制建立使用者信任，並提出實證研究架構與設計準則，供業界與學界參考。
      url: https://doi.org/10.1234/design.journal.2022
