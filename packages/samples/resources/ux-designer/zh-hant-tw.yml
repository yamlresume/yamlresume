content:
  basics:
    name: 陳思妤
    email: siyu.chen@example.com
    headline: 資深使用者體驗設計師
    phone: +886 912 345 678
    summary: |
      擁有超過八年使用者體驗設計經驗，專精於數位金融與電子商務領域。擅長透過質性與量化研究洞察使用者需求，並將其轉化為直覺且具商業價值的產品設計。具備從零到一建置設計系統的實戰經驗，以及帶領跨職能設計團隊的能力。熱衷於推動以使用者為中心的設計文化，相信優秀的設計應該同時兼顧美學、功能與情感連結。
    url: https://siyuchen.design
  education:
    - area: 創新設計研究所
      institution: 國立臺灣科技大學
      degree: Master
      courses:
        - 使用者研究與需求分析
        - 互動設計與原型開發
        - 認知心理學與人因工程
        - 設計思考與創新策略
        - 服務設計工作坊
      endDate: Jun 1, 2016
      startDate: Sep 1, 2014
      summary: |
        專注於使用者體驗與互動設計領域，透過系統性研究方法探索使用者行為與需求。畢業專題以行動金融應用為題，結合設計思考與易用性測試，提出創新的介面解決方案並獲得系上最佳設計獎。
      score: 4.0/4.0
      url: https://www.ntust.edu.tw/
    - area: 工業產品設計學系
      institution: 實踐大學
      degree: Bachelor
      courses:
        - 產品設計原理
        - 設計素描與表現技法
        - 色彩學與材質應用
        - 設計史與設計理論
        - 電腦輔助設計
      endDate: Jun 1, 2014
      startDate: Sep 1, 2010
      summary: >
        奠定扎實的設計基礎與造型能力，培養對人、物、環境的敏銳觀察力。在校期間積極參與跨領域合作專案，初次接觸使用者中心設計方法，確立朝向 UX
        設計發展的職涯方向。
      score: 3.9/4.0
      url: https://www.usc.edu.tw/
  awards:
    - awarder: 金點設計獎評審委員會
      title: 金點設計獎 Best Design
      date: Dec 2019
      summary: |
        以創新的行動支付使用體驗設計獲得年度 Best Design 獎項，肯定以使用者為核心的設計價值與商業影響力。
  certificates:
