  publications:
    - name: 以服務設計觀點探討智慧健康照護平台之使用者經驗
      publisher: 設計學報
      releaseDate: Jul 1, 2023
      url: https://www.jodesign.org.tw
      summary: |
        探討智慧健康照護平台在使用者經驗上的挑戰，提出以服務藍圖與使用者旅程地圖整合的設計評估架構，並以實際案例驗證其可行性。
  projects:
    - name: 記憶守護者（Memory Keeper）
      url: https://www.memorykeeper.example.com
      description: 為失智症患者與家屬設計的照護協作 App，整合用藥提醒、日常紀錄與緊急聯絡功能。
      startDate: Mar 1, 2021
      endDate: Dec 31, 2022
      summary: |
        - 主導田野調查與訪談，深入理解照顧者與患者的痛點，建立人物誌與使用情境
        - 設計完整的服務流程與互動原型，並進行 3 輪易用性測試，任務完成率提升 42%
        - 與工程團隊密切協作，確保設計系統在 iOS 與 Android 平台上的一致體驗
      keywords:
        - 服務設計
        - 使用者研究
        - 原型測試
        - 失智症照護
        - 設計系統
    - name: 遠距醫療預約平台 Redesign
      url: https://www.telehealth.example.com
      description: 重新設計醫療院所遠距掛號與視訊看診流程，降低患者的操作焦慮並提升預約成功率。
      startDate: Jan 1, 2020
      endDate: Jun 30, 2021
      summary: |
        - 分析既有使用者流程與客服數據，找出 10 個關鍵斷點並進行重新設計
        - 建立符合無障礙規範的設計元件，確保高齡使用者也能順利操作
        - 系統上線後，預約成功率提升 27%，客服進線量減少 18%
      keywords:
        - 醫療設計
        - 無障礙設計
        - 使用者流程
        - 數據分析
