content:
  basics:
    name: 陈雨萱
    email: chenyuxuan@designmail.com
    headline: 资深用户体验设计师与交互设计专家
    phone: +86 138 1234 5678
    summary: |
      拥有8年以上互联网产品设计经验，擅长将复杂业务需求转化为简洁优雅的用户体验方案。精通设计思维方法论，主导过多个百万级用户产品的体验升级与从0到1的创新项目。

      具备极强的跨团队协作能力，善于通过用户研究驱动设计决策，并建立可复用的设计系统以提升团队整体效能。持续关注AI、车载系统等新兴领域的交互范式演进，致力于创造兼具商业价值与用户情感共鸣的数字产品。
    url: https://chenyuxuan.design
  education:
    - area: 工业设计
      institution: 江南大学
      degree: Bachelor
      courses:
        - 人机交互设计
        - 信息架构与导视系统
        - 视觉传达设计
        - 用户研究方法
        - 设计心理学
        - 交互原型制作
        - 数字媒体技术
        - 产品与服务系统设计
      endDate: Jul 1, 2016
      startDate: Sep 1, 2012
      summary: |
        系统学习人机交互、信息设计、视觉传达等核心课程，掌握以用户为中心的设计思维与方法。

        在校期间多次参与设计工作坊与企业合作项目，完成多个涵盖移动端与实体产品的完整设计案例。担任设计学院学生会视觉部部长，负责学院品牌形象设计与大型活动视觉策划。
      score: "3.7"
      url: https://www.jiangnan.edu.cn/
  awards:
    - awarder: 红点设计大奖组委会
      title: 红点设计概念奖
      date: Nov 2019
      summary: |
        凭借为医疗行业设计的创新交互方案，从全球数千件作品中脱颖而出，获得国际评审团的高度认可。
  certificates:
    - issuer: Coursera
      name: 交互设计专业证书
      date: Jun 2020
      url: https://coursera.org/verify/ABCD1234EFGH
