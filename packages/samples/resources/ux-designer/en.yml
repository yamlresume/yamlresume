  projects:
    - name: Aero Travel
      startDate: Jan 1, 2020
      summary: >
        - Conducted competitive analysis and user interviews to identify pain
        points in sustainable travel planning

        - Designed an end-to-end mobile experience featuring itinerary building,
        carbon offset tracking, and local eco-guide integration

        - Delivered high-fidelity prototypes and a usability report that
        informed the MVP scope for investor presentations
      description: A mobile application for sustainable travel planning and carbon
        footprint tracking
      endDate: Jun 1, 2020
      keywords:
        - Sustainability
        - Mobile Design
        - User Research
      url: https://aerotravel.app
    - name: CityLights
      startDate: Aug 1, 2022
      summary: >
        - Audited accessibility and usability of existing municipal websites
        across three partner cities

        - Built a scalable component library in Figma covering typography,
        color, form elements, and navigation patterns

        - Authored documentation and usage guidelines to empower non-designer
        content managers to maintain visual consistency
      description: An open-source design system for municipal government digital services
      endDate: Dec 1, 2022
      keywords:
        - Design Systems
        - Open Source
        - Government
      url: https://citylights.designsystem.org
  skills:
    - level: Expert
      name: User Research
      keywords:
        - Interviews
        - Usability Testing
        - Personas
        - Journey Mapping
    - level: Expert
      name: Design & Prototyping
      keywords:
        - Figma
        - Sketch
        - Adobe XD
        - Principle
        - Framer
    - level: Intermediate
      name: Frontend Development
      keywords:
        - HTML
        - CSS
        - JavaScript
        - React
    - level: Advanced
      name: Design Operations
      keywords:
        - Design Systems
        - DesignOps
        - Storybook
        - Accessibility
  volunteer:
    - organization: Design for America
      position: UX Mentor
      startDate: Sep 1, 2019
      summary: >
        - Mentor undergraduate design students through semester-long social
        innovation projects focused on community health

        - Lead workshops on design thinking, wireframing, and accessible design
        practices for non-profit organizations

        - Judge annual student design showcase, providing constructive critique
        and career guidance to emerging UX professionals
      url: https://designforamerica.com
  work:
    - name: Nexus Digital
      position: Senior UX Designer
      startDate: Mar 1, 2021
      summary: >
        - Lead UX strategy and execution for core product initiatives, managing
        the end-to-end design process from discovery to delivery

        - Established and maintained a comprehensive design system used by 30+
        product teams, improving design consistency and reducing development
        time by 25%

        - Conducted mixed-methods user research including contextual inquiry,
        usability testing, and surveys to inform product roadmaps

        - Mentor a team of four junior designers, conducting design critiques
        and fostering a culture of feedback and iterative improvement

        - Collaborate closely with product managers and engineers to ensure
        feasible implementation of complex interaction patterns
      keywords:
        - Design Systems
        - User Research
        - Mentorship
        - Figma
      url: https://nexusdigital.com
    - name: Brightfield Health
      position: UX Designer
      startDate: Jun 1, 2018
      summary: >
        - Redesigned the flagship telehealth mobile application used by 500,000+
        patients, improving task completion rates by 35% through streamlined
        navigation

        - Championed accessibility compliance (WCAG 2.1 AA) across all digital
        products, conducting audits and delivering remediation guidelines

        - Created interactive prototypes and facilitated user testing sessions
        with diverse patient populations including elderly and low-vision users

        - Partnered with clinical stakeholders to translate complex medical
        workflows into simple, reassuring user experiences
      endDate: Feb 1, 2021
      keywords:
        - Healthcare
        - Mobile First
        - Accessibility
        - Prototyping
      url: https://brightfieldhealth.com
    - name: Atlas Financial Group
      position: Junior UX Designer
      startDate: Jul 1, 2017
      summary: >
        - Designed responsive web interfaces for consumer banking tools,
        producing wireframes, mockups, and clickable prototypes in Figma

        - Assisted senior researchers in moderating usability tests and
        synthesizing findings into actionable design recommendations

        - Contributed to the company's first pattern library by documenting UI
        components and interaction guidelines for the development team
      endDate: May 1, 2018
      keywords:
        - Wireframing
        - Usability Testing
        - Responsive Web
      url: https://atlasfinancial.com
