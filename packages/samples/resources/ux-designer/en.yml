content:
  basics:
    name: Maya Chen
    email: maya.chen@email.com
    headline: Senior UX Designer specializing in human-centered digital products
    phone: (415) 555-0198
    summary: >
      Passionate and detail-oriented UX Designer with over 6 years of experience
      crafting intuitive digital experiences for web and mobile platforms.
      Skilled in translating complex user needs into elegant, accessible design
      solutions that drive engagement and business growth.


      Expertise spans the full design lifecycle, from generative user research
      and journey mapping to high-fidelity prototyping and design system
      governance. Strong advocate for inclusive design practices and
      cross-functional collaboration with product, engineering, and research
      teams.


      Currently leading UX strategy and design operations at a fast-paced
      technology company, while mentoring junior designers and scaling reusable
      component libraries across multiple product lines.
    url: https://mayachen.design
  education:
    - area: Human-Computer Interaction + Design
      institution: University of Washington
      degree: Master
      courses:
        - User-Centered Design
        - Information Architecture
        - Qualitative Research Methods
        - Interaction Design Studio
        - Data Visualization
      endDate: Jun 1, 2017
      startDate: Sep 1, 2015
      summary: >
        Completed an interdisciplinary thesis on predictive touch targeting for
        mobile accessibility, resulting in a peer-reviewed workshop paper.
        Collaborated with engineering and design teams through
        industry-sponsored studio projects.
      url: https://www.washington.edu/
    - area: Psychology
      institution: University of Texas at Austin
      degree: Bachelor
      courses:
        - Cognitive Psychology
        - Statistics and Data Analysis
        - Human Factors
        - Visual Perception
      endDate: May 1, 2015
      startDate: Aug 1, 2011
      summary: >
        Developed a strong foundation in human behavior, perception, and
        decision-making. Graduated with honors and presented undergraduate
        research on attention and interface complexity at a regional psychology
        conference.
      url: https://www.utexas.edu/
  awards:
    - awarder: UX Design Awards
      title: Excellence in Health Tech Design
      date: Nov 2022
      summary: >
        Recognized for the redesign of a patient-facing telehealth platform that
        significantly improved accessibility scores and user satisfaction
        metrics among underserved communities.
  certificates:
    - issuer: Coursera
      name: Google UX Design Professional Certificate
      date: Mar 2019
      url: https://coursera.org/professional-certificates/google-ux-design
    - issuer: IAAP
      name: Certified Professional in Accessibility Core Competencies
      date: Nov 2021
      url: https://www.accessibilityassociation.org/s/certified-professional
  interests:
    - name: Photography
      keywords:
        - Street Photography
        - Film
        - Darkroom
    - name: Outdoor Activities
      keywords:
        - Hiking
        - Kayaking
        - Birdwatching
  languages:
