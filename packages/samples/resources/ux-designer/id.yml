content:
  basics:
    name: Rina Andriani Sutanto
    email: rina.sutanto@email.co.id
    headline: Desainer UX Senior | Spesialis Produk Digital
    phone: +62 812 3456 7890
    summary: >
      Desainer UX berpengalaman dengan lebih dari 6 tahun membangun produk
      digital yang berpusat pada pengguna. Ahli dalam melakukan riset pengguna,
      membuat wireframe, prototype interaktif, hingga pengujian kegunaan untuk
      memastikan solusi desain memenuhi kebutuhan bisnis dan pengguna.


      Memiliki rekam jejak terbukti dalam meningkatkan metrik keterlibatan
      pengguna dan mengurangi tingkat kesalahan tugas melalui pendekatan desain
      berbasis data. Terbiasa berkolaborasi dengan tim produk, engineer, dan
      stakeholder dalam lingkungan Agile untuk menghadirkan pengalaman yang
      seamless di berbagai platform.
    url: https://rinaandriani.myportfolio.com
  education:
    - area: Desain Komunikasi Visual
      institution: Universitas Indonesia
      degree: Bachelor
      courses:
        - Interaksi Manusia dan Komputer
        - Desain Antarmuka Pengguna
        - Metodologi Riset Desain
        - Tipografi dan Komunikasi Visual
        - Desain Informasi dan Visualisasi Data
      endDate: Jul 1, 2018
      startDate: Sep 1, 2014
      summary: >
        Fokus studi pada bidang desain interaksi dan pengalaman pengguna. Aktif
        dalam organisasi desain kampus dan berpartisipasi dalam berbagai
        kompetisi desain nasional.
      score: "3.82"
      url: https://www.ui.ac.id
  awards:
    - awarder: Asosiasi Desainer Indonesia
      title: Pemenang Kompetisi Desain UX Nasional
      date: Nov 2021
      summary: >
        Meraih juara pertama dalam kompetisi desain pengalaman pengguna tingkat
        nasional dengan proyek solusi kesehatan digital untuk daerah terpencil.
  certificates:
    - issuer: Coursera
      name: Google UX Design Professional Certificate
      date: Jun 2020
      url: https://coursera.org/verify/professional-cert/google-ux-design
    - issuer: Human Factors International
      name: Certified Usability Analyst
      date: Sep 2021
      url: https://www.humanfactors.com/certification
  interests:
