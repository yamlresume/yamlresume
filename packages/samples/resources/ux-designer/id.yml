  projects:
    - name: Redesign Aplikasi Kesehatan SehatKu
      startDate: Jan 2023
      summary: >
        - Melakukan riset komprehensif dengan 30+ responden untuk memahami pain
        point dalam konsultasi daring

        - Merancang ulang alur pemesanan janji temu dokter yang mengurangi waktu
        penyelesaian tugas sebesar 40%

        - Mengimplementasikan fitur aksesibilitas seperti voice command dan text
        scaling untuk penyandang disabilitas
      description: Redesign end-to-end aplikasi telemedicine untuk meningkatkan
        aksesibilitas pengguna
      endDate: Jun 2023
      keywords:
        - Telemedicine
        - Accessibility
        - Mobile App
        - Redesign
      url: https://rinaandriani.myportfolio.com/sehatku
  publications:
    - name: Meningkatkan Adopsi Digital pada Generasi Silver melalui Pendekatan Desain
        Inklusif
      publisher: Jurnal Desain dan Teknologi Indonesia
      releaseDate: Mar 2023
      summary: >
        - Menganalisis tantangan yang dihadapi pengguna lansia dalam menggunakan
        aplikasi digital

        - Memproposikan kerangka kerja desain inklusif yang mempertimbangkan
        aspek kognitif, motorik, dan perceptual

        - Menyajikan hasil usability testing pada prototipe aplikasi kesehatan
        yang dirancang khusus untuk generasi silver
      url: https://jdti.ui.ac.id/article/desain-inklusif-silver
  skills:
    - level: Expert
      name: UX Research
      keywords:
        - User Interview
        - Usability Testing
        - Survey Design
        - Persona
        - Journey Map
    - level: Expert
      name: UI Design & Prototyping
      keywords:
        - Figma
        - Sketch
        - Adobe XD
        - Prototyping
        - Wireframing
    - level: Advanced
      name: Design Operations
      keywords:
        - Design System
        - DesignOps
        - Facilitation
        - Workshop
  volunteer:
    - organization: Komunitas Desainer UX Indonesia
      position: Mentor Desain UX
      startDate: Jan 2022
      summary: >
        - Membimbing calon desainer UX melalui program mentoring berkala dengan
        fokus pada portfolio review dan persiapan karir

        - Menyelenggarakan workshop gratis mengenai dasar-dasar riset pengguna
        dan prototyping untuk mahasiswa dan fresh graduate

        - Berkontribusi dalam penyusunan kurikulum pembelajaran desain berbasis
        komunitas yang telah membantu 200+ peserta
      url: https://uxindonesia.org
  work:
    - name: PT Inovasi Digital Nusantara
      position: Lead UX Designer
      startDate: Jan 1, 2022
      summary: >
        - Memimpin tim desain yang terdiri dari 5 orang desainer UX/UI dalam
        pengembangan produk digital untuk klien enterprise

        - Merancang dan mengimplementasikan design system komprehensif yang
        meningkatkan konsistensi visual dan mengurangi waktu pengembangan
        sebesar 30%

        - Melakukan riset pengguna secara berkala termasuk wawancara mendalam,
        survei, dan usability testing untuk mengidentifikasi pain point pengguna

        - Berkolaborasi erat dengan product manager dan tim engineer dalam
        sprint planning dan grooming untuk memastikan feasibilitas desain
      keywords:
        - Leadership
        - Design System
        - User Research
        - Enterprise
      url: https://inovasidigital.co.id
    - name: PT Teknologi Karya Abadi
      position: Desainer UX Senior
      startDate: Mar 1, 2019
      summary: >
        - Bertanggung jawab atas pengalaman pengguna aplikasi fintech dengan
        lebih dari 2 juta pengguna aktif bulanan

        - Melakukan redesign total alur pembayaran yang berhasil meningkatkan
        tingkat konversi sebesar 25% dan mengurangi drop-off rate

        - Membuat prototype interaktif tingkat tinggi menggunakan Figma untuk
        keperluan user testing dan stakeholder presentation

        - Mengadopsi pendekatan data-driven design dengan menganalisis heatmap,
        session recording, dan analitik pengguna
      endDate: Dec 1, 2021
      keywords:
        - Fintech
        - Conversion
        - Prototyping
        - Data-Driven
      url: https://tekabadi.id
    - name: Studio Kreasi Digital
      position: Desainer UX
      startDate: Aug 1, 2018
      summary: >
        - Mendesain antarmuka dan pengalaman pengguna untuk berbagai proyek
        aplikasi mobile dan website e-commerce

        - Membantu klien UMKM dalam memahami kebutuhan pengguna melalui riset
        sederhana dan workshop desain

        - Menghasilkan wireframe, mockup, dan prototype yang siap untuk handover
        ke tim pengembangan
      endDate: Feb 1, 2019
      keywords:
        - E-Commerce
        - Mobile App
        - Wireframing
        - UMKM
      url: https://studiokreasidigital.com
