  projects:
    - name: CareConnect App
      startDate: Jan 1, 2022
      summary: >
        - End-to-End-UX für eine iOS- und Android-App mit über 50.000 aktiven
        Nutzern

        - Entwicklung eines empathischen Onboardings für Nutzer in
        Stresssituationen

        - Integration von Sprachassistenten und Barrierefreiheitsfunktionen
      description: Mobile App zur Vernetzung von Pflegekräften und Angehörigen
      endDate: Jun 1, 2023
      keywords:
        - Mobile UX
        - Healthcare
        - Accessibility
      url: https://www.nexa-health.de/careconnect
  publications:
    - name: Barrierefreiheit im medizinischen E-Commerce
      publisher: UX Magazin
      releaseDate: Nov 2022
      summary: >
        Praxisleitfaden zur Umsetzung von WCAG 2.1 AA in komplexen
        Gesundheitsportalen mit Fokus auf ältere Nutzergruppen.
      url: https://www.ux-magazin.de/barrierefreiheit-medizin-ecommerce
  skills:
    - level: Expert
      name: UX Research & Strategie
      keywords:
        - User Interviews
        - Usability Testing
        - Journey Mapping
        - Personas
        - A/B Testing
    - level: Expert
      name: UI Design & Prototyping
      keywords:
        - Figma
        - Sketch
        - Adobe XD
        - Principle
        - ProtoPie
    - level: Advanced
      name: Design Operations
      keywords:
        - Design Systems
        - Zeroheight
        - Storybook
        - Component Libraries
        - Token Studio
    - level: Intermediate
      name: Frontend-Grundlagen
      keywords:
        - HTML5
        - CSS3
        - JavaScript
        - React Basics
        - Accessibility (WCAG)
  volunteer:
    - organization: Tech4Germany
      position: UX-Mentorin
      startDate: Sep 1, 2020
      summary: >
        - Mentoring von Nachwuchsdesignern aus unterrepräsentierten Gruppen

        - Begleitung bei Portfolio-Reviews und Bewerbungsprozessen in der
        Tech-Branche

        - Workshop-Leitung zu Themen wie Design Thinking und UX-Grundlagen
      url: https://www.tech4germany.org
  work:
    - name: Nexa Health AG
      position: Lead UX Designer
      startDate: Mar 1, 2021
      summary: >
        - Leitung des UX-Teams (5 Personen) für Patienten- und Ärzteportale im
        Gesundheitssektor

        - Entwicklung und Pflege eines umfassenden Design Systems mit Figma und
        Zeroheight

        - Durchführung von User Research, Usability-Tests und
        Journey-Mapping-Workshops

        - Enge Zusammenarbeit mit Product Ownern, Entwicklern und Medizinern in
        agilen Scrum-Teams

        - Steigerung der Task-Completion-Rate um 35 % durch Redesign des
        Terminbuchungsflows
      keywords:
        - Design Systems
        - Figma
        - User Research
        - Scrum
        - Healthcare
      url: https://www.nexa-health.de
    - name: Formwerk Digital GmbH
      position: Senior UX Designer
      startDate: Jan 1, 2018
      summary: >
        - Konzeption und Gestaltung von E-Commerce-Plattformen und mobilen Apps
        für DAX-Kunden

        - Moderation von Design Sprints und Stakeholder-Workshops zur
        Anforderungsklärung

        - Erstellung interaktiver Prototypen für frühe Nutzervalidierung und
        Stakeholder-Pitches

        - Mentoring von Junior Designern und Einführung von
        Peer-Review-Prozessen
      endDate: Feb 1, 2021
      keywords:
        - E-Commerce
        - Design Sprints
        - Prototyping
        - Mentoring
      url: https://www.formwerk.de
    - name: UX Studio Mitte
      position: UX/UI Designer
      startDate: Nov 1, 2014
      summary: >
        - Unterstützung bei der Konzeption von Websites und Apps für Start-ups
        und KMU

        - Erstellung von Wireframes, Moodboards und visuellen Designs in Sketch
        und Adobe CC

        - Durchführung von Heuristischen Evaluationen und Erstellung von Style
        Guides

        - Zusammenarbeit mit Frontend-Entwicklern zur Sicherstellung der
        Design-Implementierung
      endDate: Dec 1, 2017
      keywords:
        - Wireframing
        - Visual Design
        - Sketch
        - Heuristische Evaluation
      url: https://www.uxstudio-mitte.de
