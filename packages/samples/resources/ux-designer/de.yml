content:
  basics:
    name: Lena Hoffmann
    email: kontakt@lenahoffmann-ux.de
    headline: Senior UX-Designerin & Produktstrategin
    phone: +49 170 1234567
    summary: >
      Senior UX-Designerin mit über 8 Jahren Erfahrung in der nutzerzentrierten
      Gestaltung komplexer digitaler Produkte für B2B- und B2C-Märkte.
      Spezialisiert auf Design Systems, strategisches Interaction Design und
      evidenzbasierte UX-Forschung.


      Leitet cross-funktionale Teams in agilen Umgebungen und vereint
      analytisches Denken mit ästhetischer Präzision. Leidenschaftlich für
      barrierefreies Design und datengetriebene Entscheidungsfindung, um
      messbare Geschäftsergebnisse zu erzielen.
    url: https://lenahoffmann-ux.de
  education:
    - area: Human-Computer Interaction
      institution: Hochschule für Gestaltung Schwäbisch Gmünd
      degree: Master
      courses:
        - Interaktionsgestaltung
        - Empirische Forschungsmethoden
        - Design Thinking
        - Prototyping und Testverfahren
      endDate: Sep 1, 2017
      startDate: Oct 1, 2015
      summary: >
        Schwerpunkt auf nutzerzentrierter Forschung und evidenzbasierter
        Gestaltung komplexer digitaler Systeme. Abschlussarbeit zur Reduktion
        kognitiver Belastung in medizinischen Software-Systemen.
      score: 1,3
      url: https://www.hfg-gmuend.de
    - area: Mediendesign und Kommunikation
      institution: Hochschule München
      degree: Bachelor
      courses:
        - Informationsdesign
        - Webtechnologien
        - Visuelle Kommunikation
        - Typografie und Layout
      endDate: Sep 1, 2014
      startDate: Oct 1, 2011
      summary: >
        Fundierte Ausbildung in visuellem Design, Informationsarchitektur und
        Grundlagen der Frontend-Entwicklung.
      score: 1,7
      url: https://www.hm.edu
  awards:
    - awarder: iF International Forum Design GmbH
      title: iF Design Award
      date: Mar 2023
      summary: >
        Auszeichnung für das Redesign des Patientenportals der Nexa Health AG in
        der Kategorie User Experience.
  certificates:
    - issuer: UXQB / ibi research
      name: CPUX-F (Certified Professional for Usability and User Experience -
        Foundation Level)
      date: Jun 2019
      url: https://www.uxqb.org
  interests:
