      keywords:
        - Schriftgestaltung
        - Variable Fonts
        - Leseforschung
    - name: Fotografie
      keywords:
        - Street Photography
        - Analog
        - Bildkomposition
    - name: Soziales Engagement
      keywords:
        - Tech4Germany
        - Mentoring
        - Diversity in Tech
  languages:
