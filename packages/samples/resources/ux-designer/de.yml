    - fluency: Full Professional Proficiency
      language: English
      keywords:
        - Business English
        - Technical Documentation
  location:
    city: München
    address: Lindwurmstraße 88
    country: Germany
    postalCode: "80337"
    region: Bayern
  profiles:
    - network: LinkedIn
      username: lena-hoffmann-ux
