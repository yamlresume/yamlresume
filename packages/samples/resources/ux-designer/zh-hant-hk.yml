      position: 活動統籌及設計導師
      startDate: Sep 2018
      summary: |
        - 統籌每月的 UX 設計分享會，邀請業界專家進行演講與工作坊
        - 為初學者提供設計思維與原型工具指導，協助他們建立設計基礎
        - 推動本地 UX 設計社群交流，促進知識分享與專業發展
      url: https://www.uxpahk.org
  work:
    - name: 領創數碼科技有限公司
      position: 資深用戶體驗設計師
      startDate: Mar 2020
      summary: |
        - 主導多個金融科技與電商平台的用戶體驗設計，涵蓋用戶研究、旅程地圖至互動原型
        - 建立並維護跨產品的設計系統，統一超過三十個模組的視覺與互動規範
        - 帶領三名初級設計師，制定設計評審流程與用戶測試標準，提升團隊交付質素
        - 與產品經理及工程團隊緊密協作，推動敏捷開發中的設計衝刺與快速迭代
      keywords:
        - Figma
        - Design System
        - 用戶研究
        - 團隊領導
      url: https://www.leadcx.hk
    - name: 雅卓互動設計顧問有限公司
      position: 用戶體驗設計師
      startDate: Jul 2017
      summary: |
        - 為教育、醫療及零售行業客戶設計直覺易用的網站與流動應用介面
        - 負責進行可用性測試與用戶訪談，將洞察轉化為具體的設計改進方案
        - 製作高保真互動原型與動效規範，有效降低開發階段的溝通成本
        - 協助公司贏得多項設計招標，並在業界建立良好的客戶口碑
      endDate: Feb 2020
      keywords:
        - Prototyping
        - 可用性測試
        - 客戶協作
        - 視覺設計
      url: https://www.artjoy.hk
    - name: 創意流動科技有限公司
      position: UX 設計實習生
      startDate: Jun 2016
      summary: |
        - 參與社交應用的介面設計，協助繪製線框圖與整理設計素材庫
        - 協助進行競品分析與用戶反饋整理，為產品優化提供數據支持
        - 學習並實踐以用戶為中心的設計流程，奠定紮實的專業基礎
      endDate: Aug 2016
      keywords:
        - 線框圖
        - 競品分析
        - 設計素材
      url: https://www.creativemobile.hk
