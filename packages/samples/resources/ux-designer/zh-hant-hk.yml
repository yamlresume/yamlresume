content:
  basics:
    name: 林曉彤
    headline: 資深用戶體驗設計師，專注金融科技及流動應用程式
    phone: "+852 9123 4567"
    email: hello@lamhiutung.design
    url: https://www.lamhiutung.design
    summary: |
      具超過六年經驗的用戶體驗設計師，擅長為金融科技及流動應用程式提供以用戶為中心的設計方案。

      - 主導大型銀行應用程式的用戶體驗重塑，提升用戶滿意度達 35%
      - 熟悉設計系統建立及管理，確保產品一致性及開發效率
      - 善於透過用戶研究及可用性測試，發掘用戶需要並轉化為具體設計方案
      - 與產品經理及工程師緊密合作，推動設計主導的產品開發流程
  location:
    address: 中環皇后大道中 100 號
    city: 香港
    region: 香港島
    country: Hong Kong
  profiles:
    - network: Behance
      url: https://www.behance.net/lamhiutung
      username: lamhiutung
    - network: LinkedIn
      url: https://www.linkedin.com/in/lamhiutung
      username: lam-hiu-tung
    - network: Dribbble
      url: https://dribbble.com/lamhiutung
      username: lamhiutung
  education:
    - institution: 香港理工大學
      url: https://www.polyu.edu.hk/
      degree: Bachelor
      area: 設計學（互動媒體）
      score: "3.5"
      startDate: Sep 1, 2015
      endDate: Jun 1, 2019
      courses:
        - 用戶體驗設計
        - 人機互動
        - 視覺傳達設計
        - 設計研究方法
        - 流動應用程式設計
        - 設計心理學
      summary: |
        - 專攻互動媒體設計，畢業作品獲學院頒發「最佳設計項目」獎
        - 透過多個跨學科項目，累積用戶研究、原型設計及可用性測試的實戰經驗
        - 積極參與設計學會活動，並擔任學生設計展覽的策展人
  work:
    - name: Fintastic 金融科技有限公司
      url: https://www.fintastic.example
      position: 高級用戶體驗設計師
      startDate: Jul 1, 2022
      summary: |
        - 主導公司旗艦投資應用程式的設計策略，與產品及工程團隊合作推出新功能
        - 建立及維護設計系統，統一組件規範，縮短設計到開發的交付時間約 30%
        - 規劃及執行季度用戶研究計劃，包括深度訪談及可用性測試，為產品路線圖提供建議
        - 指導初級設計師，並定期舉辦設計分享會，促進團隊專業成長
      keywords:
        - 設計系統
        - 用戶研究
        - 可用性測試
        - 金融科技
        - 團隊領導
    - name: Digital Gear Studio
      url: https://www.digitalgear.example
      position: 用戶體驗設計師
      startDate: Sep 1, 2019
      endDate: Jun 1, 2022
      summary: |
        - 負責多個客戶項目的用戶體驗設計，涵蓋零售、旅遊及教育等行業
        - 運用設計思考方法，與客戶共同定義問題，並製作線框圖及互動原型
        - 進行競爭分析及用戶訪談，將研究結果轉化為清晰的用戶旅程地圖
        - 與視覺設計師及開發人員協作，確保設計在技術上可行並符合品牌形象
      keywords:
        - 設計思考
        - 用戶旅程地圖
        - 互動原型
        - 客戶溝通
    - name: 雲創科技
      url: https://www.cloudinnovation.example
      position: 用戶體驗設計實習生
      startDate: Jun 1, 2018
      endDate: Aug 1, 2018
      summary: |
        - 協助高級設計師進行用戶訪談及問卷調查，整理研究報告
        - 參與設計工作坊，製作低保真原型及可用性測試材料
        - 與開發團隊合作，撰寫設計規格文件及交接材料
      keywords:
        - 用戶訪談
        - 問卷調查
        - 低保真原型
  skills:
    - name: 用戶研究
      level: Expert
      keywords:
        - 深度訪談
        - 可用性測試
        - 問卷調查
        - 人物誌
        - 用戶旅程地圖
    - name: 原型與設計工具
      level: Expert
      keywords:
        - Figma
        - Sketch
        - Adobe XD
        - InVision
        - Protopie
    - name: 互動設計
      level: Advanced
      keywords:
        - 線框圖
        - 微互動
        - 無障礙設計
        - 設計系統
    - name: 前端協作
      level: Beginner
      keywords:
        - HTML
        - CSS
        - JavaScript
  languages:
    - language: Cantonese
      fluency: Native or Bilingual Proficiency
      keywords:
        - 母語
    - language: English
      fluency: Full Professional Proficiency
      keywords:
        - IELTS 8.0
        - 商業英語
    - language: Mandarin
      fluency: Full Professional Proficiency
      keywords:
        - 普通話水平測試二級甲等
  awards:
    - title: 香港設計師協會環球設計大獎 2022 – 銀獎
      awarder: 香港設計師協會
      date: Oct 1, 2022
      summary: |
        憑藉「智能銀行應用程式用戶體驗重塑」項目，獲得數碼介面組別銀獎，表揚項目在用戶體驗及視覺設計上的卓越表現。
  certificates:
    - name: Certified Usability Analyst
      issuer: Human Factors International
      date: Jan 1, 2021
      url: https://www.humanfactors.com/
  publications:
    - name: 「建立可持續設計系統的五大原則」
      publisher: Medium（UX Collective）
      releaseDate: Mar 1, 2023
      url: https://medium.com/ux-collective/design-system-principles
      summary: |
        分享在金融科技公司建立及管理設計系統的實際經驗，包括組件設計、文件規範及團隊協作流程。
  projects:
    - name: 智能銀行應用程式重塑
      url: https://www.fintastic.example/projects/banking-app
      startDate: Jan 1, 2022
      endDate: Dec 1, 2022
      description: |
        為一家主流銀行重新設計流動應用程式，整合帳戶管理、投資及支付功能，提升整體用戶體驗。
      summary: |
        - 透過用戶研究及數據分析，辨識用戶痛點，並制定設計策略
        - 設計全新的資訊架構及互動流程，簡化複雜交易步驟
        - 建立可擴展的設計系統，支援 iOS 及 Android 平台
        - 推出後應用程式商店評分由 3.2 升至 4.5 星
      keywords:
        - 金融科技
        - 設計系統
        - 用戶研究
        - 可用性測試
  interests:
    - name: 行山
      keywords:
        - 麥理浩徑
        - 露營
        - 攝影
    - name: 烹飪
      keywords:
        - 烘焙
        - 港式茶餐廳美食
  volunteer:
    - organization: 香港導盲犬協會
      url: https://www.guidedogs.org.hk/
      position: 網站設計義工
      startDate: Jan 1, 2023
      summary: |
        - 協助協會重新設計官方網站，改善資訊架構及捐款流程
        - 拍攝及挑選照片，提升網站視覺吸引力及故事性

