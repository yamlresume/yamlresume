  projects:
    - name: 智慧城市流動應用
      startDate: Jan 2022
      summary: |
        - 重新設計資訊架構與導航系統，令用戶平均完成任務時間縮短四成
        - 引入無障礙設計指引，確保視障及長者用戶均能輕鬆使用
        - 設計系統涵蓋超過五十個核心組件，獲團隊廣泛採用於後續項目
      description: 為本地政府部門設計的一站式城市服務流動應用
      endDate: Oct 2022
      keywords:
        - 政府項目
        - 無障礙設計
        - 設計系統
      url: https://kaychan.hk/projects/smart-city
    - name: 網上銀行平台重設計
      startDate: Jun 2020
      summary: |
        - 透過用戶訪談與數據分析，識別關鍵痛點並提出針對性的設計方案
        - 設計全新儀表板與轉賬流程，提升用戶滿意度與交易完成率
        - 與開發團隊緊密合作，確保設計細節於產品上準確呈現
      description: 針對年輕用戶群的網上銀行體驗重設計項目
      endDate: Dec 2020
      keywords:
        - 金融科技
        - 用戶研究
        - 體驗重設計
      url: https://kaychan.hk/projects/bank-redesign
  publications:
    - name: 以設計系統提升金融科技產品的一致性
      publisher: 設計雜誌 Design Magazine
      releaseDate: Mar 2023
      summary: |
        - 探討設計系統在金融科技產品中的實踐方法與挑戰
        - 分享如何透過組件化設計與跨部門協作，提升產品開發效率與用戶體驗
      url: https://www.designmag.hk/articles/design-system-fintech
