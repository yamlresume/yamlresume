content:
  basics:
    name: 陳雅琪
    email: kay.chan@designfolio.hk
    headline: 資深用戶體驗設計師
    phone: +852 9876 5432
    summary: |
      - 擁有逾八年數碼產品設計經驗，專注於以用戶為中心的設計方法與商業策略結合
      - 擅長帶領跨職能團隊進行用戶研究、旅程地圖至互動原型設計，成功推出多款獲獎流動應用
      - 具備豐富的設計系統建構經驗，能統一視覺語言並顯著提升開發效率與產品一致性
      - 熱衷於設計思維與無障礙設計，持續推動以數據驅動的設計決策與迭代優化
    url: https://kaychan.hk
  education:
    - area: 交互設計學
      institution: 香港理工大學
      degree: Bachelor
      courses:
        - 用戶研究方法
        - 交互設計原理
        - 視覺傳達設計
        - 資訊架構與導航設計
        - 設計思維與創新
      endDate: Jun 2017
      startDate: Sep 2013
      summary: |
        - 主修交互設計，深入鑽研人機交互、認知心理學及用戶中心設計流程
        - 畢業專題探討本地長者使用流動應用的行為模式，獲院長嘉許名單
        - 積極參與校內外設計比賽，培養出敏銳的視覺觸覺與問題解決能力
      score: "3.7"
      url: https://www.polyu.edu.hk/
  awards:
    - awarder: 香港設計師協會
      title: 香港設計師協會環球設計大獎 優異獎
      date: Nov 2022
      summary: |
        憑藉智慧城市流動應用項目，於用戶體驗設計類別獲頒優異獎，表彰以人為本的創新設計方案。
    - awarder: 香港理工大學設計學院
      title: 院長嘉許名單
      date: Jun 2017
      summary: |
        於學術成績及畢業專題表現優異，獲列入院長嘉許名單以資鼓勵。
