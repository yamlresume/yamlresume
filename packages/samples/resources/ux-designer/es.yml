  projects:
    - name: SaludApp Redesign
      startDate: Jan 1, 2022
      summary: >
        - Investigación con médicos y pacientes para redefinir los flujos de
        consulta y prescripción

        - Creación de un design system accesible conforme a los estándares WCAG
        2.1 AA

        - Incremento del 40% en la tasa de reserva de citas tras el lanzamiento
        del nuevo diseño
      description: Rediseño completo de la app de telemedicina líder en España
      endDate: Jun 1, 2022
      keywords:
        - Telemedicina
        - WCAG
        - Health
        - Design System
      url: https://saludapp.example.com
  publications:
    - name: Diseñando para la diversidad cognitiva en entornos digitales
      publisher: Revista Iberoamericana de Diseño
      releaseDate: Mar 2023
      summary: >
        Artículo sobre patrones de diseño inclusivo y cómo adaptar interfaces
        para usuarios con distintas capacidades cognitivas.
      url: https://revistadiseno.es/articulo/diversidad-cognitiva
  skills:
    - level: Expert
      name: UX Research
      keywords:
        - Entrevistas
        - Encuestas
        - Testing
        - Analytics
        - Heatmaps
    - level: Expert
      name: Interaction Design
      keywords:
        - Figma
        - Sketch
        - Principle
        - Prototipado
        - Wireframing
    - level: Intermediate
      name: Front-end & Design Ops
      keywords:
        - HTML/CSS
        - Design Tokens
        - Storybook
        - Git
        - Agile
    - level: Advanced
      name: Visual Design
      keywords:
        - Tipografía
        - Color
        - Illustrator
        - Photoshop
        - Motion
  volunteer:
    - organization: Tecnología para Todos
      position: Mentora de Diseño UX
      startDate: Sep 1, 2019
      summary: >
        - Mentora voluntaria en un programa de formación para jóvenes en riesgo
        de exclusión social

        - Diseñé el plan de estudios introductorio de diseño digital y
        herramientas de prototipado

        - Acompañé a los participantes en la creación de sus primeros portfolios
        profesionales
      endDate: Jul 1, 2023
      url: https://tecnologiaparatodos.org
  work:
    - name: InnovaDigital
      position: Lead UX Designer
      startDate: Mar 1, 2021
      summary: >
        - Lidero un equipo de 6 diseñadores definiendo la estrategia de UX para
        productos fintech y salud digital

        - Diseño y valido arquitecturas de información mediante investigación
        con usuarios y pruebas de usabilidad

        - Implemento un sistema de diseño unificado que redujo el tiempo de
        desarrollo en un 30%

        - Colaboro estrechamente con producto e ingeniería para alinear
        objetivos de negocio y necesidades del usuario

        - Presento hallazgos de research a stakeholders ejecutivos para impulsar
        decisiones basadas en datos
      keywords:
        - Liderazgo
        - Fintech
        - Design Systems
        - Research
        - Strategy
      url: https://innovadigital.es
    - name: PixelCrafters
      position: UX Designer Senior
      startDate: Sep 1, 2018
      summary: >
        - Rediseñé la experiencia de onboarding de una app de ecommerce,
        aumentando la conversión en un 25%

        - Condujé entrevistas con usuarios, mapas de empatía y journey maps para
        identificar puntos de dolor críticos

        - Creé prototipos de alta fidelidad en Figma y coordiné pruebas de
        usabilidad remotas con más de 50 participantes

        - Trabajé con desarrolladores frontend para garantizar la fidelidad
        visual y funcional de los diseños entregados
      endDate: Feb 1, 2021
      keywords:
        - Ecommerce
        - Figma
        - Usability
        - Prototyping
        - Onboarding
      url: https://pixelcrafters.es
    - name: Estudio Creativo Nexo
      position: UX/UI Designer
      startDate: Oct 1, 2016
      summary: >
        - Diseñé interfaces web y móviles para clientes del sector turístico y
        educativo

        - Realicé auditorías heurísticas y análisis comparativos para proponer
        mejoras basadas en buenas prácticas

        - Colaboré en la creación de guías de estilo y componentes reutilizables
        para agilizar la producción

        - Facilité talleres de cocreación con clientes para alinear expectativas
        y definir requisitos funcionales
      endDate: Aug 1, 2018
      keywords:
        - UI Design
        - Heuristics
        - Workshops
        - Tourism
        - Mobile
      url: https://nexoestudio.com
