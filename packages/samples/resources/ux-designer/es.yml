content:
  basics:
    name: Lucía Fernández
    headline: Diseñadora UX/UI senior, especializada en investigación y diseño de
      servicios digitales
    phone: "+34 612 345 678"
    email: lucia@fernandezux.com
    url: https://www.fernandezux.com
    summary: |
      Diseñadora de producto con más de 7 años de experiencia en proyectos digitales para banca, salud y retail.
      Combino investigación cualitativa, análisis de datos y prototipado para crear experiencias usables y accesibles.

      - Lidero el diseño de extremo a extremo: research, ideación, prototipado, testing y traspaso a desarrollo.
      - Defiendo la accesibilidad (WCAG 2.2) y el diseño inclusivo como parte esencial del proceso.
      - Colaboro con equipos ágiles, producto y negocio para alinear objetivos y prioridades.
  location:
    address: Calle Gran Vía 28, 2º
    city: Madrid
    region: Comunidad de Madrid
    country: Spain
    postalCode: "28013"
  profiles:
    - network: LinkedIn
      url: https://www.linkedin.com/in/luciafernandezux
      username: luciafernandezux
    - network: Behance
      url: https://www.behance.net/luciafernandez
      username: luciafernandez

  education:
    - institution: Universidad Politécnica de Madrid
      url: https://www.upm.es/
      degree: Master
      area: Diseño de Experiencia de Usuario
      startDate: Sep 1, 2016
      endDate: Jul 1, 2018
      courses:
        - Métodos de investigación con usuarios
        - Diseño de interacción
        - Arquitectura de la información
        - Evaluación de usabilidad
        - Visualización de datos
      summary: |
        - Proyecto final premiado: rediseño de una plataforma de teleasistencia para mayores.
        - Colaboración con el Laboratorio de Accesibilidad para auditar apps públicas.
    - institution: Universidad Carlos III de Madrid
      url: https://www.uc3m.es/
      degree: Bachelor
      area: Ingeniería de Diseño Industrial
      startDate: Sep 1, 2011
      endDate: Jun 1, 2015
      courses:
        - Ergonomía y factores humanos
        - Diseño centrado en el usuario
        - Tecnologías multimedia

  work:
    - name: Nubika Digital
      url: https://www.nubikadigital.com
      position: Senior UX Designer
      startDate: Mar 1, 2021
      summary: |
        - Lidero el área de UX dentro de una squad de banca digital, colaborando con PMs, analistas y desarrolladores.
        - Rediseño integral de la app móvil de un banco europeo, logrando un aumento del 34 % en finalización de onboarding.
        - Creo y mantengo el design system junto a otros diseñadores, con más de 80 componentes en Figma.
        - Planifico y facilito sesiones de co-creación y testeos con personas usuarias en distintos países.
      keywords:
        - Design Systems
        - Banca digital
        - Figma
        - Agile
        - Accessibility
    - name: Pixel House Studio
      url: https://www.pixelhousestudio.com
      position: UX/UI Designer
      startDate: Jun 1, 2018
      endDate: Feb 1, 2021
      summary: |
        - Diseñé la experiencia de marca y producto para más de 20 clientes de los sectores salud, turismo y comercio electrónico.
        - Implementé procesos de investigación dentro de la agencia: entrevistas, encuestas y pruebas de usabilidad.
        - Trabajé junto a desarrolladores front-end para asegurar la viabilidad técnica de las propuestas.
        - Ganamos dos premios Lovie por proyectos de e-commerce accesibles.

  skills:
    - name: Research
      level: Expert
      keywords:
        - Entrevistas con usuarios
        - Encuestas
        - Pruebas de usabilidad
        - Card sorting
        - Customer journeys
    - name: Prototipado y diseño
      level: Expert
      keywords:
        - Figma
        - Sketch
        - Prototipado interactivo
        - Wireframes
        - Design systems
    - name: Arquitectura de la información
      level: Advanced
      keywords:
        - Sitemaps
        - Flujos de usuario
        - Navegación
        - Taxonomía
    - name: Accesibilidad
      level: Advanced
      keywords:
        - WCAG 2.2
        - Diseño inclusivo
        - ARIA
        - Auditorías de accesibilidad

  languages:
    - language: Spanish
      fluency: Native or Bilingual Proficiency
      keywords:
        - Lengua materna
    - language: English
      fluency: Full Professional Proficiency
      keywords:
        - TOEFL 105
        - Inglés técnico
    - language: French
      fluency: Limited Working Proficiency

  awards:
    - title: Premio Nacional de Diseño de Experiencia
      awarder: Asociación de Diseño de Interacción (IxDA España)
      date: Nov 2022
      summary: |
        Reconocimiento al mejor proyecto de diseño de servicios digitales por la app de salud "Bienestar360".

  certificates:
    - name: Google UX Design Professional Certificate
      issuer: Coursera
      date: Apr 2020
      url: https://www.coursera.org/professional-certificates/google-ux-design
    - name: Certified Usability Analyst
      issuer: Human Factors International
      date: Oct 2019
      url: https://www.humanfactors.com

  publications:
    - name: El impacto del design system en la productividad de equipos ágiles
      publisher: Revista Iberoamericana de Interacción Humano-Computadora
      releaseDate: May 2023
      url: https://www.revistaiahc.org/estudio-design-system
      summary: |
        Estudio de caso sobre la implantación de un design system en una entidad financiera y su efecto en la velocidad de desarrollo y la consistencia del producto.

  projects:
    - name: Bienestar360
      url: https://www.bienestar360.example
      description: Rediseño completo de una plataforma de telemedicina para mejorar la
        adherencia al tratamiento.
      startDate: Jan 2022
      endDate: Dec 2022
      summary: |
        - Dirigí la investigación con pacientes y profesionales de la salud para identificar puntos de fricción.
        - Testeé prototipos en alta fidelidad con 30 usuarios, iterando el flujo de gestión de citas y medicación.
        - El rediseño redujo el abandono de la plataforma un 28 % y las consultas de soporte un 47 %.
      keywords:
        - Salud digital
        - Telemedicina
        - User research
        - Prototipado
    - name: 'Design System "Atomika"'
      url: https://www.designsystem.atomika.example
      description: Sistema de diseño de código abierto para aplicaciones de banca y seguros.
      startDate: Mar 2021
      endDate: Jul 2023
      summary: |
        - Definición de tokens, componentes y documentación para un sistema multiplataforma.
        - Incluye pautas de accesibilidad y ejemplos de código para React Native.
        - Adoptado por 5 equipos de producto, reduciendo el tiempo de diseño de nuevas funcionalidades.
      keywords:
        - Design system
        - Tokens
        - React
        - Documentación

  interests:
    - name: Fotografía urbana
      keywords:
        - Street photography
        - Composición
        - Luz natural
    - name: Senderismo
      keywords:
        - Rutas de montaña
        - Naturaleza
        - Bienestar

  volunteer:
    - organization: UXPA España
      url: https://www.uxpa.es
      position: Coordinadora de voluntarios
      startDate: Jan 2020
      endDate: Mar 2023
      summary: |
        - Organicé encuentros y talleres sobre metodologías UX para la comunidad local.
        - Fui mentora en el programa de jóvenes diseñadores, asesorando a personas en sus primeros proyectos profesionales.

locale:
