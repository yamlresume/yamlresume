content:
  basics:
    name: Elena Vargas Morales
    email: elena.vargas@disenoux.es
    headline: Diseñadora de UX Senior especializada en productos digitales
    phone: +34 612 345 678
    summary: >
      Diseñadora de UX con más de 8 años de experiencia creando experiencias
      digitales centradas en el usuario para productos SaaS y aplicaciones
      móviles. Especializada en investigación cualitativa, diseño de interacción
      y sistemas de diseño escalables.


      Apasionada por transformar problemas complejos en soluciones intuitivas
      mediante metodologías ágiles y prácticas de diseño colaborativo. He
      liderado equipos multidisciplinarios en entornos internacionales, logrando
      aumentar la retención de usuarios y mejorar métricas de usabilidad en
      proyectos de alto impacto.
    url: https://elenavargas.design
  education:
    - area: Diseño de Interacción y Usabilidad
      institution: Universidad Politécnica de Madrid (UPM)
      degree: Bachelor
      courses:
        - Diseño de Interfaces de Usuario
        - Psicología Cognitiva
        - Investigación de Usuarios
        - Diseño de Interacción
        - Prototipado y Pruebas
        - Accesibilidad Web
        - Visualización de Datos
      endDate: Jul 1, 2016
      startDate: Sep 1, 2012
      summary: >
        - Formación integral en diseño centrado en el usuario y metodologías de
        investigación cualitativa

        - Desarrollo de proyectos finales enfocados en la mejora de la
        accesibilidad digital

        - Participación en talleres interdisciplinarios de innovación
        tecnológica
      score: 9.1/10
      url: https://www.upm.es
    - area: Diseño de Servicios y Experiencia de Usuario
      institution: Universidad de Barcelona
      degree: Master
      courses:
        - Estrategia de Diseño
        - Narrativas Digitales
        - Ética y Privacidad en UX
        - Diseño Multidispositivo
        - Métricas y UX Research
      endDate: Jun 1, 2018
      startDate: Oct 1, 2016
      summary: >
        - Especialización en diseño de servicios y estrategia de experiencia de
        usuario

        - Realización de prácticas en consultoras de transformación digital

        - Tesis sobre sistemas de diseño inclusivos en entornos corporativos
      score: Matrícula de Honor
      url: https://www.ub.edu
  awards:
    - awarder: Asociación Española de Diseño (AED)
      title: Premio a la Mejor Experiencia de Usuario
      date: Nov 2022
      summary: >
        Reconocimiento al rediseño integral de una plataforma de banca digital
        que mejoró la accesibilidad y satisfacción del cliente.
  certificates:
    - issuer: W3C / Fundación CTIC
      name: Certificación en Accesibilidad Web (WCAG)
      date: May 2023
      url: https://www.w3.org/WAI/
  interests:
