  projects:
    - name: Ridisegno dell'app di home banking Aurora
      url: https://www.lumendigital.it/progetti/aurora
      description: Progetto end-to-end di redesign dell'app mobile per una banca digitale.
      startDate: Mar 2022
      endDate: Sep 2022
      summary: |
        - Condotto ricerca utente con 24 clienti e analisi dei dati di utilizzo
        - Progettato nuovi flussi di pagamento e gestione delle finanze personali
        - Ridotto del 35% le chiamate al supporto per le operazioni più comuni
      keywords:
