  projects:
    - name: Redesign App Saúde Conectada
      startDate: Jan 2022
      summary: >
        - Conduziu pesquisa com 40 pacientes e 15 profissionais de saúde para
        mapear dores no agendamento de consultas

        - Projetou nova arquitetura de informação e fluxo de agendamento,
        reduzindo etapas em 50%

        - Desenvolveu protótipo navegável em alta fidelidade validado em testes
        de usabilidade com nota SUS de 85
      description: Redesign completo de aplicativo de telemedicina para o SUS
      endDate: Jun 2022
      keywords:
        - Telemedicina
        - Acessibilidade
        - Pesquisa de Campo
        - Figma
      url: https://anacarolinaux.com.br/saude-conectada
    - name: Design System Orbit
      startDate: Jul 2022
      summary: >
        - Estruturou biblioteca de componentes reutilizáveis em Figma com tokens
        de design e documentação interativa

        - Definiu padrões de acessibilidade e responsividade adotados por 6
        squads de produto

        - Reduziu tempo de handoff entre design e desenvolvimento em
        aproximadamente 20 horas por sprint
      description: Sistema de componentes escalável para plataforma SaaS B2B
      endDate: Dec 2022
      keywords:
        - Design System
        - Tokens de Design
        - Documentação
        - Escalabilidade
      url: https://anacarolinaux.com.br/orbit
  skills:
    - level: Expert
      name: Pesquisa e Estratégia em UX
      keywords:
        - User Research
        - Testes de Usabilidade
        - Design Thinking
        - Métricas de UX
        - Personas
    - level: Expert
      name: Design de Interface e Prototipagem
      keywords:
        - Figma
        - Sketch
        - Adobe XD
        - Prototipagem
        - Design Systems
    - level: Intermediate
      name: Desenvolvimento Front-end
      keywords:
        - HTML5
        - CSS3
        - JavaScript
        - React básico
        - Tailwind CSS
    - level: Advanced
      name: Facilitação e Liderança
      keywords:
        - Workshops
        - Design Sprint
        - Colaboração
        - Mentoria
        - Stakeholder Management
  volunteer:
    - organization: UX para Todes
      position: Mentora de Carreira
      startDate: Mar 2022
      summary: >
        - Realiza mentorias mensais para profissionais em transição de carreira
        para UX

        - Facilita oficinas gratuitas de introdução ao design de experiência do
        usuário em comunidades periféricas

        - Colabora na curadoria de conteúdos sobre diversidade e inclusão no
        design brasileiro
      url: https://uxparatodes.org.br
  work:
    - name: InovaTech Soluções
      position: UX Designer Senior
      startDate: Feb 1, 2022
      summary: >
        - Lidera o chapter de UX no squad de contas digitais, definindo o design
        system e padrões de acessibilidade WCAG 2.1

        - Conduz pesquisas exploratórias e avaliativas com mais de 50 usuários
        por sprint, gerando insights para roadmap de produto

        - Redesenhou o fluxo de onboarding reduzindo o tempo de cadastro em 40%
        e aumentando a taxa de conclusão em 28%

        - Facilita workshops de discovery e ideação com stakeholders de
        negócios, engenharia e suporte ao cliente
      keywords:
        - Design System
        - Acessibilidade
        - Pesquisa em UX
        - Figma
        - Facilitação
      url: https://inovatech.com.br
    - name: Agência Pixel Lab
      position: UX Designer Pleno
      startDate: Jun 1, 2019
      summary: >
        - Atuou em projetos de transformação digital para clientes dos setores
        de saúde, educação e varejo

        - Criou protótipos de alta fidelidade e mapas de jornada do usuário para
        validar hipóteses antes do desenvolvimento

        - Implementou processo de testes de usabilidade remoto, reduzindo custos
        de pesquisa em 30%

        - Colaborou com desenvolvedores front-end para garantir fidelidade
        visual e comportamental das entregas
      endDate: Jan 1, 2022
      keywords:
        - Prototipagem
        - Jornada do Usuário
        - Testes de Usabilidade
        - Design Responsivo
        - HTML/CSS
      url: https://pixelab.com.br
    - name: Estúdio Criação Digital
      position: Estagiária de UX/UI
      startDate: Jan 1, 2018
      summary: >
        - Auxiliou na criação de wireframes e fluxos de navegação para
        aplicativos mobile e plataformas web

        - Realizou benchmarkings de mercado e análises heurísticas de interfaces
        concorrentes

        - Apoiou a equipe na documentação de style guides e handoff para
        desenvolvimento

        - Participou de entrevistas com usuários e síntese de dados em personas
        e mapas de empatia
      endDate: May 1, 2019
      keywords:
        - Wireframing
        - Análise Heurística
        - Personas
        - Handoff
        - Benchmarking
      url: https://estudiocriacaodigital.com.br
