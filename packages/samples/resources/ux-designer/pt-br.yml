content:
  basics:
    name: Ana Carolina Mendes
    email: ana.mendes@email.com
    headline: UX Designer Senior | Estratégia de Produto e Design de Interação
    phone: +55 11 98765-4321
    summary: >
      Designer de experiência do usuário com mais de 6 anos de atuação em
      produtos digitais complexos, especializada em transformar dados
      qualitativos e quantitativos em soluções centradas no usuário. Combina
      estratégia de negócios com práticas de design thinking para criar
      interfaces intuitivas e acessíveis.


      Lidera processos de discovery e delivery em times multidisciplinares,
      conduzindo pesquisas, workshops de cocriação e testes de usabilidade que
      resultaram em aumento de 35% na conversão de fluxos críticos em produtos
      SaaS e fintech.
    url: https://anacarolinaux.com.br
  education:
    - area: Design
      institution: Universidade de São Paulo
      degree: Bachelor
      courses:
        - Design de Interação
        - Ergonomia Cognitiva e Usabilidade
        - Métodos de Pesquisa Qualitativa
        - Tipografia e Informação
        - Programação para Designers
        - Semiótica e Comunicação Visual
      endDate: Dec 1, 2017
      startDate: Mar 1, 2013
      summary: >
        - Desenvolveu projeto de conclusão de curso sobre acessibilidade digital
        em serviços bancários mobile

        - Participou do grupo de pesquisa em Interfaces Tangíveis e Experiência
        do Usuário

        - Recebeu menção honrosa no Salão de Criação USP por projeto de redesign
        de sistema de transporte público
      score: "8.9"
      url: https://www.usp.br
  awards:
    - awarder: Associação Brasileira de Design de Interação
      title: Melhor Case de UX em Fintech
      date: Nov 2023
      summary: >
        Reconhecimento pelo redesign do fluxo de transferências que aumentou a
        confiança dos usuários e reduziu erros operacionais em 25%.
  certificates:
    - issuer: Google via Coursera
      name: Google UX Design Professional Certificate
      date: Aug 2021
      url: https://www.coursera.org/professional-certificates/google-ux-design
    - issuer: Nielsen Norman Group
      name: UX Master Certification
      date: Mar 2023
      url: https://www.nngroup.com/ux-master-certification/
