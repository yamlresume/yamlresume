content:
  basics:
    name: Mariana Costa
    headline: 'UX Designer Plena | Pesquisa, Prototipação e Design de Interfaces'
    phone: "+55 11 98765-4321"
    email: mariana.design@email.com
    url: https://marianacosta.design
    summary: |
      UX Designer com 6+ anos de experiência em produtos digitais, atuando em todo o ciclo de discovery e delivery.

      Especialista em pesquisa com usuários, arquitetura da informação, prototipação em alta fidelidade e design de interfaces para web e mobile. Facilita a criação e a evolução de design systems, colabora com times de produto e engenharia e conduz testes de usabilidade para embasar decisões com dados e evidências.

  location:
    address: Av. Paulista, 1000
    city: São Paulo
    region: São Paulo
    country: Brazil
    postalCode: "01310-100"

  profiles:
    - network: LinkedIn
      url: https://www.linkedin.com/in/marianacosta-ux
      username: marianacosta-ux
    - network: Behance
      url: https://www.behance.net/marianacosta
      username: marianacosta
    - network: Medium
      url: https://medium.com/@marianacosta
      username: marianacosta

  education:
